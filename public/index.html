<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroTrustPanda ZS Policy Wizard v1.8.1 - Zscaler Template Policy Configuration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-card: #1a2236;
      --bg-card-hover: #1f2943;
      --bg-input: #0f1629;
      --border: #2a3654;
      --border-focus: #3b82f6;
      --text-primary: #e8ecf4;
      --text-secondary: #8896b3;
      --text-muted: #5c6b8a;
      --accent-blue: #3b82f6;
      --accent-blue-dim: #1e40af;
      --accent-green: #10b981;
      --accent-green-dim: #065f46;
      --accent-amber: #f59e0b;
      --accent-amber-dim: #78350f;
      --accent-red: #ef4444;
      --accent-red-dim: #7f1d1d;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --radius: 8px;
      --radius-lg: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Layout */
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-brand .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: white;
    }
    .header-brand h1 {
      font-size: 18px; font-weight: 600;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-brand .tag {
      font-size: 10px; padding: 2px 8px; border-radius: 4px;
      background: var(--accent-blue-dim); color: var(--accent-blue);
      font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .auth-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
    }
    .auth-badge.connected { background: var(--accent-green-dim); color: var(--accent-green); }
    .auth-badge.disconnected { background: var(--accent-red-dim); color: var(--accent-red); }
    .auth-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .auth-badge.connected .dot { background: var(--accent-green); }
    .auth-badge.disconnected .dot { background: var(--accent-red); }

    .main { flex: 1; display: flex; }
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 1.5rem 0;
      flex-shrink: 0;
    }
    .sidebar-section { padding: 0 1rem; margin-bottom: 1.5rem; }
    .sidebar-section-title {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text-muted); padding: 0 0.5rem;
      margin-bottom: 8px;
    }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius);
      cursor: pointer; font-size: 14px; color: var(--text-secondary);
      transition: all 0.15s;
      position: relative;
    }
    .sidebar-item:hover { background: var(--bg-card); color: var(--text-primary); }
    .sidebar-item.active {
      background: var(--accent-blue-dim);
      color: var(--accent-blue);
      font-weight: 500;
    }
    .sidebar-item .step-num {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      background: var(--bg-input); border: 1px solid var(--border);
    }
    .sidebar-item.active .step-num {
      background: var(--accent-blue); border-color: var(--accent-blue); color: white;
    }
    .sidebar-item.completed .step-num {
      background: var(--accent-green); border-color: var(--accent-green); color: white;
    }

    .content { flex: 1; padding: 2rem 3rem; max-width: 960px; }
    .content-wide { max-width: 1200px; }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card-header { margin-bottom: 1rem; }
    .card-header h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .card-header h3 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .card-header p { font-size: 14px; color: var(--text-secondary); }

    /* Form Elements */
    .form-group { margin-bottom: 1.25rem; }
    .form-label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 6px;
    }
    .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    input[type="text"], input[type="password"], select, textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }
    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 80px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 500;
      cursor: pointer; border: 1px solid transparent;
      transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent-blue); color: white; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-success { background: var(--accent-green); color: white; }
    .btn-success:hover:not(:disabled) { background: #059669; }
    .btn-warning { background: var(--accent-amber); color: #1a1a1a; }
    .btn-danger { background: var(--accent-red); color: white; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .btn-ghost {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--text-muted); color: var(--text-primary); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .btn-group { display: flex; gap: 8px; margin-top: 1.5rem; }

    /* Tier Cards */
    .tier-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1rem 0; }
    .tier-card {
      background: var(--bg-input);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .tier-card:hover { border-color: var(--text-muted); }
    .tier-card.selected { border-color: var(--accent-blue); background: var(--accent-blue-dim); }
    .tier-card .tier-icon { font-size: 28px; margin-bottom: 8px; }
    .tier-card .tier-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .tier-card .tier-desc { font-size: 12px; color: var(--text-secondary); }

    /* Compliance Grid */
    .compliance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 1rem 0; }
    .compliance-chip {
      padding: 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      text-align: center;
    }
    .compliance-chip:hover { border-color: var(--text-muted); }
    .compliance-chip.selected { border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }

    /* Toggle */
    .toggle-group { display: flex; flex-direction: column; gap: 8px; }
    .toggle-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .toggle-item label { font-size: 14px; cursor: pointer; }
    .toggle-switch {
      position: relative; width: 44px; height: 24px;
      background: var(--bg-secondary); border-radius: 12px;
      cursor: pointer; transition: background 0.2s;
      border: 1px solid var(--border);
    }
    .toggle-switch.active { background: var(--accent-blue); border-color: var(--accent-blue); }
    .toggle-switch .toggle-knob {
      position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%;
      background: white; transition: transform 0.2s;
    }
    .toggle-switch.active .toggle-knob { transform: translateX(20px); }

    /* Allow / Block step (v1.6.0) */
    .ab-group { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; background: var(--bg-input); }
    .ab-group-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; cursor: pointer; flex-wrap: wrap; }
    .ab-group-title { font-size: 14px; font-weight: 600; }
    .ab-group-sub { font-size: 12px; color: var(--text-muted); }
    .ab-rows { border-top: 1px solid var(--border); }
    .ab-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .ab-row:last-child { border-bottom: none; }
    .ab-row-name { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    .ab-row-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .ab-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .ab-seg button { background: var(--bg-secondary); color: var(--text-secondary); border: none; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
    .ab-seg button + button { border-left: 1px solid var(--border); }
    .ab-seg button.on-allow { background: var(--accent-green); color: #0a0e17; font-weight: 600; }
    .ab-seg button.on-block { background: var(--accent-red); color: #fff; font-weight: 600; }
    .ab-seg button.on-default { background: var(--accent-blue); color: #fff; font-weight: 600; }
    .ab-seg button:disabled { opacity: 0.4; cursor: not-allowed; }
    .ab-warn { color: var(--accent-amber); font-size: 11px; margin-top: 2px; }

    /* Plan/Diff View */
    .diff-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .diff-table th {
      text-align: left; padding: 8px 12px;
      background: var(--bg-secondary); border-bottom: 1px solid var(--border);
      font-weight: 600; color: var(--text-secondary); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .diff-table td {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .diff-table tr:hover { background: var(--bg-card-hover); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
    }
    .badge-create { background: var(--accent-green-dim); color: var(--accent-green); }
    .badge-update { background: var(--accent-blue-dim); color: var(--accent-blue); }
    .badge-risk { background: var(--accent-red-dim); color: var(--accent-red); }
    .badge-category { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }

    /* Alerts */
    .alert {
      padding: 12px 16px; border-radius: var(--radius);
      margin-bottom: 1rem; font-size: 14px;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .alert-info { background: var(--accent-blue-dim); border: 1px solid rgba(59,130,246,0.3); }
    .alert-warning { background: var(--accent-amber-dim); border: 1px solid rgba(245,158,11,0.3); color: var(--accent-amber); }
    .alert-success { background: var(--accent-green-dim); border: 1px solid rgba(16,185,129,0.3); color: var(--accent-green); }
    .alert-danger { background: var(--accent-red-dim); border: 1px solid rgba(239,68,68,0.3); color: var(--accent-red); }

    /* Explainer */
    .explainer {
      background: var(--bg-input);
      border-left: 3px solid var(--accent-cyan);
      padding: 12px 16px;
      margin: 1rem 0;
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .explainer strong { color: var(--accent-cyan); }

    /* Compliance Evidence */
    .evidence-item {
      padding: 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 6px;
      font-size: 13px;
    }
    .evidence-item .fw { color: var(--accent-purple); font-weight: 600; }
    .evidence-item .ctrl { color: var(--accent-cyan); }

    /* Audit Log */
    .log-entry {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      display: grid;
      grid-template-columns: 180px 120px 100px 1fr;
      gap: 8px;
    }
    .log-entry .ts { color: var(--text-muted); }
    .log-entry .action { color: var(--accent-cyan); font-weight: 500; }
    .log-entry .status-ok { color: var(--accent-green); }
    .log-entry .status-err { color: var(--accent-red); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Loading spinner */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ZPA placeholder */
    .placeholder-banner {
      background: linear-gradient(135deg, var(--bg-card), var(--bg-input));
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: center;
      color: var(--text-muted);
    }
    .placeholder-banner h3 { color: var(--text-secondary); margin-bottom: 8px; }

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .content { padding: 1rem; }
      .tier-grid { grid-template-columns: 1fr; }
      .compliance-grid { grid-template-columns: repeat(2, 1fr); }
      .form-row { grid-template-columns: 1fr; }
    }
    /* Policy Catalog */
    .catalog-tier { margin-bottom: 2rem; }
    .catalog-tier-header {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; user-select: none; font-weight: 600; font-size: 15px;
    }
    .catalog-tier-header:hover { background: var(--bg-card-hover); }
    .catalog-tier-header .arrow { transition: transform 0.2s; font-size: 11px; color: var(--text-muted); }
    .catalog-tier-header .arrow.open { transform: rotate(90deg); }
    .catalog-fw { margin: 0.5rem 0 0.5rem 1.5rem; }
    .catalog-fw-header {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; font-weight: 500; font-size: 13px;
    }
    .catalog-fw-header:hover { background: var(--bg-card-hover); }
    .catalog-policy-group { margin: 0.5rem 0 0.5rem 1rem; }
    .catalog-policy-header {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.6rem;
      cursor: pointer; font-size: 13px; font-weight: 500; color: var(--accent-cyan);
    }
    .catalog-policy-header:hover { color: var(--accent-blue); }
    .catalog-rule {
      margin: 0.25rem 0 0.25rem 1.5rem; padding: 0.6rem 0.75rem;
      background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; line-height: 1.6;
    }
    .catalog-rule-name { font-weight: 600; color: var(--text-primary); font-size: 13px; }
    .catalog-rule-action {
      display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11px;
      font-weight: 600; margin-left: 0.5rem;
    }
    .catalog-rule-action.BLOCK { background: var(--accent-red-dim); color: var(--accent-red); }
    .catalog-rule-action.ALLOW { background: var(--accent-green-dim); color: var(--accent-green); }
    .catalog-rule-action.CAUTION { background: var(--accent-amber-dim); color: var(--accent-amber); }
    .catalog-rule-action.INSPECT, .catalog-rule-action.DECRYPT { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
    .catalog-rule-action.DO_NOT_DECRYPT { background: rgba(139,92,246,0.15); color: var(--accent-purple); }
    .catalog-rule-action.QUARANTINE, .catalog-rule-action.QUARANTINE_ISOLATE { background: rgba(139,92,246,0.15); color: var(--accent-purple); }
    .catalog-rule-detail { color: var(--text-secondary); margin-top: 2px; }
    .catalog-rule-cats { color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 3px; word-break: break-all; }
    .catalog-compliance-tag {
      display: inline-block; padding: 1px 6px; margin: 2px 3px 2px 0; border-radius: 3px;
      font-size: 10px; background: rgba(59,130,246,0.12); color: var(--accent-blue); font-family: 'IBM Plex Mono', monospace;
    }
    .catalog-count {
      display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
      background: var(--bg-input); color: var(--text-muted); margin-left: 0.5rem; font-weight: 400;
    }
    .catalog-loading { text-align: center; padding: 3rem; color: var(--text-muted); }
    .catalog-summary { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.25rem; }
    .catalog-summary-chip {
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ========================
    // Error Boundary — catches React render crashes and shows debug info instead of black screen
    // ========================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        this.setState({ errorInfo });
        // Log to console for debugging
        console.error('[ZTP ErrorBoundary] Render crash caught:', error);
        console.error('[ZTP ErrorBoundary] Component stack:', errorInfo?.componentStack);
        // Also log to server error log
        try {
          const payload = {
            error: error?.message || String(error),
            stack: error?.stack,
            componentStack: errorInfo?.componentStack
          };
          console.error('[ZTP ErrorBoundary] Full details:', JSON.stringify(payload, null, 2));
        } catch(e) {}
      }
      render() {
        if (this.state.hasError) {
          return React.createElement('div', {
            style: { padding: '2rem', background: '#1a0000', border: '2px solid #ef4444',
                     borderRadius: '8px', margin: '1rem', color: '#fca5a5', fontFamily: 'monospace' }
          },
            React.createElement('h2', { style: { color: '#ef4444', marginBottom: '1rem' } }, '⚠ UI Render Error'),
            React.createElement('p', { style: { marginBottom: '1rem' } },
              'A React rendering error occurred. This is a bug — the data from the API could not be displayed. Details below:'),
            React.createElement('pre', {
              style: { fontSize: '12px', background: '#0a0a0a', padding: '1rem', borderRadius: '4px',
                       overflow: 'auto', maxHeight: '300px', whiteSpace: 'pre-wrap', color: '#fca5a5' }
            }, [
              'Error: ' + (this.state.error?.message || String(this.state.error)),
              '\n\nStack: ' + (this.state.error?.stack || 'N/A'),
              '\n\nComponent: ' + (this.state.errorInfo?.componentStack || 'N/A')
            ].join('')),
            React.createElement('p', { style: { marginTop: '1rem', fontSize: '12px', color: '#9ca3af' } },
              'Check the browser developer console (F12 → Console tab) for full details. ' +
              'Also check the server logs in ./logs/ for API-side errors.'),
            React.createElement('button', {
              onClick: () => this.setState({ hasError: false, error: null, errorInfo: null }),
              style: { marginTop: '1rem', padding: '8px 16px', background: '#ef4444', color: 'white',
                       border: 'none', borderRadius: '4px', cursor: 'pointer' }
            }, '🔄 Try Again')
          );
        }
        return this.props.children;
      }
    }

    // ========================
    // App Version
    // ========================
    const APP_VERSION = '1.8.1';
    const BUILD_DATE = '2026-03-30';

    // ========================
    // API Helper
    // ========================
    const api = {
      sessionId: null,
      async call(method, path, body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (this.sessionId) headers['X-Session-Id'] = this.sessionId;
        const opts = { method, headers };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(`/api${path}`, opts);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        return data;
      }
    };

    // ========================
    // Wizard Steps
    // ========================
    const WIZARD_STEPS = [
      { id: 'tier', label: 'Security Tier', icon: '🛡️' },
      { id: 'compliance', label: 'Compliance', icon: '📋' },
      { id: 'customize', label: 'Customize', icon: '⚙️' },
      { id: 'actions', label: 'Allow / Block', icon: '🚦' },
      { id: 'review', label: 'Review Plan', icon: '🔍' },
      { id: 'apply', label: 'Apply', icon: '🚀' },
      { id: 'audit', label: 'Audit Log', icon: '📄' }
    ];

    // ========================
    // Main App
    // ========================
    function App() {
      // Navigation: activeModule = 'zia-wizard' | 'zia-bulk' | 'zcc' | 'about' | null
      const [activeModule, setActiveModule] = useState(null);
      const [step, setStep] = useState('connect');
      const [auth, setAuth] = useState({ connected: false, mode: null, cloud: null });
      const [config, setConfig] = useState({
        module: 'zia',
        tier: 'BALANCED',
        complianceFramework: null,
        prefix: 'ZTP',
        enableUrlFiltering: true,
        enableFirewall: true,
        enableSslInspection: true,
        enableMalwareProtection: true,
        enableAdvancedSettings: true,
        enableSandbox: true,
        enableDnsSecurity: true,
        enableFileTypeControl: true,
        enableCloudAppControl: true,
        enableDlp: true,
        // v1.6.0 Allow/Block choices: policy-level ('DEFAULT'|'ALLOW'|'BLOCK') + per-rule overrides
        actionSettings: { policy: {}, rules: {} }
      });
      const [template, setTemplate] = useState(null);
      const [plan, setPlan] = useState(null);
      const [applyResult, setApplyResult] = useState(null);
      const [auditLogs, setAuditLogs] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [completedSteps, setCompletedSteps] = useState(new Set());

      const markComplete = (s) => setCompletedSteps(prev => new Set([...prev, s]));

      const goTo = (s) => {
        setError(null);
        // Clear downstream state when going back in the wizard
        const stepOrder = ['tier', 'compliance', 'customize', 'actions', 'review', 'apply', 'audit'];
        const targetIdx = stepOrder.indexOf(s);
        if (targetIdx >= 0) {
          if (targetIdx < stepOrder.indexOf('review')) { setPlan(null); }
          if (targetIdx < stepOrder.indexOf('apply')) { setApplyResult(null); }
          if (targetIdx < stepOrder.indexOf('customize')) { setTemplate(null); }
        }
        setStep(s);
      };

      const switchModule = (mod) => {
        setError(null);
        setActiveModule(mod);
        if (mod === 'zia-wizard') {
          // Reset wizard state so user can run a fresh deployment
          setStep('tier');
          setTemplate(null);
          setPlan(null);
          setApplyResult(null);
          setCompletedSteps(new Set());
        }
        else if (mod === 'zia-bulk') setStep('bulk-delete');
        else if (mod === 'zcc') setStep('zcc');
        else if (mod === 'zdx') setStep('zdx');
        else if (mod === 'about') setStep('about');
        else if (mod === 'catalog') setStep('catalog');
      };

      const showConnect = !auth.connected && activeModule !== 'catalog' && activeModule !== 'about';
      const showZiaWizard = auth.connected && activeModule === 'zia-wizard';
      const showZiaBulk = auth.connected && activeModule === 'zia-bulk';
      const showZcc = auth.connected && activeModule === 'zcc';
      const showZdx = auth.connected && activeModule === 'zdx';
      const showAbout = activeModule === 'about';
      const showCatalog = activeModule === 'catalog';
      const ziaExpanded = activeModule === 'zia-wizard' || activeModule === 'zia-bulk';

      return (
        <div className="app">
          <header className="header">
            <div className="header-brand">
              <div className="logo" style={{fontSize:'16px'}}>🐼</div>
              <div><h1 style={{fontSize:'15px'}}>ZeroTrustPanda ZS Policy Wizard</h1></div>
              <span className="tag">v{APP_VERSION}</span>
            </div>
            <div className="header-right">
              <div className={`auth-badge ${auth.connected ? 'connected' : 'disconnected'}`}>
                <span className="dot"></span>
                {auth.connected ? `${auth.mode?.toUpperCase()} · ${auth.cloud}` : 'Not Connected'}
              </div>
              {auth.connected && (
                <button className="btn btn-ghost btn-sm" onClick={async () => {
                  try { await api.call('POST', '/auth/logout'); } catch(e) {}
                  api.sessionId = null; setAuth({ connected: false }); setActiveModule(null); setCompletedSteps(new Set()); goTo('connect');
                }}>Disconnect</button>
              )}
            </div>
          </header>
          <div className="main">
            <nav className="sidebar">
              <div className="sidebar-section">
                <div className="sidebar-item" style={{opacity: auth.connected ? 0.5 : 1}}
                  onClick={() => { if (!auth.connected) { setActiveModule(null); setStep('connect'); }}}>
                  <span className="step-num">{auth.connected ? '✓' : '🔌'}</span>
                  {auth.connected ? 'Connected' : 'Connect'}
                </div>
              </div>
              {auth.connected && (
                <div className="sidebar-section">
                  <div className="sidebar-section-title">Modules</div>
                  <div className={`sidebar-item ${ziaExpanded ? 'active' : ''}`}
                    onClick={() => switchModule('zia-wizard')} style={{cursor:'pointer', fontWeight: ziaExpanded ? 600 : 400}}>
                    <span className="step-num">🌐</span> Zscaler Internet Access
                  </div>
                  {ziaExpanded && (<>
                    <div className={`sidebar-item ${activeModule === 'zia-wizard' ? 'active' : ''}`}
                      onClick={() => switchModule('zia-wizard')} style={{paddingLeft:'2.2rem', fontSize:'12px', cursor:'pointer'}}>
                      <span className="step-num" style={{fontSize:'10px', width:'16px', height:'16px'}}>🛡️</span> Security Tier Wizard
                    </div>
                    <div className={`sidebar-item ${activeModule === 'zia-bulk' ? 'active' : ''}`}
                      onClick={() => switchModule('zia-bulk')} style={{paddingLeft:'2.2rem', fontSize:'12px', cursor:'pointer'}}>
                      <span className="step-num" style={{fontSize:'10px', width:'16px', height:'16px'}}>🗑️</span> Bulk Rule Manager
                    </div>
                  </>)}
                  {showZiaWizard && WIZARD_STEPS.map((s, i) => (
                    <div key={s.id} className={`sidebar-item ${step === s.id ? 'active' : ''} ${completedSteps.has(s.id) ? 'completed' : ''}`}
                      onClick={() => { if (completedSteps.has(s.id) || step === s.id) goTo(s.id); }}
                      style={{paddingLeft:'3.2rem', fontSize:'11px', cursor: completedSteps.has(s.id) ? 'pointer' : 'default'}}>
                      <span className="step-num" style={{fontSize:'9px', width:'15px', height:'15px'}}>{completedSteps.has(s.id) ? '✓' : i + 1}</span> {s.label}
                    </div>
                  ))}
                  <div className={`sidebar-item ${activeModule === 'zcc' ? 'active' : ''}`}
                    onClick={() => switchModule('zcc')} style={{cursor:'pointer'}}>
                    <span className="step-num">📱</span> Mobile Admin Portal
                  </div>
                  <div className={`sidebar-item ${activeModule === 'zdx' ? 'active' : ''}`}
                    onClick={() => switchModule('zdx')} style={{cursor:'pointer'}}>
                    <span className="step-num">📈</span> Digital Experience
                  </div>
                  <div className="sidebar-item" style={{opacity:0.4, cursor:'default'}}>
                    <span className="step-num">🔒</span> Zscaler Private Access
                  </div>
                </div>
              )}
              <div className="sidebar-section" style={{marginTop:'auto'}}>
                <div className={`sidebar-item ${activeModule === 'catalog' ? 'active' : ''}`}
                  onClick={() => switchModule('catalog')} style={{cursor:'pointer', fontSize:'12px'}}>
                  <span className="step-num" style={{fontSize:'10px'}}>📖</span> Policy Catalog
                </div>
                <div className={`sidebar-item ${activeModule === 'about' ? 'active' : ''}`}
                  onClick={() => switchModule('about')} style={{cursor:'pointer', fontSize:'12px'}}>
                  <span className="step-num" style={{fontSize:'10px'}}>ℹ️</span> About
                </div>
              </div>
            </nav>
            <div className={`content ${step === 'review' ? 'content-wide' : ''}`}>
              {error && <div className="alert alert-danger">⚠ {error}</div>}
              {showConnect && (<ConnectStep auth={auth} setAuth={setAuth} setError={setError} loading={loading} setLoading={setLoading}
                onComplete={() => { markComplete('connect'); setActiveModule(null); setStep('select'); }} />)}
              {auth.connected && !activeModule && (
                <div className="card">
                  <div className="card-header"><h2>🐼 Welcome to ZeroTrustPanda</h2><p>Select a module from the sidebar or choose below.</p></div>
                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1rem', margin:'1rem 0'}}>
                    <div className="tier-card" onClick={() => switchModule('zia-wizard')} style={{cursor:'pointer'}}>
                      <div className="tier-icon">🌐</div><div className="tier-name">ZIA Security Wizard</div>
                      <div className="tier-desc">Deploy URL Filtering, Firewall, SSL, Sandbox, DNS, File Type, Cloud App Control, and DLP policies.</div>
                    </div>
                    <div className="tier-card" onClick={() => switchModule('zcc')} style={{cursor:'pointer'}}>
                      <div className="tier-icon">📱</div><div className="tier-name">Mobile Admin Portal</div>
                      <div className="tier-desc">Configure ZCC Forwarding Profiles and App Profiles with best-practice settings.</div>
                    </div>
                    <div className="tier-card" onClick={() => switchModule('zdx')} style={{cursor:'pointer'}}>
                      <div className="tier-icon">📈</div><div className="tier-name">Digital Experience (ZDX)</div>
                      <div className="tier-desc">Turn on ZDX Web and CloudPath probes following the Zscaler POV best practice guide, and manage existing apps and probes.</div>
                    </div>
                    <div className="tier-card" onClick={() => switchModule('catalog')} style={{cursor:'pointer'}}>
                      <div className="tier-icon">📖</div><div className="tier-name">Policy Catalog</div>
                      <div className="tier-desc">Browse every rule across all tiers and compliance frameworks before deploying. Full rule details and compliance mappings.</div>
                    </div>
                    <div className="tier-card" onClick={() => switchModule('about')} style={{cursor:'pointer'}}>
                      <div className="tier-icon">ℹ️</div><div className="tier-name">About</div>
                      <div className="tier-desc">Documentation, modules, compliance frameworks, version history.</div>
                    </div>
                  </div>
                </div>
              )}
              {showCatalog && (<CatalogStep />)}
              {showAbout && (
                <div className="card">
                  <div className="card-header"><h2>🐼 ZeroTrustPanda ZS Policy Wizard</h2><p>Automated Zscaler policy configuration for healthcare and enterprise.</p></div>
                  <div style={{fontSize:'13px', color:'var(--text-secondary)', lineHeight:'1.8'}}>
                    <h3 style={{fontSize:'15px', color:'var(--accent-cyan)', margin:'1rem 0 0.5rem'}}>What This Wizard Does</h3>
                    <p>Automates Zscaler security policy deployment based on industry best practices and compliance frameworks. Select a tier, choose compliance, deploy a complete policy set in minutes.</p>
                    <h3 style={{fontSize:'15px', color:'var(--accent-cyan)', margin:'1.5rem 0 0.5rem'}}>ZIA Security Tier Wizard</h3>
                    <p>Deploys policies across 7 areas (4 tiers: Strict, Balanced, Permissive, Zero Trust Hospital):</p>
                    <div style={{paddingLeft:'1rem'}}>
                      <div>• <strong>URL Filtering</strong> — Block legal liability, security risk, bandwidth/productivity categories</div>
                      <div>• <strong>Cloud Firewall</strong> — Network application controls (WEBSEARCH, WEB, ENTERPRISE, P2P, etc.)</div>
                      <div>• <strong>SSL/TLS Inspection</strong> — Decrypt/bypass with health, finance, government exemptions</div>
                      <div>• <strong>Cloud Sandbox</strong> — Quarantine Office/PDF, scan executables, AI Instant Verdict</div>
                      <div>• <strong>DNS Security</strong> — Block malicious DNS categories and 21+ DNS tunnel types</div>
                      <div>• <strong>File Type Control</strong> — Block database uploads, password-protected archives, scripts</div>
                      <div>• <strong>Cloud App Control</strong> — Restrict DoH, file sharing, webmail, streaming, IM, AI/ML</div>
                    </div>
                    <h3 style={{fontSize:'15px', color:'var(--accent-cyan)', margin:'1.5rem 0 0.5rem'}}>Bulk Rule Manager</h3>
                    <p>View and delete rules across all ZIA policy categories for cleanup after testing.</p>
                    <h3 style={{fontSize:'15px', color:'var(--accent-cyan)', margin:'1.5rem 0 0.5rem'}}>Mobile Admin Portal (ZCC)</h3>
                    <p>Create ZCC Forwarding Profiles and Windows / macOS App Profiles from templates. Read supported; write requires ZCC API write permissions.</p>
                    <h3 style={{fontSize:'15px', color:'var(--accent-cyan)', margin:'1.5rem 0 0.5rem'}}>Digital Experience (ZDX)</h3>
                    <p>Set up ZDX Web and CloudPath probes for predefined and custom apps following the Zscaler POV best practice guide, and manage existing apps and probes. Requires the ZDX scope on the API client.</p>
                    <h3 style={{fontSize:'15px', color:'var(--accent-cyan)', margin:'1.5rem 0 0.5rem'}}>Compliance</h3>
                    <p>HIPAA, HITRUST CSF, NIST 800-53, NIST 800-171, PCI-DSS, CJIS, SOX, FERPA, GDPR</p>
                    <h3 style={{fontSize:'15px', color:'var(--accent-cyan)', margin:'1.5rem 0 0.5rem'}}>Version History</h3>
                    <div style={{paddingLeft:'1rem', fontSize:'12px'}}>
                      <div><strong>v1.8.1</strong> — Fix: macOS app profile (and its forwarding profile) failed to create on tenants other than the lab tenant because the macOS template set a tenant-specific notification template (ID 2221); removed, macOS template now 16 settings</div>
                      <div><strong>v1.8.0</strong> — New Digital Experience (ZDX) module: set up Web and CloudPath probes following the Zscaler POV best practice guide (Microsoft Login predefined app and zscaler.com custom app), add Zscaler predefined SaaS apps (with tenant prefix) or your own URLs, review, dry run, apply with read-back verification and rollback; Manage screen to turn apps and probes on or off and delete custom ones</div>
                      <div><strong>v1.7.1</strong> — Mobile Admin wording: templates renamed "Zscaler POV Best Practice", each step explains what a forwarding profile and an app profile are; macOS now also defaults to creating a new forwarding profile</div>
                      <div><strong>v1.7.0</strong> — Mobile Admin: forwarding profile step before the app profile. Create a new forwarding profile from the POV best practice template (8 settings) or Portal Default, or pick an existing one; Apply creates the forwarding profile first, links the app profile to it and verifies both (rolls the forwarding profile back if the app profile fails). Delete forwarding profiles from Mobile Admin (refused while an app profile uses them)</div>
                      <div><strong>v1.6.1</strong> — Mobile Admin: create macOS app profiles from the POV best practice template with the same template, customize, review, dry run, apply and verify flow; Windows/macOS platform picker; macOS profiles listed for delete; Modern UI flagged as a manual portal step (the public API ignores it)</div>
                      <div><strong>v1.6.0</strong> — Mobile Admin: create Windows app profiles from the POV best practice template with customize, review, dry run, apply and read-back verification; delete profiles; fixed app-profile PATCH payload. Allow / Block step: choose Allow or Block per policy type (URL, Firewall, DNS, File Type, Cloud App Control, DLP) with per-rule overrides and weakening warnings</div>
                      <div><strong>v1.5.2</strong> — DLP rules shown in Review step, wizard state resets between runs for multi-deploy sessions</div>
                      <div><strong>v1.5.1</strong> — Multi-user sessions (50 concurrent, 1hr TTL), Policy Catalog browser (no auth needed)</div>
                      <div><strong>v1.5.0</strong> — Data Loss Prevention module (dictionary-first, 14 rule defs, 9 compliance frameworks)</div>
                      <div><strong>v1.4.0</strong> — UI restructure, ZeroTrustPanda branding, firewall nwApplications fix, About page</div>
                      <div><strong>v1.3.0</strong> — Mobile Admin Portal (ZCC), OneAPI-only auth</div>
                      <div><strong>v1.2.x</strong> — Sandbox, DNS, File Type, Cloud App Control, Bulk Rule Manager</div>
                      <div><strong>v1.0-1.1</strong> — URL Filtering, Firewall, SSL, Malware Protection, Error boundary</div>
                    </div>
                  </div>
                </div>
              )}
              {showZiaWizard && step === 'tier' && (<TierStep config={config} setConfig={setConfig}
                onNext={() => { markComplete('tier'); if (config.tier === 'ZTH_EBOOK') { setConfig(c => ({...c, complianceFramework: null})); markComplete('compliance'); goTo('customize'); } else { goTo('compliance'); } }} />)}
              {showZiaWizard && step === 'compliance' && (<ComplianceStep config={config} setConfig={setConfig}
                onNext={() => { markComplete('compliance'); goTo('customize'); }} onBack={() => goTo('tier')} />)}
              {showZiaWizard && step === 'customize' && (<CustomizeStep config={config} setConfig={setConfig}
                setTemplate={setTemplate} setError={setError} loading={loading} setLoading={setLoading}
                onNext={() => { markComplete('customize'); goTo('actions'); }} onBack={() => goTo('compliance')} />)}
              {showZiaWizard && step === 'actions' && (<ActionsStep config={config} setConfig={setConfig}
                setTemplate={setTemplate} setError={setError} loading={loading} setLoading={setLoading}
                onNext={() => { markComplete('actions'); goTo('review'); }} onBack={() => goTo('customize')} />)}
              {showZiaWizard && step === 'review' && (<ReviewStep template={template} plan={plan} setPlan={setPlan}
                auth={auth} setError={setError} loading={loading} setLoading={setLoading}
                onApply={() => { markComplete('review'); goTo('apply'); }} onBack={() => goTo('actions')} />)}
              {showZiaWizard && step === 'apply' && (<ApplyStep template={template} plan={plan}
                applyResult={applyResult} setApplyResult={setApplyResult}
                setError={setError} loading={loading} setLoading={setLoading}
                onNext={() => { markComplete('apply'); goTo('audit'); }} />)}
              {showZiaWizard && step === 'audit' && (<AuditStep auditLogs={auditLogs} setAuditLogs={setAuditLogs} setError={setError} />)}
              {showZiaBulk && (<BulkDeleteStep setError={setError} loading={loading} setLoading={setLoading} />)}
              {showZcc && (<MobileAdminStep setError={setError} loading={loading} setLoading={setLoading} config={config} />)}
              {showZdx && (<ZdxStep setError={setError} />)}
            </div>
          </div>
        </div>
      );
    }

    // ========================
    // Step: Connect
    // ========================
    function ConnectStep({ auth, setAuth, setError, loading, setLoading, onComplete }) {
      const [form, setForm] = useState({
        clientId: '', clientSecret: '', vanityDomain: '', cloud: ''
      });

      const handleConnect = async () => {
        setLoading(true); setError(null);
        try {
          const result = await api.call('POST', '/auth/oneapi', {
            clientId: form.clientId, clientSecret: form.clientSecret,
            vanityDomain: form.vanityDomain, cloud: form.cloud || undefined
          });
          api.sessionId = result.sessionId;
          setAuth({ connected: true, mode: 'oneapi', cloud: form.vanityDomain });
          onComplete();
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Connect to Zscaler</h2>
              <p>Authenticate using OneAPI (OAuth2) credentials from ZIdentity. This provides access to ZIA, ZCC, and other Zscaler services through a single token.</p>
            </div>

            <div className="explainer">
              <strong>Prerequisites:</strong> You need an API client configured in ZIdentity → Integration → API Clients
              with scopes for ZIA, ZCC and ZDX. The Client ID and Client Secret are generated there.
            </div>

            <div>
              <div className="form-group">
                <label className="form-label">Vanity Domain</label>
                <input type="text" value={form.vanityDomain} placeholder="yourcompany"
                  onChange={e => setForm({...form, vanityDomain: e.target.value})} />
                <div className="form-hint">Your ZIdentity vanity domain (e.g., "acme" for acme.zslogin.net)</div>
              </div>
              <div className="form-group">
                <label className="form-label">Client ID</label>
                <input type="text" value={form.clientId} placeholder="OAuth2 Client ID"
                  onChange={e => setForm({...form, clientId: e.target.value})} />
              </div>
              <div className="form-group">
                <label className="form-label">Client Secret</label>
                <input type="password" value={form.clientSecret} placeholder="OAuth2 Client Secret"
                  onChange={e => setForm({...form, clientSecret: e.target.value})} />
              </div>
              <div className="form-group">
                <label className="form-label">Cloud (optional)</label>
                <input type="text" value={form.cloud} placeholder="Leave blank for production"
                  onChange={e => setForm({...form, cloud: e.target.value})} />
                <div className="form-hint">Only needed for non-production environments (e.g., beta)</div>
              </div>
            </div>

            <div className="btn-group">
              <button className="btn btn-primary" onClick={handleConnect} disabled={loading}>
                {loading ? <><span className="spinner"></span> Connecting...</> : 'Connect & Authenticate'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ========================
    // Step: Module Select
    // ========================
    function ModuleStep({ config, setConfig, onNext }) {
      const [schema, setSchema] = useState(null);
      const [schemaLoading, setSchemaLoading] = useState(false);
      const [schemaError, setSchemaError] = useState(null);

      const fetchSchema = async () => {
        setSchemaLoading(true); setSchemaError(null);
        try {
          const data = await api.call('GET', '/diag/schema');
          setSchema(data);
        } catch (e) { setSchemaError(e.message); }
        setSchemaLoading(false);
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Select Modules</h2>
              <p>Choose which Zscaler modules to configure. The MVP focuses on ZIA.</p>
            </div>

            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1rem', margin:'1rem 0'}}>
              <div className={`tier-card selected`} style={{borderColor:'var(--accent-green)'}}>
                <div className="tier-icon">🌐</div>
                <div className="tier-name">Zscaler Internet Access</div>
                <div className="tier-desc">URL Filtering, Cloud Firewall, SSL Inspection, DLP, Sandbox, Cloud App Control, Malware Protection</div>
                <div style={{marginTop:'8px', color:'var(--accent-green)', fontSize:'12px', fontWeight:600}}>✓ ACTIVE</div>
              </div>
              <div className="placeholder-banner" style={{border:'1px dashed var(--border)'}}>
                <div className="tier-icon" style={{fontSize:'28px'}}>🔒</div>
                <h3>Zscaler Private Access</h3>
                <div className="tier-desc">App Segments, Access Policies, Wildcard Rules — Coming in a future release</div>
                <div style={{marginTop:'8px', color:'var(--text-muted)', fontSize:'12px'}}>PLACEHOLDER</div>
              </div>
            </div>

            <div className="card" style={{background:'var(--bg-input)', marginTop:'1rem'}}>
              <div className="card-header">
                <h3>API Schema Discovery</h3>
                <p>Fetch a sample of your tenant's current rules to verify API connectivity and field formats.</p>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={fetchSchema} disabled={schemaLoading}>
                {schemaLoading ? <><span className="spinner"></span> Fetching...</> : '🔍 Fetch Tenant Schema'}
              </button>
              {schemaError && <div className="alert alert-danger" style={{marginTop:'8px'}}>⚠ {schemaError}</div>}
              {schema && (
                <div style={{marginTop:'12px', maxHeight:'400px', overflowY:'auto'}}>
                  {Object.entries(schema).map(([key, val]) => (
                    <div key={key} style={{marginBottom:'12px'}}>
                      <div style={{fontWeight:600, fontSize:'13px', color:'var(--accent-cyan)', marginBottom:'4px'}}>{key}</div>
                      {val.error ? (
                        <div style={{fontSize:'12px', color:'var(--accent-red)'}}>Error: {val.error}</div>
                      ) : (
                        <pre style={{
                          fontSize:'11px', fontFamily:'IBM Plex Mono', color:'var(--text-secondary)',
                          background:'var(--bg-primary)', padding:'8px', borderRadius:'4px',
                          overflow:'auto', maxHeight:'200px', whiteSpace:'pre-wrap', wordBreak:'break-all'
                        }}>{JSON.stringify(val, null, 2)}</pre>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="btn-group">
              <button className="btn btn-primary" onClick={onNext}>Continue with ZIA →</button>
            </div>
          </div>
        </div>

    // ========================
    // Step: Allow / Block (v1.6.0)
    // ========================
    const isRestrictiveAction = (a) => /(^|,\s*)(BLOCK|DENY|CAUTION|ISOLATE)/.test(a || '');
    const isBlockAction = (a) => /(^|,\s*)(BLOCK|DENY)/.test(a || '');

    function ActionsStep({ config, setConfig, setTemplate, setError, loading, setLoading, onNext, onBack }) {
      const [catalog, setCatalog] = useState(null);
      const [open, setOpen] = useState({});
      const settings = config.actionSettings || { policy: {}, rules: {} };

      const catalogKey = JSON.stringify([config.tier, config.complianceFramework, config.prefix,
        config.enableUrlFiltering, config.enableFirewall, config.enableDnsSecurity,
        config.enableFileTypeControl, config.enableCloudAppControl, config.enableDlp]);

      useEffect(() => {
        let cancelled = false;
        setCatalog(null);
        api.call('POST', '/templates/action-catalog', config)
          .then(c => { if (!cancelled) setCatalog(c); })
          .catch(e => setError(e.message));
        return () => { cancelled = true; };
      }, [catalogKey]);

      const update = (policy, rules) => setConfig({ ...config, actionSettings: { policy, rules } });

      // A policy-level choice clears that type's per-rule overrides so the two never disagree
      const setPolicy = (type, value) => {
        const rules = { ...settings.rules };
        Object.keys(rules).forEach(k => { if (k.startsWith(type + ':')) delete rules[k]; });
        update({ ...settings.policy, [type]: value }, rules);
      };

      const baseFor = (r) => r.defaultAction === 'ALLOW' ? 'ALLOW' : isBlockAction(r.defaultAction) ? 'BLOCK' : null;

      const setRule = (type, rule, value) => {
        const rules = { ...settings.rules };
        const p = settings.policy[type];
        const inherited = (p === 'ALLOW' || p === 'BLOCK') ? p : baseFor(rule);
        if (value === inherited) delete rules[rule.key]; else rules[rule.key] = value;
        update(settings.policy, rules);
      };

      const effective = (type, r) => {
        if (r.locked) return baseFor(r);
        if (settings.rules[r.key]) return settings.rules[r.key];
        const p = settings.policy[type];
        if (p === 'ALLOW' || p === 'BLOCK') return p;
        return baseFor(r); // null = Caution/Isolate tier default
      };

      const isWeakened = (type, r) => !r.locked && isRestrictiveAction(r.defaultAction) && effective(type, r) === 'ALLOW';
      const weakenedCount = (catalog || []).reduce((n, g) => n + g.rules.filter(r => isWeakened(g.type, r)).length, 0);
      const overrideCount = Object.keys(settings.rules).length +
        Object.values(settings.policy).filter(v => v === 'ALLOW' || v === 'BLOCK').length;

      const resetAll = () => update({}, {});

      const handleGenerate = async () => {
        setLoading(true); setError(null);
        try {
          const tmpl = await api.call('POST', '/templates/generate', config);
          setTemplate(tmpl);
          onNext();
        } catch (e) { setError(e.message); }
        setLoading(false);
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Allow or Block</h2>
              <p>Choose whether each policy type allows or blocks. Expand a policy type to flip individual rules.</p>
            </div>

            <div className="alert alert-info">
              <span>ℹ <strong>Tier default</strong> keeps exactly what the {config.tier} tier creates (including Caution pages).
              <strong> Allow all</strong> / <strong>Block all</strong> applies to every rule in that policy type; you can then change single rules.</span>
            </div>

            {weakenedCount > 0 && (
              <div className="alert alert-warning">
                <span>⚠ {weakenedCount} rule{weakenedCount === 1 ? '' : 's'} that the {config.tier} tier would restrict {weakenedCount === 1 ? 'is' : 'are'} set to Allow.
                This reduces protection; it is flagged in the plan and recorded in the audit log.</span>
              </div>
            )}

            {!catalog ? (
              <div style={{textAlign:'center', padding:'2rem'}}><div className="spinner" style={{margin:'0 auto'}}></div></div>
            ) : catalog.length === 0 ? (
              <div className="alert alert-warning">None of the Allow/Block policy types are enabled. Go back to Customize.</div>
            ) : catalog.map(g => {
              const pol = settings.policy[g.type] || 'DEFAULT';
              const overrides = g.rules.filter(r => settings.rules[r.key]).length;
              const blocking = g.rules.filter(r => effective(g.type, r) === 'BLOCK').length;
              return (
                <div className="ab-group" key={g.type}>
                  <div className="ab-group-header" onClick={() => setOpen({ ...open, [g.type]: !open[g.type] })}>
                    <div>
                      <div className="ab-group-title">{open[g.type] ? '▾' : '▸'} {g.label}</div>
                      <div className="ab-group-sub">
                        {g.rules.length} rule{g.rules.length === 1 ? '' : 's'} · {blocking} blocking
                        {overrides > 0 && <> · {overrides} individually changed</>}
                      </div>
                    </div>
                    <div className="ab-seg" onClick={e => e.stopPropagation()}>
                      <button className={pol === 'DEFAULT' ? 'on-default' : ''} onClick={() => setPolicy(g.type, 'DEFAULT')}>Tier default</button>
                      <button className={pol === 'ALLOW' ? 'on-allow' : ''} onClick={() => setPolicy(g.type, 'ALLOW')}>Allow all</button>
                      <button className={pol === 'BLOCK' ? 'on-block' : ''} onClick={() => setPolicy(g.type, 'BLOCK')}>Block all</button>
                    </div>
                  </div>
                  {open[g.type] && (
                    <div className="ab-rows">
                      {g.rules.map(r => {
                        const eff = effective(g.type, r);
                        return (
                          <div className="ab-row" key={r.key}>
                            <div>
                              <div className="ab-row-name">{r.name}</div>
                              <div className="ab-row-desc">{r.description}</div>
                              <div className="ab-row-desc">
                                Tier default: <strong>{r.defaultActions ? r.defaultActions.join(', ') : r.defaultAction}</strong>
                              </div>
                              {isWeakened(g.type, r) && <div className="ab-warn">⚠ Weaker than the {config.tier} tier default</div>}
                              {r.locked && <div className="ab-row-desc">🔒 Required for baseline internet access; cannot be changed</div>}
                            </div>
                            <div className="ab-seg">
                              <button disabled={r.locked} className={eff === 'ALLOW' ? 'on-allow' : ''} onClick={() => setRule(g.type, r, 'ALLOW')}>Allow</button>
                              <button disabled={r.locked} className={eff === 'BLOCK' ? 'on-block' : ''} onClick={() => setRule(g.type, r, 'BLOCK')}>Block</button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}

            <div className="btn-group">
              <button className="btn btn-ghost" onClick={onBack}>← Back</button>
              {overrideCount > 0 && <button className="btn btn-ghost" onClick={resetAll}>Reset to tier defaults</button>}
              <button className="btn btn-primary" onClick={handleGenerate} disabled={loading || !catalog}>
                {loading ? <><span className="spinner"></span> Generating...</> : 'Generate Template & Review →'}
              </button>
            </div>
          </div>
        </div>
      );
    }

              <div>
                {loading ? (
                  <div style={{textAlign:'center', padding:'2rem'}}><div className="spinner" style={{margin:'0 auto'}}></div><p style={{marginTop:'8px', color:'var(--text-muted)'}}>Running dry run against your tenant...</p></div>
                ) : plan ? (
                  <div>
                    <div className="alert alert-info">
                      ℹ Plan Summary: <strong>{plan.summary.creates} creates</strong>, <strong>{plan.summary.updates} updates</strong>
                      {plan.summary.actionOverrides > 0 && <>, <strong>{plan.summary.actionOverrides} Allow/Block overrides</strong></>}
                      {plan.summary.riskyActions > 0 && <>, <span style={{color:'var(--accent-red)'}}>{plan.summary.riskyActions} risky actions</span></>}
                    </div>
                    {plan.warnings?.length > 0 && plan.warnings.map((w,i) => (
                      <div key={i} className="alert alert-warning">⚠ {w}</div>
                    ))}
                    <table className="diff-table">
                      <thead>
                        <tr>
                          <th>Action</th>
                          <th>Category</th>
                          <th>Rule Name</th>
                          <th>Current</th>
                          <th>Proposed</th>
                        </tr>
                      </thead>
                      <tbody>
                        {plan.actions.map((a, i) => (
                          <tr key={i}>
                            <td>
                              <span className={`badge ${a.type==='CREATE' ? 'badge-create' : 'badge-update'}`}>{a.type}</span>
                              {a.isRisky && <span className="badge badge-risk" style={{marginLeft:'4px'}}>RISK</span>}
                              {a.weakened && <span className="badge badge-risk" style={{marginLeft:'4px'}}>WEAKENED</span>}
                              {a.actionChanged && !a.weakened && <span className="badge badge-update" style={{marginLeft:'4px'}}>OVERRIDE</span>}
                            </td>
                            <td><span className="badge badge-category">{a.category}</span></td>
                            <td style={{fontFamily:'IBM Plex Mono', fontSize:'12px'}}>{a.name}</td>
                            <td style={{fontSize:'12px', color:'var(--text-muted)'}}>
                              {a.current ? JSON.stringify(a.current) : '—'}
                            </td>
                            <td style={{fontSize:'12px', color:'var(--accent-green)'}}>
                              {JSON.stringify(a.proposed)}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ) : (
                  <div>
                    <button className="btn btn-primary" onClick={runDryRun} disabled={loading}>
                      Run Dry Run Against Tenant
                    </button>
                    <p className="form-hint" style={{marginTop:'8px'}}>This will read your current configuration and show what would change.</p>
                  </div>
                )}
              </div>
            )}

            <div className="btn-group">
              <button className="btn btn-ghost" onClick={onBack}>← Back</button>
              {!auth.connected ? (
                <div className="alert alert-warning" style={{margin:0}}>Connect to ZIA first to apply changes</div>
              ) : (
                <button className="btn btn-success" onClick={onApply}>
                  Proceed to Apply →
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ========================
    // Step: Apply
    // ========================
    function ApplyStep({ template, plan, applyResult, setApplyResult, setError, loading, setLoading, onNext }) {
      const [confirmed, setConfirmed] = useState(false);

      const handleApply = async () => {
        setLoading(true); setError(null);
        try {
          const result = await api.call('POST', '/apply', {
            template,
            snapshotId: plan?.snapshotId
          });
          setApplyResult(result);
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      };

      const handleRollback = async () => {
        if (!plan?.snapshotId) return;
        setLoading(true);
        try {
          const result = await api.call('POST', '/rollback', { snapshotId: plan.snapshotId });
          alert(result.message);
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Apply Configuration</h2>
              <p>This will create policy rules in your ZIA tenant and activate the changes.</p>
            </div>

            {!applyResult ? (
              <div>
                <div className="alert alert-warning">
                  ⚠ <strong>Caution:</strong> This will make real changes to your ZIA tenant. A snapshot has been
                  taken for best-effort rollback. Created rules will be ordered above any conflicting existing rules.
                </div>

                <div className="toggle-item" style={{marginBottom:'1rem'}}>
                  <label onClick={() => setConfirmed(!confirmed)} style={{cursor:'pointer'}}>
                    I understand this will modify my ZIA tenant configuration and have reviewed the plan.
                  </label>
                  <div className={`toggle-switch ${confirmed ? 'active' : ''}`}
                    onClick={() => setConfirmed(!confirmed)}>
                    <div className="toggle-knob"></div>
                  </div>
                </div>

                <div className="btn-group">
                  <button className="btn btn-success" onClick={handleApply} disabled={!confirmed || loading}>
                    {loading ? <><span className="spinner"></span> Applying...</> : '🚀 Apply Changes'}
                  </button>
                </div>
              </div>
            ) : (
              <div>
                {applyResult.activated ? (
                  <div className="alert alert-success">
                    ✓ Changes applied and activated successfully!
                    Applied {applyResult.summary.applied} rules with {applyResult.summary.errors} errors.
                  </div>
                ) : (
                  <div className="alert alert-danger">
                    Changes were applied but activation may have failed. Check errors below.
                  </div>
                )}

                {applyResult.applied?.length > 0 && (
                  <div style={{marginBottom:'1rem'}}>
                    <h3 style={{fontSize:'14px', marginBottom:'8px', color:'var(--accent-green)'}}>Applied ({applyResult.applied.length})</h3>
                    {applyResult.applied.map((a, i) => (
                      <div key={i} style={{padding:'6px 12px', borderBottom:'1px solid var(--border)', fontSize:'13px'}}>
                        <span className={`badge ${a.type==='CREATE' ? 'badge-create' : 'badge-update'}`}>{a.type}</span>
                        {' '}<span className="badge badge-category">{a.category}</span>
                        {' '}{a.name}
                        {a.id && <span style={{color:'var(--text-muted)', marginLeft:'8px'}}>ID: {a.id}</span>}
                      </div>
                    ))}
                  </div>
                )}

                {applyResult.errors?.length > 0 && (
                  <div style={{marginBottom:'1rem'}}>
                    <h3 style={{fontSize:'14px', marginBottom:'8px', color:'var(--accent-red)'}}>Errors ({applyResult.errors.length})</h3>
                    {applyResult.errors.map((e, i) => (
                      <div key={i} className="alert alert-danger" style={{fontSize:'13px'}}>
                        {e.category} / {e.name}: {e.error}
                      </div>
                    ))}
                  </div>
                )}

                <div className="btn-group">
                  <button className="btn btn-danger" onClick={handleRollback} disabled={loading}>
                    ↩ Attempt Rollback
                  </button>
                  <button className="btn btn-primary" onClick={onNext}>
                    View Audit Log →
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================
    // Step: Audit Log
    // ========================
    function AuditStep({ auditLogs, setAuditLogs, setError }) {
      const [loaded, setLoaded] = useState(false);

      useEffect(() => {
        if (!loaded) {
          api.call('GET', '/audit/logs').then(setAuditLogs).catch(e => setError(e.message));
          setLoaded(true);
        }
      }, [loaded]);

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Audit Log</h2>
              <p>Complete record of all actions taken during this session.</p>
            </div>

            <div className="btn-group" style={{marginTop:0, marginBottom:'1rem'}}>
              <button className="btn btn-ghost btn-sm" onClick={() => {
                window.open('/api/audit/export/csv', '_blank');
              }}>📥 Export CSV</button>
              <button className="btn btn-ghost btn-sm" onClick={() => {
                window.open('/api/audit/export/json', '_blank');
              }}>📥 Export JSON</button>
              <button className="btn btn-ghost btn-sm" onClick={() => {
                api.call('GET', '/audit/logs').then(setAuditLogs).catch(e => setError(e.message));
              }}>🔄 Refresh</button>
            </div>

            <div style={{maxHeight:'500px', overflowY:'auto', border:'1px solid var(--border)', borderRadius:'var(--radius)'}}>
              <div className="log-entry" style={{background:'var(--bg-secondary)', position:'sticky', top:0}}>
                <span style={{fontWeight:600}}>Timestamp</span>
                <span style={{fontWeight:600}}>Action</span>
                <span style={{fontWeight:600}}>Status</span>
                <span style={{fontWeight:600}}>Details</span>
              </div>
              {auditLogs.length === 0 ? (
                <div style={{padding:'2rem', textAlign:'center', color:'var(--text-muted)'}}>No log entries yet</div>
              ) : (
                auditLogs.map((entry, i) => (
                  <div key={i} className="log-entry">
                    <span className="ts">{new Date(entry.timestamp).toLocaleString()}</span>
                    <span className="action">{entry.action}</span>
                    <span className={entry.status === 'success' ? 'status-ok' : 'status-err'}>
                      {entry.status}
                    </span>
                    <span style={{color:'var(--text-secondary)', wordBreak:'break-all'}}>
                      {typeof entry.details === 'object' ? JSON.stringify(entry.details) : entry.details}
                    </span>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // ========================
    // Step: Policy Catalog (no auth required)
    // ========================
    function CatalogStep() {
      const [catalog, setCatalog] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [openTiers, setOpenTiers] = useState({});
      const [openFws, setOpenFws] = useState({});
      const [openPolicies, setOpenPolicies] = useState({});

      useEffect(() => {
        let cancelled = false;
        setLoading(true);
        fetch('/api/catalog').then(r => r.json()).then(data => {
          if (!cancelled) { setCatalog(data); setLoading(false); }
        }).catch(e => {
          if (!cancelled) { setError(e.message); setLoading(false); }
        });
        return () => { cancelled = true; };
      }, []);

      const toggle = (map, setMap, key) => setMap(prev => ({ ...prev, [key]: !prev[key] }));

      const tierMeta = {
        STRICT: { icon: '🔒', label: 'Strict', color: 'var(--accent-red)' },
        BALANCED: { icon: '⚖️', label: 'Balanced', color: 'var(--accent-blue)' },
        PERMISSIVE: { icon: '🔓', label: 'Permissive', color: 'var(--accent-green)' },
        ZTH_EBOOK: { icon: '🏥', label: 'Zero Trust Hospital', color: 'var(--accent-purple)' }
      };

      const policyLabels = {
        urlFiltering: '🌐 URL Filtering',
        firewallFiltering: '🔥 Cloud Firewall',
        sslInspection: '🔒 SSL/TLS Inspection',
        sandbox: '📦 Cloud Sandbox',
        dnsSecurity: '🛡️ DNS Security',
        fileTypeControl: '📄 File Type Control',
        cloudAppControl: '☁️ Cloud App Control',
        dlp: '🔍 Data Loss Prevention',
        malwareProtection: '🦠 Malware Protection',
        advancedSettings: '⚙️ Advanced Settings'
      };

      function getActionClass(action) {
        if (!action) return '';
        const a = String(action).toUpperCase();
        if (a.includes('BLOCK')) return 'BLOCK';
        if (a === 'ALLOW') return 'ALLOW';
        if (a === 'CAUTION') return 'CAUTION';
        if (a.includes('DECRYPT') && !a.includes('NOT')) return 'DECRYPT';
        if (a.includes('DO_NOT_DECRYPT')) return 'DO_NOT_DECRYPT';
        if (a.includes('QUARANTINE')) return 'QUARANTINE';
        if (a.includes('INSPECT')) return 'INSPECT';
        return '';
      }

      function renderRule(rule, idx) {
        const actionClass = getActionClass(rule.action);
        return (
          <div className="catalog-rule" key={idx}>
            <div>
              <span className="catalog-rule-name">{rule.name}</span>
              <span className={`catalog-rule-action ${actionClass}`}>{rule.action}</span>
              {rule.severity && <span className="catalog-rule-action" style={{background:'var(--bg-secondary)',color:'var(--text-muted)',marginLeft:'4px'}}>{rule.severity.replace('RULE_SEVERITY_','')}</span>}
            </div>
            {rule.description && <div className="catalog-rule-detail">{rule.description}</div>}
            {rule.urlCategories && rule.urlCategories.length > 0 && (
              <div className="catalog-rule-cats">Categories: {rule.urlCategories.join(', ')}</div>
            )}
            {rule.nwApplications && rule.nwApplications.length > 0 && (
              <div className="catalog-rule-cats">Apps: {rule.nwApplications.join(', ')}</div>
            )}
            {rule.dictionaryNames && rule.dictionaryNames.length > 0 && (
              <div className="catalog-rule-cats">Dictionaries: {rule.dictionaryNames.join(', ')}</div>
            )}
            {rule.preferredEngines && rule.preferredEngines.length > 0 && (
              <div className="catalog-rule-cats">Preferred Engines: {rule.preferredEngines.join(', ')}</div>
            )}
            {rule.fileTypes && rule.fileTypes.length > 0 && (
              <div className="catalog-rule-cats">File Types: {Array.isArray(rule.fileTypes) ? rule.fileTypes.join(', ') : rule.fileTypes}</div>
            )}
            {rule.firstTimeOperation && (
              <div className="catalog-rule-cats">First-time: {rule.firstTimeOperation}</div>
            )}
            {rule.withoutContentInspection && (
              <div className="catalog-rule-cats" style={{color:'var(--accent-amber)'}}>Without Content Inspection</div>
            )}
            {rule.complianceMapping && rule.complianceMapping.length > 0 && (
              <div style={{marginTop:'4px'}}>
                {rule.complianceMapping.map((c, ci) => (
                  <span key={ci} className="catalog-compliance-tag">{c.framework} {c.id}: {c.name}</span>
                ))}
              </div>
            )}
          </div>
        );
      }

      function renderPolicies(policies, tierKey, fwKey) {
        return Object.entries(policies).map(([policyType, rules]) => {
          const pKey = `${tierKey}-${fwKey}-${policyType}`;
          const isOpen = openPolicies[pKey];
          const count = Array.isArray(rules) ? rules.length : 1;
          const label = policyLabels[policyType] || policyType;
          return (
            <div className="catalog-policy-group" key={policyType}>
              <div className="catalog-policy-header" onClick={() => toggle(openPolicies, setOpenPolicies, pKey)}>
                <span className="arrow" style={{fontSize:'10px',transition:'transform 0.2s',transform:isOpen?'rotate(90deg)':'none'}}>▶</span>
                {label}
                <span className="catalog-count">{count}</span>
              </div>
              {isOpen && Array.isArray(rules) && rules.map((r, i) => renderRule(r, i))}
              {isOpen && !Array.isArray(rules) && rules.settings && (
                <div className="catalog-rule">
                  <div className="catalog-rule-name">{rules.name}</div>
                  {rules.description && <div className="catalog-rule-detail">{rules.description}</div>}
                  <div className="catalog-rule-cats" style={{whiteSpace:'pre-wrap'}}>{JSON.stringify(rules.settings, null, 2)}</div>
                  {rules.complianceMapping && rules.complianceMapping.length > 0 && (
                    <div style={{marginTop:'4px'}}>
                      {rules.complianceMapping.map((c, ci) => (
                        <span key={ci} className="catalog-compliance-tag">{c.framework} {c.id}: {c.name}</span>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        });
      }

      if (loading) return <div className="catalog-loading">Loading policy catalog...</div>;
      if (error) return <div className="alert alert-danger">Failed to load catalog: {error}</div>;
      if (!catalog) return null;

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>📖 Policy Catalog</h2>
              <p>Browse every rule across all security tiers and compliance frameworks. No authentication required. Click a tier to expand, then drill into frameworks and policy types to see individual rules with compliance mappings.</p>
            </div>

            <div className="explainer">
              <strong>How to use:</strong> Expand a security tier below, then pick a compliance framework (or "No Framework" for general-purpose).
              Each policy module shows every rule that would be created, including the action, URL categories, dictionaries, protocols, and
              mapped compliance controls. Use this to decide which tier and framework is right for your organization before connecting to ZIA.
            </div>

            {Object.entries(catalog.tiers).map(([tierKey, fwMap]) => {
              const meta = tierMeta[tierKey] || { icon: '?', label: tierKey, color: 'var(--text-primary)' };
              const isTierOpen = openTiers[tierKey];
              const totalRules = Object.values(fwMap).reduce((sum, fw) =>
                sum + Object.values(fw.ruleCounts || {}).reduce((s, c) => s + c, 0), 0
              );

              return (
                <div className="catalog-tier" key={tierKey}>
                  <div className="catalog-tier-header" onClick={() => toggle(openTiers, setOpenTiers, tierKey)}>
                    <span className="arrow" style={{transform:isTierOpen?'rotate(90deg)':'none'}}>▶</span>
                    <span>{meta.icon}</span>
                    <span style={{color: meta.color}}>{meta.label}</span>
                    <span className="catalog-count">{Object.keys(fwMap).length} framework{Object.keys(fwMap).length !== 1 ? 's' : ''}</span>
                  </div>
                  {isTierOpen && Object.entries(fwMap).map(([fwKey, fwData]) => {
                    const fKey = `${tierKey}-${fwKey}`;
                    const isFwOpen = openFws[fKey];
                    const fwLabel = fwKey === 'NONE' ? 'No Framework (General)' :
                      (catalog.frameworks[fwKey] ? `${catalog.frameworks[fwKey].name} — ${catalog.frameworks[fwKey].fullName}` : fwKey);
                    const rc = fwData.ruleCounts || {};
                    const totalFwRules = Object.values(rc).reduce((s, c) => s + c, 0);

                    return (
                      <div className="catalog-fw" key={fwKey}>
