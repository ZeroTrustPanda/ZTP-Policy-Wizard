<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroTrustPanda ZS Policy Wizard v2.7.0 - Zscaler Template Policy Configuration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-card: #1a2236;
      --bg-card-hover: #1f2943;
      --bg-input: #0f1629;
      --border: #2a3654;
      --border-focus: #3b82f6;
      --text-primary: #e8ecf4;
      --text-secondary: #8896b3;
      --text-muted: #5c6b8a;
      --accent-blue: #3b82f6;
      --accent-blue-dim: #1e40af;
      --accent-green: #10b981;
      --accent-green-dim: #065f46;
      --accent-amber: #f59e0b;
      --accent-amber-dim: #78350f;
      --accent-red: #ef4444;
      --accent-red-dim: #7f1d1d;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --radius: 8px;
      --radius-lg: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Layout */
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-brand .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: white;
    }
    .header-brand h1 {
      font-size: 18px; font-weight: 600;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-brand .tag {
      font-size: 10px; padding: 2px 8px; border-radius: 4px;
      background: var(--accent-blue-dim); color: var(--accent-blue);
      font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .auth-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
    }
    .auth-badge.connected { background: var(--accent-green-dim); color: var(--accent-green); }
    .auth-badge.disconnected { background: var(--accent-red-dim); color: var(--accent-red); }
    .auth-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .auth-badge.connected .dot { background: var(--accent-green); }
    .auth-badge.disconnected .dot { background: var(--accent-red); }

    .main { flex: 1; display: flex; min-width: 0; }
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 1.5rem 0;
      flex-shrink: 0;
    }
    .sidebar-section { padding: 0 1rem; margin-bottom: 1.5rem; }
    .sidebar-section-title {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text-muted); padding: 0 0.5rem;
      margin-bottom: 8px;
    }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius);
      cursor: pointer; font-size: 14px; color: var(--text-secondary);
      transition: all 0.15s;
      position: relative;
    }
    .sidebar-item:hover { background: var(--bg-card); color: var(--text-primary); }
    .sidebar-item.active {
      background: var(--accent-blue-dim);
      color: var(--accent-blue);
      font-weight: 500;
    }
    .sidebar-item .step-num {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      background: var(--bg-input); border: 1px solid var(--border);
    }
    .sidebar-item.active .step-num {
      background: var(--accent-blue); border-color: var(--accent-blue); color: white;
    }
    .sidebar-item.completed .step-num {
      background: var(--accent-green); border-color: var(--accent-green); color: white;
    }

    /* v2.3.1: the content column fills the window (up to a readable maximum) and never pushes past it */
    .content { flex: 1 1 auto; min-width: 0; padding: 2rem clamp(1rem, 3vw, 3rem); max-width: min(1280px, 100%); }
    .content-wide { max-width: min(1440px, 100%); }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: clamp(1rem, 2vw, 1.5rem);
      margin-bottom: 1.5rem;
      min-width: 0; max-width: 100%;
      overflow-x: auto;
    }
    .card .card { overflow-x: visible; }
    .card-header { margin-bottom: 1rem; }
    .card-header h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .card-header h3 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .card-header p { font-size: 14px; color: var(--text-secondary); }

    /* Form Elements */
    .form-group { margin-bottom: 1.25rem; }
    .form-label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 6px;
    }
    .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    input[type="text"], input[type="password"], input[type="date"], select, textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      transition: border-color 0.15s;
      outline: none;
    }
    input[type="date"] { color-scheme: dark; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }
    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 80px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 500;
      cursor: pointer; border: 1px solid transparent;
      transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent-blue); color: white; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-success { background: var(--accent-green); color: white; }
    .btn-success:hover:not(:disabled) { background: #059669; }
    .btn-warning { background: var(--accent-amber); color: #1a1a1a; }
    .btn-danger { background: var(--accent-red); color: white; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .btn-ghost {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--text-muted); color: var(--text-primary); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .btn-group { display: flex; gap: 8px; margin-top: 1.5rem; }

    /* Tier Cards */
    .tier-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1rem 0; }
    .tier-card {
      background: var(--bg-input);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .tier-card:hover { border-color: var(--text-muted); }
    .tier-card.selected { border-color: var(--accent-blue); background: var(--accent-blue-dim); }
    .tier-card .tier-icon { font-size: 28px; margin-bottom: 8px; }
    .tier-card .tier-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .tier-card .tier-desc { font-size: 12px; color: var(--text-secondary); }

    /* Compliance Grid */
    .compliance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 1rem 0; }
    a.btn, a.btn:hover { text-decoration: none; }
    .compliance-chip {
      padding: 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      text-align: center;
    }
    .compliance-chip:hover { border-color: var(--text-muted); }
    .compliance-chip.selected { border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }

    /* Toggle */
    .toggle-group { display: flex; flex-direction: column; gap: 8px; }
    .toggle-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .toggle-item label { font-size: 14px; cursor: pointer; }
    .toggle-switch {
      position: relative; width: 44px; height: 24px;
      background: var(--bg-secondary); border-radius: 12px;
      cursor: pointer; transition: background 0.2s;
      border: 1px solid var(--border);
    }
    .toggle-switch.active { background: var(--accent-blue); border-color: var(--accent-blue); }
    .toggle-switch .toggle-knob {
      position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%;
      background: white; transition: transform 0.2s;
    }
    .toggle-switch.active .toggle-knob { transform: translateX(20px); }

    /* Allow / Block step (v1.6.0) */
    .ab-group { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; background: var(--bg-input); }
    .ab-group-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; cursor: pointer; flex-wrap: wrap; }
    .ab-group-title { font-size: 14px; font-weight: 600; }
    .ab-group-sub { font-size: 12px; color: var(--text-muted); }
    .ab-rows { border-top: 1px solid var(--border); }
    .ab-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .ab-row:last-child { border-bottom: none; }
    .ab-row-name { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    .ab-row-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .ab-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .ab-seg button { background: var(--bg-secondary); color: var(--text-secondary); border: none; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
    .ab-seg button + button { border-left: 1px solid var(--border); }
    .ab-seg button.on-allow { background: var(--accent-green); color: #0a0e17; font-weight: 600; }
    .ab-seg button.on-block { background: var(--accent-red); color: #fff; font-weight: 600; }
    .ab-seg button.on-default { background: var(--accent-blue); color: #fff; font-weight: 600; }
    .ab-seg button:disabled { opacity: 0.4; cursor: not-allowed; }
    .ab-warn { color: var(--accent-amber); font-size: 11px; margin-top: 2px; }

    /* Plan/Diff View */
    .diff-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .diff-table th {
      text-align: left; padding: 8px 12px;
      background: var(--bg-secondary); border-bottom: 1px solid var(--border);
      font-weight: 600; color: var(--text-secondary); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .diff-table td {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      vertical-align: top; overflow-wrap: anywhere;
    }
    .diff-table td input[type="text"], .diff-table td select { min-width: 0; padding: 6px 8px; }
    .zpa-apps td { padding: 6px 6px; }
    .zpa-apps th { padding: 8px 6px; }
    .diff-table tr:hover { background: var(--bg-card-hover); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
    }
    .badge-create { background: var(--accent-green-dim); color: var(--accent-green); }
    .badge-update { background: var(--accent-blue-dim); color: var(--accent-blue); }
    .badge-risk { background: var(--accent-red-dim); color: var(--accent-red); }
    .badge-category { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }

    /* Alerts */
    .alert {
      padding: 12px 16px; border-radius: var(--radius);
      margin-bottom: 1rem; font-size: 14px;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .alert-info { background: var(--accent-blue-dim); border: 1px solid rgba(59,130,246,0.3); }
    .alert-warning { background: var(--accent-amber-dim); border: 1px solid rgba(245,158,11,0.3); color: var(--accent-amber); }
    .alert-success { background: var(--accent-green-dim); border: 1px solid rgba(16,185,129,0.3); color: var(--accent-green); }
    .alert-danger { background: var(--accent-red-dim); border: 1px solid rgba(239,68,68,0.3); color: var(--accent-red); }

    /* Explainer */
    .explainer {
      background: var(--bg-input);
      border-left: 3px solid var(--accent-cyan);
      padding: 12px 16px;
      margin: 1rem 0;
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .explainer strong { color: var(--accent-cyan); }

    /* Compliance Evidence */
    .evidence-item {
      padding: 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 6px;
      font-size: 13px;
    }
    .evidence-item .fw { color: var(--accent-purple); font-weight: 600; }
    .evidence-item .ctrl { color: var(--accent-cyan); }

    /* Audit Log */
    .log-entry {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      display: grid;
      grid-template-columns: 180px 120px 100px 1fr;
      gap: 8px;
    }
    .log-entry .ts { color: var(--text-muted); }
    .log-entry .action { color: var(--accent-cyan); font-weight: 500; }
    .log-entry .status-ok { color: var(--accent-green); }
    .log-entry .status-err { color: var(--accent-red); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Loading spinner */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ZPA placeholder */
    .placeholder-banner {
      background: linear-gradient(135deg, var(--bg-card), var(--bg-input));
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: center;
      color: var(--text-muted);
    }
    .placeholder-banner h3 { color: var(--text-secondary); margin-bottom: 8px; }

    /* Responsive */
    .header { flex-wrap: wrap; gap: 8px; }
    .header-right { flex-wrap: wrap; }
    img, svg, pre, code { max-width: 100%; }
    pre { overflow-x: auto; }
    .btn-group { flex-wrap: wrap; }
    @media (max-width: 1200px) {
      .sidebar { width: 220px; }
      .diff-table th, .diff-table td { padding: 8px; }
    }
    @media (max-width: 760px) {
      [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
      .guide-pill { font-size: 11px; padding: 4px 8px; }
    }
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .content { padding: 1rem; }
      .tier-grid { grid-template-columns: 1fr; }
      .compliance-grid { grid-template-columns: repeat(2, 1fr); }
      .form-row { grid-template-columns: 1fr; }
    }
    /* Policy Catalog */
    .catalog-tier { margin-bottom: 2rem; }
    .catalog-tier-header {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; user-select: none; font-weight: 600; font-size: 15px;
    }
    .catalog-tier-header:hover { background: var(--bg-card-hover); }
    .catalog-tier-header .arrow { transition: transform 0.2s; font-size: 11px; color: var(--text-muted); }
    .catalog-tier-header .arrow.open { transform: rotate(90deg); }
    .catalog-fw { margin: 0.5rem 0 0.5rem 1.5rem; }
    .catalog-fw-header {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; font-weight: 500; font-size: 13px;
    }
    .catalog-fw-header:hover { background: var(--bg-card-hover); }
    .catalog-policy-group { margin: 0.5rem 0 0.5rem 1rem; }
    .catalog-policy-header {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.6rem;
      cursor: pointer; font-size: 13px; font-weight: 500; color: var(--accent-cyan);
    }
    .catalog-policy-header:hover { color: var(--accent-blue); }
    .catalog-rule {
      margin: 0.25rem 0 0.25rem 1.5rem; padding: 0.6rem 0.75rem;
      background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; line-height: 1.6;
    }
    .catalog-rule-name { font-weight: 600; color: var(--text-primary); font-size: 13px; }
    .catalog-rule-action {
      display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11px;
      font-weight: 600; margin-left: 0.5rem;
    }
    .catalog-rule-action.BLOCK { background: var(--accent-red-dim); color: var(--accent-red); }
    .catalog-rule-action.ALLOW { background: var(--accent-green-dim); color: var(--accent-green); }
    .catalog-rule-action.CAUTION { background: var(--accent-amber-dim); color: var(--accent-amber); }
    .catalog-rule-action.INSPECT, .catalog-rule-action.DECRYPT { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
    .catalog-rule-action.DO_NOT_DECRYPT { background: rgba(139,92,246,0.15); color: var(--accent-purple); }
    .catalog-rule-action.QUARANTINE, .catalog-rule-action.QUARANTINE_ISOLATE { background: rgba(139,92,246,0.15); color: var(--accent-purple); }
    .catalog-rule-detail { color: var(--text-secondary); margin-top: 2px; }
    .catalog-rule-cats { color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 3px; word-break: break-all; }
    .catalog-compliance-tag {
      display: inline-block; padding: 1px 6px; margin: 2px 3px 2px 0; border-radius: 3px;
      font-size: 10px; background: rgba(59,130,246,0.12); color: var(--accent-blue); font-family: 'IBM Plex Mono', monospace;
    }
    .catalog-count {
      display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
      background: var(--bg-input); color: var(--text-muted); margin-left: 0.5rem; font-weight: 400;
    }
    .catalog-loading { text-align: center; padding: 3rem; color: var(--text-muted); }
    .catalog-summary { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.25rem; }
    .catalog-summary-chip {
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border);
    }
      .guide-stepper { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1rem; position:sticky; top:0; z-index:5; background:var(--bg-primary); padding:6px 0; }
    .guide-pill { display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-size:12px; border:1px solid var(--border); background:var(--bg-input); color:var(--text-muted); }
    .guide-pill.cur { background:var(--accent-blue); color:#fff; border-color:var(--accent-blue); }
    .guide-pill.seen { background:var(--accent-green-dim); color:var(--accent-green); }
    .guide-num { display:inline-flex; width:18px; height:18px; border-radius:50%; align-items:center; justify-content:center; font-size:10px; background:rgba(255,255,255,0.15); }
    /* ===== v2.5 light theme ("Forest") =====
       Neutral, slightly green-cool canvas; white surfaces; one brand green for actions and selection;
       status colours kept distinct from the brand (info = slate blue, warning = ochre, danger = brick).
       Text contrast: ink 15.9:1, secondary 7.6:1, muted 4.7:1 on white (WCAG AA for body text). */
    :root[data-theme="light"] {
      --bg-primary: #F2F5F3;
      --bg-secondary: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F5F8F6;
      --bg-input: #FFFFFF;
      --bg-subtle: #F6F8F7;
      --border: #DCE3DE;
      --border-strong: #C5D0C9;
      --border-focus: #1F7A4D;
      --text-primary: #13231B;
      --text-secondary: #45564D;
      --text-muted: #66766D;
      --accent-blue: #1F7A4D;      /* brand: actions, selection, focus */
      --accent-blue-dim: #E4F1EA;
      --accent-green: #157347;     /* success */

    :root[data-theme="light"] .guide-pill.cur .guide-num { background: rgba(255,255,255,.22); }

    :root[data-theme="light"] ::-webkit-scrollbar-track { background: var(--bg-primary); }
    :root[data-theme="light"] ::-webkit-scrollbar-thumb { background: #C5D0C9; }
    :root[data-theme="light"] .catalog-compliance-tag, :root[data-theme="light"] .catalog-rule-action.INSPECT, :root[data-theme="light"] .catalog-rule-action.DECRYPT { background: #E4F1EA; color: #145A39; }
    .sidebar { position: sticky; top: 64px; align-self: flex-start; height: calc(100vh - 64px); overflow-y: auto; }
    @media (max-width: 900px) { .sidebar { position: static; height: auto; } }
    .product-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--accent-blue-dim); color: var(--accent-blue); margin-bottom: 12px; }

    @media (max-width: 900px) { .about-grid { grid-template-columns: 1fr; } }

    .about-list { list-style: none; padding: 0; margin: 0; }
    .about-list li { padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
    .about-list li strong { display: block; font-weight: 600; }
    .about-list li span { color: var(--text-secondary); font-size: 13px; }

</head>
<body>
  <div id="app"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ========================
    // Error Boundary — catches React render crashes and shows debug info instead of black screen
    // ========================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        this.setState({ errorInfo });
        // Log to console for debugging
        console.error('[ZTP ErrorBoundary] Render crash caught:', error);
        console.error('[ZTP ErrorBoundary] Component stack:', errorInfo?.componentStack);
        // Also log to server error log
        try {
          const payload = {
            error: error?.message || String(error),
            stack: error?.stack,
            componentStack: errorInfo?.componentStack
          };
          console.error('[ZTP ErrorBoundary] Full details:', JSON.stringify(payload, null, 2));
        } catch(e) {}
      }
      render() {
        if (this.state.hasError) {
          return React.createElement('div', {
            style: { padding: '2rem', background: '#1a0000', border: '2px solid #ef4444',
                     borderRadius: '8px', margin: '1rem', color: '#fca5a5', fontFamily: 'monospace' }
          },
            React.createElement('h2', { style: { color: '#ef4444', marginBottom: '1rem' } }, '⚠ UI Render Error'),
            React.createElement('p', { style: { marginBottom: '1rem' } },
              'A React rendering error occurred. This is a bug — the data from the API could not be displayed. Details below:'),
            React.createElement('pre', {
              style: { fontSize: '12px', background: '#0a0a0a', padding: '1rem', borderRadius: '4px',
                       overflow: 'auto', maxHeight: '300px', whiteSpace: 'pre-wrap', color: '#fca5a5' }
            }, [
              'Error: ' + (this.state.error?.message || String(this.state.error)),
              '\n\nStack: ' + (this.state.error?.stack || 'N/A'),
              '\n\nComponent: ' + (this.state.errorInfo?.componentStack || 'N/A')
            ].join('')),
            React.createElement('p', { style: { marginTop: '1rem', fontSize: '12px', color: '#9ca3af' } },
              'Check the browser developer console (F12 → Console tab) for full details. ' +
              'Also check the server logs in ./logs/ for API-side errors.'),
            React.createElement('button', {
              onClick: () => this.setState({ hasError: false, error: null, errorInfo: null }),
              style: { marginTop: '1rem', padding: '8px 16px', background: '#ef4444', color: 'white',
                       border: 'none', borderRadius: '4px', cursor: 'pointer' }
            }, '🔄 Try Again')
          );
        }
        return this.props.children;
      }
    }

    // ========================
    // App Version
    // ========================
    const APP_VERSION = '2.8.0';
    const BUILD_DATE = '2026-03-30';

    // ========================
    // v2.6: tenant keys in memory. One signed-in session per tenant, kept by the wizard's server process while it runs.
    // The browser holds only the session handles (never a client secret); closing the wizard forgets them all.
    // ========================
    const wallet = {
      items: (() => { try { return JSON.parse(sessionStorage.getItem('zpw.wallet') || '{}'); } catch (e) { return {}; } })(),
      key: (t) => `${String((t && t.vanity) || '').toLowerCase()}@${String((t && t.cloud) || 'production').toLowerCase()}`,
      get(t) { return t ? this.items[this.key(t)] || null : null; },
      put(t, sessionId) { this.items[this.key(t)] = { sessionId, vanity: String(t.vanity || '').toLowerCase(), cloud: t.cloud || 'production', at: Date.now() }; this.save(); },
      drop(t) { delete this.items[this.key(t)]; this.save(); },
      dropSession(sid) { for (const [k, v] of Object.entries(this.items)) if (v.sessionId === sid) delete this.items[k]; this.save(); },
      list() { return Object.values(this.items); },
      save() { try { sessionStorage.setItem('zpw.wallet', JSON.stringify(this.items)); } catch (e) { /* memory only */ } }
    };

    // ========================
    // API Helper
    // ========================
    const api = {
      sessionId: null,
      async call(method, path, body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (this.sessionId) headers['X-Session-Id'] = this.sessionId;
        const opts = { method, headers };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(`/api${path}`, opts);
        const data = await res.json();
        if (!res.ok) { const e = new Error(data.error || 'Request failed'); e.data = data; e.status = res.status; throw e; }
        return data;
      },
      /** v2.2 live progress: newline-delimited JSON from /api/v2/events; returns a stop function. */
      events(onEvent) {
        const ctl = new AbortController();
        (async () => {
          try {
            const res = await fetch('/api/v2/events', { headers: { 'X-Session-Id': this.sessionId || '' }, signal: ctl.signal });
            const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
            for (;;) {
              const { value, done } = await reader.read(); if (done) break;
              buf += dec.decode(value, { stream: true });
              let i; while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 1); try { const ev = JSON.parse(line); if (!ev.beat && !ev.hello) onEvent(ev); } catch (e) { /* partial */ } }
            }
          } catch (e) { /* stopped */ }
        })();
        return () => ctl.abort();
      }
    };

    // ========================
    // Wizard Steps
    // ========================
    const WIZARD_STEPS = [
      { id: 'tier', label: 'Framework File', icon: '📁' },
      { id: 'customize', label: 'Customize', icon: '⚙️' },
      { id: 'actions', label: 'Rules', icon: '🚦' },
      { id: 'review', label: 'Review Plan', icon: '🔍' },
      { id: 'apply', label: 'Apply', icon: '🚀' },
      { id: 'audit', label: 'Audit Log', icon: '📄' }
    ];

    // ========================
    // Main App
    // ========================
    // v2.5: one line-icon set (24px grid, 1.75 stroke, round caps; drawn for this app) instead of emoji
    const ICON_PATHS = {
      start: 'M5 12h11M12 6l6 6-6 6M4 5v14',
      povs: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
      plus: 'M12 5v14M5 12h14',
      templates: 'M8 4h9a2 2 0 0 1 2 2v12M5 8h9a2 2 0 0 1 2 2v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z',
      zcc: 'M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM11 18h2',
      zia: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.5 2.4 3.8 5.4 3.8 9s-1.3 6.6-3.8 9c-2.5-2.4-3.8-5.4-3.8-9S9.5 5.4 12 3z',
      zpa: 'M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3M12 15v2',
      zdx: 'M3 12h4l3-7 4 14 3-7h4',
      aiguard: 'M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6zM9.5 12l1.8 1.8L15 10',
      tests: 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3M7.5 15h9',
      restore: 'M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4M12 8v4l3 2',
      report: 'M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v4h4M9 12h6M9 16h6',
      bulk: 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',
      catalog: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7',
      about: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v6M12 7.5v.5',
      connected: 'M5 12l4.5 4.5L19 7',
      connect: 'M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0zM12 16v5',
      chevron: 'M9 6l6 6-6 6'
    };
    function Icon({ name, size = 16, style }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={{ flexShrink: 0, ...(style || {}) }}>
          <path d={ICON_PATHS[name] || ICON_PATHS.about} />
        </svg>
      );
    }

    function ThemeToggle() {
      const [theme, setTheme] = useState(() => document.documentElement.dataset.theme || 'light');
      const pick = (t) => { document.documentElement.dataset.theme = t; setTheme(t); try { localStorage.setItem('zpw.theme', t); } catch (e) {} };
      return (
        <div className="theme-toggle" role="group" aria-label="Colour theme" data-themetoggle>
          <button className={theme === 'light' ? 'on' : ''} aria-pressed={theme === 'light'} onClick={() => pick('light')} data-theme-light>Light</button>
          <button className={theme === 'dark' ? 'on' : ''} aria-pressed={theme === 'dark'} onClick={() => pick('dark')} data-theme-dark>Dark</button>
        </div>
      );
    }

    function App() {
      // Navigation: activeModule = 'zia-wizard' | 'zia-bulk' | 'zcc' | 'about' | null
      const [activeModule, setActiveModule] = useState(null);
      const [step, setStep] = useState('connect');
      const [auth, setAuth] = useState({ connected: false, mode: null, cloud: null });
      const [config, setConfig] = useState({
        module: 'zia',
        tier: 'BALANCED',
        complianceFramework: null,
        prefix: 'ZTP',
        enableUrlFiltering: true,
        enableFirewall: true,
        enableSslInspection: true,
        enableMalwareProtection: true,
        enableAdvancedSettings: true,
        enableSandbox: true,
        enableDnsSecurity: true,
        enableFileTypeControl: true,
        enableCloudAppControl: true,
        enableDlp: true,
        // v1.6.0 Allow/Block choices: policy-level ('DEFAULT'|'ALLOW'|'BLOCK') + per-rule overrides ('ISOLATE' for URL rules, v1.9.0)
        actionSettings: { policy: {}, rules: {} },
        // v1.9.0: rule on/off switches, isolation profile, interception certificate, framework loaded from a file / capture
        disabledRules: {},
        cbiProfile: null,
        sslCertificate: null,
        baseTemplate: null,
        frameworkName: null
      });
      const [template, setTemplate] = useState(null);
      const [plan, setPlan] = useState(null);
      const [applyResult, setApplyResult] = useState(null);
      const [auditLogs, setAuditLogs] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [completedSteps, setCompletedSteps] = useState(new Set());
      // v2.0
      const meta = useV2Meta();
      const [globalPrefix, setGlobalPrefix] = useState(() => safeStore.get('zpw.prefix') || '');
      const [licensing, setLicensing] = useState(null);
      const [pov, setPov] = useState(POV_DEFAULT);          // GLB-06: lives here, so Back / Next never loses a choice
      const [povStep, setPovStep] = useState('scope');
      const [povResult, setPovResult] = useState(null);
      const [povReached, setPovReached] = useState(0);
      // v2.4: Active POVs
      const [povList, setPovList] = useState([]);
      const [povsOpen, setPovsOpen] = useState(true);
      const [activePov, setActivePov] = useState(null);
      const [sessionTenant, setSessionTenant] = useState(null);
      const [povHomeId, setPovHomeId] = useState(null);
      const [guideKey, setGuideKey] = useState(1);
      const [guideResume, setGuideResume] = useState(null);
      const [guideTemplate, setGuideTemplate] = useState(null);
      const [pendingOpen, setPendingOpen] = useState(null);
      const [connectPrefill, setConnectPrefill] = useState(null);
      const refreshPovs = () => api.call('GET', '/v2/povs').then(r => setPovList(r.povs || [])).catch(() => {});
      useEffect(() => { refreshPovs(); const t = setInterval(refreshPovs, 60000); return () => clearInterval(t); }, [auth.connected]);
      const goPov = (id) => { setError(null); setPovStep(id); setPovReached(r => Math.max(r, POV_STEPS.findIndex(s => s.id === id))); };
      useEffect(() => {
        if (!auth.connected) { setLicensing(null); setActivePov(null); setSessionTenant(null); return; }
        api.call('GET', '/v2/povs/active').then(r => { setSessionTenant(r.tenant); if (r.pov) setActivePov(r.pov); }).catch(() => {});
        if (globalPrefix) api.call('POST', '/v2/prefix', { prefix: globalPrefix }).catch(() => {});
        api.call('GET', '/v2/licensing').then(setLicensing).catch(() => setLicensing({ items: {}, endpointDlpEnabledInZcc: null }));
      }, [auth.connected, auth.sid]);

      const markComplete = (s) => setCompletedSteps(prev => new Set([...prev, s]));

      const goTo = (s) => {
        setError(null);
        // Clear downstream state when going back in the wizard
        const stepOrder = ['tier', 'compliance', 'customize', 'actions', 'review', 'apply', 'audit'];
        const targetIdx = stepOrder.indexOf(s);
        if (targetIdx >= 0) {
          if (targetIdx < stepOrder.indexOf('review')) { setPlan(null); }
          if (targetIdx < stepOrder.indexOf('apply')) { setApplyResult(null); }
          if (targetIdx < stepOrder.indexOf('customize')) { setTemplate(null); }
        }
        setStep(s);
      };

      const [bulkTab, setBulkTab] = useState('zia');
      const switchModule = (mod) => {
        setError(null);
        // v2.3: the per-product bulk managers are one page now
        if (['zia-bulk', 'zpa-bulk', 'zdx-bulk'].includes(mod)) { setBulkTab(mod.split('-')[0]); mod = 'bulk'; }
        setActiveModule(mod);
        if (mod === 'zia-wizard') {
          // Reset wizard state so user can run a fresh deployment
          setStep('tier');
          setTemplate(null);
          setPlan(null);
          setApplyResult(null);
          setCompletedSteps(new Set());
        }
        else if (mod === 'bulk') setStep('bulk');
        else if (mod === 'zia-pov') setStep('pov');
        else if (['zpa', 'report'].includes(mod)) setStep(mod);
        else if (mod === 'zia-ssl') setStep('ssl');
        else if (mod === 'zcc') setStep('zcc');
        else if (['start', 'tests', 'zcc-devices', 'restore', 'pov-home', 'pov-templates', 'aiguard'].includes(mod)) setStep(mod);
        else if (mod === 'zdx') setStep('zdx');
        else if (mod === 'about') setStep('about');
        else if (mod === 'catalog') setStep('catalog');
      };

      /** Make the tenant's in-memory session the active one. false when there is none (or it has expired). */
      const useTenant = async (t) => {
        const w = wallet.get(t);
        if (!w) return false;
        if (api.sessionId === w.sessionId && auth.connected) return true;
        const prev = api.sessionId;
        api.sessionId = w.sessionId;
        try { const st = await api.call('GET', '/auth/status'); if (!st.authenticated) throw new Error('expired'); }
        catch (e) { wallet.drop(t); api.sessionId = prev; return false; }
        setAuth({ connected: true, mode: 'oneapi', cloud: w.vanity, sid: w.sessionId });
        return true;
      };
      /** A new API key for a POV's tenant, typed on the POV page: signs in, keeps it in memory, switches to it. */
      const addKeyFor = async (p, form) => {
        const result = await api.call('POST', '/auth/oneapi', { clientId: form.clientId, clientSecret: form.clientSecret, vanityDomain: p.tenant.vanity, cloud: form.cloud || (p.tenant.cloud !== 'production' ? p.tenant.cloud : undefined) });
        wallet.put(p.tenant, result.sessionId);
        api.sessionId = result.sessionId;
        setAuth({ connected: true, mode: 'oneapi', cloud: p.tenant.vanity, sid: result.sessionId });
        markComplete('connect');
        refreshPovs();
      };
      const forgetKey = async (t) => {
        const w = wallet.get(t); if (!w) return;
        const prev = api.sessionId; api.sessionId = w.sessionId;
        try { await api.call('POST', '/auth/logout'); } catch (e) { /* already gone */ }
        wallet.drop(t);
        if (prev === w.sessionId) { api.sessionId = null; setAuth({ connected: false }); } else api.sessionId = prev;
      };
      /** Opening a POV switches to its tenant when that tenant's key is in memory (no sign-in again). */
      const openPovHome = async (id) => {
        const x = povList.find(v => v.id === id);
        if (x && x.tenant && !(auth.connected && sameTenant(x.tenant, sessionTenant))) await useTenant(x.tenant);
        setPovHomeId(id); switchModule('pov-home');
      };
      /** Open a POV in this session and continue the guided flow exactly where it was left. */
      const resumePov = async (p) => {
        setError(null);
        try {
          const r = await api.call('POST', `/v2/povs/${p.id}/open`);
          const pv = r.pov;
          const batch = ReactDOM.unstable_batchedUpdates || ((f) => f());
          batch(() => {
            setGuideKey(k => k + 1); setGuideResume(pv.guide || null); setGuideTemplate(null);
            setActivePov(pv);
            if (pv.prefix) { setGlobalPrefix(pv.prefix); safeStore.set('zpw.prefix', pv.prefix); }
            setPov((pv.guide && pv.guide.pov) || POV_DEFAULT);
            switchModule('start');
          });
          refreshPovs();
        } catch (e) { setError(e.message); }
      };
      /** A fresh POV (optionally from a template): closes the one open in this session first. */
      const newPov = async (template) => {
        setError(null);
        if (auth.connected) await api.call('POST', '/v2/povs/close').catch(() => {});
        const batch = ReactDOM.unstable_batchedUpdates || ((f) => f());
        batch(() => {
          setGuideKey(k => k + 1); setGuideResume(null); setGuideTemplate(template || null);
          setActivePov(null);
          setPov(template && template.pov ? { ...POV_DEFAULT, ...template.pov } : POV_DEFAULT);
          switchModule('start');
        });
      };
      const connectFor = async (p) => {
        if (auth.connected) { try { await api.call('POST', '/auth/logout'); } catch (e) {} api.sessionId = null; setAuth({ connected: false }); }
        setPendingOpen(p); setConnectPrefill({ vanity: p.tenant && p.tenant.vanity, cloud: p.tenant && p.tenant.cloud !== 'production' ? p.tenant.cloud : '' });
        setActiveModule(null); setStep('connect');
      };
      const showConnect = !auth.connected && activeModule !== 'catalog' && activeModule !== 'about' && activeModule !== 'pov-home' && activeModule !== 'pov-templates';
      const showZiaWizard = auth.connected && activeModule === 'zia-wizard';
      const showZcc = auth.connected && activeModule === 'zcc';
      const showZdx = auth.connected && activeModule === 'zdx';
      const showAbout = activeModule === 'about';
      const showCatalog = activeModule === 'catalog';
      const showZiaSsl = auth.connected && activeModule === 'zia-ssl';
      const ziaExpanded = ['zia-pov', 'zia-wizard', 'zia-ssl', 'aiguard'].includes(activeModule);
      const zpaExpanded = activeModule === 'zpa';
      const zdxExpanded = activeModule === 'zdx';
      const needsPrefix = auth.connected && !globalPrefix && ['zia-pov', 'zpa', 'zcc', 'aiguard'].includes(activeModule);
      const zccExpanded = activeModule === 'zcc' || activeModule === 'zcc-devices';

        <div className={`sidebar-item ${activeModule === mod ? 'active' : ''}`} data-nav={mod} onClick={() => switchModule(mod)}

          <span className="step-num" style={{width:'16px', height:'16px'}}><Icon name={icon} size={12} /></span> {label}

            <div className="header-right">

              <div className={`auth-badge ${auth.connected ? 'connected' : 'disconnected'}`}>

              {auth.connected && (
                <button className="btn btn-ghost btn-sm" onClick={async () => {

                        style={{paddingLeft:'3.2rem', fontSize:'11px', cursor: completedSteps.has(s.id) ? 'pointer' : 'default'}}>
                        <span className="step-num" style={{fontSize:'9px', width:'15px', height:'15px'}}>{completedSteps.has(s.id) ? '✓' : i + 1}</span> {s.label}
                      </div>

                    {sub('zia-ssl', 'zpa', 'SSL Certificate Manager')}
                    {sub('aiguard', 'aiguard', 'AI Guard')}
                  </>)}
                  <div className={`sidebar-item ${zpaExpanded ? 'active' : ''}`} data-nav="zpa-top"
                    onClick={() => switchModule('zpa')} style={{cursor:'pointer', fontWeight: zpaExpanded ? 600 : 400}}>
                    <span className="step-num"><Icon name="zpa" size={14} /></span> Zscaler Private Access
                  </div>
                  <div className={`sidebar-item ${zdxExpanded ? 'active' : ''}`} data-nav="zdx-top"
                    onClick={() => switchModule('zdx')} style={{cursor:'pointer', fontWeight: zdxExpanded ? 600 : 400}}>
                    <span className="step-num"><Icon name="zdx" size={14} /></span> Zscaler Digital Experience
                  </div>
                  <div className={`sidebar-item ${activeModule === 'tests' ? 'active' : ''}`} data-nav="tests"
                    onClick={() => switchModule('tests')} style={{cursor:'pointer', marginTop:'0.5rem'}}>
                    <span className="step-num"><Icon name="tests" size={14} /></span> POV Tests
                  </div>
                  <div className={`sidebar-item ${activeModule === 'restore' ? 'active' : ''}`} data-nav="restore"
                    onClick={() => switchModule('restore')} style={{cursor:'pointer'}}>
                    <span className="step-num"><Icon name="restore" size={14} /></span> Restore & Drift
                  </div>
                  <div className={`sidebar-item ${activeModule === 'report' ? 'active' : ''}`} data-nav="report"
                    onClick={() => switchModule('report')} style={{cursor:'pointer'}}>
                    <span className="step-num"><Icon name="report" size={14} /></span> Summary Report
                  </div>
                </div>
              )}
              <div className="sidebar-section" style={{marginTop:'auto'}}>
                {auth.connected && (
                  <div className={`sidebar-item ${activeModule === 'bulk' ? 'active' : ''}`} data-nav="bulk"
                    onClick={() => switchModule('bulk')} style={{cursor:'pointer', fontSize:'12px'}}>
                    <span className="step-num"><Icon name="bulk" size={14} /></span> Bulk Rule Manager
                  </div>
                )}
                <div className={`sidebar-item ${activeModule === 'catalog' ? 'active' : ''}`}
                  onClick={() => switchModule('catalog')} style={{cursor:'pointer', fontSize:'12px'}}>
                  <span className="step-num"><Icon name="catalog" size={14} /></span> Policy Catalog
                </div>
                <div className={`sidebar-item ${activeModule === 'about' ? 'active' : ''}`}
                  onClick={() => switchModule('about')} style={{cursor:'pointer', fontSize:'12px'}}>
                  <span className="step-num"><Icon name="about" size={14} /></span> About
                </div>
              </div>
            </nav>
            <div className={`content ${step === 'review' ? 'content-wide' : ''}`}>
              {error && <div className="alert alert-danger">⚠ {error}</div>}
              {needsPrefix && <div className="alert alert-info" data-needsprefix><span>Start with the customer intake on <a href="#" onClick={e => { e.preventDefault(); switchModule('start'); }}>POV Start</a>: it sets the prefix used for every object created in ZIA, ZPA and ZCC.</span></div>}
              {auth.connected && globalPrefix && ['zia-pov', 'zpa', 'zcc'].includes(activeModule) && <div className="form-hint" style={{marginBottom:'0.75rem'}} data-prefixinfo>Prefix <code>{globalPrefix}</code> (from the customer intake on POV Start)</div>}
              {auth.connected && activeModule === 'zia-pov' && globalPrefix && meta && (<>
                {povStep === 'scope' && <ScopeStep meta={meta} pov={pov} setPov={setPov} licensing={licensing} onNext={() => goPov('baseline')} />}
                {povStep === 'baseline' && <BaselineStep meta={meta} pov={pov} setPov={setPov} setError={setError} onNext={() => goPov('rules')} onBack={() => goPov('scope')} />}
                {povStep === 'rules' && <PovRulesStep meta={meta} pov={pov} setPov={setPov} prefix={globalPrefix} auth={auth} setError={setError} onNext={() => goPov('review')} onBack={() => goPov('baseline')} />}
                {povStep === 'review' && <PovReviewStep pov={pov} prefix={globalPrefix} setError={setError} result={povResult} setResult={setPovResult} onBack={() => goPov('rules')} onDone={() => goPov('done')} />}
                {povStep === 'done' && <PovDoneStep result={povResult} onReport={() => switchModule('report')} onRestart={() => { setPovResult(null); setPovReached(0); goPov('scope'); }} />}

              {auth.connected && activeModule === 'zpa' && globalPrefix && meta && <ZpaWizard meta={meta} prefix={globalPrefix} setError={setError} onReport={() => switchModule('report')} />}
              {auth.connected && activeModule === 'bulk' && <BulkHub key={bulkTab} initialTab={bulkTab} meta={meta} prefix={globalPrefix} setError={setError} loading={loading} setLoading={setLoading} />}
              {auth.connected && activeModule === 'report' && <ReportStep setError={setError} />}
              {auth.connected && <RateLimitBar />}
              {auth.connected && meta && <div style={{display: activeModule === 'start' ? 'block' : 'none'}}><PovGuide key={guideKey} meta={meta} auth={auth} prefix={globalPrefix} setPrefix={setGlobalPrefix} licensing={licensing} pov={pov} setPov={setPov} setError={setError} onReport={() => switchModule('report')}
                activePov={activePov} resume={guideResume} template={guideTemplate} onPovCreated={(pv) => { setActivePov(pv); refreshPovs(); }} onPovChanged={() => refreshPovs()} /></div>}
              {activeModule === 'pov-home' && povHomeId && <PovHome id={povHomeId} auth={auth} sessionTenant={sessionTenant} activePov={activePov} onResume={resumePov} onConnectFor={connectFor} onUseTenant={useTenant} onAddKey={addKeyFor} onForgetKey={forgetKey}
                onClosed={(id) => { if (activePov && activePov.id === id) setActivePov(null); refreshPovs(); setPovHomeId(null); setActiveModule(auth.connected ? 'start' : null); setStep(auth.connected ? 'start' : 'connect'); }}
                onChanged={refreshPovs} onGo={switchModule} setError={setError} />}
              {auth.connected && activeModule === 'aiguard' && globalPrefix && <AiGuardStep prefix={globalPrefix} setError={setError} onReport={() => switchModule('report')} />}
              {activeModule === 'pov-templates' && <PovTemplates auth={auth} onStart={newPov} setError={setError} />}
              {auth.connected && activeModule === 'tests' && <PovTests setError={setError} />}
              {auth.connected && activeModule === 'zcc-devices' && <ZccDevicesInstall setError={setError} />}
              {auth.connected && activeModule === 'restore' && <RestoreDrift prefix={globalPrefix} setError={setError} />}
              {showConnect && (<ConnectStep auth={auth} setAuth={setAuth} setError={setError} loading={loading} setLoading={setLoading}
