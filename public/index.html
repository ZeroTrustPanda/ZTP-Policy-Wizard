    // ---------- POV tests (7, 8, 9) ----------
    // ---------- v2.6: Prove it (every policy type) and the POV test kit ----------
    let PROVE_CATALOG = null;
    const PROVE_TYPES = [['url', 'URL filtering'], ['threat', 'Threat protection'], ['cloudApp', 'Cloud apps'], ['firewall', 'Firewall'], ['dns', 'DNS control']];
    const PROVE_PH = { url: 'https://www.example.com', threat: 'https://… (a file or page)', cloudApp: 'App name, e.g. CHATGPT_AI', firewall: '203.0.113.10:22/tcp', dns: 'example.com' };
    function ProveResult({ r }) {
      if (!r) return null;
      return (
        <table className="diff-table" style={{marginTop:'0.6rem'}} data-proof><tbody>
          <tr><td style={{width:'170px'}}>Destination</td><td><code>{r.target}</code>{r.doh ? ' (DNS over HTTPS)' : ''}{r.appType ? <span className="form-hint" style={{marginLeft:'6px'}}>{r.appType}</span> : null}</td></tr>
          <tr><td>Result</td><td style={{fontWeight:600}} data-proofverdict>{r.verdict}</td></tr>
          {(r.trace || []).length > 1 && <tr><td>Why</td><td data-prooftrace><ol style={{margin:0, paddingLeft:'18px', fontSize:'12.5px'}}>{r.trace.map((t, i) => <li key={i} data-tracestep={t.step} style={t.bypass ? {color:'var(--accent-red)'} : undefined}>{t.text}</li>)}</ol></td></tr>}
          {r.agreement && <tr><td>Expected</td><td data-proofagrees={String(r.agrees)} style={{color: r.agrees === true ? 'var(--accent-green)' : r.agrees === false ? 'var(--accent-red)' : 'var(--text-muted)', fontWeight:600}}>{r.agrees === true ? '✓ ' : r.agrees === false ? '✕ ' : ''}{r.agreement}</td></tr>}
          {r.categories && <tr><td>Categories</td><td>{r.categories.join(', ') || '—'}{(r.securityAlerts || []).length > 0 && <span className="badge badge-risk" style={{marginLeft:'6px'}}>Security alert: {r.securityAlerts.join(', ')}</span>}</td></tr>}
          <tr><td>First matching rule</td><td>{r.match ? <><code>{r.match.name}</code> (order {r.match.order}) → {r.match.actions ? r.match.actions.join(', ') : <ActionBadge action={r.match.action} />}
            {(r.match.conditions || []).length > 0 && <div className="form-hint">{r.match.conditions.join('; ')}</div>}{r.match.note && <div className="form-hint">{r.match.note}</div>}</> : 'None; the default rule applies.'}</td></tr>
          {(r.alsoChecked || []).length > 0 && <tr><td>Next in line</td><td style={{fontSize:'12px'}}>{r.alsoChecked.map(x => <div key={x.name}><code>{x.name}</code> → {x.actions ? x.actions.join(', ') : x.action}</div>)}</td></tr>}
          {r.atp && <tr><td>Threat protection</td><td style={{fontSize:'12px'}}>{Object.entries(r.atp).map(([k, v]) => `${k.replace(/Blocked$/, '')}: ${v === true ? 'block' : v === false ? 'off' : v}`).join(' · ')}</td></tr>}
          {(r.sandbox || []).length > 0 && <tr><td>Sandbox rules</td><td style={{fontSize:'12px'}}>{r.sandbox.map(x => <div key={x.name}><code>{x.name}</code> → {x.ba || x.action}{x.firstTime ? ` (first time: ${x.firstTime})` : ''}</div>)}</td></tr>}
          <tr><td>Last hour (Z-Insights)</td><td style={{fontSize:'12px'}}>{r.insights && (r.insights.webThreats || r.insights.firewallActions) ? <>
            {r.insights.webThreats && <div>Web threats: {r.insights.webThreats.length ? r.insights.webThreats.map(x => `${x.name} ${x.total}`).join(', ') : 'none'}</div>}
            {r.insights.firewallActions && <div>Firewall actions: {r.insights.firewallActions.length ? r.insights.firewallActions.map(x => `${x.name} ${x.total}`).join(', ') : 'none'}</div>}</> : 'Not available for this API client.'}</td></tr>
        </tbody></table>
      );
    }
    /** initial: { type, target, appType?, doh? } · compact: one row inside a test · connected: false shows why it is off */
    function ProveIt({ initial, compact, connected = true, setError }) {
      const [cat, setCat] = useState(PROVE_CATALOG);
      const [type, setType] = useState((initial && initial.type) || 'url');
      const [choice, setChoice] = useState(initial && initial.target ? initial.target : '');
      const [custom, setCustom] = useState('');
      const [res, setRes] = useState(null);
      const [busy, setBusy] = useState(false);
      const [expect, setExpect] = useState((initial && initial.expect) || '');
      useEffect(() => { if (!PROVE_CATALOG) api.call('GET', '/v2/prove/catalog').then(r => { PROVE_CATALOG = r.catalog; setCat(r.catalog); }).catch(() => {}); }, []);
      const items = (cat && cat[type] && cat[type].items) || [];
      const sel = items.find(i => i.target === choice);
      const run = async () => {
        const target = choice === '__own' ? custom.trim() : choice;
        if (!target) return;
        setBusy(true); setRes(null);
        try { setRes(await api.call('POST', '/v2/prove', { type, target, expect: expect || undefined, appType: sel ? sel.type : (initial && initial.type === type ? initial.appType : undefined), doh: sel ? !!sel.doh : (type === 'dns' && initial && initial.doh) })); }
        catch (e) { setError && setError(e.message); }
        setBusy(false);
      };
      return (
        <div data-proveit={type}>
          <div style={{display:'flex', gap:'6px', flexWrap:'wrap', alignItems:'center'}}>
            {!compact && <select value={type} onChange={e => { setType(e.target.value); setChoice(''); setRes(null); }} style={{width:'auto'}} data-provetype>{PROVE_TYPES.map(([k, l]) => <option key={k} value={k}>{l}</option>)}</select>}
            <select value={choice} onChange={e => { setChoice(e.target.value); setRes(null); }} style={{flex:1, minWidth:'200px', fontSize: compact ? '12px' : undefined}} data-provechoice>
              <option value="">{cat ? `Pick a ${(cat[type] && cat[type].label || '').toLowerCase()} destination…` : 'Loading…'}</option>
              {items.map(i => <option key={i.target} value={i.target}>{i.label}</option>)}
              {initial && initial.target && !items.some(i => i.target === initial.target) && <option value={initial.target}>{initial.target}</option>}
              <option value="__own">Your own…</option>
            </select>
            {choice === '__own' && <input type="text" value={custom} onChange={e => setCustom(e.target.value)} placeholder={PROVE_PH[type]} style={{flex:1, minWidth:'180px'}} data-proveown />}
            {type !== 'cloudApp' && <select value={expect} onChange={e => { setExpect(e.target.value); setRes(null); }} style={{width:'auto', fontSize: compact ? '12px' : undefined}} title="What the POV should do with it; the result says whether the configuration agrees" data-proveexpect>
              <option value="">Expect: any</option><option value="BLOCK">Expect: blocked</option><option value="ALLOW">Expect: allowed</option><option value="CAUTION">Expect: caution</option><option value="ISOLATE">Expect: isolated</option>
              {(type === 'url' || type === 'threat') && <><option value="INSPECTED">Expect: inspected</option><option value="NOT_INSPECTED">Expect: not inspected</option></>}
            </select>}
            <button className={`btn ${compact ? 'btn-ghost btn-sm' : 'btn-primary'}`} onClick={run} disabled={busy || !connected || !(choice && (choice !== '__own' || custom.trim()))} title={connected ? '' : 'Connect to the POV tenant first'} data-provebtn>{busy ? <span className="spinner"></span> : '🔎 Prove it'}</button>
          </div>
          {!compact && cat && cat[type] && <div className="form-hint">{cat[type].hint} The check follows the request's path: Client Connector and PAC bypasses, SSL inspection, then the rule that decides. Users, groups, locations and time windows are not evaluated; the exact transaction is in ZIA Insights › Logs.</div>}
          <ProveResult r={res} />
        </div>
      );
    }
    // v2.8: POV posture score at the start and the end, and what ZIA cannot see (SSL exemptions, Client Connector and PAC bypasses)
    const POSTURE_STATUS = { pass: ['Configured', 'badge-create'], fail: ['Action needed', 'badge-risk'], review: ['Review', 'badge-update'], info: ['Info', 'badge-category'],
      notPermitted: ['Not permitted', 'badge-category'], notChecked: ['Not checked', 'badge-category'], notLicensed: ['Not licensed', 'badge-category'] };
    function PostureResult({ r, label }) {
      const [open, setOpen] = useState(false);
      if (!r) return null;
      const findings = r.results.filter(x => x.status === 'fail' || x.status === 'review');
      return (
        <div style={{marginTop:'0.6rem'}} data-posture={label}>
          <div style={{display:'flex', gap:'12px', alignItems:'baseline', flexWrap:'wrap'}}>
            <strong style={{fontSize:'15px'}}>{label}</strong>
            <span style={{fontSize:'26px', fontWeight:700}} data-posturescore>{r.score === null ? '—' : r.score}</span>
            <span className="badge badge-category" data-posturematurity>{r.maturity}</span>
            <span className="form-hint" style={{margin:0}}>{r.counts.pass} configured · {r.counts.fail} action needed · {r.counts.review} review{r.counts.notPermitted ? ` · ${r.counts.notPermitted} not permitted` : ''}{r.counts.notChecked ? ` · ${r.counts.notChecked} not checked` : ''} · {new Date(r.at).toLocaleString()}</span>
          </div>
          <div style={{display:'flex', flexWrap:'wrap', gap:'6px', margin:'6px 0'}}>{r.areas.map(a => <span key={a.area} className="badge badge-category" title={`${a.pass} configured, ${a.fail} action needed, ${a.review} review`}>{a.area}: {a.score === null ? '—' : `${a.score}%`}</span>)}</div>
          <details open={open} onToggle={e => setOpen(e.target.open)}><summary style={{cursor:'pointer', fontSize:'13px'}}>{findings.length} finding{findings.length === 1 ? '' : 's'} to act on · all {r.results.length} checks</summary>
            <table className="diff-table" style={{marginTop:'6px'}}><tbody>{r.results.map(x => <tr key={x.id} data-posturecheck={x.id}>
              <td style={{width:'150px', fontSize:'12px'}}>{x.area}<div className="form-hint" style={{margin:0}}>{x.id}</div></td>
              <td style={{fontSize:'12.5px'}}><strong>{x.label}</strong> <span className={`badge ${(POSTURE_STATUS[x.status] || [])[1] || 'badge-category'}`}>{(POSTURE_STATUS[x.status] || [x.status])[0]}</span>
                <div>{x.found}</div>{x.means && <div className="form-hint" style={{margin:0}}><strong>Means:</strong> {x.means} <strong>Do:</strong> {x.do} <strong>Outcome:</strong> {x.outcome}</div>}</td></tr>)}</tbody></table>
          </details>
          <div className="form-hint">{r.method}</div>
        </div>
      );
    }
    function PosturePanel({ connected, saved, setError }) {
      const [st, setSt] = useState(saved ? { start: saved.start || null, end: saved.end || null } : null);
      const [cmp, setCmp] = useState(null);
      const [busy, setBusy] = useState(null);
      useEffect(() => { if (connected) api.call('GET', '/v2/posture').then(r => { if (r.start || r.end) { setSt(r); setCmp(r.compare); } }).catch(() => {}); }, [connected]);
      const take = async (stage) => {
        setBusy(stage); setError(null);
        try { const r = await api.call('POST', '/v2/posture', { stage }); setSt({ start: r.start, end: r.end }); setCmp(r.compare); } catch (e) { setError('Posture check failed: ' + e.message); }
        setBusy(null);
      };
      return (
        <div className="card" data-posturepanel>
          <div className="card-header"><h2>POV posture score</h2><p>A read-only check of about 40 settings the POV touches (SSL, threat, URL, firewall, DNS, file type, DLP, AI apps, Client Connector). Take it at the start of the POV and again at the end; the summary report shows both and what changed. Checks the API client cannot read are left out of the score, not counted against it.</p></div>
          <div className="btn-group" style={{marginTop:0}}>
            <button className="btn btn-primary" onClick={() => take('start')} disabled={!connected || !!busy} data-posturestart>{busy === 'start' ? <span className="spinner"></span> : '📍'} {st && st.start ? 'Retake start score' : 'Take start score'}</button>
            <button className="btn btn-ghost" onClick={() => take('end')} disabled={!connected || !!busy} data-postureend>{busy === 'end' ? <span className="spinner"></span> : '🏁'} {st && st.end ? 'Retake end score' : 'Take end score'}</button>
          </div>
          {cmp && cmp.delta !== null && <div className={`alert ${cmp.delta > 0 ? 'alert-success' : cmp.delta < 0 ? 'alert-warning' : 'alert-info'}`} data-posturedelta={cmp.delta}><span><strong>{cmp.delta > 0 ? '+' : ''}{cmp.delta} points</strong> ({cmp.from} {cmp.fromMaturity} → {cmp.to} {cmp.toMaturity}).{cmp.improved.length ? ` Improved: ${cmp.improved.map(i => i.label).join('; ')}.` : ''}{cmp.regressed.length ? ` Went back: ${cmp.regressed.map(i => i.label).join('; ')}.` : ''}</span></div>}
          {st && st.start && <PostureResult r={st.start} label="Start" />}
          {st && st.end && <PostureResult r={st.end} label="End" />}
          {!(st && (st.start || st.end)) && <div className="form-hint">No score taken yet.</div>}
        </div>
      );
    }
    function CoveragePanel({ connected, setError }) {
      const [c, setC] = useState(null);

            <button className="btn btn-primary" onClick={() => load(!!c)} disabled={!connected || busy} data-coverageload>{busy ? <span className="spinner"></span> : '🔍'} {c ? 'Check again' : 'Check coverage'}</button>
          </div>
          {c && <>
            <div className="alert alert-info" data-coverageheadline><span><strong>{c.headline}</strong></span></div>
            {c.items.map((i, k) => <div key={k} className="toggle-item" style={{display:'block'}} data-coverageitem={i.area}>

              <div style={{fontSize:'12.5px'}}>{i.found}</div>
              <div className="form-hint" style={{margin:0}}><strong>Means:</strong> {i.means} <strong>Do:</strong> {i.do}</div></div>)}
            {!c.items.length && <div className="form-hint">Nothing found that keeps traffic away from inspection.</div>}
            {[...(c.notes || []), ...(c.refused || [])].map((n, k) => <div key={k} className="form-hint">ℹ {n}</div>)}
            <div className="form-hint">{c.volumeNote}</div>
          </>}
        </div>
      );
    }

    /** The test kit for a POV (or the POV open in this session): only what the POV covers. */
    function TestKit({ povId, setError }) {
      const [kit, setKit] = useState(null);
      useEffect(() => { setKit(null); api.call('GET', `/v2/test-kit${povId ? `?povId=${encodeURIComponent(povId)}` : ''}`).then(setKit).catch(e => setError && setError(e.message)); }, [povId]);
      if (!kit) return <div className="form-hint"><span className="spinner"></span> Loading the test kit…</div>;
      const fileLink = (f) => f.available === false ? <span className="form-hint" style={{maxWidth:'280px'}} data-kitnote={f.id}>{f.note}</span>
        : <a className="btn btn-ghost btn-sm" href={`/api/v2/test-kit/file/${f.id}`} download={f.name} data-kitfile={f.id}>⬇ Download</a>;
      return (
        <div data-testkit>
          {!kit.sections.length && <div className="alert alert-info"><span>This POV has no DLP, malware or sandbox tests in scope, so there is nothing to download.</span></div>}
          {kit.sections.map(sec => (
            <div key={sec.id} style={{marginBottom:'1rem'}} data-kitsection={sec.id}>
              <h3 style={{fontSize:'14px', margin:'0 0 0.3rem'}}>{sec.title}</h3>
              <div className="form-hint" style={{marginTop:0}}>{sec.how}</div>
              {(sec.files || []).filter(f => f.primary !== false).map(f => <div key={f.id} className="toggle-item"><div><strong style={{fontSize:'13px'}}>{f.label}</strong><div className="form-hint">{f.why}</div></div>{fileLink(f)}</div>)}
              {(sec.files || []).some(f => f.primary === false) && <details style={{marginTop:'4px'}}><summary className="form-hint" style={{cursor:'pointer'}}>Other verticals</summary>
                {sec.files.filter(f => f.primary === false).map(f => <div key={f.id} className="toggle-item"><div><strong style={{fontSize:'13px'}}>{f.label}</strong><div className="form-hint">{f.why}</div></div>{fileLink(f)}</div>)}</details>}
              {(sec.links || []).length > 0 && [...new Set(sec.links.map(l => l.group))].map(g => (
                <div key={g} style={{marginTop:'4px'}}><div className="form-hint" style={{fontWeight:600}}>{g}</div>
                  <div style={{display:'flex', flexWrap:'wrap', gap:'6px'}}>{sec.links.filter(l => l.group === g).map(l => <a key={l.url} className="btn btn-ghost btn-sm" href={l.url} target="_blank" rel="noopener noreferrer" data-kitlink={l.url}>{l.label} ↗</a>)}</div></div>))}
            </div>
          ))}
          {kit.hidden.length > 0 && <div className="form-hint" data-kithidden>Not shown: {kit.hidden.join(', ')}.{kit.basis === 'licences' ? ' (No POV scope yet, so this follows the tenant licences.)' : ''}</div>}
        </div>
      );
    }

    // v2.7: the compliance pack for a saved POV (mapping report, policy export, test plan by control)
    function CompliancePack({ povId, setError }) {
      const [pack, setPack] = useState(null);
      const [err, setErr] = useState(null);
      useEffect(() => { setPack(null); setErr(null); if (!povId) return; api.call('GET', `/v2/compliance-pack?povId=${encodeURIComponent(povId)}`).then(setPack).catch(e => setErr(e.message)); }, [povId]);
      if (!povId) return null;
      if (err) return <div className="form-hint" data-compliancepack="none">{err}</div>;
      if (!pack) return <div className="form-hint"><span className="spinner"></span> Loading the compliance pack…</div>;
      return (
        <div data-compliancepack={pack.profile.id}>
          <div className="form-hint" style={{marginTop:0}}>For <strong>{pack.profile.fullName || pack.profile.name}</strong>, the profile chosen on Customer intake. Built from this POV's choices; nothing is read from the tenant.</div>
          {pack.alignment && <div className={`alert ${pack.alignment.status === 'Aligned' ? 'alert-success' : pack.alignment.status === 'Partial' ? 'alert-warning' : 'alert-danger'}`} style={{display:'block'}} data-packalignment={pack.alignment.status}>
            <strong>{pack.alignment.status}.</strong> {pack.alignment.text}
            {pack.alignment.missing.length > 0 && <details className="form-hint"><summary style={{cursor:'pointer'}}>{pack.alignment.missing.length} control{pack.alignment.missing.length === 1 ? '' : 's'} not addressed</summary>{pack.alignment.missing.map(m => <div key={m.id}><code>{m.id}</code> {m.name}</div>)}</details>}
          </div>}
          {pack.files.map(f => <div key={f.id} className="toggle-item"><div><strong style={{fontSize:'13px'}}>{f.label}</strong><div className="form-hint">{f.why}</div></div>
            <a className="btn btn-ghost btn-sm" href={`/api/v2/compliance-pack/file/${f.id}?povId=${encodeURIComponent(povId)}`} data-packfile={f.id}>⬇ Download</a></div>)}
        </div>
      );
    }
    // Rules page (before the POV is saved): the same files from the choices on screen
    async function downloadPack(id, body) {
      const r = await fetch(`/api/v2/compliance-pack/file/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Session-Id': api.sessionId || '' }, body: JSON.stringify(body) });
      if (!r.ok) { let m = `HTTP ${r.status}`; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
      const name = ((r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/) || [])[1] || id;
      const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = name; a.click();
    }

    function PovTests({ setError }) {
      const [tests, setTests] = useState(null);
      const [notes, setNotes] = useState({});
      const [url, setUrl] = useState('');
      const [proof, setProof] = useState(null);
      const [busy, setBusy] = useState(false);
      const [kit, setKit] = useState(null);
      const load = () => api.call('GET', '/v2/tests').then(r => setTests(r.tests)).catch(e => setError(e.message));
      useEffect(() => { load(); }, []);
      const mark = async (t, status) => { await api.call('POST', `/v2/tests/${t.id}`, { status: t.result && t.result.status === status ? null : status, note: notes[t.id] !== undefined ? notes[t.id] : ((t.result && t.result.note) || '') }); load(); };
      const prove = async (u) => { setBusy(true); setProof(null); try { setProof(await api.call('POST', '/v2/prove', { url: u || url })); } catch (e) { setError(e.message); } setBusy(false); };
      const runbookMd = () => ['# POV test runbook', '', ...(tests || []).flatMap(t => [`## ${t.product}: ${t.title}`, '', ...t.steps.map((s, i) => `${i + 1}. ${s}`), '', `**Expected:** ${t.expect}`, '', `Result: ${t.result ? t.result.status : 'not run'}${t.result && t.result.note ? ` — ${t.result.note}` : ''}`, ''])].join('\n');
      const done = (tests || []).filter(t => t.result).length;
      return (
        <div data-step="tests">
          <div className="card">
            <div className="card-header" style={{display:'flex', justifyContent:'space-between'}}>
              <div><h2>POV test runbook</h2><p>One test for each policy the wizard created in this session: how to show it and what the customer should see. Mark each one as you go; results go into the summary report.</p></div>
              {tests && tests.length > 0 && <button className="btn btn-ghost btn-sm" onClick={() => download('pov-test-runbook.md', runbookMd(), 'text/markdown')}>⬇ Runbook (.md)</button>}
            </div>
            {!tests && <div className="form-hint"><span className="spinner"></span> Loading…</div>}
            {tests && !tests.length && <div className="alert alert-info"><span>Run a product first (POV Start or a module). Tests appear for the policies that were created.</span></div>}
            {tests && tests.length > 0 && <div className="alert alert-info"><span>{done} of {tests.length} tests recorded · {tests.filter(t => t.result && t.result.status === 'pass').length} passed · {tests.filter(t => t.result && t.result.status === 'fail').length} failed</span></div>}
            {(tests || []).map(t => (
              <div key={t.id} className="ab-row" style={{display:'block', borderLeft: `3px solid ${t.result ? (t.result.status === 'pass' ? 'var(--accent-green)' : t.result.status === 'fail' ? 'var(--accent-red)' : 'var(--text-muted)') : 'transparent'}`}} data-test={t.id}>
                <div style={{display:'flex', justifyContent:'space-between', gap:'12px', flexWrap:'wrap'}}>
                  <div style={{flex:1, minWidth:'280px'}}>
                    <div className="ab-row-name"><span className="badge badge-category">{t.product}</span> {t.title}</div>
                    <ol style={{fontSize:'12px', margin:'4px 0 4px 18px'}}>{t.steps.map((s, i) => <li key={i}>{s}</li>)}</ol>
                    <div className="ab-row-desc"><strong>Expected:</strong> {t.expect}</div>
                    <div className="ab-row-desc">Objects: {t.objects.map(o => <code key={o} style={{marginRight:'4px'}}>{o}</code>)}</div>
                  </div>
                  <div style={{display:'flex', flexDirection:'column', gap:'4px', minWidth:'210px'}}>
                    <div className="ab-seg">
                      <button className={t.result && t.result.status === 'pass' ? 'on-allow' : ''} onClick={() => mark(t, 'pass')} data-pass>Pass</button>
                      <button className={t.result && t.result.status === 'fail' ? 'on-block' : ''} onClick={() => mark(t, 'fail')} data-fail>Fail</button>
                      <button className={t.result && t.result.status === 'skip' ? 'on-default' : ''} onClick={() => mark(t, 'skip')}>Skip</button>
                    </div>
                    <input type="text" placeholder="Note (optional)" value={notes[t.id] !== undefined ? notes[t.id] : ((t.result && t.result.note) || '')} onChange={e => setNotes({ ...notes, [t.id]: e.target.value })} onBlur={() => t.result && mark({ ...t, result: null }, t.result.status)} style={{fontSize:'12px'}} />
                  </div>
                </div>
                {t.prove && <div style={{marginTop:'6px'}} data-testprove={t.id}><ProveIt initial={t.prove} compact setError={setError} /></div>}
              </div>
            ))}
          </div>
          <div className="card" data-prove>
            <div className="card-header"><h2>Prove it</h2><p>What Internet Access does with a destination, for every kind of test: URL filtering, threat protection, cloud apps, firewall and DNS. Pick a built-in test destination or type your own. Zscaler does not give API clients the individual log lines, so open Insights › Logs in the ZIA portal to show the exact transaction.</p></div>
            <ProveIt initial={{ type: 'url' }} setError={setError} />
          </div>
          <div className="card" data-dlpkit>
            <div className="card-header"><h2>Test kit</h2><p>Only what this POV covers: DLP files for the customer's vertical plus generic PII, EICAR and AMTSO threat tests, and a unique sandbox file. Everything is synthetic and harmless.</p></div>
            <TestKit setError={setError} />
          </div>
        </div>
      );
    }

    // ---------- Client Connector devices, one-time passwords, install builder (10) ----------
    function ZccDevicesInstall({ setError }) {
      const [devices, setDevices] = useState(null);
      const [devErr, setDevErr] = useState(null);
      const [otp, setOtp] = useState({});
      const [filter, setFilter] = useState('');
      const [cat, setCat] = useState(null);
      const [platform, setPlatform] = useState('windows');
      const [type, setType] = useState('msi');
      const [values, setValues] = useState({});
      const [installer, setInstaller] = useState('');
      const [tokens, setTokens] = useState(null);
      const [build, setBuild] = useState(null);
      const loadDevices = () => { setDevErr(null); api.call('GET', '/v2/zcc/devices').then(r => setDevices(r.devices)).catch(e => setDevErr(e.message)); };
      useEffect(() => { loadDevices(); api.call('GET', '/v2/zcc/install/catalog').then(setCat).catch(() => {}); }, []);
      useEffect(() => { setTokens(null); setBuild(null); api.call('GET', `/v2/zcc/install/tokens/${platform}`).then(setTokens).catch(() => setTokens([])); }, [platform]);
      const params = cat ? cat[platform].filter(p => platform === 'macos' || (type === 'msi' ? p.msi : p.exe)) : [];
      const cats = [...new Set(params.map(p => p.cat))];
      const keyOf = (p) => p.key;
      const getOtp = async (d) => { try { const r = await api.call('POST', '/v2/zcc/devices/otp', { udid: d.udid }); setOtp({ ...otp, [d.udid]: r.otp || Object.values(r.passwords || {})[0] || '(no OTP returned)' }); } catch (e) { setError(e.message); } };
      const doBuild = async () => { try { setBuild(await api.call('POST', '/v2/zcc/install/build', { platform, installerType: type, values, installerName: installer || undefined })); } catch (e) { setError(e.message); } };
      const shown = (devices || []).filter(d => !filter || `${d.user} ${d.hostname} ${d.os} ${d.policy}`.toLowerCase().includes(filter.toLowerCase()));
      const field = (p) => {
        const k = keyOf(p), v = values[k];
        const set = (val) => { setBuild(null); setValues({ ...values, [k]: val }); };
        if (p.type === 'toggle' || p.type === 'toggle_on') { const on = v === undefined ? p.type === 'toggle_on' : !!v; return <div className={`toggle-switch ${on ? 'active' : ''}`} onClick={() => set(!on)}><div className="toggle-knob"></div></div>; }
        if (p.type === 'dropdown') return <select value={v === undefined ? p.options[0][1] : v} onChange={e => set(e.target.value)}>{p.options.map(([l, val]) => <option key={val} value={val}>{l}</option>)}</select>;
        if (p.fromTenant === 'policyToken') return (
          <div style={{display:'flex', gap:'6px'}}>
            <select value={v || ''} onChange={e => set(e.target.value)} style={{flex:1}}>
              <option value="">{tokens === null ? 'Loading app profiles…' : 'No policy token'}</option>
              {(tokens || []).map(t => <option key={t.id} value={t.policyToken}>{t.name} ({t.policyToken})</option>)}
            </select>
          </div>);
        if (p.type === 'dropdown' || !p.type) return null;
        if (k === 'CLOUDNAME' || k === 'cloudName') return <select value={v || ''} onChange={e => set(e.target.value)}><option value="">Not set</option>{cat.cloudNames.map(c => <option key={c} value={c}>{c}</option>)}</select>;
        return <input type={p.type === 'password' ? 'password' : 'text'} value={v || ''} placeholder={p.ph || ''} onChange={e => set(e.target.value)} autoComplete="off" />;
      };
      return (
        <div data-step="zcc-devices">
          <div className="card" data-devices>
            <div className="card-header" style={{display:'flex', justifyContent:'space-between'}}>
              <div><h2>Enrolled devices</h2><p>Devices registered to Client Connector. Issue a one-time password to let one user turn off a service or uninstall without sharing the profile password. One-time passwords are shown here only and never logged.</p></div>
              <button className="btn btn-ghost btn-sm" onClick={loadDevices}>↻ Refresh</button>
            </div>
            {devErr && <div className="alert alert-warning"><span>{devErr}</span></div>}
            {!devices && !devErr && <div className="form-hint"><span className="spinner"></span> Loading devices…</div>}
            {devices && (<>
              <input type="search" value={filter} onChange={e => setFilter(e.target.value)} placeholder="Filter by user, host, OS or profile" style={{marginBottom:'6px'}} />
              <table className="diff-table"><thead><tr><th>User</th><th>Device</th><th>Platform</th><th>State</th><th>Version</th><th>App profile</th><th>One-time password</th></tr></thead>
                <tbody>{shown.slice(0, 200).map(d => (
                  <tr key={d.udid}>
                    <td style={{fontSize:'12px'}}>{d.user}</td><td style={{fontSize:'12px'}}>{d.hostname}</td><td>{d.platform}</td><td>{d.state}</td><td style={{fontSize:'12px'}}>{d.agent}</td><td style={{fontSize:'12px'}}>{d.policy}</td>
                    <td>{otp[d.udid] ? <code data-otp>{otp[d.udid]}</code> : <button className="btn btn-ghost btn-sm" onClick={() => getOtp(d)} data-getotp>Get OTP</button>}</td>
                  </tr>))}
                  {!shown.length && <tr><td colSpan={7} className="form-hint">No devices.</td></tr>}
                </tbody></table>
            </>)}
          </div>
          <div className="card" data-installer>
            <div className="card-header"><h2>Install Client Connector</h2><p>Build the exact install command for a test machine, checked before you run it. Download a script to run next to the installer (Windows .bat runs as administrator; macOS .command asks for the admin password). Passwords are masked on screen but included in the script.</p></div>
            <div style={{display:'flex', gap:'8px', flexWrap:'wrap', marginBottom:'0.75rem'}}>
              <div className="ab-seg">
                <button className={platform === 'windows' ? 'on-default' : ''} onClick={() => { setPlatform('windows'); setValues({}); }} data-plat="windows">🪟 Windows</button>
                <button className={platform === 'macos' ? 'on-default' : ''} onClick={() => { setPlatform('macos'); setValues({}); }} data-plat="macos">🍎 macOS</button>
              </div>
              {platform === 'windows' && <div className="ab-seg">
                <button className={type === 'msi' ? 'on-default' : ''} onClick={() => { setType('msi'); setValues({}); setBuild(null); }}>MSI</button>
                <button className={type === 'exe' ? 'on-default' : ''} onClick={() => { setType('exe'); setValues({}); setBuild(null); }}>EXE</button>
              </div>}
              <input type="text" value={installer} onChange={e => { setInstaller(e.target.value); setBuild(null); }} placeholder={platform === 'macos' ? 'Installer name, e.g. Zscaler-osx-4.5.0-installer.app' : `Installer file name, e.g. Zscaler-windows-4.5.0-x64.${type}`} style={{flex:1, minWidth:'260px'}} data-installername />
            </div>
            {cats.map(c => (
              <details key={c} open={c === 'Core Enrollment' || c === 'Enforcement & Security'} style={{marginBottom:'0.5rem'}}>
                <summary style={{cursor:'pointer', fontSize:'13px', fontWeight:600}}>{c}</summary>
                {params.filter(p => p.cat === c).map(p => (
                  <div key={keyOf(p)} className="toggle-item" style={{alignItems:'center'}} data-param={keyOf(p)}>
                    <div style={{flex:1}}><label><code>{platform === 'macos' ? p.mac : type === 'msi' ? p.msi : p.exe}</code></label><div className="form-hint" style={{margin:0}}>{p.desc}</div></div>
                    <div style={{minWidth:'240px', maxWidth:'360px'}}>{field(p)}</div>
                  </div>
                ))}
              </details>
            ))}
            <div className="btn-group"><button className="btn btn-primary" onClick={doBuild} data-buildinstall>Check and build</button></div>
            {build && (<>
              {build.issues.map((i, k) => <div key={k} className={`alert ${i[0] === 'ERROR' ? 'alert-danger' : 'alert-warning'}`}><span>{i[0] === 'ERROR' ? '✕' : '⚠'} {i[1]}</span></div>)}
              <div className="form-label">Command {build.platform === 'macos' ? '(Terminal)' : '(administrator command prompt)'}</div>
              <pre style={{whiteSpace:'pre-wrap', wordBreak:'break-all', fontSize:'12px', background:'var(--bg-input)', padding:'8px', borderRadius:'6px'}} data-installcmd>{build.command}</pre>
              {build.script && <button className="btn btn-success btn-sm" onClick={() => download(build.script.name, build.script.content, 'text/plain')} data-downloadscript>⬇ {build.script.name}</button>}
            </>)}
          </div>
        </div>
      );
    }

    // ---------- Snapshots / restore (13) and drift (14) ----------
    function RestoreDrift({ prefix, setError }) {
      const [snaps, setSnaps] = useState(null);
      const [plan, setPlan] = useState(null);
      const [done, setDone] = useState(null);
      const [busy, setBusy] = useState(false);
      const [confirmed, setConfirmed] = useState(false);
      const [drift, setDrift] = useState(null);
      const load = () => api.call('GET', `/v2/snapshots${prefix ? `?prefix=${encodeURIComponent(prefix)}` : ''}`).then(setSnaps).catch(e => setError(e.message));
      useEffect(() => { load(); }, [prefix]);
      const preview = async (s) => { setBusy(true); setDone(null); setConfirmed(false); try { setPlan(await api.call('POST', `/v2/snapshots/${s.id}/restore`, { dryRun: true })); } catch (e) { setError(e.message); } setBusy(false); };
      const restore = async () => { setBusy(true); try { setDone(await api.call('POST', `/v2/snapshots/${plan.id}/restore`, { dryRun: false, planId: plan.planId })); setPlan(null); load(); } catch (e) { setError(e.message); } setBusy(false); };
      const checkDrift = async () => { setBusy(true); setDrift(null); try { setDrift(await api.call('POST', '/v2/drift', {})); } catch (e) { setError(e.message); } setBusy(false); };
      return (
        <div data-step="restore">
          <div className="card" data-drift>
            <div className="card-header"><h2>Drift check</h2><p>Compares the tenant with what the wizard applied in this session. Anything listed was changed or deleted since (by an admin, the customer or another tool).</p></div>
            <button className="btn btn-primary" onClick={checkDrift} disabled={busy} data-checkdrift>{busy && !plan ? <span className="spinner"></span> : 'Check for drift'}</button>
            {drift && drift.note && <div className="alert alert-info" style={{marginTop:'0.5rem'}}><span>{drift.note}</span></div>}
            {drift && drift.products.map(p => (
              <div key={p.product} style={{marginTop:'0.75rem'}}>
                <h3 style={{fontSize:'14px'}}>{p.product}: {p.drift.length ? `${p.drift.length} change(s) since ${new Date(p.since).toLocaleString()}` : `no drift (${p.unchanged} objects match)`}</h3>
                {p.drift.length > 0 && <LedgerTable ledger={p.drift} filterProduct />}
                {p.drift.length > 0 && <div className="form-hint">Re-run that product (or POV Start) to put the wizard's settings back.</div>}
              </div>
            ))}
          </div>
          <div className="card" data-snapshots>
            <div className="card-header" style={{display:'flex', justifyContent:'space-between'}}>
              <div><h2>Restore</h2><p>Every Internet Access and Private Access apply saves a snapshot of what it changed. Restoring deletes what that run created and puts back what it updated, newest change first, then activates ZIA. Snapshots never contain secrets and stay on this computer.</p></div>
              <button className="btn btn-ghost btn-sm" onClick={load}>↻</button>
            </div>
            {!snaps && <span className="spinner"></span>}
            {snaps && !snaps.length && <div className="form-hint">No snapshots yet for {prefix ? <code>{prefix}</code> : 'this prefix'}.</div>}
            {snaps && snaps.length > 0 && (
              <table className="diff-table"><thead><tr><th>When</th><th>Product</th><th>Prefix</th><th>Changes</th><th></th></tr></thead>
                <tbody>{snaps.map(s => (
                  <tr key={s.id} data-snap={s.id}>
                    <td style={{fontSize:'12px'}}>{new Date(s.at).toLocaleString()}</td><td>{s.product.toUpperCase()}</td><td><code>{s.prefix}</code></td><td>{s.steps}</td>
                    <td>{s.restoredAt ? <span className="badge badge-category">Restored {new Date(s.restoredAt).toLocaleString()}</span> : <button className="btn btn-ghost btn-sm" onClick={() => preview(s)} disabled={busy} data-previewrestore>Preview restore</button>}</td>
                  </tr>))}</tbody></table>
            )}
            {plan && (<>
              <div className="alert alert-warning" style={{marginTop:'0.75rem'}}><span>Restore dry run for the {plan.product.toUpperCase()} run of {new Date(plan.at).toLocaleString()}: {plan.results.length} step(s), newest first. Nothing changed yet.</span></div>
              <table className="diff-table"><tbody>{plan.results.map((r, i) => <tr key={i}><td>{r.action}</td><td style={{fontSize:'12px'}}>{r.label}</td></tr>)}</tbody></table>
              <div className="toggle-item" style={{marginTop:'0.5rem'}}><label onClick={() => setConfirmed(!confirmed)} style={{cursor:'pointer'}}>I have reviewed this. Restore the tenant to before that run.</label>
                <div className={`toggle-switch ${confirmed ? 'active' : ''}`} onClick={() => setConfirmed(!confirmed)} data-confirmrestore><div className="toggle-knob"></div></div></div>
              <LiveProgress active={busy} title="Restoring" />
              <div className="btn-group"><button className="btn btn-ghost" onClick={() => setPlan(null)}>Cancel</button>
                <button className="btn btn-danger" disabled={!confirmed || busy} onClick={restore} data-dorestore>{busy ? <span className="spinner"></span> : 'Restore'}</button></div>
            </>)}
            {done && <div className="alert alert-success" style={{marginTop:'0.75rem', display:'block'}}>{done.results.map((r, i) => <div key={i}>{r.action === 'FAILED' ? '✕' : '✓'} {r.action} · {r.label}{r.error ? ` — ${r.error}` : ''}</div>)}{done.activated === true && <div>✓ ZIA activated</div>}</div>}
          </div>
        </div>
      );
    }

    // ---------- §8 Bulk managers (ZPA, ZDX) ----------
    function BulkManagerV2({ product, prefix, meta, setError }) {
      const [filter, setFilter] = useState(prefix || '');
      const [items, setItems] = useState(null);
      const [sel, setSel] = useState({});
      const [plan, setPlan] = useState(null);
      const [done, setDone] = useState(null);
      const [busy, setBusy] = useState(false);
      const [confirmed, setConfirmed] = useState(false);
      const load = async () => {
        setItems(null); setSel({}); setPlan(null); setDone(null);
        try { setItems(await api.call('GET', product === 'zpa' ? `/v2/zpa/objects?prefix=${encodeURIComponent(filter)}` : `/v2/zdx/objects?filter=${encodeURIComponent(filter)}`)); }
        catch (e) { setError(e.message); setItems([]); }
      };
      useEffect(() => { load(); }, [product]);
      const chosen = (items || []).filter(i => sel[`${i.kind}:${i.id}`]);
      const preview = async () => { setBusy(true); try { setPlan(await api.call('POST', `/v2/${product}/delete`, { items: chosen, dryRun: true })); setConfirmed(false); } catch (e) { setError(e.message); } setBusy(false); };
      const del = async () => { setBusy(true); try { setDone(await api.call('POST', `/v2/${product}/delete`, { items: chosen, planId: plan.planId })); setPlan(null); } catch (e) { setError(e.message); } setBusy(false); };
      return (
        <div className="card" data-step={`bulk-${product}`}>
          <div className="card-header"><h2>{product === 'zpa' ? 'ZPA' : 'ZDX'} Bulk Manager</h2>
            <p>End-of-POV cleanup: list the objects the wizard created, select them and delete in one go, after a preview. {product === 'zpa' ? meta.copy.bulk.zpaOrder : 'Custom applications are deleted with their probes, then collections.'}</p></div>
          <div style={{display:'flex', gap:'8px', marginBottom:'0.75rem'}}>
            <input type="text" value={filter} onChange={e => setFilter(e.target.value)} placeholder={product === 'zpa' ? 'Name starts with…' : 'Name contains…'} style={{width:'220px'}} data-bulkfilter />
            <button className="btn btn-ghost btn-sm" onClick={load}>↻ List</button>
            <button className="btn btn-ghost btn-sm" onClick={() => setSel(Object.fromEntries((items || []).filter(i => !i.error).map(i => [`${i.kind}:${i.id}`, true])))}>Select all</button>
            <button className="btn btn-ghost btn-sm" onClick={() => setSel({})}>Clear</button>
          </div>
          {!items ? <div className="spinner"></div> : (
            <table className="diff-table" data-bulklist style={{tableLayout:'fixed', width:'100%'}}>
              <thead><tr><th style={{width:'36px'}}></th><th style={{width:'190px'}}>Type</th><th style={{width:'34%'}}>Name</th><th>Detail</th></tr></thead>
              <tbody>
                {items.map((i, idx) => i.error
                  ? <tr key={idx}><td></td><td>{i.label}</td><td colSpan={2} style={{color:'var(--accent-red)'}}>{i.error}</td></tr>
                  : <tr key={`${i.kind}:${i.id}`}><td><input type="checkbox" checked={!!sel[`${i.kind}:${i.id}`]} onChange={e => { setPlan(null); setSel({ ...sel, [`${i.kind}:${i.id}`]: e.target.checked }); }} /></td>
                      <td style={{whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}} title={i.label}>{i.label || (i.kind === 'app' ? 'Application' : 'Collection')}</td><td style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'12px', overflowWrap:'anywhere'}}>{i.name}</td><td style={{fontSize:'12px'}}>{i.detail}{(i.usedBy || []).length > 0 && <div style={{color: i.usedBy.some(u => !sel[`${u.kind}:${u.id}`]) ? 'var(--accent-amber)' : 'var(--text-muted)', marginTop:'2px'}} data-bulkusedby>Used by {i.usedBy.map(u => `${u.label} ${u.name}`).join(', ')}{i.usedBy.some(u => !u.mine) ? ' (not created by the wizard)' : ''}</div>}</td></tr>)}
                {!items.length && <tr><td colSpan={4} style={{color:'var(--text-muted)'}}>No matching objects.</td></tr>}
              </tbody>
            </table>
          )}
          {plan && (<>
            <div className="alert alert-warning" style={{display:'block', marginTop:'1rem'}} data-bulkplan>
              <strong>Preview — nothing deleted yet. Order:</strong>
              <ol style={{margin:'6px 0 0 18px'}}>{plan.results.map((r, i) => <li key={i} style={r.action === 'BLOCKED' ? {color:'var(--accent-red)'} : null} data-bulkstep={r.action}>{r.label || r.kind}: {r.name}{r.action === 'BLOCKED' ? ` — held back: ${r.error}` : ''}</li>)}</ol>
            </div>
            {(plan.issues || []).length > 0 && <div className="alert alert-danger" style={{display:'block', marginTop:'0.5rem'}} data-bulkissues>
              <strong>{plan.issues.length} dependenc{plan.issues.length === 1 ? 'y' : 'ies'} not selected.</strong> ZPA refuses to delete an object while something else still uses it, so these objects are held back:
              <ul style={{margin:'6px 0 0 18px'}}>{plan.issues.map((x, i) => <li key={i}>{x.object} is used by <strong>{x.blockedBy}</strong>. {x.fix}{x.selectable && <button className="btn btn-ghost btn-sm" style={{marginLeft:'6px'}} onClick={() => { setPlan(null); setSel(v => ({ ...v, [`${x.kind}:${x.id}`]: true })); }} data-bulkselectdep>Select it too</button>}</li>)}</ul>
            </div>}
            <div className="toggle-item"><label onClick={() => setConfirmed(!confirmed)} style={{cursor:'pointer'}}>Permanently delete these {plan.results.filter(r => r.action === 'DELETE').length} object(s){plan.results.some(r => r.action === 'BLOCKED') ? ' (held-back objects are left in place)' : ''}.</label>
              <div className={`toggle-switch ${confirmed ? 'active' : ''}`} onClick={() => setConfirmed(!confirmed)} data-bulkconfirm><div className="toggle-knob"></div></div></div>
          </>)}
          {done && <div className="alert alert-success" style={{display:'block', marginTop:'1rem'}} data-bulkdone>{done.results.map((r, i) => <div key={i}>{r.action === 'DELETED' || r.action === 'DETACHED' ? '✓' : r.action === 'FAILED' ? '✕' : '⚠'} {r.label || r.kind}: {r.name}{r.action === 'DETACHED' ? ' (removed)' : ''}{r.note ? ` (${r.note})` : ''}{r.error ? ` — ${r.error}` : ''}</div>)}</div>}
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={preview} disabled={!chosen.length || busy} data-bulkpreview>Preview delete ({chosen.length})</button>
            <button className="btn btn-danger" onClick={del} disabled={!plan || !confirmed || busy} data-bulkdelete>{busy ? <><span className="spinner"></span> Deleting…</> : 'Delete'}</button>
          </div>
        </div>
      );
    }

    // ---------- §9 Report ----------
    function ReportStep({ setError }) {
      const [rep, setRep] = useState(null);
      const [runs, setRuns] = useState(null);
      const load = async () => { try { setRuns(await api.call('GET', '/v2/runs')); setRep(await api.call('POST', '/v2/report', {})); } catch (e) { setError(e.message); } };
      useEffect(() => { load(); }, []);
      const download = (text, name, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); };
      const openHtml = () => { const w = window.open('', '_blank'); if (w) { w.document.write(rep.html); w.document.close(); } };
      const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
      return (
        <div className="card" data-step="report">
          <div className="card-header"><h2>Summary report</h2><p>Everything this session changed in ZIA, ZCC and ZPA, the rule decisions, the posture score at the start and end, customer rules that decide first, inspection coverage, warnings and manual follow-ups — ready to hand to the customer.</p></div>
          {runs && <div className="form-hint">Runs recorded this session: ZIA {runs.zia} · ZCC {runs.zcc} · ZPA {runs.zpa}</div>}
          {rep && rep.containsSecret && <div className="alert alert-danger" data-reportsecret><span>🔑 This report contains the ZPA provisioning key. Treat the file as a secret.</span></div>}
          {rep && (<>
            <div className="btn-group" style={{justifyContent:'flex-start'}}>
              <button className="btn btn-primary" onClick={() => download(rep.markdown, `zscaler-pov-summary-${stamp}${rep.containsSecret ? '-SENSITIVE' : ''}.md`, 'text/markdown')} data-dlmd>⬇ Markdown</button>
              <button className="btn btn-primary" onClick={() => download(rep.html, `zscaler-pov-summary-${stamp}${rep.containsSecret ? '-SENSITIVE' : ''}.html`, 'text/html')} data-dlhtml>⬇ HTML</button>
              <button className="btn btn-primary" onClick={async () => {
                try {
                  const r = await fetch('/api/v2/report/docx', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Session-Id': api.sessionId || '' }, body: '{}' });
                  if (!r.ok) throw new Error(`HTTP ${r.status}`);
                  download(await r.blob(), `zscaler-pov-summary-${stamp}${rep.containsSecret ? '-SENSITIVE' : ''}.docx`, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
                } catch (e) { setError('Word download failed: ' + e.message); } }} data-dldocx>⬇ Word</button>
              <button className="btn btn-ghost" onClick={openHtml}>Open printable page (Save as PDF)</button>
              <button className="btn btn-ghost" onClick={load}>↻ Refresh</button>
            </div>
            <pre style={{whiteSpace:'pre-wrap', fontSize:'12px', background:'var(--bg-input)', padding:'1rem', borderRadius:'6px', maxHeight:'480px', overflow:'auto'}} data-reportmd>{rep.markdown}</pre>
          </>)}
        </div>
      );
    }

    // ========================
    // Step: Connect
    // ========================
    function ConnectStep({ auth, setAuth, setError, loading, setLoading, onComplete, prefill }) {
      const [form, setForm] = useState({
        clientId: '', clientSecret: '', vanityDomain: (prefill && prefill.vanity) || '', cloud: (prefill && prefill.cloud) || ''
      });
      useEffect(() => { if (prefill) setForm(f => ({ ...f, vanityDomain: prefill.vanity || '', cloud: prefill.cloud || '' })); }, [prefill && prefill.vanity]);

      const handleConnect = async () => {
        setLoading(true); setError(null);
        try {
          const result = await api.call('POST', '/auth/oneapi', {
            clientId: form.clientId, clientSecret: form.clientSecret,
            vanityDomain: form.vanityDomain, cloud: form.cloud || undefined
          });
          api.sessionId = result.sessionId;
          wallet.put({ vanity: form.vanityDomain, cloud: form.cloud || 'production' }, result.sessionId);
          setAuth({ connected: true, mode: 'oneapi', cloud: form.vanityDomain, sid: result.sessionId });
          onComplete();
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Connect to Zscaler</h2>
              <p>Authenticate using OneAPI (OAuth2) credentials from ZIdentity. This provides access to ZIA, ZCC, and other Zscaler services through a single token.</p>
            </div>
            {prefill && prefill.vanity && <div className="alert alert-info" data-connectfor><span>Signing in to resume a POV on <strong>{prefill.vanity}</strong>. Credentials are used for this session only and are never saved.</span></div>}

            <div className="explainer">
              <strong>Prerequisites:</strong> You need an API client configured in ZIdentity → Integration → API Clients
              with scopes for ZIA, ZCC and ZDX. The Client ID and Client Secret are generated there.
            </div>

            <div>
              <div className="form-group">
                <label className="form-label">Vanity Domain</label>
                <input type="text" value={form.vanityDomain} placeholder="yourcompany"
                  onChange={e => setForm({...form, vanityDomain: e.target.value})} />
                <div className="form-hint">Your ZIdentity vanity domain (e.g., "acme" for acme.zslogin.net)</div>
              </div>
              <div className="form-group">
                <label className="form-label">Client ID</label>
                <input type="text" value={form.clientId} placeholder="OAuth2 Client ID"
                  onChange={e => setForm({...form, clientId: e.target.value})} />
              </div>
              <div className="form-group">
                <label className="form-label">Client Secret</label>
                <input type="password" value={form.clientSecret} placeholder="OAuth2 Client Secret"
                  onChange={e => setForm({...form, clientSecret: e.target.value})} />
              </div>
              <div className="form-group">
                <label className="form-label">Cloud (optional)</label>
                <input type="text" value={form.cloud} placeholder="Leave blank for production"
                  onChange={e => setForm({...form, cloud: e.target.value})} />
                <div className="form-hint">Only needed for non-production environments (e.g., beta)</div>
              </div>
            </div>

            <div className="btn-group">
              <button className="btn btn-primary" onClick={handleConnect} disabled={loading}>
                {loading ? <><span className="spinner"></span> Connecting...</> : 'Connect & Authenticate'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function CustomizeStep({ config, setConfig, setTemplate, setError, loading, setLoading, onNext, onBack, auth }) {
