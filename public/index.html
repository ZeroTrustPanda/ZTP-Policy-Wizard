<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroTrustPanda ZS Policy Wizard v2.2.0 - Zscaler Template Policy Configuration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-card: #1a2236;
      --bg-card-hover: #1f2943;
      --bg-input: #0f1629;
      --border: #2a3654;
      --border-focus: #3b82f6;
      --text-primary: #e8ecf4;
      --text-secondary: #8896b3;
      --text-muted: #5c6b8a;
      --accent-blue: #3b82f6;
      --accent-blue-dim: #1e40af;
      --accent-green: #10b981;
      --accent-green-dim: #065f46;
      --accent-amber: #f59e0b;
      --accent-amber-dim: #78350f;
      --accent-red: #ef4444;
      --accent-red-dim: #7f1d1d;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --radius: 8px;
      --radius-lg: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Layout */
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-brand .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: white;
    }
    .header-brand h1 {
      font-size: 18px; font-weight: 600;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-brand .tag {
      font-size: 10px; padding: 2px 8px; border-radius: 4px;
      background: var(--accent-blue-dim); color: var(--accent-blue);
      font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .auth-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
    }
    .auth-badge.connected { background: var(--accent-green-dim); color: var(--accent-green); }
    .auth-badge.disconnected { background: var(--accent-red-dim); color: var(--accent-red); }
    .auth-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .auth-badge.connected .dot { background: var(--accent-green); }
    .auth-badge.disconnected .dot { background: var(--accent-red); }

    .main { flex: 1; display: flex; }
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 1.5rem 0;
      flex-shrink: 0;
    }
    .sidebar-section { padding: 0 1rem; margin-bottom: 1.5rem; }
    .sidebar-section-title {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text-muted); padding: 0 0.5rem;
      margin-bottom: 8px;
    }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius);
      cursor: pointer; font-size: 14px; color: var(--text-secondary);
      transition: all 0.15s;
      position: relative;
    }
    .sidebar-item:hover { background: var(--bg-card); color: var(--text-primary); }
    .sidebar-item.active {
      background: var(--accent-blue-dim);
      color: var(--accent-blue);
      font-weight: 500;
    }
    .sidebar-item .step-num {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      background: var(--bg-input); border: 1px solid var(--border);
    }
    .sidebar-item.active .step-num {
      background: var(--accent-blue); border-color: var(--accent-blue); color: white;
    }
    .sidebar-item.completed .step-num {
      background: var(--accent-green); border-color: var(--accent-green); color: white;
    }

    .content { flex: 1; padding: 2rem 3rem; max-width: 960px; }
    .content-wide { max-width: 1200px; }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card-header { margin-bottom: 1rem; }
    .card-header h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .card-header h3 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .card-header p { font-size: 14px; color: var(--text-secondary); }

    /* Form Elements */
    .form-group { margin-bottom: 1.25rem; }
    .form-label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 6px;
    }
    .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    input[type="text"], input[type="password"], select, textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }
    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 80px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 500;
      cursor: pointer; border: 1px solid transparent;
      transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent-blue); color: white; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-success { background: var(--accent-green); color: white; }
    .btn-success:hover:not(:disabled) { background: #059669; }
    .btn-warning { background: var(--accent-amber); color: #1a1a1a; }
    .btn-danger { background: var(--accent-red); color: white; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .btn-ghost {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--text-muted); color: var(--text-primary); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .btn-group { display: flex; gap: 8px; margin-top: 1.5rem; }

    /* Tier Cards */
    .tier-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1rem 0; }
    .tier-card {
      background: var(--bg-input);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .tier-card:hover { border-color: var(--text-muted); }
    .tier-card.selected { border-color: var(--accent-blue); background: var(--accent-blue-dim); }
    .tier-card .tier-icon { font-size: 28px; margin-bottom: 8px; }
    .tier-card .tier-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .tier-card .tier-desc { font-size: 12px; color: var(--text-secondary); }

    /* Compliance Grid */
    .compliance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 1rem 0; }
    .compliance-chip {
      padding: 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      text-align: center;
    }
    .compliance-chip:hover { border-color: var(--text-muted); }
    .compliance-chip.selected { border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }

    /* Toggle */
    .toggle-group { display: flex; flex-direction: column; gap: 8px; }
    .toggle-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .toggle-item label { font-size: 14px; cursor: pointer; }
    .toggle-switch {
      position: relative; width: 44px; height: 24px;
      background: var(--bg-secondary); border-radius: 12px;
      cursor: pointer; transition: background 0.2s;
      border: 1px solid var(--border);
    }
    .toggle-switch.active { background: var(--accent-blue); border-color: var(--accent-blue); }
    .toggle-switch .toggle-knob {
      position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%;
      background: white; transition: transform 0.2s;
    }
    .toggle-switch.active .toggle-knob { transform: translateX(20px); }

    /* Allow / Block step (v1.6.0) */
    .ab-group { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; background: var(--bg-input); }
    .ab-group-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; cursor: pointer; flex-wrap: wrap; }
    .ab-group-title { font-size: 14px; font-weight: 600; }
    .ab-group-sub { font-size: 12px; color: var(--text-muted); }
    .ab-rows { border-top: 1px solid var(--border); }
    .ab-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .ab-row:last-child { border-bottom: none; }
    .ab-row-name { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    .ab-row-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .ab-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .ab-seg button { background: var(--bg-secondary); color: var(--text-secondary); border: none; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
    .ab-seg button + button { border-left: 1px solid var(--border); }
    .ab-seg button.on-allow { background: var(--accent-green); color: #0a0e17; font-weight: 600; }
    .ab-seg button.on-block { background: var(--accent-red); color: #fff; font-weight: 600; }
    .ab-seg button.on-default { background: var(--accent-blue); color: #fff; font-weight: 600; }
    .ab-seg button:disabled { opacity: 0.4; cursor: not-allowed; }
    .ab-warn { color: var(--accent-amber); font-size: 11px; margin-top: 2px; }

    /* Plan/Diff View */
    .diff-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .diff-table th {
      text-align: left; padding: 8px 12px;
      background: var(--bg-secondary); border-bottom: 1px solid var(--border);
      font-weight: 600; color: var(--text-secondary); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .diff-table td {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .diff-table tr:hover { background: var(--bg-card-hover); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
    }
    .badge-create { background: var(--accent-green-dim); color: var(--accent-green); }
    .badge-update { background: var(--accent-blue-dim); color: var(--accent-blue); }
    .badge-risk { background: var(--accent-red-dim); color: var(--accent-red); }
    .badge-category { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }

    /* Alerts */
    .alert {
      padding: 12px 16px; border-radius: var(--radius);
      margin-bottom: 1rem; font-size: 14px;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .alert-info { background: var(--accent-blue-dim); border: 1px solid rgba(59,130,246,0.3); }
    .alert-warning { background: var(--accent-amber-dim); border: 1px solid rgba(245,158,11,0.3); color: var(--accent-amber); }
    .alert-success { background: var(--accent-green-dim); border: 1px solid rgba(16,185,129,0.3); color: var(--accent-green); }
    .alert-danger { background: var(--accent-red-dim); border: 1px solid rgba(239,68,68,0.3); color: var(--accent-red); }

    /* Explainer */
    .explainer {
      background: var(--bg-input);
      border-left: 3px solid var(--accent-cyan);
      padding: 12px 16px;
      margin: 1rem 0;
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .explainer strong { color: var(--accent-cyan); }

    /* Compliance Evidence */
    .evidence-item {
      padding: 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 6px;
      font-size: 13px;
    }
    .evidence-item .fw { color: var(--accent-purple); font-weight: 600; }
    .evidence-item .ctrl { color: var(--accent-cyan); }

    /* Audit Log */
    .log-entry {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      display: grid;
      grid-template-columns: 180px 120px 100px 1fr;
      gap: 8px;
    }
    .log-entry .ts { color: var(--text-muted); }
    .log-entry .action { color: var(--accent-cyan); font-weight: 500; }
    .log-entry .status-ok { color: var(--accent-green); }
    .log-entry .status-err { color: var(--accent-red); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Loading spinner */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ZPA placeholder */
    .placeholder-banner {
      background: linear-gradient(135deg, var(--bg-card), var(--bg-input));
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: center;
      color: var(--text-muted);
    }
    .placeholder-banner h3 { color: var(--text-secondary); margin-bottom: 8px; }

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .content { padding: 1rem; }
      .tier-grid { grid-template-columns: 1fr; }
      .compliance-grid { grid-template-columns: repeat(2, 1fr); }
      .form-row { grid-template-columns: 1fr; }
    }
    /* Policy Catalog */
    .catalog-tier { margin-bottom: 2rem; }
    .catalog-tier-header {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; user-select: none; font-weight: 600; font-size: 15px;
    }
    .catalog-tier-header:hover { background: var(--bg-card-hover); }
    .catalog-tier-header .arrow { transition: transform 0.2s; font-size: 11px; color: var(--text-muted); }
    .catalog-tier-header .arrow.open { transform: rotate(90deg); }
    .catalog-fw { margin: 0.5rem 0 0.5rem 1.5rem; }
    .catalog-fw-header {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; font-weight: 500; font-size: 13px;
    }
    .catalog-fw-header:hover { background: var(--bg-card-hover); }
    .catalog-policy-group { margin: 0.5rem 0 0.5rem 1rem; }
    .catalog-policy-header {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.6rem;
      cursor: pointer; font-size: 13px; font-weight: 500; color: var(--accent-cyan);
    }
    .catalog-policy-header:hover { color: var(--accent-blue); }
    .catalog-rule {
      margin: 0.25rem 0 0.25rem 1.5rem; padding: 0.6rem 0.75rem;
      background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; line-height: 1.6;
    }
    .catalog-rule-name { font-weight: 600; color: var(--text-primary); font-size: 13px; }
    .catalog-rule-action {
      display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11px;
      font-weight: 600; margin-left: 0.5rem;
    }
    .catalog-rule-action.BLOCK { background: var(--accent-red-dim); color: var(--accent-red); }
    .catalog-rule-action.ALLOW { background: var(--accent-green-dim); color: var(--accent-green); }
    .catalog-rule-action.CAUTION { background: var(--accent-amber-dim); color: var(--accent-amber); }
    .catalog-rule-action.INSPECT, .catalog-rule-action.DECRYPT { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
    .catalog-rule-action.DO_NOT_DECRYPT { background: rgba(139,92,246,0.15); color: var(--accent-purple); }
    .catalog-rule-action.QUARANTINE, .catalog-rule-action.QUARANTINE_ISOLATE { background: rgba(139,92,246,0.15); color: var(--accent-purple); }
    .catalog-rule-detail { color: var(--text-secondary); margin-top: 2px; }
    .catalog-rule-cats { color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 3px; word-break: break-all; }
    .catalog-compliance-tag {
      display: inline-block; padding: 1px 6px; margin: 2px 3px 2px 0; border-radius: 3px;
      font-size: 10px; background: rgba(59,130,246,0.12); color: var(--accent-blue); font-family: 'IBM Plex Mono', monospace;
    }
    .catalog-count {
      display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
      background: var(--bg-input); color: var(--text-muted); margin-left: 0.5rem; font-weight: 400;
    }
    .catalog-loading { text-align: center; padding: 3rem; color: var(--text-muted); }
    .catalog-summary { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.25rem; }
    .catalog-summary-chip {
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ========================
    // Error Boundary — catches React render crashes and shows debug info instead of black screen
    // ========================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        this.setState({ errorInfo });
        // Log to console for debugging
        console.error('[ZTP ErrorBoundary] Render crash caught:', error);
        console.error('[ZTP ErrorBoundary] Component stack:', errorInfo?.componentStack);
        // Also log to server error log
        try {
          const payload = {
            error: error?.message || String(error),
            stack: error?.stack,
            componentStack: errorInfo?.componentStack
          };
          console.error('[ZTP ErrorBoundary] Full details:', JSON.stringify(payload, null, 2));
        } catch(e) {}
      }
      render() {
        if (this.state.hasError) {
          return React.createElement('div', {
            style: { padding: '2rem', background: '#1a0000', border: '2px solid #ef4444',
                     borderRadius: '8px', margin: '1rem', color: '#fca5a5', fontFamily: 'monospace' }
          },
            React.createElement('h2', { style: { color: '#ef4444', marginBottom: '1rem' } }, '⚠ UI Render Error'),
            React.createElement('p', { style: { marginBottom: '1rem' } },
              'A React rendering error occurred. This is a bug — the data from the API could not be displayed. Details below:'),
            React.createElement('pre', {
              style: { fontSize: '12px', background: '#0a0a0a', padding: '1rem', borderRadius: '4px',
                       overflow: 'auto', maxHeight: '300px', whiteSpace: 'pre-wrap', color: '#fca5a5' }
            }, [
              'Error: ' + (this.state.error?.message || String(this.state.error)),
              '\n\nStack: ' + (this.state.error?.stack || 'N/A'),
              '\n\nComponent: ' + (this.state.errorInfo?.componentStack || 'N/A')
            ].join('')),
            React.createElement('p', { style: { marginTop: '1rem', fontSize: '12px', color: '#9ca3af' } },
              'Check the browser developer console (F12 → Console tab) for full details. ' +
              'Also check the server logs in ./logs/ for API-side errors.'),
            React.createElement('button', {
              onClick: () => this.setState({ hasError: false, error: null, errorInfo: null }),
              style: { marginTop: '1rem', padding: '8px 16px', background: '#ef4444', color: 'white',
                       border: 'none', borderRadius: '4px', cursor: 'pointer' }
            }, '🔄 Try Again')
          );
        }
        return this.props.children;
      }
    }

    // ========================
    // App Version

      async call(method, path, body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (this.sessionId) headers['X-Session-Id'] = this.sessionId;
        const opts = { method, headers };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(`/api${path}`, opts);
        const data = await res.json();
        if (!res.ok) { const e = new Error(data.error || 'Request failed'); e.data = data; e.status = res.status; throw e; }
        return data;
      },
      /** v2.2 live progress: newline-delimited JSON from /api/v2/events; returns a stop function. */
      events(onEvent) {
        const ctl = new AbortController();
        (async () => {
          try {
            const res = await fetch('/api/v2/events', { headers: { 'X-Session-Id': this.sessionId || '' }, signal: ctl.signal });
            const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
            for (;;) {
              const { value, done } = await reader.read(); if (done) break;
              buf += dec.decode(value, { stream: true });
              let i; while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 1); try { const ev = JSON.parse(line); if (!ev.beat && !ev.hello) onEvent(ev); } catch (e) { /* partial */ } }
            }
          } catch (e) { /* stopped */ }
        })();
        return () => ctl.abort();
      }
    };

              )}
              {showZiaWizard && step === 'tier' && (<FrameworkPanel setConfig={setConfig} setError={setError} auth={auth}
                onLoaded={(captured) => { markComplete('tier'); markComplete('compliance'); goTo('customize'); }} />)}
              {showZiaWizard && step === 'tier' && (<div className="alert alert-info"><span>ℹ Framework files from 1.9: load a saved framework or capture this tenant's policies, then continue. For a new POV, use the <a href="#" onClick={e => { e.preventDefault(); switchModule('zia-pov'); }}>Zscaler Internet Access Policy Wizard</a>.</span></div>)}
              {showZiaWizard && step === 'compliance' && (<ComplianceStep config={config} setConfig={setConfig}
                onNext={() => { markComplete('compliance'); goTo('customize'); }} onBack={() => goTo('tier')} />)}
              {showZiaWizard && step === 'customize' && (<CustomizeStep config={config} setConfig={setConfig} auth={auth}
                setTemplate={setTemplate} setError={setError} loading={loading} setLoading={setLoading}
                onNext={() => { markComplete('customize'); goTo('actions'); }} onBack={() => goTo(config.baseTemplate ? 'tier' : 'compliance')} />)}
              {showZiaWizard && step === 'actions' && (<ActionsStep config={config} setConfig={setConfig}
                setTemplate={setTemplate} setError={setError} loading={loading} setLoading={setLoading}

              {showZiaWizard && step === 'review' && (<ReviewStep template={template} plan={plan} setPlan={setPlan}

              {showZiaWizard && step === 'apply' && (<ApplyStep template={template} plan={plan}
                applyResult={applyResult} setApplyResult={setApplyResult}
                setError={setError} loading={loading} setLoading={setLoading}
                onNext={() => { markComplete('apply'); goTo('audit'); }} />)}
              {showZiaWizard && step === 'audit' && (<AuditStep auditLogs={auditLogs} setAuditLogs={setAuditLogs} setError={setError} />)}

    // ========================
    // Policy Wizard 2.0 — global prefix, ZIA POV flow (scope → baseline → rules → dry run → apply), ZPA, bulk managers, report
    // ========================
    const POV_STEPS = [
      { id: 'scope', label: 'Scope' },
      { id: 'baseline', label: 'Baseline Framework' },
      { id: 'rules', label: 'Rules' },
      { id: 'review', label: 'Dry Run' },
      { id: 'done', label: 'Apply & Results' }
    ];
    const POV_DEFAULT = { scope: null, baseline: null, disabledRules: {}, actionSettings: { policy: {}, rules: {} }, settingOverrides: {}, cbiProfile: null, sslCertificate: null };
    const SCOPE_TO_TYPES = {
      urlFiltering: ['urlFiltering'], cloudAppControl: ['cloudAppControl'], fileTypeControl: ['fileTypeControl'], advancedThreatProtection: ['advancedThreatProtection'],
      firewallFiltering: ['firewallFiltering'], dnsSecurity: ['dnsSecurity'], sslInspection: ['sslInspection'], dlpMonitor: ['dlp'], dlpBlock: ['dlp'],
      endpointDlp: ['endpointDlp'], sandboxStandard: ['sandbox'], sandboxAdvanced: ['sandbox'], aiPromptCapture: ['aiPromptCapture']
    };
    const typesInScope = (scope) => new Set(Object.entries(scope || {}).filter(([, v]) => v).flatMap(([k]) => SCOPE_TO_TYPES[k] || []));
    /** SCP-03: keep choices whose policy type is still in scope; drop the rest. */
    function pruneToScope(pov, scope) {
      const t = typesInScope(scope);
      const keep = (key) => t.has(String(key).split(':')[0]);
      const f = (o) => Object.fromEntries(Object.entries(o || {}).filter(([k]) => keep(k)));
      const pol = Object.fromEntries(Object.entries(pov.actionSettings.policy || {}).filter(([k]) => t.has(k)));
      // DLP Monitor and Block generate different rules: switching between them drops the old DLP choices
      const dlpSwitched = pov.scope && ((!!pov.scope.dlpMonitor) !== (!!scope.dlpMonitor));
      const drop = (o) => dlpSwitched ? Object.fromEntries(Object.entries(o).filter(([k]) => !k.startsWith('dlp:'))) : o;
      return { ...pov, scope, disabledRules: drop(f(pov.disabledRules)), actionSettings: { policy: pol, rules: drop(f(pov.actionSettings.rules)) }, settingOverrides: f(pov.settingOverrides) };
    }
    const safeStore = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* not available */ } } };

    function useV2Meta() {
      const [meta, setMeta] = useState(null);
      useEffect(() => { api.call('GET', '/v2/meta').then(setMeta).catch(() => {}); }, []);
      return meta;
    }

    // GLB-02: one prefix for every object the wizard creates in ZIA, ZPA and ZCC
    function PrefixBar({ prefix, setPrefix, setError }) {
      const [draft, setDraft] = useState(prefix || '');
      const [saved, setSaved] = useState(!!prefix);
      const valid = /^[A-Za-z0-9_-]{1,20}$/.test(draft);
      useEffect(() => { setDraft(prefix || ''); setSaved(!!prefix); }, [prefix]);
      const save = async () => {
        try { await api.call('POST', '/v2/prefix', { prefix: draft }); setPrefix(draft); setSaved(true); safeStore.set('zpw.prefix', draft); }
        catch (e) { setError(e.message); }
      };
      return (
        <div className="card" style={{padding:'0.75rem 1rem', marginBottom:'1rem', display:'flex', gap:'12px', alignItems:'center', flexWrap:'wrap'}} data-prefixbar>
          <strong style={{fontSize:'13px'}}>Global prefix</strong>
          <input type="text" value={draft} maxLength={20} onChange={e => { setDraft(e.target.value.trim()); setSaved(false); }} placeholder="e.g. ACMEPOV"
            style={{width:'180px', borderColor: draft && !valid ? 'var(--accent-red)' : undefined}} data-prefixinput />
          <button className="btn btn-primary btn-sm" disabled={!valid || (saved && draft === prefix)} onClick={save} data-prefixsave>{saved && draft === prefix ? '✓ Saved' : 'Use this prefix'}</button>
          <span className="form-hint" style={{margin:0}}>
            {draft && !valid ? 'Letters, numbers, - and _ only (max 20).' : <>Every object the wizard creates in ZIA, ZPA and ZCC starts with <code>{(prefix || draft || 'PREFIX')}-</code>. Re-running with the same prefix updates those objects instead of duplicating them.</>}
          </span>
        </div>
      );
    }

    // ---------- §1 Scope ----------
    function ScopeStep({ meta, pov, setPov, licensing, onNext }) {
      const scope = pov.scope || Object.fromEntries(meta.scopeItems.map(i => [i.key, i.default]));
      const groupOf = (key) => Object.entries(meta.exclusiveGroups).find(([, keys]) => keys.includes(key));
      const lic = (key) => (licensing && licensing.items && licensing.items[key]) || null;
      const set = (key, on) => {
        const next = { ...scope, [key]: on };
        const g = groupOf(key);
        if (on && g) for (const other of g[1]) if (other !== key) next[other] = false;   // SCP-30/31
        setPov(prev => pruneToScope(prev, next));
      };
      useEffect(() => { if (!pov.scope) setPov(prev => ({ ...prev, scope })); }, []);
      // GLB-08 + SCP-04: an item the tenant is not licensed for is switched off, not just hidden
      useEffect(() => {
        if (!licensing || !licensing.items) return;
        const blocked = Object.entries(licensing.items).filter(([, v]) => v.licensed === false).map(([k]) => k);
        if (blocked.some(k => scope[k])) setPov(prev => pruneToScope(prev, { ...(prev.scope || scope), ...Object.fromEntries(blocked.map(k => [k, false])) }));
      }, [licensing, pov.scope]);
      const rows = (keys) => keys.map(key => {
        const item = meta.scopeItems.find(i => i.key === key);
        const l = lic(key);
        const blocked = l && l.licensed === false;
        const on = !!scope[key] && !blocked;
        return (
          <div key={key} className="toggle-item" style={{opacity: blocked ? 0.55 : 1}} title={blocked ? meta.copy.scope.notLicensed : ''} data-scope={key}>
            <div style={{flex:1}}>
              <label style={{cursor: blocked ? 'not-allowed' : 'pointer'}} onClick={() => !blocked && set(key, !scope[key])}>{item.label}
                {blocked && <span className="badge badge-risk" style={{marginLeft:'8px'}}>{meta.copy.scope.notLicensed}</span>}
                {l && l.licensed === null && <span className="badge badge-category" style={{marginLeft:'8px'}} title={l.reason}>Licence not confirmed</span>}
              </label>
              <div className="form-hint">{item.desc}</div>
              {key === 'endpointDlp' && on && licensing && licensing.endpointDlpEnabledInZcc !== true && (
                <div className="alert alert-warning" style={{marginTop:'6px'}}><span>⚠ {licensing.endpointDlpEnabledInZcc === false ? meta.copy.scope.endpointPrereqDisabled : meta.copy.scope.endpointPrereq}</span></div>
              )}
              {key === 'aiPromptCapture' && on && <div className="form-hint" style={{color:'var(--accent-amber)'}}>⚠ {meta.copy.aiPrompt.note}</div>}
              {l && l.licensed === null && on && <div className="form-hint" style={{color:'var(--accent-amber)'}}>{meta.copy.scope.licenceUnknown}</div>}
            </div>
            <div className={`toggle-switch ${on ? 'active' : ''}`} onClick={() => !blocked && set(key, !scope[key])} style={{cursor: blocked ? 'not-allowed' : 'pointer'}}><div className="toggle-knob"></div></div>
          </div>
        );
      });
      return (
        <div className="card" data-step="scope">
          <div className="card-header"><h2>{meta.copy.scope.title}</h2><p>{meta.copy.scope.intro}</p></div>
          {!licensing && <div className="form-hint" style={{marginBottom:'0.75rem'}}><span className="spinner"></span> Checking what this tenant is licensed for…</div>}
          <h3 style={{fontSize:'13px', margin:'0.5rem 0'}}>Data protection and sandbox</h3>
          <div className="form-hint" style={{marginBottom:'6px'}}>{meta.copy.scope.exclusiveNote}</div>
          {rows(['dlpMonitor', 'dlpBlock'])}
          {rows(['endpointDlp'])}
          {rows(['sandboxStandard', 'sandboxAdvanced'])}
          {rows(['aiPromptCapture'])}
          <h3 style={{fontSize:'13px', margin:'1rem 0 0.5rem'}}>Core internet security</h3>
          {rows(['urlFiltering', 'cloudAppControl', 'fileTypeControl', 'advancedThreatProtection', 'firewallFiltering', 'dnsSecurity', 'sslInspection'])}
          <div className="btn-group">
            <button className="btn btn-primary" onClick={onNext} disabled={!Object.values(scope).some(Boolean)} data-next>Next: Baseline Framework →</button>
          </div>
        </div>
      );
    }

    // ---------- §2 Baseline Framework ----------
    function BaselineStep({ meta, pov, setPov, setError, onNext, onBack }) {
      const fileRef = useRef(null);
      const pick = (id) => setPov(prev => (prev.baseline === id ? prev : { ...prev, baseline: id, disabledRules: {}, actionSettings: { policy: {}, rules: {} }, settingOverrides: {} }));
      const card = (b) => (
        <label key={b.id} className={`tier-card ${pov.baseline === b.id ? 'selected' : ''}`} style={{cursor:'pointer', display:'block', textAlign:'left'}} data-baseline={b.id}>
          <div style={{display:'flex', gap:'8px', alignItems:'center'}}>
            <input type="radio" name="baseline" checked={pov.baseline === b.id} onChange={() => pick(b.id)} />
            <div className="tier-name" style={{margin:0}}>{b.name}</div>
          </div>
          <div className="tier-desc" style={{marginTop:'4px'}}>{b.fullName !== b.name ? <><strong>{b.fullName}.</strong> </> : ''}{b.description}</div>
          <div className="form-hint" style={{marginTop:'4px'}}>Definition {b.version} · researched {b.researchedAt} · {b.sources.length} sources</div>
        </label>
      );
      const save = () => {
        const data = { format: 'zpw-pov-selections', version: 2, savedAt: new Date().toISOString(), pov };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pov-selections-${pov.baseline || 'draft'}.json`; a.click();
      };
      const load = async (file) => {
        try {
          const j = JSON.parse(await file.text());
          if (j.format !== 'zpw-pov-selections' || !j.pov) throw new Error('This is not a saved POV selections file.');
          setPov({ ...POV_DEFAULT, ...j.pov, cbiProfile: null, sslCertificate: null });
        } catch (e) { setError(e.message); }
        if (fileRef.current) fileRef.current.value = '';
      };
      const selected = [...meta.baselines.compliance, ...meta.baselines.nonMapped].find(b => b.id === pov.baseline);
      return (
        <div className="card" data-step="baseline">
          <div className="card-header"><h2>{meta.copy.baseline.title}</h2><p>{meta.copy.baseline.intro}</p></div>
          <h3 style={{fontSize:'13px', margin:'0.5rem 0'}}>Compliance frameworks</h3>
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(260px, 1fr))', gap:'10px'}}>{meta.baselines.compliance.map(card)}</div>
          <h3 style={{fontSize:'13px', margin:'1.25rem 0 0.5rem'}}>{meta.copy.baseline.nonMappedTitle}</h3>
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(260px, 1fr))', gap:'10px'}}>{meta.baselines.nonMapped.map(card)}</div>
          {selected && (
            <details style={{marginTop:'1rem'}}>
              <summary style={{cursor:'pointer', fontSize:'13px'}}>Sources for {selected.name} ({selected.sources.length})</summary>
              <ul style={{fontSize:'12px', marginTop:'6px'}}>{selected.sources.map(s => <li key={s.id}><a href={s.url} target="_blank" rel="noreferrer">{s.title}</a></li>)}</ul>
            </details>
          )}
          <div style={{display:'flex', gap:'8px', marginTop:'1rem', flexWrap:'wrap'}}>
            <input ref={fileRef} type="file" accept=".json,application/json" style={{display:'none'}} onChange={e => e.target.files[0] && load(e.target.files[0])} data-loadselections />
            <button className="btn btn-ghost btn-sm" onClick={() => fileRef.current && fileRef.current.click()}>📂 Load saved selections…</button>
            <button className="btn btn-ghost btn-sm" onClick={save} disabled={!pov.baseline}>💾 Save selections…</button>
            <span className="form-hint" style={{margin:0}}>Saves scope, baseline, rule switches and Allow / Block choices to reuse with another customer.</span>
          </div>
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={onBack}>← Scope</button>
            <button className="btn btn-primary" onClick={onNext} disabled={!pov.baseline} data-next>Next: Rules →</button>
          </div>
        </div>
      );
    }

    // ---------- §2.1 Rule review ----------
    function PovRulesStep({ meta, pov, setPov, prefix, auth, setError, onNext, onBack }) {
      const [tpl, setTpl] = useState(null);
      const [open, setOpen] = useState({});
      const [q, setQ] = useState('');
      const [changedOnly, setChangedOnly] = useState(false);
      const searchRef = useRef(null);
      const [certs, reloadCerts] = useSslCertificates(!!(pov.scope && pov.scope.sslInspection) && auth.connected);
      const key = JSON.stringify([pov.baseline, pov.scope, prefix]);
      useEffect(() => {
        let gone = false;
        setTpl(null);
        api.call('POST', '/v2/zia/generate', { baseline: pov.baseline, scope: pov.scope, prefix }).then(t => { if (!gone) setTpl(t); }).catch(e => setError(e.message));
        return () => { gone = true; };
      }, [key]);
      const disabled = pov.disabledRules || {};
      const choices = pov.actionSettings || { policy: {}, rules: {} };
      const setRuleOn = (k, on) => setPov(p => { const d = { ...p.disabledRules }; if (on) delete d[k]; else d[k] = true; return { ...p, disabledRules: d }; });
      const setGroupOn = (g, on) => setPov(p => { const d = { ...p.disabledRules }; for (const r of (g.rules || g.settings)) { if (on) delete d[r.key]; else d[r.key] = true; } return { ...p, disabledRules: d }; });
      const setAll = (on) => setPov(p => { const d = { ...p.disabledRules }; for (const g of tpl.catalog) for (const r of (g.rules || g.settings)) { if (on) delete d[r.key]; else d[r.key] = true; } return { ...p, disabledRules: d }; });
      // FWK-11/12, OQ-9: the bulk control rewrites every rule in the category; a rule choice after that wins until the bulk control is used again
      const bulk = (type, v) => setPov(p => {
        const rules = Object.fromEntries(Object.entries(p.actionSettings.rules).filter(([k]) => !k.startsWith(type + ':')));
        const policy = { ...p.actionSettings.policy }; if (v === 'DEFAULT') delete policy[type]; else policy[type] = v;
        return { ...p, actionSettings: { policy, rules } };
      });
      const setRuleAction = (r, v) => setPov(p => ({ ...p, actionSettings: { ...p.actionSettings, rules: { ...p.actionSettings.rules, [r.key]: v } } }));
      const effective = (g, r) => {
        const rc = choices.rules[r.key]; if (rc) return rc;
        const pc = choices.policy[g.type]; if (pc === 'ALLOW' || pc === 'BLOCK') return pc;
        const d = String(r.defaultAction || '');
        return /^(ALLOW)/.test(d) ? 'ALLOW' : /^(BLOCK|DENY)/.test(d) ? 'BLOCK' : d === 'ISOLATE' ? 'ISOLATE' : null;
      };
      const settingValue = (s) => pov.settingOverrides[s.key] !== undefined ? pov.settingOverrides[s.key] : s.defaultValue;
      // 19: search, changed-from-default filter, expand / collapse, keyboard shortcuts
      const isChanged = (g, r) => !!disabled[r.key] || !!choices.rules[r.key] || !!choices.policy[g.type] || pov.settingOverrides[r.key] !== undefined;
      const visible = (g, r) => (!q || `${r.name || r.label} ${r.description || ''}`.toLowerCase().includes(q.toLowerCase())) && (!changedOnly || isChanged(g, r));
      const setAllOpen = (v) => tpl && setOpen(Object.fromEntries(tpl.catalog.map(g => [g.type, v])));
      useEffect(() => {
        const onKey = (e) => {
          const typing = /INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '');
          if (e.key === '/' && !typing) { e.preventDefault(); searchRef.current && searchRef.current.focus(); }
          else if (e.key === 'Escape' && typing && e.target === searchRef.current) { setQ(''); e.target.blur(); }
          else if (!typing && (e.key === 'e' || e.key === 'E')) setAllOpen(true);
          else if (!typing && (e.key === 'c' || e.key === 'C')) setAllOpen(false);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [tpl]);
      if (!tpl) return <div className="card"><div style={{textAlign:'center', padding:'2rem'}}><div className="spinner" style={{margin:'0 auto'}}></div><div className="form-hint">Building the rule set for {pov.baseline}…</div></div></div>;
      const total = tpl.catalog.reduce((n, g) => n + (g.rules || g.settings).length, 0);
      const off = tpl.catalog.reduce((n, g) => n + (g.rules || g.settings).filter(r => disabled[r.key]).length, 0);
      const anyIsolate = Object.values(choices.rules).includes('ISOLATE');
      return (
        <div className="card" data-step="rules">
          <div className="card-header"><h2>Rules — {tpl.metadata.baseline.name}</h2>
            <p>Every rule the baseline creates for the features in scope, grouped by category. Switch rules on or off, and choose Allow or Block per category or per rule. A rule you change after using the category control keeps your choice until you use the category control again.</p></div>
          <div className="alert alert-info"><span>{total - off} of {total} rules and settings on · names start with <code>{prefix}-</code></span></div>
          {(tpl.generationNotes || []).length > 0 && <div className="alert alert-warning" style={{display:'block'}}>{tpl.generationNotes.map((n, i) => <div key={i}>⚠ {n}</div>)}</div>}
          <div style={{display:'flex', gap:'6px', marginBottom:'0.75rem', flexWrap:'wrap', alignItems:'center'}}>

    function LedgerTable({ ledger, filterProduct }) {
      const [show, setShow] = useState('changes');
      const rows = (ledger || []).filter(e => show === 'all' || e.action !== 'NO_CHANGE');
      return (
        <div>
          <div style={{display:'flex', gap:'6px', margin:'0.5rem 0'}}>
            <button className={`btn btn-sm ${show === 'changes' ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setShow('changes')}>Changes only</button>
            <button className={`btn btn-sm ${show === 'all' ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setShow('all')} data-showall>Everything ({(ledger || []).length})</button>
          </div>
          <table className="diff-table" data-ledger>
            <thead><tr>{!filterProduct && <th>Product</th>}<th>Type</th><th>Name</th><th>Planned action</th><th>Detail</th></tr></thead>
            <tbody>
              {rows.map((e, i) => (
                <tr key={i}>
                  {!filterProduct && <td>{e.product}</td>}
                  <td>{e.category}</td><td style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'12px'}}>{e.name}</td>
                  <td><ActionBadge action={e.action} /></td>
                  <td style={{fontSize:'12px'}}>
                    {e.error || (!e.details && e.changes ? 'Changes: ' + e.changes.join(', ') : '') || e.note || e.why || ''}
                    {e.details && e.details.length > 0 && (
                      <div data-fielddiff>{e.why && <div>{e.why}</div>}{e.details.map((d, j) => (
                        <div key={j} style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'11px', margin:'2px 0'}}>
                          <strong>{d.field}</strong>: <span style={{color:'var(--accent-red)', textDecoration:'line-through'}}>{d.from}</span> → <span style={{color:'var(--accent-green)'}}>{d.to}</span>
                        </div>))}
                        {(e.changes || []).filter(c => /^order /.test(c)).map((c, j) => <div key={'o' + j} style={{fontSize:'11px'}}>{c}</div>)}
                      </div>
                    )}
                  </td>
                </tr>
              ))}
              {!rows.length && <tr><td colSpan={5} style={{color:'var(--text-muted)'}}>Nothing to change.</td></tr>}
            </tbody>
          </table>
        </div>
      );
    }
    const countLine = (c) => Object.entries(c || {}).map(([k, v]) => `${ACTION_LABEL[k] || k} ${v}`).join(' · ') || 'nothing';

    // ---------- Dry run + apply (GLB-03/04) ----------
    function PovReviewStep({ pov, prefix, setError, result, setResult, onBack, onDone }) {
      const [plan, setPlan] = useState(null);
      const [busy, setBusy] = useState(false);
      const [confirmed, setConfirmed] = useState(false);
      const body = () => ({ baseline: pov.baseline, scope: pov.scope, prefix, disabledRules: pov.disabledRules, actionSettings: pov.actionSettings,
        settingOverrides: pov.settingOverrides, cbiProfile: pov.cbiProfile, sslCertificate: pov.sslCertificate });
      const run = async () => { setBusy(true); setError(null); setPlan(null); try { setPlan(await api.call('POST', '/v2/zia/plan', body())); } catch (e) { setError('Dry run failed: ' + e.message); } setBusy(false); };
      useEffect(() => { run(); }, []);
      const apply = async () => {
        setBusy(true); setError(null);
        try { const r = await api.call('POST', '/v2/zia/apply', { ...body(), planId: plan.planId }); setResult(r); onDone(); }
        catch (e) { setError('Apply failed: ' + e.message); }
        setBusy(false);
      };
      return (
        <div className="card" data-step="review">
          <div className="card-header"><h2>Dry run</h2><p>Nothing has been changed yet. This is exactly what Apply will do: each object is matched by name in your tenant.</p></div>
          {busy && !plan && <div style={{textAlign:'center', padding:'2rem'}}><div className="spinner" style={{margin:'0 auto'}}></div><div className="form-hint">Reading your tenant and comparing…</div></div>}
          {plan && (<>
            <div className="alert alert-info" data-plancounts><span><strong>Planned:</strong> {countLine(plan.counts)}</span></div>
            {plan.errors.map((e, i) => <div key={i} className="alert alert-danger"><span>✕ {e}</span></div>)}
            {plan.warnings.length > 0 && (
              <div className="alert alert-warning" style={{display:'block'}} data-planwarnings>{plan.warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}</div>
            )}
            {plan.resolved && plan.resolved.cbi && plan.resolved.cbi.name && <div className="form-hint">Isolation profile: {plan.resolved.cbi.name}</div>}
            <LedgerTable ledger={plan.ledger} filterProduct />
            <div className="toggle-item" style={{marginTop:'1rem'}}>
              <label onClick={() => setConfirmed(!confirmed)} style={{cursor:'pointer'}}>I have reviewed this dry run. Apply these changes to ZIA and activate them.</label>
              <div className={`toggle-switch ${confirmed ? 'active' : ''}`} onClick={() => setConfirmed(!confirmed)} data-confirm><div className="toggle-knob"></div></div>
            </div>
          </>)}
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={onBack} disabled={busy}>← Rules</button>
            <button className="btn btn-ghost" onClick={run} disabled={busy}>↻ Re-run dry run</button>
            <button className="btn btn-success" onClick={apply} disabled={!plan || !confirmed || busy} data-apply>{busy && plan ? <><span className="spinner"></span> Applying…</> : '🚀 Apply and activate'}</button>
          </div>
        </div>
      );
    }

    function PovDoneStep({ result, onReport, onRestart }) {
      if (!result) return null;
      const failed = result.ledger.filter(e => e.action === 'FAILED' || e.action === 'SKIPPED');
      return (
        <div className="card" data-step="done">
          <div className="card-header"><h2>Applied</h2><p>{countLine(result.counts)}. {result.activated === true ? 'Changes were activated.' : result.activated === false ? 'Activation failed — activate in the ZIA portal.' : 'Nothing needed activating.'}</p></div>
          {failed.length > 0 && <div className="alert alert-warning"><span>⚠ {failed.length} object(s) did not apply. Each one is listed below with the reason; everything else was applied.</span></div>}
          {result.warnings.length > 0 && <div className="alert alert-warning" style={{display:'block'}}>{result.warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}</div>}
          <LedgerTable ledger={result.ledger} filterProduct />
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={onRestart}>Start another run</button>
            <button className="btn btn-primary" onClick={onReport} data-gotoreport>Summary report →</button>
          </div>
        </div>
      );
    }

    // ---------- §5 ZPA wizard ----------

      const [iso, setIso] = useState({ enabled: true, copyPaste: 'none', uploadDownload: 'none', allowPrinting: false, watermark: true, watermarkMessage: 'Zscaler POV' });
      const [ba, setBa] = useState({ domain: '', port: '443', certificateId: '' });
      const [bulk, setBulk] = useState(false);
      const [apps, setApps] = useState([]);            // [{ name, destinations[], tcpPorts, udpPorts, row, settings }]
      const [csvErrors, setCsvErrors] = useState([]);
      const [csvName, setCsvName] = useState('');
      const [openApp, setOpenApp] = useState(null);
      const [errors, setErrors] = useState([]);
      const [plan, setPlan] = useState(null);
      const [result, setResult] = useState(null);
      const [busy, setBusy] = useState(false);
      const [reveal, setReveal] = useState(false);
      const [confirmed, setConfirmed] = useState(false);
      useEffect(() => { api.call('GET', '/v2/zpa/context').then(setCtx).catch(e => setCtx({ error: e.message })); }, []);
      useEffect(() => { setPlan(null); setConfirmed(false); }, [JSON.stringify([form, settings, bulk, apps, policies, pra, iso, ba])]);
      useEffect(() => {
        if (bulk && !apps.length) { setErrors([]); return; }
        const t = setTimeout(() => api.call('POST', '/v2/zpa/validate', bulk ? { apps, settings, pra, browserAccess: ba } : { domains: form.domains, tcpPorts: form.tcpPorts, udpPorts: form.udpPorts, settings, pra, browserAccess: ba }).then(r => setErrors(r.errors)).catch(() => {}), 250);
        return () => clearTimeout(t);
      }, [form.domains, form.tcpPorts, form.udpPorts, settings.healthReporting, bulk, JSON.stringify(apps), pra.rdpHost, pra.sshHost, ba.domain, ba.port]);
      const body = () => ({ prefix, ...(bulk ? { apps } : { domains: form.domains, tcpPorts: form.tcpPorts, udpPorts: form.udpPorts }), settings, connectorGroupId: form.connectorGroupId || null, descriptions: form.descriptions, policies, pra,
        isolationProfile: policies.isolation ? iso : { ...iso, enabled: false }, browserAccess: ba.domain.trim() ? ba : {} });
      const downloadTemplate = () => {
        const blob = new Blob([meta.copy.zpa.bulkTemplate], { type: 'text/csv' });

      const loadCsv = async (file) => {

        setCsvName(file.name);
        try {
          const text = await file.text();
          const r = await api.call('POST', '/v2/zpa/parse-csv', { text });

      const segName = (name) => `${prefix}-${String(name).trim().replace(/\s+/g, '-')}`;

                  <thead><tr><th>Application segment</th><th>Destinations</th><th>TCP</th><th>UDP</th><th>Settings</th><th></th></tr></thead>
                  <tbody>
                    {apps.map((a, i) => (
                      <React.Fragment key={i}>
                        <tr data-zpaapp={a.name}>
                          <td><code>{segName(a.name)}</code></td>
                          <td style={{fontSize:'12px'}}>{(a.destinations || []).join(', ')}</td>
                          <td style={{fontSize:'12px'}}>{a.tcpPorts || '—'}</td>
                          <td style={{fontSize:'12px'}}>{a.udpPorts || '—'}</td>
                          <td style={{fontSize:'12px'}}>{Object.keys(a.settings || {}).length ? <span className="badge badge-update">{Object.keys(a.settings).length} custom</span> : 'Shared defaults'}</td>
                          <td style={{whiteSpace:'nowrap'}}>
                            <button className="btn btn-ghost btn-sm" onClick={() => setOpenApp(openApp === i ? null : i)} data-zpaappsettings={a.name}>{openApp === i ? 'Close' : 'Settings'}</button>
                            <button className="btn btn-ghost btn-sm" onClick={() => { setApps(apps.filter((_, j) => j !== i)); setCsvErrors(csvErrors.filter(e => !e.startsWith(`Row ${a.row} `))); setOpenApp(null); }} title="Remove from this upload">✕</button>
                          </td>
                        </tr>
                        {openApp === i && (
                          <tr><td colSpan={6} style={{background:'var(--bg-card)'}}>
                            <div className="form-hint" style={{marginBottom:'6px'}}>Settings for <strong>{a.name}</strong>. Anything you change here overrides the shared defaults below for this application only.</div>
                            <ZpaSegmentSettings value={appSettings(a)} onChange={v => setAppSettings(i, v)} compact />
                            {Object.keys(a.settings || {}).length > 0 && <button className="btn btn-ghost btn-sm" onClick={() => setAppSettings(i, settings)}>Reset to shared defaults</button>}

            <div className="form-hint">Comma-separated. Wildcard domain (*.example.com), domain, IPv4 address or IPv4 CIDR.</div>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px'}}>
            <div className="form-group"><label className="form-label">TCP port ranges</label><input type="text" value={form.tcpPorts} onChange={e => setForm({ ...form, tcpPorts: e.target.value })} /></div>
            <div className="form-group"><label className="form-label">UDP port ranges</label><input type="text" value={form.udpPorts} onChange={e => setForm({ ...form, udpPorts: e.target.value })} /></div>
          </div>
          <div className="form-hint" style={{marginBottom:'0.5rem'}}>Port 53 is left out on purpose (DNS stays with Client Connector).</div>
          <div className="form-group">
            <label className="form-label">Application segment description</label>
            <input type="text" value={form.descriptions.appSegment} onChange={e => setForm({ ...form, descriptions: { ...form.descriptions, appSegment: e.target.value } })} />
          </div>
          </>)}
          <details style={{margin:'0.5rem 0 1rem'}} open>
            <summary style={{cursor:'pointer', fontSize:'13px'}}>{bulk ? 'Shared application segment settings (every uploaded application starts with these)' : 'Application segment settings (defaults from the POV guide)'}</summary>
            <div className="form-hint" style={{margin:'6px 0'}}>{meta.copy.zpa.defaultsNote}</div>
            <ZpaSegmentSettings value={settings} onChange={setSettings} />
          </details>
          <details style={{margin:'0.5rem 0 1rem'}} open data-zpapolicies>
            <summary style={{cursor:'pointer', fontSize:'13px'}}>Policies for the application segment{bulk ? 's' : ''}</summary>
            {[['access', 'Access policy (everyone)', 'Anyone signed in to ZPA can reach these applications. Narrow it to groups later in the ZPA portal.'],
              ['timeout', 'Timeout policy', 'Users re-authenticate every 8 hours, or after 1 hour idle.'],
              ['inspection', 'AppProtection inspection', 'Inspect traffic with an OWASP Core Rule Set profile (needs AppProtection on the tenant).'],
              ['isolation', 'Browser isolation', 'Users who reach these applications through Browser Access get an isolated browser session.']].map(([k, label, hint]) => (
              <div className="toggle-item" key={k} data-zpapolicy={k}>
                <div><label onClick={() => setPolicies({ ...policies, [k]: !policies[k] })} style={{cursor:'pointer'}}>{label}</label><div className="form-hint">{hint}</div></div>
                <div className={`toggle-switch ${policies[k] ? 'active' : ''}`} onClick={() => setPolicies({ ...policies, [k]: !policies[k] })}><div className="toggle-knob"></div></div>
              </div>))}
          </details>
          {policies.isolation && (
            <details style={{margin:'0.5rem 0 1rem'}} data-zpaiso>
              <summary style={{cursor:'pointer', fontSize:'13px'}}>Isolation profile settings</summary>
              <div className="toggle-item">
                <div><label onClick={() => setIso({ ...iso, enabled: !iso.enabled })} style={{cursor:'pointer'}}>Create a POV isolation profile (<code>{n('isolation-profile')}</code>)</label>
                  <div className="form-hint">Off: the isolation policy uses the tenant's default isolation profile.</div></div>
                <div className={`toggle-switch ${iso.enabled ? 'active' : ''}`} onClick={() => setIso({ ...iso, enabled: !iso.enabled })} data-isoenabled><div className="toggle-knob"></div></div>
              </div>
              {iso.enabled && (<>
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px', marginTop:'8px'}}>
                  <div className="form-group"><label className="form-label">Copy and paste</label>
                    <select value={iso.copyPaste} onChange={e => setIso({ ...iso, copyPaste: e.target.value })} data-isocopy>
                      <option value="none">Blocked both ways</option><option value="upstream">Only into the isolated page</option><option value="downstream">Only out of the isolated page</option><option value="all">Allowed both ways</option>
                    </select></div>
                  <div className="form-group"><label className="form-label">Upload and download</label>
                    <select value={iso.uploadDownload} onChange={e => setIso({ ...iso, uploadDownload: e.target.value })} data-isoupload>
                      <option value="none">Blocked</option><option value="upstream">Uploads only</option><option value="all">Uploads and downloads</option>
                    </select></div>
                </div>
                <div className="toggle-item"><div><label onClick={() => setIso({ ...iso, allowPrinting: !iso.allowPrinting })} style={{cursor:'pointer'}}>Allow printing</label></div>
