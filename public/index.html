      const set = (patch) => setG(prev => ({ ...prev, ...patch }));
      const setName = (name) => setG(prev => ({ ...prev, customerName: name, prefix: prev.prefixEdited ? prev.prefix : suggestPrefix(name) }));
      const baselines = meta ? [...meta.baselines.compliance, ...meta.baselines.nonMapped] : [];
      const pickPreset = (p) => set({ presetId: p.id, baseline: p.baseline });
      const domainBad = g.domain && !DOMAIN_OK(g.domain);
      const prefixBad = g.prefix && !PREFIX_OK(g.prefix);
      const needDomain = g.scope.zpa;
      const ok = g.customerName.trim() && PREFIX_OK(g.prefix) && (!needDomain || DOMAIN_OK(g.domain)) && !domainBad;
      const preset = presets.find(p => p.id === g.presetId);
      return (
        <div className="card" data-guide="intake">
          <div className="card-header"><h2>Customer intake</h2><p>Who the POV is for. The prefix names every object the wizard creates; the preset pre-fills the private applications and ZDX apps for the customer's market.</p></div>
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))', gap:'12px'}}>
            <div className="form-group"><label className="form-label">Customer name</label>
              <input type="text" value={g.customerName} onChange={e => setName(e.target.value)} placeholder="Maine Medical Center" data-intakename /></div>
            <div className="form-group"><label className="form-label">Prefix</label>
              <input type="text" value={g.prefix} maxLength={20} onChange={e => set({ prefix: e.target.value.trim(), prefixEdited: true })} placeholder="MMC" data-intakeprefix
                style={{borderColor: prefixBad ? 'var(--accent-red)' : undefined, fontFamily:'IBM Plex Mono, monospace'}} />
              <div className="form-hint">{prefixBad ? 'Letters, numbers, - and _ only (max 20).' : <>Generated from the name. Objects are named <code>{g.prefix || 'PREFIX'}-…</code>; re-running with it updates them instead of duplicating.</>}
                {g.prefixEdited && <> <a href="#" style={{color:'var(--accent-cyan)'}} onClick={e => { e.preventDefault(); set({ prefix: suggestPrefix(g.customerName), prefixEdited: false }); }}>Use generated</a></>}</div></div>
            <div className="form-group"><label className="form-label">Internal domain{needDomain ? '' : ' (optional)'}</label>
              <input type="text" value={g.domain} onChange={e => set({ domain: e.target.value.trim().toLowerCase() })} placeholder="hospital.org" data-intakedomain
                style={{borderColor: domainBad ? 'var(--accent-red)' : undefined}} />
              <div className="form-hint">{domainBad ? 'Not a valid domain (for example hospital.org).' : 'Saved for Private Access: a wildcard segment *.' + (g.domain || 'domain') + ' plus the preset apps.'}</div></div>
          </div>
          <div className="form-label">Preset</div>
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(180px, 1fr))', gap:'8px', marginBottom:'0.75rem'}}>
            {presets.map(p => (
              <div key={p.id} className={`tier-card ${g.presetId === p.id ? 'selected' : ''}`} onClick={() => pickPreset(p)} style={{cursor:'pointer', padding:'0.75rem', textAlign:'left'}} data-preset={p.id}>
                <div className="tier-name" style={{fontSize:'13px'}}>{p.icon} {p.name}</div>
                <div className="tier-desc" style={{fontSize:'11px'}}>{p.description}</div>
                <div className="form-hint" style={{marginTop:'4px'}}>{p.appCount} private apps · {p.zdxCount} ZDX apps</div>
              </div>
            ))}
          </div>
          {(g.scope.zia || g.scope.aiguard) && (() => {
            // v2.7: the one place the POV's compliance profile is chosen; Internet Access, AI Guard, the test kit and the reports all use it
            const GROUPS = [['HEALTHCARE', 'Healthcare'], ['FINANCE', 'Financial services'], ['EDUCATION', 'Education'], ['FEDERAL', 'Federal and public sector'], ['GENERAL', 'Any industry']];
            const sel = baselines.find(b => b.id === g.baseline);
            return (
              <div className="form-group" style={{maxWidth:'640px'}} data-intakecompliance><label className="form-label">Compliance profile</label>
                <select value={g.baseline} onChange={e => set({ baseline: e.target.value })} data-intakebaseline>
                  {GROUPS.map(([v, l]) => { const items = meta.baselines.compliance.filter(b => b.vertical === v); return items.length ? <optgroup key={v} label={l}>{items.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}</optgroup> : null; })}
                  <optgroup label="Best-practice baselines (CIS Controls, NIST CSF)">{meta.baselines.nonMapped.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}</optgroup>
                </select>
                <div className="form-hint">{sel ? <><strong>{sel.fullName || sel.name}.</strong> {sel.description} </> : ''}{preset && preset.baseline !== g.baseline ? `The ${preset.name} preset suggests ${preset.baseline}. ` : ''}Every rule the wizard creates is mapped to this profile's controls; the test kit and reports follow it.</div></div>
            );
          })()}
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={onBack}>← Back</button>
            <button className="btn btn-primary" onClick={onNext} disabled={!ok || busy} data-next>{busy ? <><span className="spinner"></span> Preparing…</> : 'Next →'}</button>
          </div>
        </div>
      );
    }

    // v2.4: secrets never leave the browser with a POV's resume point
    const stripPw = (payloads) => ({ ...payloads, zcc: Object.fromEntries(Object.entries((payloads && payloads.zcc) || {}).map(([k, v]) => { const { tamperPassword, ...rest } = v || {}; return [k, rest]; })) });
    const wantsTamper = (p) => !p.enabledSettings || p.enabledSettings.includes('tamperPasswords');

    function PovGuide({ meta, auth, prefix, setPrefix, licensing, pov, setPov, setError, onReport, activePov, resume, template, onPovCreated, onPovChanged }) {
      const R = resume || null;
      const T = template || null;
      const [pwRegenerated] = useState(() => !!(R && R.payloads && Object.values(R.payloads.zcc || {}).some(p => p && !p.tamperPassword && wantsTamper(p))));
      const [g, setG] = useState(() => {
        if (R && R.g) return { ...GUIDE_DEFAULT, ...R.g, scope: { ...GUIDE_DEFAULT.scope, ...(R.g.scope || {}) } };
        if (T) return { ...GUIDE_DEFAULT, scope: { ...GUIDE_DEFAULT.scope, ...(T.scope || {}) }, presetId: T.presetId || GUIDE_DEFAULT.presetId, baseline: T.baseline || GUIDE_DEFAULT.baseline };
        return GUIDE_DEFAULT;
      });
      const [stage, setStage] = useState((R && R.stage) || 'readiness');
      const [visited, setVisited] = useState(() => new Set((R && R.visited) || ['readiness']));
      const [presets, setPresets] = useState([]);
      const [preset, setPreset] = useState((R && R.preset) || null);
      const [zpaInitial, setZpaInitial] = useState((R && R.zpaInitial) || null);
      const [wizardKey, setWizardKey] = useState((R && R.wizardKey) || '');
      const [payloads, setPayloads] = useState(() => {
        const p = (R && R.payloads) || { zcc: {}, ziaReady: false, zpa: null, zdx: null };
        // tamper passwords are never saved with a POV: a resumed POV gets a fresh one
        const zcc = Object.fromEntries(Object.entries(p.zcc || {}).map(([k, v]) => [k, v && !v.tamperPassword && wantsTamper(v) ? { ...v, tamperPassword: genPassword() } : v]));
        return { zcc: {}, ziaReady: false, zpa: null, zdx: null, ...p, zcc };
      });
      // v2.7: the compliance profile is chosen once, on Customer intake; a POV saved on the old baseline step resumes on Rules
      const [ziaSub, setZiaSub] = useState(((R && R.ziaSub) === 'baseline' ? 'rules' : (R && R.ziaSub)) || 'scope');
      const [fwdProfiles, setFwdProfiles] = useState(null);
      const [busy, setBusy] = useState(false);
      useEffect(() => { api.call('GET', '/v2/intake/presets').then(setPresets).catch(() => {}); }, []);
      useEffect(() => {
        const t = setTimeout(() => api.call('POST', '/v2/intake', { customerName: g.customerName, domain: DOMAIN_OK(g.domain) ? g.domain : '', presetId: g.presetId, baseline: g.baseline, products: g.scope }).catch(() => {}), 800);
        return () => clearTimeout(t);
      }, [JSON.stringify(g)]);

      const needZcc = g.scope.zia || g.scope.zpa;
      const stages = [
        { id: 'readiness', label: 'Tenant readiness' }, { id: 'scope', label: 'Build the POV' }, { id: 'intake', label: 'Customer intake' },
        needZcc && { id: 'zcc', label: 'Client Connector' }, g.scope.zia && { id: 'zia', label: 'Internet Access' }, g.scope.aiguard && g.scope.zia && { id: 'aiguard', label: 'AI Guard' },
        g.scope.zpa && { id: 'zpa', label: 'Private Access' }, g.scope.zdx && { id: 'zdx', label: 'Digital Experience' },
        { id: 'run', label: 'Dry run & apply' }
      ].filter(Boolean);
      const idx = Math.max(0, stages.findIndex(s => s.id === stage));
      const go = (id) => { setError(null); setStage(id); setVisited(v => new Set([...v, id])); try { window.scrollTo(0, 0); } catch (e) {} };
      const next = () => go(stages[Math.min(idx + 1, stages.length - 1)].id);
      const back = () => go(stages[Math.max(idx - 1, 0)].id);
      const nextLabel = stages[idx + 1] ? `Next: ${stages[idx + 1].label} →` : 'Next →';

      // v2.4: the resume point is saved to the open POV a moment after anything changes
      useEffect(() => {
        if (!activePov) return;
        const blob = { g, stage, stageLabel: (stages[idx] || {}).label, visited: [...visited], preset, zpaInitial, wizardKey, payloads: stripPw(payloads), ziaSub, pov };
        const t = setTimeout(() => api.call('PUT', `/v2/povs/${activePov.id}`, { guide: blob }).then(r => onPovChanged && onPovChanged(r.summary)).catch(() => {}), 1200);
        return () => clearTimeout(t);
      }, [activePov && activePov.id, JSON.stringify([g, stage, [...visited], payloads, ziaSub, wizardKey, pov])]);

      // Intake → save the prefix, create (or rename) the POV, fill the preset for the domain and prepare each product's wizard
      const finishIntake = async () => {
        setBusy(true); setError(null);
        try {
          await api.call('POST', '/v2/prefix', { prefix: g.prefix });
          setPrefix(g.prefix); safeStore.set('zpw.prefix', g.prefix);
          if (!activePov) {
            const c = await api.call('POST', '/v2/povs', { customerName: g.customerName, prefix: g.prefix, templateId: (T && T.id) || null });
            if (onPovCreated) onPovCreated(c.pov);
          } else if (activePov.customerName !== g.customerName || activePov.prefix !== g.prefix) {
            const u = await api.call('PUT', `/v2/povs/${activePov.id}`, { customerName: g.customerName, prefix: g.prefix });
            if (onPovChanged) onPovChanged(u.summary);
          }
          const r = await api.call('POST', '/v2/intake/preset', { id: g.presetId, domain: g.domain, customerName: g.customerName });
          setPreset(r.preset);
          let apps = [];
          if (g.scope.zpa && r.preset.apps.length) {
            const csv = 'Application Name,Destinations,Ports\r\n' + r.preset.apps.map(a => [a.name, a.destinations.join('; '), a.ports].map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\r\n');
            const parsed = await api.call('POST', '/v2/zpa/parse-csv', { text: csv });
            apps = parsed.apps;
          }
          setZpaInitial(apps.length ? { apps } : { domains: g.domain ? `*.${g.domain}` : '' });
          const key = [g.prefix, g.domain, g.presetId].join('|');
          if (key !== wizardKey) {
            setWizardKey(key);
            setPayloads({ zcc: {}, ziaReady: false, zpa: null, zdx: null });
            setVisited(new Set(['readiness', 'scope', 'intake']));
            setZiaSub('scope');
          }
          if (g.scope.zia && pov.baseline !== g.baseline) {
            setPov(prev => ({ ...prev, baseline: g.baseline, fromIntake: true, disabledRules: { 'firewallFiltering:Default-Block-All': true }, actionSettings: { policy: {}, rules: {} }, settingOverrides: {} }));
          }
          next();
        } catch (e) { setError(e.message); }
        setBusy(false);
      };
      // Client Connector profiles are read when its step is first shown (also after resuming a POV)
      useEffect(() => {
        if (stage === 'zcc' && needZcc && !fwdProfiles) api.call('GET', '/zcc/profiles').then(d => setFwdProfiles(d.forwardingProfiles || [])).catch(() => setFwdProfiles([]));
      }, [stage]);

      const show = (id) => ({ display: stage === id ? 'block' : 'none' });
      const savedZcc = Object.keys(payloads.zcc);
      const zccSeed = savedZcc.length ? payloads.zcc : (T && T.zcc) || null;
      const pwNote = pwRegenerated && <div className="alert alert-warning" data-pwregen><span>🔑 Client Connector tamper passwords are never saved with a POV, so a new one was generated when this POV was resumed. If the profile was already applied, applying again changes its password (the new one is in the summary report).</span></div>;
      return (
        <div data-step="start">
          {activePov && <div className="form-hint" style={{margin:'0 0 6px'}} data-guidepov>POV: <strong>{activePov.customerName}</strong> · prefix <code>{activePov.prefix || prefix}</code> · progress is saved automatically</div>}
          {T && !activePov && <div className="form-hint" style={{margin:'0 0 6px'}} data-guidetemplate>Starting from template <strong>{T.name}</strong></div>}
          <GuideStepper stages={stages} stage={stage} visited={visited} go={go} />
          {stage === 'readiness' && (<>
            <ReadinessPanel setError={setError} />
            <div className="btn-group" style={{marginTop:0}}><button className="btn btn-primary" onClick={next} data-next>Next: Build the POV →</button></div>
          </>)}
          {stage === 'scope' && <ScopePanel g={g} setG={setG} onNext={next} onBack={back} />}
          {stage === 'intake' && <IntakePanel meta={meta} g={g} setG={setG} presets={presets} onNext={finishIntake} onBack={back} busy={busy} />}

          {wizardKey && needZcc && visited.has('zcc') && (
            <div style={show('zcc')} data-guide="zcc">
              {pwNote}
              {savedZcc.length > 0 && <div className="alert alert-success"><span>✓ Saved for the dry run: {savedZcc.map(k => k === 'macos' ? 'macOS' : 'Windows').join(' and ')} profile{savedZcc.length > 1 ? 's' : ''}
                <button className="btn btn-ghost btn-sm" style={{marginLeft:'8px'}} onClick={() => setPayloads(p => ({ ...p, zcc: {} }))}>Clear</button></span></div>}
              {fwdProfiles ? (
                <ZccCreateWizard key={wizardKey} setError={setError} config={{ globalPrefix: prefix }} forwardingProfiles={fwdProfiles} initialPlatform={zccSeed ? Object.keys(zccSeed)[0] : undefined}
                  guided={{ seed: zccSeed, saved: payloads.zcc, onSave: (plat, p) => setPayloads(prev => ({ ...prev, zcc: { ...prev.zcc, [plat]: p } })), onNext: next, onBack: back, onSkip: () => { setPayloads(prev => ({ ...prev, zcc: {} })); next(); } }} />
              ) : <div className="card"><span className="spinner"></span> Reading Client Connector profiles…</div>}
            </div>
          )}
          {wizardKey && g.scope.zia && visited.has('zia') && meta && (
            <div style={show('zia')} data-guide="zia">
              {ziaSub === 'scope' && <ScopeStep meta={meta} pov={pov} setPov={setPov} licensing={licensing} onBack={back} onNext={() => setZiaSub('rules')} nextLabel="Next: Rules →" />}
              {ziaSub === 'rules' && <PovRulesStep meta={meta} pov={pov} setPov={setPov} prefix={prefix} auth={auth} setError={setError} onBack={() => setZiaSub('scope')} backLabel="← Scope"
                nextLabel={nextLabel} onNext={() => { setPayloads(p => ({ ...p, ziaReady: true })); next(); }} />}
            </div>
          )}
          {wizardKey && g.scope.aiguard && g.scope.zia && visited.has('aiguard') && (
            <div style={show('aiguard')} data-guide="aiguard">
              <AiGuardStep key={wizardKey} prefix={prefix} setError={setError} baseline={g.baseline}
                guided={{ saved: payloads.aiguard || null, onBack: back, nextLabel, onNext: (b) => { setPayloads(p => ({ ...p, aiguard: b })); next(); } }} />
            </div>
          )}
          {wizardKey && g.scope.zpa && visited.has('zpa') && meta && (zpaInitial || payloads.zpa) && (
            <div style={show('zpa')} data-guide="zpa">
              <ZpaWizard key={wizardKey} meta={meta} prefix={prefix} setError={setError} onReport={onReport}
                guided={{ initial: payloads.zpa ? { saved: payloads.zpa } : zpaInitial, seed: (T && T.zpa) || null, onBack: back, nextLabel, onNext: (body) => { setPayloads(p => ({ ...p, zpa: body })); next(); } }} />
            </div>
          )}
          {wizardKey && g.scope.zdx && visited.has('zdx') && (preset || payloads.zdx) && (
            <div style={show('zdx')} data-guide="zdx">
              <ZdxWizard key={wizardKey} setError={setError}
                guided={{ custom: (preset && preset.zdxApps) || [], predefined: (preset && preset.zdxPredefined) || [], saved: payloads.zdx || (T && T.zdx) || null, onBack: back, nextLabel, onNext: (pl) => { setPayloads(p => ({ ...p, zdx: pl })); next(); } }} />
            </div>
          )}
          {stage === 'run' && (<>
            {pwNote}
            <GuidedRun g={g} prefix={prefix} pov={pov} payloads={payloads} stages={stages} go={go} setError={setError} onReport={onReport} onBack={back} />
          </>)}
        </div>
      );
    }

    // One dry run and one apply across what the guided steps collected, in order ZCC → ZIA → ZPA → ZDX
    function GuidedRun({ g, prefix, pov, payloads, stages, go, setError, onReport, onBack }) {
      const [plans, setPlans] = useState({});        // key → { status, rows, error, payload, planId, until }
      const [results, setResults] = useState({});
      const [busy, setBusy] = useState(null);         // 'plan' | 'apply' | null
      const [confirmed, setConfirmed] = useState(false);
      const [, tick] = useState(0);
      useEffect(() => { const t = setInterval(() => tick(x => x + 1), 1000); return () => clearInterval(t); }, []);
      const ziaPayload = () => ({ baseline: pov.baseline, scope: pov.scope, prefix, disabledRules: pov.disabledRules, actionSettings: pov.actionSettings, settingOverrides: pov.settingOverrides, cbiProfile: pov.cbiProfile, sslCertificate: pov.sslCertificate });
      const steps = [
        payloads.zcc.windows && { key: 'zccWin', product: 'zcc', stage: 'zcc', label: 'Client Connector (Windows)', platform: 'windows', payload: payloads.zcc.windows },
        payloads.zcc.macos && { key: 'zccMac', product: 'zcc', stage: 'zcc', label: 'Client Connector (macOS)', platform: 'macos', payload: payloads.zcc.macos },
        g.scope.zia && payloads.ziaReady && pov.baseline && { key: 'zia', product: 'zia', stage: 'zia', label: 'Internet Access', payload: ziaPayload() },
        g.scope.aiguard && g.scope.zia && payloads.aiguard && { key: 'aiguard', product: 'aiguard', stage: 'aiguard', label: 'AI Guard', payload: { ...payloads.aiguard, prefix } },
        g.scope.zpa && payloads.zpa && { key: 'zpa', product: 'zpa', stage: 'zpa', label: 'Private Access', payload: payloads.zpa },
        g.scope.zdx && payloads.zdx && { key: 'zdx', product: 'zdx', stage: 'zdx', label: 'Digital Experience', payload: payloads.zdx }
      ].filter(Boolean);
      const missing = [
        g.scope.zia && !(payloads.ziaReady && pov.baseline) && { stage: 'zia', label: 'Internet Access' },
        g.scope.aiguard && g.scope.zia && !payloads.aiguard && { stage: 'aiguard', label: 'AI Guard' },
        g.scope.zpa && !payloads.zpa && { stage: 'zpa', label: 'Private Access' },
        g.scope.zdx && !payloads.zdx && { stage: 'zdx', label: 'Digital Experience' }
      ].filter(Boolean);

      const planOne = async (st) => {
        try {
          if (st.product === 'zia' || st.product === 'zpa' || st.product === 'aiguard') {
            const p = await api.call('POST', `/v2/${st.product}/plan`, st.payload);
            return { status: (p.errors && p.errors.length) ? 'error' : 'ok', error: (p.errors || []).join(' '), payload: st.payload, planId: p.planId, counts: p.counts, rows: p.ledger, warnings: p.warnings,
              shadow: p.shadow || null, forecast: p.forecast || null, manualSteps: p.manualSteps || null };
          }
          if (st.product === 'zcc') {
            const p = await api.call('POST', `/zcc/app-profiles/${st.platform}/dryrun`, st.payload);
            const rows = [];
            if (p.forwardingProfile && p.forwardingProfile.isNew) rows.push({ product: 'ZCC', category: 'Forwarding Profile', name: p.forwardingProfile.name, action: p.forwardingAction || 'CREATE' });
            rows.push({ product: 'ZCC', category: 'App Profile', name: st.payload.name, action: p.action, changes: p.changeReasons });
            const fails = (p.checks || []).filter(c => c.status === 'fail');
            return { status: p.ok ? 'ok' : 'error', error: fails.map(c => `${c.name}: ${c.detail}`).join(' '), payload: st.payload, planId: p.planId, rows, warnings: p.warnings || [] };
          }
          if (st.product === 'zdx') {
            const p = await api.call('POST', '/zdx/dryrun', st.payload);
            const rows = (p.apps || []).flatMap(a => (a.steps || []).filter(s => s.op !== 'none').map(s => ({ product: 'ZDX', category: a.kind === 'setup' ? 'Setup' : 'App', name: a.name, action: /create/i.test(s.op) ? 'CREATE' : 'UPDATE', note: s.label })));
            const fails = (p.checks || []).filter(c => c.status === 'fail');
            return { status: p.ok ? 'ok' : 'error', error: fails.map(c => `${c.name}: ${c.detail}`).join(' '), payload: st.payload, rows, warnings: p.warnings || [] };
          }
        } catch (e) {
          if (e.status === 429 || /rate limit/i.test(e.message)) {
            const rl = await api.call('GET', '/v2/ratelimits').catch(() => null);
            const until = rl && (st.product === 'zdx' ? rl.zdx : rl.zcc).blockedUntil;
            return { status: 'waiting', error: e.message, until };
          }
          return { status: 'error', error: e.message };
        }
      };
      const planAll = async () => {
        setBusy('plan'); setError(null); setResults({}); setConfirmed(false);
        const out = {};
        for (const st of steps) { out[st.key] = { status: 'running' }; setPlans({ ...out }); out[st.key] = await planOne(st); setPlans({ ...out }); }
        setBusy(null);
      };
      useEffect(() => { if (steps.length) planAll(); }, []);
      // a step paused by a rate limit is re-run on its own when the wait is over
      useEffect(() => {
        const waiting = steps.filter(st => plans[st.key] && plans[st.key].status === 'waiting' && plans[st.key].until && new Date(plans[st.key].until).getTime() <= Date.now());
        if (!waiting.length || busy) return;
        (async () => { for (const st of waiting) { const r = await planOne(st); setPlans(prev => ({ ...prev, [st.key]: r })); } })();
      });
      const applyAll = async () => {
        setBusy('apply'); setError(null);
        const out = {};
        for (const st of steps) {
          const pl = plans[st.key];
          if (!pl || pl.status !== 'ok') { out[st.key] = { status: 'skipped', error: 'The dry run for this product did not pass.' }; setResults({ ...out }); continue; }
          out[st.key] = { status: 'running' }; setResults({ ...out });
          try {
            if (st.product === 'zia') { const r = await api.call('POST', '/v2/zia/apply', { ...pl.payload, planId: pl.planId }); out[st.key] = { status: r.verify && r.verify.differ.length ? 'warn' : 'ok', counts: r.counts, rows: r.ledger, note: r.activated ? 'Activated' : '',
              warnings: [...(r.verify ? [r.verify.text, ...r.verify.differ.map(d => `${d.category}: ${d.name} — ${d.why}`)] : []), ...((r.manualSteps || []).map(m => `Portal step: ${m.area}: ${m.step}`))] }; }
            else if (st.product === 'aiguard') { const r = await api.call('POST', '/v2/aiguard/apply', { ...pl.payload, planId: pl.planId }); out[st.key] = { status: 'ok', counts: r.counts, rows: r.ledger, warnings: [...(r.warnings || []), ...(r.gatewayMissing ? ['Create the proxy gateway in the ZIA portal, then re-run AI Guard to add the forwarding rule.'] : [])], note: r.activated ? 'Activated' : '' }; }
            else if (st.product === 'zpa') { const r = await api.call('POST', '/v2/zpa/apply', { ...pl.payload, planId: pl.planId }); out[st.key] = { status: 'ok', counts: r.counts, rows: r.ledger, key: !!r.provisioningKey }; }
            else if (st.product === 'zcc') { const r = await api.call('POST', `/zcc/app-profiles/${st.platform}`, { ...pl.payload, planId: pl.planId }); out[st.key] = { status: r.verified ? 'ok' : 'warn', rows: [{ product: 'ZCC', category: 'App Profile', name: r.name, action: r.action, note: r.verified ? 'Verified on read-back' : 'Some settings did not verify' }] }; }
            else if (st.product === 'zdx') { const r = await api.call('POST', '/zdx/apply', pl.payload); out[st.key] = { status: r.success ? 'ok' : 'warn', rows: r.results.map(x => ({ product: 'ZDX', category: x.kind, name: x.name, action: x.ok ? 'CREATE' : 'FAILED' })) }; }
          } catch (e) { out[st.key] = { status: 'error', error: applyError(e) }; }
          setResults({ ...out });
        }
        setBusy(null);
      };
      const planned = steps.length && steps.every(st => plans[st.key] && plans[st.key].status !== 'running');
      const anyOk = steps.some(st => plans[st.key] && plans[st.key].status === 'ok');
      const applied = Object.keys(results).length > 0;
      const badge = (r) => !r ? null : r.status === 'running' ? <span className="spinner"></span> : r.status === 'ok' ? <span className="badge badge-create">{applied ? 'Done' : 'Ready'}</span>
        : r.status === 'waiting' ? <span className="badge badge-update">Rate limit · retries in {r.until ? fmtLeft(r.until) : 'a few minutes'}</span>
        : r.status === 'warn' ? <span className="badge badge-update">Check</span> : r.status === 'skipped' ? <span className="badge badge-category">Skipped</span> : <span className="badge badge-risk">Failed</span>;
      return (
        <div className="card" data-combined>
          <div className="card-header"><h2>Dry run & apply</h2><p>One dry run covers everything you set up for <strong>{g.customerName || 'this customer'}</strong> (prefix <code>{prefix}</code>). Nothing changes until you apply; Apply runs Client Connector → Internet Access → AI Guard → Private Access → Digital Experience and shows each object as it is created.</p></div>
          {missing.map(m => <div key={m.stage} className="alert alert-warning"><span>{m.label} is in scope but its step was not finished. <button className="btn btn-ghost btn-sm" onClick={() => go(m.stage)}>Go to {m.label}</button></span></div>)}
          {!steps.length && <div className="alert alert-info"><span>Nothing to run yet. Finish at least one product step.</span></div>}
          {steps.map(st => {
            const pl = plans[st.key], rs = results[st.key], cur = rs || pl;
            return (
              <div key={st.key} style={{marginTop:'0.75rem', borderTop:'1px solid var(--border)', paddingTop:'0.75rem'}} data-step-product={st.key}>
                <h3 style={{fontSize:'14px', display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap'}}>{st.label} {badge(cur)} {cur && cur.counts && <span className="form-hint" style={{margin:0}}>{countLine(cur.counts)}</span>}
                  {!applied && <button className="btn btn-ghost btn-sm" style={{marginLeft:'auto'}} onClick={() => go(st.stage)} disabled={!!busy}>Edit</button>}</h3>
                {cur && cur.error && <div className="alert alert-danger"><span>{cur.error}</span></div>}
                {cur && (cur.warnings || []).slice(0, 6).map((w, i) => <div key={i} className="form-hint" style={{color:'var(--accent-amber)'}}>⚠ {w}</div>)}
                {pl && !rs && st.product === 'zia' && <PlanExtras plan={pl} />}
                {cur && cur.rows && (
                  <details open={cur.rows.length <= 12}><summary style={{cursor:'pointer', fontSize:'12px'}}>{cur.rows.length} object{cur.rows.length === 1 ? '' : 's'}</summary><LedgerTable ledger={cur.rows} filterProduct /></details>
                )}
              </div>
            );
          })}
          {planned && anyOk && !applied && (
            <div className="toggle-item" style={{marginTop:'1rem'}}>
              <label onClick={() => setConfirmed(!confirmed)} style={{cursor:'pointer'}}>I have reviewed the dry run. Apply the ready products (failed ones are skipped).</label>
              <div className={`toggle-switch ${confirmed ? 'active' : ''}`} onClick={() => setConfirmed(!confirmed)} data-confirmall><div className="toggle-knob"></div></div>
            </div>
          )}
          <LiveProgress active={busy === 'apply'} title="Applying" />
          <div className="btn-group">
            {!applied && <button className="btn btn-ghost" onClick={onBack} disabled={!!busy}>← Back</button>}
            {!applied && <button className="btn btn-ghost" onClick={planAll} disabled={!!busy || !steps.length} data-planall>{busy === 'plan' ? <><span className="spinner"></span> Dry run…</> : '↻ Re-run dry run'}</button>}
            {planned && anyOk && !applied && <button className="btn btn-success" disabled={!confirmed || !!busy} onClick={applyAll} data-applyall>{busy === 'apply' ? <><span className="spinner"></span> Applying…</> : '🚀 Apply all'}</button>}
            {applied && !busy && <button className="btn btn-primary" onClick={onReport}>Summary report →</button>}
          </div>
        </div>
      );
    }

    // v2.3: one Bulk Rule Manager for ZIA, ZPA and ZDX
    function BulkHub({ meta, prefix, setError, loading, setLoading, initialTab }) {
      const [tab, setTab] = useState(initialTab || 'zia');
      return (
        <div data-bulkhub>
          <div className="card" style={{padding:'0.75rem 1rem', marginBottom:'1rem'}}>
            <h2 style={{fontSize:'16px', margin:'0 0 0.5rem'}}>🗑️ Bulk Rule Manager</h2>
            <div style={{display:'flex', gap:'6px', flexWrap:'wrap'}}>
              {[['zia', '🌐 Internet Access'], ['zpa', '🔒 Private Access'], ['zdx', '📈 Digital Experience']].map(([k, l]) => (
                <button key={k} className={`btn btn-sm ${tab === k ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setTab(k)} data-bulktab={k}>{l}</button>
              ))}
            </div>
          </div>
          {tab === 'zia' && <BulkDeleteStep setError={setError} loading={loading} setLoading={setLoading} />}
          {tab === 'zpa' && meta && <BulkManagerV2 key="zpa" product="zpa" prefix={prefix} meta={meta} setError={setError} />}
          {tab === 'zdx' && meta && <BulkManagerV2 key="zdx" product="zdx" prefix={prefix} meta={meta} setError={setError} />}
        </div>
      );
    }

    // ========================
    // v2.4 — Active POVs: POV home, templates
    // ========================
    const POV_STATUS = { planning: { label: 'Planning', color: 'var(--accent-blue)' }, built: { label: 'Built', color: 'var(--accent-purple)' }, testing: { label: 'Testing', color: 'var(--accent-amber)' }, 'wrapping-up': { label: 'Wrapping up', color: 'var(--accent-cyan)' }, closed: { label: 'Closed', color: 'var(--text-muted)' } };
    const ago = (iso) => { if (!iso) return ''; const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
    const StatusPill = ({ status }) => { const s = POV_STATUS[status] || POV_STATUS.planning; return <span className="badge" style={{background:'transparent', border:`1px solid ${s.color}`, color: s.color}} data-povstatus={status}>{s.label}</span>; };
    const sameTenant = (a, b) => a && b && String(a.vanity || '').toLowerCase() === String(b.vanity || '').toLowerCase() && String(a.cloud || 'production').toLowerCase() === String(b.cloud || 'production').toLowerCase();
    const ledgerCounts = (ledger) => (ledger || []).reduce((c, e) => { c[e.action] = (c[e.action] || 0) + 1; return c; }, {});

    /** Template choices from a POV's saved resume point: what was chosen, never who / where (no customer, tenant, prefix, names, lists of customer hosts, secrets). */
    function templateChoices(guide) {
      const gd = guide || {}, pl = gd.payloads || {};
      const zcc = Object.fromEntries(Object.entries(pl.zcc || {}).map(([k, v]) => {
        const { name, description, tamperPassword, forwardingProfileId, newForwardingProfile, lists, ...rest } = v || {};
        const keptLists = lists ? Object.fromEntries(Object.entries(lists).filter(([lk]) => lk !== 'vpnGateways')) : null;
        return [k, { ...rest, lists: keptLists, newForwardingProfile: newForwardingProfile ? { templateId: newForwardingProfile.templateId, enabledSettings: newForwardingProfile.enabledSettings } : null }];
      }));
      const z = pl.zpa || null;
      return {
        scope: gd.g ? gd.g.scope : null, presetId: gd.g ? gd.g.presetId : null, baseline: gd.g ? gd.g.baseline : null,
        pov: gd.pov ? { ...gd.pov, cbiProfile: null, sslCertificate: null } : null,
        zcc: Object.keys(zcc).length ? zcc : null,
        zpa: z ? { settings: z.settings, policies: z.policies, isolationProfile: z.isolationProfile, descriptions: z.descriptions } : null,
        zdx: pl.zdx || null
      };
    }

    function PovHome({ id, auth, sessionTenant, activePov, onResume, onConnectFor, onUseTenant, onAddKey, onForgetKey, onClosed, onChanged, onGo, setError }) {
      const [keyForm, setKeyForm] = useState({ clientId: '', clientSecret: '' });
      const [keyBusy, setKeyBusy] = useState(false);
      const [data, setData] = useState(null);
      const [tab, setTab] = useState('overview');
      const [noteText, setNoteText] = useState('');
      const [fuText, setFuText] = useState('');
      const [crText, setCrText] = useState('');
      const [tpl, setTpl] = useState(null);           // { name, description } while saving a template
      const [tplSaved, setTplSaved] = useState(null);
      const [archiving, setArchiving] = useState(false);
      const [busy, setBusy] = useState(false);
      const [openRun, setOpenRun] = useState(null);
      const load = () => api.call('GET', `/v2/povs/${id}`).then(setData).catch(e => setError(e.message));
      useEffect(() => { setData(null); setTab('overview'); load(); }, [id]);
      useEffect(() => { if (activePov && activePov.id === id) { const t = setInterval(load, 15000); return () => clearInterval(t); } }, [id, activePov && activePov.id]);
      if (!data) return <div className="card"><span className="spinner"></span> Loading POV…</div>;
      const p = data.pov, sum = data.summary, gd = p.guide || {}, gg = gd.g || {};
      const put = async (patch) => { try { const r = await api.call('PUT', `/v2/povs/${id}`, patch); setData(d => ({ ...d, pov: r.pov, summary: r.summary })); if (onChanged) onChanged(); } catch (e) { setError(e.message); } };
      const isActive = activePov && activePov.id === id;
      const tenantOk = auth.connected && sameTenant(p.tenant, sessionTenant);
      const tenantLabel = `${p.tenant && p.tenant.vanity}${p.tenant && p.tenant.cloud && p.tenant.cloud !== 'production' ? ` (${p.tenant.cloud})` : ''}`;
      const runsFlat = ['zcc', 'zia', 'aiguard', 'zpa', 'zdx'].flatMap(k => (p.runs && p.runs[k] || []).map((r, i) => ({ k, i, r }))).sort((a, b) => (a.r.at < b.r.at ? 1 : -1));
      const PRODUCT = { zcc: 'Client Connector', zia: 'Internet Access', aiguard: 'AI Guard', zpa: 'Private Access', zdx: 'Digital Experience' };
      const exportIt = async () => { try { const ex = await api.call('GET', `/v2/povs/${id}/export`); download(`${p.id}.ztp-pov.json`, JSON.stringify(ex, null, 2), 'application/json'); } catch (e) { setError(e.message); } };
      const saveTemplate = async () => { try { const r = await api.call('POST', '/v2/pov-templates', { name: tpl.name, description: tpl.description, choices: templateChoices(gd), fromPov: p.id }); setTplSaved(r.template.name); setTpl(null); } catch (e) { setError(e.message); } };
      const archive = async () => { try { await api.call('DELETE', `/v2/povs/${id}`); if (onClosed) onClosed(id); } catch (e) { setError(e.message); } };
      const resume = async () => { setBusy(true); await onResume(p); setBusy(false); };
      const planRows = [
        ['Products', ['zia', 'aiguard', 'zpa', 'zdx'].filter(k => gg.scope && gg.scope[k]).map(k => k === 'aiguard' ? 'AI Guard' : PRODUCT[k]).join(', ') || '—'],
        ['Preset', ({ HEALTHCARE: 'Healthcare', GENERAL: 'General enterprise', FINANCE: 'Financial services', EDUCATION: 'Education', BLANK: 'Start empty' })[gg.presetId] || gg.presetId || '—'], ['Baseline (ZIA)', (gd.pov && gd.pov.baseline) || gg.baseline || '—'], ['Internal domain', gg.domain || '—'],
        ['Client Connector', Object.keys((gd.payloads && gd.payloads.zcc) || {}).map(k => k === 'macos' ? 'macOS' : 'Windows').join(' + ') || 'not set up yet'],
        ...(gg.scope && gg.scope.aiguard ? [['AI Guard', gd.payloads && gd.payloads.aiguard ? `${(gd.payloads.aiguard.apps || []).length} AI apps` : 'not set up yet']] : []),
        ['Private Access', gd.payloads && gd.payloads.zpa ? (gd.payloads.zpa.apps ? `${gd.payloads.zpa.apps.length} application segments` : `wildcard ${gd.payloads.zpa.domains || ''}`) : 'not set up yet'],
        ['Digital Experience', gd.payloads && gd.payloads.zdx ? `${(gd.payloads.zdx.predefined || []).length + (gd.payloads.zdx.custom || []).length} apps` : 'not set up yet']
      ];
      const openFu = (p.followUps || []).filter(f => !f.done);
      return (
        <div data-povhome={p.id}>
          <div className="card">
            <div style={{display:'flex', justifyContent:'space-between', gap:'12px', flexWrap:'wrap', alignItems:'flex-start'}}>
              <div>
                <h2 style={{fontSize:'20px', margin:0}}>{p.customerName} <StatusPill status={p.status} /></h2>
                <div className="form-hint">Tenant <strong>{tenantLabel}</strong> · prefix <code>{p.prefix || '—'}</code> · last activity {ago(sum.lastActivityAt)} · started {new Date(p.createdAt).toLocaleDateString()}</div>
              </div>
              <select value={p.status} onChange={e => put({ status: e.target.value })} style={{width:'auto'}} data-povstatusselect>
                {Object.entries(POV_STATUS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
              </select>
            </div>
            {sum.quiet && <div className="alert alert-warning" style={{marginTop:'0.75rem'}} data-povquiet><span>⏰ No activity for {sum.daysQuiet} days.{sum.next ? ` Next: ${sum.next.label} on ${sum.next.date}.` : ''}</span></div>}
            <div style={{marginTop:'0.75rem'}} data-povresume>
              {!tenantOk && wallet.get(p.tenant) ? (
                <div className="alert alert-info" data-povswitch><span>The API key for <strong>{tenantLabel}</strong> is in memory.
                  <button className="btn btn-primary btn-sm" style={{marginLeft:'8px'}} onClick={async () => { if (!(await onUseTenant(p.tenant))) setError(`The session for ${tenantLabel} has expired; add the API key again.`); }} data-povswitchbtn>Switch to {p.tenant && p.tenant.vanity}</button></span></div>
              ) : !tenantOk ? (
                <div className="alert alert-info" style={{display:'block'}} data-povaddkey>
                  <div style={{marginBottom:'6px'}}><strong>API key for {tenantLabel}</strong>{auth.connected && sessionTenant ? <span> (you are working in <strong>{sessionTenant.vanity}</strong>; both stay signed in)</span> : null}. Kept in memory while the wizard runs, never saved with the POV or on disk.</div>
                  <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))', gap:'8px', alignItems:'end'}}>
                    <div><label className="form-label">Client ID</label><input type="text" value={keyForm.clientId} onChange={e => setKeyForm({ ...keyForm, clientId: e.target.value.trim() })} autoComplete="off" data-povkeyid /></div>
                    <div><label className="form-label">Client secret</label><input type="password" value={keyForm.clientSecret} onChange={e => setKeyForm({ ...keyForm, clientSecret: e.target.value })} autoComplete="new-password" data-povkeysecret /></div>
                    <div><button className="btn btn-primary" disabled={keyBusy || !keyForm.clientId || !keyForm.clientSecret} onClick={async () => {
                      setKeyBusy(true); setError(null);
                      try { await onAddKey(p, keyForm); setKeyForm({ clientId: '', clientSecret: '' }); } catch (e) { setError(e.message); }
                      setKeyBusy(false); }} data-povkeyadd>{keyBusy ? <span className="spinner"></span> : 'Add key and switch'}</button></div>
                  </div>
                </div>
              ) : (
                <div style={{display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap'}}>
                  <button className="btn btn-primary" onClick={resume} disabled={busy} data-povresumebtn>{busy ? <span className="spinner"></span> : '▶'} {isActive ? 'Continue' : 'Resume'}{gd.stageLabel ? `: ${gd.stageLabel}` : ''}</button>
                  {isActive && <span className="badge badge-create">Open in this session</span>}
                  {isActive && <button className="btn btn-ghost btn-sm" onClick={() => onGo('restore')}>Restore & drift</button>}
                  {isActive && <button className="btn btn-ghost btn-sm" onClick={() => onGo('tests')}>POV tests</button>}
                  {isActive && <button className="btn btn-ghost btn-sm" onClick={() => onGo('report')}>Summary report</button>}
                  <button className="btn btn-ghost btn-sm" style={{marginLeft:'auto'}} onClick={() => onForgetKey(p.tenant)} title="Sign out of this tenant and drop its API key from memory" data-povforget>Forget key</button>
                </div>
              )}
            </div>
          </div>

          <div style={{display:'flex', gap:'6px', flexWrap:'wrap', marginBottom:'1rem'}}>
            {[['overview', 'Overview'], ['runs', `What the tool did (${runsFlat.length})`], ['tests', `Tests & success criteria (${sum.tests.pass}/${sum.tests.total})`], ['prove', 'Prove it & test kit'], ['posture', 'Posture & coverage'], ['timeline', `Timeline & notes`]].map(([k, l]) => (
              <button key={k} className={`btn btn-sm ${tab === k ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setTab(k)} data-povtab={k}>{l}</button>
            ))}
          </div>

          {tab === 'posture' && (
            <div data-povposture>
              {!(tenantOk && isActive) && <div className="alert alert-info"><span>Open this POV in a session signed in to <strong>{tenantLabel}</strong> (Resume, above) to take a posture score or read inspection coverage. Saved results are shown below.</span></div>}
              <PosturePanel connected={tenantOk && isActive} saved={p.posture || null} setError={setError} />
              <CoveragePanel connected={tenantOk && isActive} setError={setError} />
            </div>
          )}
          {tab === 'prove' && (
            <div data-povprove>
              <div className="card">
                <div className="card-header"><h2>Prove it</h2><p>Show the customer what Internet Access does with a destination: URL filtering, threat protection, cloud apps, firewall and DNS. Built-in test destinations or your own.</p></div>
                {!tenantOk && <div className="alert alert-info"><span>Connect to <strong>{tenantLabel}</strong> (above) to run Prove it against this POV's tenant.</span></div>}
                <ProveIt initial={{ type: 'url' }} connected={tenantOk} setError={setError} />
                {(data.tests || []).filter(t => t.prove).length > 0 && <>
                  <h3 style={{fontSize:'14px', margin:'1rem 0 0.4rem'}}>For each test in this POV's runbook</h3>
                  {(data.tests || []).filter(t => t.prove).map(t => <div key={t.id} className="ab-row" style={{display:'block'}} data-povtestprove={t.id}><div className="ab-row-name" style={{marginBottom:'4px'}}><span className="badge badge-category">{t.product}</span> {t.title}</div><ProveIt initial={t.prove} compact connected={tenantOk} setError={setError} /></div>)}
                </>}
              </div>
              <div className="card">
                <div className="card-header"><h2>Test kit</h2><p>Only what this POV covers: DLP files for its compliance profile and vertical plus generic PII, EICAR and AMTSO threat tests, and a unique sandbox file.</p></div>
                <TestKit povId={p.id} setError={setError} />
              </div>
              <div className="card">
                <div className="card-header"><h2>Compliance pack</h2><p>Control mapping report, policy export and test plan by control for this POV's compliance profile.</p></div>
                <CompliancePack povId={p.id} setError={setError} />
              </div>
            </div>
          )}

          {tab === 'overview' && (
            <div className="card" data-povoverview>
              <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(280px, 1fr))', gap:'1rem'}}>
                <div>
                  <h3 style={{fontSize:'14px', margin:'0 0 0.5rem'}}>POV plan</h3>
                  <table className="diff-table"><tbody>{planRows.map(([k, v]) => <tr key={k}><td style={{width:'40%', color:'var(--text-muted)'}}>{k}</td><td>{v}</td></tr>)}</tbody></table>
                </div>
                <div>
                  <h3 style={{fontSize:'14px', margin:'0 0 0.5rem'}}>Where things stand</h3>
                  <table className="diff-table"><tbody>
                    <tr><td style={{width:'40%', color:'var(--text-muted)'}}>Left off at</td><td><strong>{gd.stageLabel || 'Not started'}</strong></td></tr>
                    <tr><td style={{color:'var(--text-muted)'}}>Runs</td><td>{sum.runs ? `${sum.runs} apply run${sum.runs === 1 ? '' : 's'}` : 'Nothing applied yet'}</td></tr>
                    <tr><td style={{color:'var(--text-muted)'}}>Tests</td><td>{sum.tests.total ? `${sum.tests.pass} passed · ${sum.tests.fail} failed · ${sum.tests.total - sum.tests.pass - sum.tests.fail} to do` : 'No tests yet'}</td></tr>
                    <tr><td style={{color:'var(--text-muted)'}}>Success criteria</td><td>{sum.criteria.total ? `${sum.criteria.met} of ${sum.criteria.total} met` : 'None yet'}</td></tr>
                    <tr><td style={{color:'var(--text-muted)'}}>Next date</td><td>{sum.next ? `${sum.next.label} · ${sum.next.date}` : '—'}</td></tr>
                  </tbody></table>
                </div>
              </div>
              <h3 style={{fontSize:'14px', margin:'1.25rem 0 0.5rem'}}>Next steps ({openFu.length})</h3>
              {openFu.length ? openFu.map(f => <div key={f.id} className="form-hint" style={{margin:'2px 0'}}>☐ {f.text} {f.source === 'wizard' && <span className="badge badge-category">wizard</span>}</div>) : <div className="form-hint">Nothing open. Add follow-ups under Timeline & notes.</div>}
              {(p.notes || []).length > 0 && (<><h3 style={{fontSize:'14px', margin:'1.25rem 0 0.5rem'}}>Latest note</h3><div style={{fontSize:'13px', whiteSpace:'pre-wrap'}}>{p.notes[p.notes.length - 1].text}</div><div className="form-hint">{new Date(p.notes[p.notes.length - 1].at).toLocaleString()}</div></>)}
              <div className="btn-group">
                <button className="btn btn-ghost btn-sm" onClick={exportIt} data-povexport>⬇ Export POV</button>
                <button className="btn btn-ghost btn-sm" onClick={() => { setTplSaved(null); setTpl({ name: `${p.customerName} setup`, description: '' }); }} disabled={!p.guide} data-povsavetpl>💾 Save as template</button>
                {!archiving ? <button className="btn btn-ghost btn-sm" onClick={() => setArchiving(true)} data-povarchive>🗄 Archive</button>
                  : <span style={{display:'flex', gap:'6px', alignItems:'center'}}><span className="form-hint" style={{margin:0}}>Archive this POV? It leaves the list (the folder is kept under povs/_archive).</span><button className="btn btn-danger btn-sm" onClick={archive} data-povarchiveyes>Archive</button><button className="btn btn-ghost btn-sm" onClick={() => setArchiving(false)}>Cancel</button></span>}
              </div>
              {tpl && (
                <div className="card" style={{background:'var(--bg-input)', marginTop:'0.75rem'}} data-tplform>
                  <div className="form-hint" style={{marginTop:0}}>A template keeps this POV's choices (products, preset, baseline, ZIA rule choices, Client Connector settings, ZPA settings and policies, ZDX apps), never the customer, tenant, prefix, host names or secrets.</div>
                  <div style={{display:'grid', gridTemplateColumns:'1fr 2fr', gap:'8px'}}>
                    <input type="text" value={tpl.name} maxLength={80} onChange={e => setTpl({ ...tpl, name: e.target.value })} placeholder="Template name" data-tplname />
                    <input type="text" value={tpl.description} maxLength={300} onChange={e => setTpl({ ...tpl, description: e.target.value })} placeholder="What it is for (optional)" />
                  </div>
                  <div className="btn-group" style={{marginTop:'0.5rem'}}><button className="btn btn-primary btn-sm" onClick={saveTemplate} disabled={!tpl.name.trim()} data-tplsave>Save template</button><button className="btn btn-ghost btn-sm" onClick={() => setTpl(null)}>Cancel</button></div>
                </div>
              )}
              {tplSaved && <div className="alert alert-success" style={{marginTop:'0.75rem'}}><span>✓ Saved template "{tplSaved}". Start a new POV from it under Active POVs › Templates.</span></div>}
            </div>
          )}

          {tab === 'runs' && (
            <div className="card" data-povruns>
              {!runsFlat.length && <div className="form-hint">Nothing applied yet. Dry runs and applies made while this POV is open are recorded here.</div>}
              {runsFlat.map(({ k, i, r }) => {
                const key = `${k}-${i}`, c = ledgerCounts(r.ledger);
                return (
                  <div key={key} style={{borderBottom:'1px solid var(--border)', padding:'8px 0'}} data-povrun={k}>
                    <div style={{display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap'}}>
                      <strong style={{fontSize:'13px'}}>{PRODUCT[k]}</strong>
                      <span className="form-hint" style={{margin:0}}>{new Date(r.at).toLocaleString()}</span>
                      <span className="form-hint" style={{margin:0}}>{k === 'zdx' ? `${(r.apps || []).length} apps` : countLine(c)}</span>
                      {r.snapshot && <span className="badge badge-category" title={r.snapshot}>restorable</span>}
                      {r.activated === true && <span className="badge badge-create">activated</span>}
                      {(r.ledger || r.apps) && <button className="btn btn-ghost btn-sm" style={{marginLeft:'auto'}} onClick={() => setOpenRun(openRun === key ? null : key)}>{openRun === key ? 'Hide' : 'Details'}</button>}
                    </div>
                    {openRun === key && (r.ledger ? <LedgerTable ledger={r.ledger} filterProduct /> : <div className="form-hint">{(r.apps || []).map(a => `${a.ok ? '✓' : '✗'} ${a.name}`).join(' · ')}</div>)}
                  </div>
                );
              })}
              {isActive && runsFlat.length > 0 && <div className="btn-group"><button className="btn btn-ghost btn-sm" onClick={() => onGo('restore')} data-povdrift>Check drift / restore a run</button></div>}
            </div>
          )}

          {tab === 'tests' && (
            <div className="card" data-povtests>
              <h3 style={{fontSize:'14px', margin:'0 0 0.5rem'}}>Customer success criteria</h3>
              <div className="form-hint" style={{marginTop:0}}>What the customer agreed the POV must prove. Link the tests that show each one.</div>
              {(p.criteria || []).map((c, i) => (
                <div key={c.id} className="toggle-item" style={{alignItems:'flex-start', gap:'8px'}} data-criterion={i}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600, fontSize:'13px'}}>{c.text}</div>
                    <div style={{display:'flex', gap:'6px', flexWrap:'wrap', marginTop:'4px'}}>
                      {data.tests.map(t => (
                        <label key={t.id} style={{fontSize:'11px', display:'flex', gap:'3px', alignItems:'center', cursor:'pointer', opacity: (c.testIds || []).includes(t.id) ? 1 : 0.55}}>
                          <input type="checkbox" checked={(c.testIds || []).includes(t.id)} onChange={() => put({ criteria: p.criteria.map((x, j) => j === i ? { ...x, testIds: (x.testIds || []).includes(t.id) ? x.testIds.filter(y => y !== t.id) : [...(x.testIds || []), t.id] } : x) })} />
                          {t.title}{t.result ? ` (${t.result.status})` : ''}
                        </label>
                      ))}
                    </div>
                  </div>
                  <select value={c.status} style={{width:'auto'}} onChange={e => put({ criteria: p.criteria.map((x, j) => j === i ? { ...x, status: e.target.value } : x) })} data-criterionstatus>
                    <option value="pending">Pending</option><option value="met">Met</option><option value="not-met">Not met</option>
                  </select>
                  <button className="btn btn-ghost btn-sm" onClick={() => put({ criteria: p.criteria.filter((_, j) => j !== i) })}>✕</button>
                </div>
              ))}
              <div style={{display:'flex', gap:'6px', marginTop:'6px'}}>
                <input type="text" value={crText} onChange={e => setCrText(e.target.value)} placeholder="e.g. Clinicians reach Epic without the VPN" data-criterioninput />
                <button className="btn btn-primary btn-sm" disabled={!crText.trim()} onClick={() => { put({ criteria: [...(p.criteria || []), { text: crText.trim(), status: 'pending', testIds: [] }] }); setCrText(''); }} data-criterionadd>Add</button>
              </div>
              <h3 style={{fontSize:'14px', margin:'1.25rem 0 0.5rem'}}>POV tests ({sum.tests.pass} passed of {sum.tests.total})</h3>
              {!data.tests.length && <div className="form-hint">Tests appear once something has been applied.</div>}
              <table className="diff-table"><tbody>
                {data.tests.map(t => <tr key={t.id}><td style={{width:'24px'}}>{t.result ? (t.result.status === 'pass' ? '✅' : t.result.status === 'fail' ? '❌' : '⏭') : '⬜'}</td><td>{t.title}</td><td className="form-hint">{t.result && t.result.note}</td></tr>)}
              </tbody></table>
              {isActive && <div className="btn-group"><button className="btn btn-ghost btn-sm" onClick={() => onGo('tests')}>Run tests →</button></div>}
            </div>
          )}

          {tab === 'timeline' && (
            <div className="card" data-povtimeline>
              <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))', gap:'12px'}}>
                <div className="form-group"><label className="form-label">Kickoff</label><input type="date" value={(p.timeline && p.timeline.kickoff) || ''} onChange={e => put({ timeline: { ...p.timeline, kickoff: e.target.value || null } })} data-povkickoff /></div>
                <div className="form-group"><label className="form-label">POV ends</label><input type="date" value={(p.timeline && p.timeline.end) || ''} onChange={e => put({ timeline: { ...p.timeline, end: e.target.value || null } })} data-povend /></div>
              </div>
              <div className="form-label">Check-ins</div>
              {((p.timeline && p.timeline.checkins) || []).map((c, i) => (
                <div key={i} style={{display:'flex', gap:'6px', marginBottom:'4px'}}>
                  <input type="date" value={c.date || ''} style={{width:'auto'}} onChange={e => put({ timeline: { ...p.timeline, checkins: p.timeline.checkins.map((x, j) => j === i ? { ...x, date: e.target.value } : x) } })} />
                  <input type="text" value={c.label} onChange={e => put({ timeline: { ...p.timeline, checkins: p.timeline.checkins.map((x, j) => j === i ? { ...x, label: e.target.value } : x) } })} />
                  <button className="btn btn-ghost btn-sm" onClick={() => put({ timeline: { ...p.timeline, checkins: p.timeline.checkins.filter((_, j) => j !== i) } })}>✕</button>
                </div>
              ))}
              <button className="btn btn-ghost btn-sm" onClick={() => put({ timeline: { ...p.timeline, checkins: [...((p.timeline && p.timeline.checkins) || []), { date: new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10), label: 'Check-in' }] } })} data-povaddcheckin>+ Add check-in</button>

              <h3 style={{fontSize:'14px', margin:'1.25rem 0 0.5rem'}}>Follow-ups</h3>
              {(p.followUps || []).map((f, i) => (
                <label key={f.id} className="toggle-item" style={{cursor:'pointer', padding:'6px 10px'}} data-followup={i}>
                  <span style={{textDecoration: f.done ? 'line-through' : 'none', opacity: f.done ? 0.6 : 1}}><input type="checkbox" checked={f.done} onChange={() => put({ followUps: p.followUps.map((x, j) => j === i ? { ...x, done: !x.done } : x) })} style={{marginRight:'8px'}} />{f.text} {f.source === 'wizard' && <span className="badge badge-category">wizard</span>}</span>
                </label>
              ))}
              <div style={{display:'flex', gap:'6px', marginTop:'6px'}}>
                <input type="text" value={fuText} onChange={e => setFuText(e.target.value)} placeholder="e.g. Get the real PACS host name from the imaging team" data-followupinput />
                <button className="btn btn-primary btn-sm" disabled={!fuText.trim()} onClick={() => { put({ followUps: [...(p.followUps || []), { text: fuText.trim(), done: false, source: 'me' }] }); setFuText(''); }} data-followupadd>Add</button>
              </div>

              <h3 style={{fontSize:'14px', margin:'1.25rem 0 0.5rem'}}>Notes</h3>
              <textarea rows={3} value={noteText} onChange={e => setNoteText(e.target.value)} placeholder="Where you left off, what the customer said, what to show next time…" data-noteinput />
              <div className="btn-group" style={{marginTop:'0.5rem'}}><button className="btn btn-primary btn-sm" disabled={!noteText.trim()} onClick={() => { put({ notes: [...(p.notes || []), { text: noteText.trim(), at: new Date().toISOString() }] }); setNoteText(''); }} data-noteadd>Add note</button></div>
              {(p.notes || []).slice().reverse().map((n, i) => (
                <div key={i} style={{borderTop:'1px solid var(--border)', padding:'8px 0'}} data-note={i}><div className="form-hint" style={{margin:0}}>{new Date(n.at).toLocaleString()}</div><div style={{fontSize:'13px', whiteSpace:'pre-wrap'}}>{n.text}</div></div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function PovTemplates({ auth, onStart, setError }) {
      const [list, setList] = useState(null);
      const [confirm, setConfirm] = useState(null);
      const load = () => api.call('GET', '/v2/pov-templates').then(r => setList(r.templates)).catch(e => setError(e.message));
      useEffect(() => { load(); }, []);
      const start = async (t) => { try { const r = await api.call('GET', `/v2/pov-templates/${t.id}`); onStart({ id: r.template.id, name: r.template.name, ...r.template.choices }); } catch (e) { setError(e.message); } };
      return (
        <div className="card" data-povtemplates>
          <div className="card-header"><h2>POV templates</h2><p>Reusable choices (products, preset, baseline, ZIA rule choices, Client Connector settings, ZPA settings and policies, ZDX apps). Save one from any POV's Overview with <em>Save as template</em>. A template never holds a customer, tenant, prefix, host names or secrets.</p></div>
          {!list && <span className="spinner"></span>}
          {list && !list.length && <div className="form-hint">No templates yet.</div>}
          {list && list.map(t => (
            <div key={t.id} className="toggle-item" style={{alignItems:'flex-start'}} data-template={t.id}>
              <div style={{flex:1}}><div style={{fontWeight:600}}>{t.name}</div><div className="form-hint">{t.description || ''} · saved {new Date(t.createdAt).toLocaleDateString()}</div></div>
              <div style={{display:'flex', gap:'6px', flexWrap:'wrap'}}>
                <button className="btn btn-primary btn-sm" disabled={!auth.connected} title={auth.connected ? '' : 'Sign in to the new customer\'s tenant first'} onClick={() => start(t)} data-templatestart>New POV from template</button>
                {confirm === t.id ? <><button className="btn btn-danger btn-sm" onClick={async () => { await api.call('DELETE', `/v2/pov-templates/${t.id}`).catch(() => {}); setConfirm(null); load(); }}>Delete</button><button className="btn btn-ghost btn-sm" onClick={() => setConfirm(null)}>Cancel</button></>
                  : <button className="btn btn-ghost btn-sm" onClick={() => setConfirm(t.id)}>🗑</button>}
              </div>
            </div>
          ))}
          {!auth.connected && <div className="form-hint">Sign in to the new customer's tenant to start a POV from a template.</div>}
        </div>
      );
    }

    // ========================
    // v2.5 — AI Guard: ZIA inspects AI apps and proxy-chains them to AI Guard
    // ========================
    // compliance baseline (intake) → AI Guard profile; tiers and the ZTH baseline use the general profile
    const AIG_PROFILE_FOR = (b) => ['HIPAA', 'HITRUST', 'PCI', 'GDPR', 'CJIS', 'FERPA', 'SOX', 'NIST_800_171', 'NIST_800_53', 'IRS_1075'].includes(b) ? b
      : ({ FEDRAMP_MOD: 'NIST_800_53', FEDRAMP_HIGH: 'NIST_800_53', GOVRAMP: 'NIST_800_53', FED_ZT: 'NIST_800_53', CMMC_L2: 'NIST_800_171' })[b] || 'GENERAL';
    function AiGuardStep({ prefix, setError, guided, onReport, baseline }) {
      const saved = (guided && guided.saved) || null;
      const [ctx, setCtx] = useState(null);
      const [apps, setApps] = useState(() => new Set((saved && saved.apps) || []));
      const [extra, setExtra] = useState(((saved && saved.extraDomains) || []).join(', '));
      const [cloudMs, setCloudMs] = useState(!!(saved && saved.includeCloudMicrosoft));
      const [cert, setCert] = useState(() => (saved && saved.cert) || { mode: '' });
      const [certFile, setCertFile] = useState('');
      const [host, setHost] = useState(() => (saved && saved.proxyHost) || '');
      const [ziaAllow, setZiaAllow] = useState(() => saved && saved.ziaAllow ? new Set(saved.ziaAllow) : null);   // null = follow the AI Guard apps
      const [compliance, setCompliance] = useState(() => (saved && saved.compliance) || { profile: AIG_PROFILE_FOR(baseline), mode: 'monitor' });
      // v2.7: in a POV the profile always follows the compliance profile chosen on Customer intake (only Monitor / Block is chosen here)
      useEffect(() => { if (baseline && compliance.profile !== AIG_PROFILE_FOR(baseline)) setCompliance(c => ({ ...c, profile: AIG_PROFILE_FOR(baseline) })); }, [baseline]);
      const [opts, setOpts] = useState(() => ({ blockQuic: saved ? saved.blockQuic !== false : true, sslInspect: saved ? saved.sslInspect !== false : true, promptCapture: saved ? saved.promptCapture !== false : true }));
      const [plan, setPlan] = useState(null);
      const [result, setResult] = useState(null);
      const [busy, setBusy] = useState(false);
      const [confirmed, setConfirmed] = useState(false);
      const load = () => api.call('GET', '/v2/aiguard/context').then(c => {
        setCtx(c);
        setApps(prev => prev.size ? prev : new Set(c.apps.filter(a => a.default).map(a => a.id)));
        const exProxy = (c.existingProxies || [])[0];
        if (!cert.mode && c.rootCertificates && c.rootCertificates.length) setCert({ mode: 'existing', id: (exProxy && exProxy.certId && c.rootCertificates.some(r => String(r.id) === String(exProxy.certId))) ? exProxy.certId : c.rootCertificates[0].id });
        setHost(h => h || (exProxy ? exProxy.address : c.proxy.address));
      }).catch(e => setCtx({ error: e.message }));
      useEffect(() => { load(); }, []);
      useEffect(() => { setPlan(null); setConfirmed(false); }, [JSON.stringify([[...apps], extra, cloudMs, cert, opts, host, ziaAllow ? [...ziaAllow] : null, compliance])]);
      const body = () => ({ prefix, apps: [...apps], extraDomains: splitItems(extra), includeCloudMicrosoft: cloudMs, cert, proxyHost: host, ziaAllow: [...(ziaAllow || apps)], compliance, ...opts });
      const readPem = async (file) => { if (!file) return; setCertFile(file.name); const t = await file.text(); setCert({ mode: 'upload', pem: t.trim() }); };
      const dry = async () => { setBusy(true); setError(null); try { setPlan(await api.call('POST', '/v2/aiguard/plan', body())); } catch (e) { setError(e.message); } setBusy(false); };
      const apply = async () => { setBusy(true); setError(null); try { setResult(await api.call('POST', '/v2/aiguard/apply', { ...body(), planId: plan.planId })); } catch (e) { setError(e.message); } setBusy(false); };
      const toggleApp = (id) => setApps(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
      const pemOk = cert.mode === 'existing' ? !!cert.id : cert.mode === 'upload' ? /^-----BEGIN CERTIFICATE-----[\s\S]+-----END CERTIFICATE-----$/.test(String(cert.pem || '').trim()) : false;
      const ready = pemOk && apps.size > 0;
      const N = ctx && ctx.names ? ctx.names : null;
      const gwFound = ctx && N && (ctx.gateways || []).find(g => g.name === N.gateway);
      if (!ctx) return <div className="card"><span className="spinner"></span> Checking AI Guard and ZIA…</div>;
      const opt = (k, label, hint, disabled) => (
        <div className="toggle-item" style={{opacity: disabled ? 0.55 : 1}} data-agopt={k}>
          <div><label onClick={() => !disabled && setOpts({ ...opts, [k]: !opts[k] })} style={{cursor: disabled ? 'not-allowed' : 'pointer'}}>{label}</label><div className="form-hint">{hint}</div></div>
          <div className={`toggle-switch ${opts[k] && !disabled ? 'active' : ''}`} onClick={() => !disabled && setOpts({ ...opts, [k]: !opts[k] })}><div className="toggle-knob"></div></div>
        </div>
      );
      return (
        <div className="card" data-step="aiguard">
          <div className="card-header"><h2>AI Guard</h2><p>ZIA decrypts the AI apps you pick and sends their traffic to AI Guard by proxy chaining, so prompts and responses are checked by your AI Guard detection policies. Follows Zscaler's "Integrating ZIA with AI Guard" guide.</p></div>
          {ctx.error && <div className="alert alert-danger"><span>{ctx.error}</span></div>}
          <table className="diff-table" style={{marginBottom:'1rem'}} data-agchecks><tbody>
            {(ctx.checks || []).map((c, i) => <tr key={i} data-agcheck={c.name}><td style={{width:'24px'}}>{STATUS_ICON[c.status]}</td><td style={{width:'230px'}}>{c.name}</td><td style={{fontSize:'12px'}}>{c.detail}{c.fix && <div className="form-hint" style={{margin:0}}>→ {c.fix}</div>}</td></tr>)}
          </tbody></table>

          <h3 style={{fontSize:'14px', margin:'0 0 0.5rem'}}>AI apps to protect</h3>
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(240px, 1fr))', gap:'8px'}} data-agapps>
            {ctx.apps.map(a => (
              <label key={a.id} className={`tier-card ${apps.has(a.id) ? 'selected' : ''}`} style={{cursor:'pointer', padding:'0.7rem', textAlign:'left', margin:0}} data-agapp={a.id}>
                <div style={{display:'flex', gap:'8px', alignItems:'center'}}><input type="checkbox" checked={apps.has(a.id)} onChange={() => toggleApp(a.id)} /><strong style={{fontSize:'13px'}}>{a.name}</strong></div>
                <div className="form-hint" style={{marginTop:'4px', wordBreak:'break-word'}}>{a.domains.join(', ')}</div>
              </label>
            ))}
          </div>
          <div className="toggle-item" style={{marginTop:'8px'}} data-agcloudms>
            <div><label onClick={() => setCloudMs(!cloudMs)} style={{cursor:'pointer'}}>Also send all of <code>{ctx.cloudMicrosoft}</code> (Copilot inside Microsoft 365 apps)</label>
              <div className="form-hint">Zscaler lists it for Copilot, but most of Microsoft 365 uses it too. Off by default; test Outlook and Teams if you turn it on.</div></div>
            <div className={`toggle-switch ${cloudMs ? 'active' : ''}`} onClick={() => setCloudMs(!cloudMs)}><div className="toggle-knob"></div></div>
          </div>
          <div className="form-group" style={{marginTop:'8px'}}><label className="form-label">More AI domains (optional)</label>
            <input type="text" value={extra} onChange={e => setExtra(e.target.value)} placeholder=".chat.example-ai.com, .api.internal-llm.example.org" data-agextra /></div>

          <h3 style={{fontSize:'14px', margin:'1rem 0 0.5rem'}}>AI Guard CA certificate</h3>
          <div className="form-hint" style={{marginTop:0}}>Download it in the AI Guard portal: Tenant Settings › Integrations › Download Zscaler AI Guard Proxy Chain Certificate. ZIA uses it to trust the AI Guard proxy.</div>
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(260px, 1fr))', gap:'8px', marginTop:'6px'}}>
            <label className={`tier-card ${cert.mode === 'upload' ? 'selected' : ''}`} style={{cursor:'pointer', padding:'0.8rem', textAlign:'left', margin:0}} data-agcertupload>
              <div style={{display:'flex', gap:'8px', alignItems:'center'}}><input type="radio" checked={cert.mode === 'upload'} onChange={() => setCert({ mode: 'upload', pem: cert.pem || '' })} /><strong style={{fontSize:'13px'}}>Upload the .pem</strong></div>
              <input type="file" accept=".pem,.crt,.cer,application/x-pem-file" style={{marginTop:'8px', fontSize:'12px'}} onChange={e => { readPem(e.target.files[0]); e.target.value = ''; }} data-agpem />
              {cert.mode === 'upload' && <div className="form-hint">{pemOk ? `✓ ${certFile || 'Certificate'} loaded; uploaded to ZIA as ${N ? N.cert : 'the AI Guard CA'} (type Proxy Chaining).` : 'Pick the AI Guard CA file (PEM, -----BEGIN CERTIFICATE-----).'}</div>}
            </label>
            <label className={`tier-card ${cert.mode === 'existing' ? 'selected' : ''}`} style={{cursor:'pointer', padding:'0.8rem', textAlign:'left', margin:0, opacity: (ctx.rootCertificates || []).length ? 1 : 0.6}} data-agcertexisting>
              <div style={{display:'flex', gap:'8px', alignItems:'center'}}><input type="radio" disabled={!(ctx.rootCertificates || []).length} checked={cert.mode === 'existing'} onChange={() => setCert({ mode: 'existing', id: (ctx.rootCertificates[0] || {}).id })} /><strong style={{fontSize:'13px'}}>Already in ZIA</strong></div>
              {(ctx.rootCertificates || []).length ? (
                <select style={{marginTop:'8px'}} value={cert.mode === 'existing' ? String(cert.id) : ''} onChange={e => setCert({ mode: 'existing', id: Number(e.target.value) || e.target.value })}>
                  {ctx.rootCertificates.map(c => <option key={c.id} value={String(c.id)}>{c.name}</option>)}
                </select>
              ) : <div className="form-hint">No Proxy Chaining root certificate in ZIA yet.</div>}
            </label>
          </div>
          {(() => { const ex = (ctx.existingProxies || []).find(p => cert.mode === 'existing' && String(p.certId) === String(cert.id));
            return ex ? <div className="alert alert-info" style={{marginTop:'8px'}} data-agreuse>Reusing the existing AI Guard proxy <strong>{ex.name}</strong> ({ex.address}:{ex.port}){ex.gateway ? <span> and gateway <strong>{ex.gateway}</strong></span> : null}. No new proxy is created.</div>
              : <div className="form-group" style={{marginTop:'8px'}}><label className="form-label">AI Guard forwarding host</label>
                  <input type="text" value={host} onChange={e => setHost(e.target.value.trim())} data-aghost />
                  <div className="form-hint">From the AI Guard guide: {ctx.proxy.address}, port {ctx.proxy.port}. Some tenants use forward.zseclipse.net; use what your AI Guard portal shows.</div></div>; })()}

          <h3 style={{fontSize:'14px', margin:'1rem 0 0.5rem'}}>What ZIA does</h3>
          {opt('sslInspect', 'Inspect the AI apps (above every SSL bypass)', 'Adds an SSL Inspect rule for the AI app domains at the top, above every Do Not Decrypt rule including "Office 365 One Click" and Zscaler\'s exemptions. Without it Microsoft 365 Copilot is never decrypted, so it can\'t reach AI Guard.')}
          {opt('blockQuic', 'Block QUIC (Block/ICMP)', 'AI apps fall back to TLS over TCP, which ZIA can inspect and chain. Required by the guide.')}
          {opt('promptCapture', 'Capture AI prompts in ZIA logs', ctx.genAiLicensed === false ? 'Needs the Gen AI Security licence (not on this tenant).' : 'Turns on Gen AI prompt capture for the chosen apps (Web Insights shows prompts up to 2 KB).', ctx.genAiLicensed === false)}

          <h3 style={{fontSize:'14px', margin:'1rem 0 0.5rem'}}>Allow in ZIA</h3>

          {(() => { const profs = ctx.profiles || []; const P = profs.find(p => p.id === compliance.profile);
            const NAMES = { US_SSN: 'SSN', DATE_OF_BIRTH: 'Date of birth', MEDICAL_LICENSE: 'Medical license no.', US_DEA_NUMBER: 'DEA number', STREET_ADDRESS: 'Street address',

                name <code>{N ? N.gateway : 'PREFIX-AIG-Gateway'}</code>, Fail Close on, Primary Proxy <code>{N ? N.proxy : 'PREFIX-AIG-Proxy'}</code>, Secondary None. Then run the dry run again and the forwarding rule is created.
