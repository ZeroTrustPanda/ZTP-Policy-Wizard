                        <div className="catalog-fw-header" onClick={() => toggle(openFws, setOpenFws, fKey)}>
                          <span className="arrow" style={{fontSize:'10px',transition:'transform 0.2s',transform:isFwOpen?'rotate(90deg)':'none'}}>▶</span>
                          <span>{fwKey === 'NONE' ? '🌐' : '📋'}</span>
                          <span>{fwLabel}</span>
                          <span className="catalog-count">{totalFwRules} rules</span>
                        </div>
                        {isFwOpen && (
                          <div>
                            <div className="catalog-summary" style={{margin:'0.5rem 0 0.25rem 1rem'}}>
                              {Object.entries(rc).map(([pt, c]) => (
                                <span key={pt} className="catalog-summary-chip">{policyLabels[pt]?.split(' ').slice(1).join(' ') || pt}: {c}</span>
                              ))}
                            </div>
                            {renderPolicies(fwData.policies, tierKey, fwKey)}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ========================
    // Step: Mobile Admin Portal (ZCC)
    // ========================
    const ZCC_STEPS = [
      { id: 'platform', label: 'Platform' },
      { id: 'forwarding', label: 'Forwarding Profile' },
      { id: 'template', label: 'App Profile' },
      { id: 'customize', label: 'Customize' },
      { id: 'review', label: 'Review' },
      { id: 'dryrun', label: 'Dry Run' },
      { id: 'apply', label: 'Apply' }
    ];

    const ZCC_PLATFORMS = [
      { id: 'windows', label: 'Windows', icon: '🪟', nameTag: 'Windows', blurb: 'Client Connector on Windows 10 / 11 devices', fwdDefault: 'new' },
      { id: 'macos', label: 'macOS', icon: '🍎', nameTag: 'macOS', blurb: 'Client Connector on Macs (Apple Silicon and Intel)', fwdDefault: 'new' }
    ];

    // Settings toggles grouped by category (shared by the forwarding and app profile steps)
    function ZccSettingToggles({ settings, enabled, onToggle }) {
      const cats = [...new Set(settings.map(s => s.category))];
      return cats.map(cat => (
        <div key={cat} style={{marginBottom:'1rem'}}>
          <h4 style={{fontSize:'13px', color:'var(--accent-blue)', margin:'0.75rem 0 0.5rem'}}>{cat}</h4>
          <div className="toggle-group">
            {settings.filter(s => s.category === cat).map(s => (
              <div className="toggle-item" key={s.key} data-setting={s.key}>
                <div>
                  <label onClick={() => onToggle(s.key)}>{s.label} {s.impact === 'caution' && <span className="badge badge-risk" style={{marginLeft:'6px'}}>REVIEW</span>}{s.manual && <span className="badge badge-risk" style={{marginLeft:'6px'}}>MANUAL</span>}</label>
                  <div className="form-hint">{s.description}</div>
                  <div className="form-hint">Sets: <strong>{s.value}</strong> · Portal default: {s.portalDefault}</div>
                </div>
                <div className={`toggle-switch ${enabled.has(s.key) ? 'active' : ''}`} onClick={() => onToggle(s.key)}><div className="toggle-knob"></div></div>
              </div>
            ))}
          </div>
        </div>
      ));
    }

    function ZccSettingsTable({ settings }) {
      return (
        <div style={{overflowX:'auto'}}>
          <table className="diff-table">
            <thead><tr><th>Category</th><th>Setting</th><th>New value</th><th>Portal default</th><th>What it does</th></tr></thead>
            <tbody>
              {settings.map(s => (
                <tr key={s.key}>
                  <td><span className="badge badge-category">{s.category}</span></td>
                  <td style={{fontWeight:600}}>{s.label}{s.impact === 'caution' && <span className="badge badge-risk" style={{marginLeft:'6px'}}>REVIEW</span>}{s.manual && <span className="badge badge-risk" style={{marginLeft:'6px'}}>MANUAL</span>}</td>
                  <td style={{color:'var(--accent-green)'}}>{s.value}</td>
                  <td style={{color:'var(--text-muted)'}}>{s.portalDefault}</td>
                  <td style={{fontSize:'12px', color:'var(--text-secondary)'}}>{s.description}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function ZccVerifyTable({ rows }) {
      if (!rows || !rows.length) return null;
      return (
        <table className="diff-table">
          <thead><tr><th></th><th>Setting</th><th>Expected</th><th>Read back</th></tr></thead>
          <tbody>
            {rows.map(v => (
              <tr key={v.key}><td>{v.manual ? '✋' : v.ok ? '✅' : '❌'}</td><td>{v.label}</td><td>{v.expected}</td><td>{v.manual ? 'Set in portal' : v.ok ? 'Matches' : (v.error || 'Different')}</td></tr>
            ))}
          </tbody>
        </table>
      );
    }

    // ========================
    // Mobile Admin: Create App Profile wizard
    // Windows v1.6.0, macOS v1.6.1, forwarding profile first v1.7.0
    // Platform -> Forwarding Profile -> App Profile -> Customize -> Review -> Dry Run -> Apply
    // ========================
    function ZccCreateWizard({ setError, config, forwardingProfiles, onExit, onCreated }) {
      const prefix = (config && config.prefix) || 'ZTP';
      const [step, setStep] = useState('platform');
      const [platform, setPlatform] = useState('windows');
      const [catalog, setCatalog] = useState(null);
      const [templateId, setTemplateId] = useState('BEST_PRACTICE');
      const [enabled, setEnabled] = useState(null); // Set of app profile setting keys
      const [form, setForm] = useState({
        name: `${prefix}-Windows-BestPractice`,
        description: 'Created by ZTP Policy Wizard from the Best Practice template',
        forwardingProfileId: 0,
        active: false
      });
      // Forwarding profile (created first, then linked to the app profile)
      const [fwdCatalog, setFwdCatalog] = useState(null);
      const [fwdMode, setFwdMode] = useState('new'); // 'new' | 'existing'
      const [fwdTemplateId, setFwdTemplateId] = useState('BEST_PRACTICE');
      const [fwdEnabled, setFwdEnabled] = useState(null);
      const [fwdName, setFwdName] = useState(`${prefix}-FWD-Windows-BestPractice`);
      const [plan, setPlan] = useState(null);
      const [busy, setBusy] = useState(false);
      const [confirmed, setConfirmed] = useState(false);
      const [result, setResult] = useState(null);

      const plat = ZCC_PLATFORMS.find(p => p.id === platform);

      // Forwarding profile an app template recommends (none of the POV templates do), else Default
      const recommendedFwdId = (t) => {
        const rec = t && t.recommendedForwardingProfile;
        if (!rec) return 0;
        const list = forwardingProfiles || [];
        const hit = list.find(f => String(f.id) === String(rec.id)) || list.find(f => (f.name || '').toLowerCase() === String(rec.name).toLowerCase());
        return hit ? Number(hit.id) : 0;
      };

      useEffect(() => {
        api.call('GET', '/zcc/fwd-templates').then(c => {
          setFwdCatalog(c);
          const t = c.find(x => x.id === 'BEST_PRACTICE') || c[0];
          setFwdEnabled(new Set(t.settings.map(s => s.key)));
        }).catch(e => setError(e.message));
      }, []);

      useEffect(() => {
        let cancelled = false;
        setCatalog(null); setEnabled(null); setPlan(null);
        api.call('GET', `/zcc/templates/${platform}`).then(c => {
          if (cancelled) return;
          setCatalog(c);
          const t = c.find(x => x.id === templateId) || c.find(x => x.id === 'BEST_PRACTICE') || c[0];
          setTemplateId(t.id);
          setEnabled(new Set(t.settings.map(s => s.key)));
          setForm(f => ({ ...f, forwardingProfileId: recommendedFwdId(t) }));
        }).catch(e => setError(e.message));
        return () => { cancelled = true; };
      }, [platform]);

      // Forwarding profiles may arrive after the catalog: apply the recommendation once they do
      useEffect(() => {
        if (!catalog) return;
        const t = catalog.find(x => x.id === templateId);
        const rec = recommendedFwdId(t);
        if (rec && !Number(form.forwardingProfileId)) setForm(f => ({ ...f, forwardingProfileId: rec }));
      }, [forwardingProfiles, catalog]);

      const pickPlatform = (id) => {
        if (id === platform) return;
        const from = ZCC_PLATFORMS.find(p => p.id === platform), to = ZCC_PLATFORMS.find(p => p.id === id);
        setForm(f => ({ ...f, name: f.name.replace(`-${from.nameTag}-`, `-${to.nameTag}-`) }));
        setFwdName(n => n.replace(`-${from.nameTag}-`, `-${to.nameTag}-`));
        setFwdMode(to.fwdDefault);
        setPlatform(id);
      };

      const template = catalog ? catalog.find(t => t.id === templateId) : null;
      const chosen = template ? template.settings.filter(s => enabled && enabled.has(s.key)) : [];
      const fwdTemplate = fwdCatalog ? fwdCatalog.find(t => t.id === fwdTemplateId) : null;
      const fwdChosen = fwdTemplate ? fwdTemplate.settings.filter(s => fwdEnabled && fwdEnabled.has(s.key)) : [];
      const reached = ZCC_STEPS.findIndex(s => s.id === step);
      const isNewFwd = fwdMode === 'new';
      const existingFwdName = (forwardingProfiles || []).find(f => String(f.id) === String(form.forwardingProfileId))?.name || 'Default';
      const fwdLabel = isNewFwd ? fwdName : existingFwdName;
      const fwdNameTaken = isNewFwd && (forwardingProfiles || []).some(f => String(f.name || '').toLowerCase() === fwdName.trim().toLowerCase());

      const payload = () => ({
        ...form, templateId, enabledSettings: [...(enabled || [])],
        forwardingProfileId: isNewFwd ? 0 : form.forwardingProfileId,
        newForwardingProfile: isNewFwd ? { name: fwdName.trim(), templateId: fwdTemplateId, enabledSettings: [...(fwdEnabled || [])] } : null
      });

      const pickTemplate = (id) => {
        setTemplateId(id); setPlan(null);
        const t = catalog.find(x => x.id === id);
        setEnabled(new Set(t.settings.map(s => s.key)));
        setForm(f => ({ ...f, forwardingProfileId: recommendedFwdId(t) || f.forwardingProfileId }));
        if (id === 'PORTAL_DEFAULT') setForm(f => ({ ...f, name: f.name.replace(/BestPractice$/, 'Blank'), description: 'Created by ZTP Policy Wizard (portal defaults)' }));
        else setForm(f => ({ ...f, name: f.name.replace(/Blank$/, 'BestPractice'), description: 'Created by ZTP Policy Wizard from the Best Practice template' }));
      };
      const pickFwdTemplate = (id) => {
        setFwdTemplateId(id); setPlan(null);
        const t = fwdCatalog.find(x => x.id === id);
        setFwdEnabled(new Set(t.settings.map(s => s.key)));
        setFwdName(n => id === 'PORTAL_DEFAULT' ? n.replace(/BestPractice$/, 'Blank') : n.replace(/Blank$/, 'BestPractice'));
      };
      const toggle = (key) => { setPlan(null); setEnabled(prev => { const n = new Set(prev); n.has(key) ? n.delete(key) : n.add(key); return n; }); };
      const toggleFwd = (key) => { setPlan(null); setFwdEnabled(prev => { const n = new Set(prev); n.has(key) ? n.delete(key) : n.add(key); return n; }); };
      const setField = (k, v) => { setPlan(null); setForm(f => ({ ...f, [k]: v })); };

      const runDryRun = async () => {
        setBusy(true); setError(null);
        try { const p = await api.call('POST', `/zcc/app-profiles/${platform}/dryrun`, payload()); setPlan(p); setStep('dryrun'); }
        catch (e) { setError('Dry run failed: ' + e.message); }
        setBusy(false);
      };
      const runApply = async () => {
        setBusy(true); setError(null);
        try { const r = await api.call('POST', `/zcc/app-profiles/${platform}`, payload()); setResult(r); if (onCreated) onCreated(r); }
        catch (e) { setError('Create failed: ' + e.message); }
        setBusy(false);
      };
      const restart = () => { setStep('platform'); setPlan(null); setResult(null); setConfirmed(false); };

      const statusIcon = { pass: '✅', warn: '⚠️', fail: '❌' };

      const Stepper = () => (
        <div style={{display:'flex', gap:'6px', marginBottom:'1.25rem', flexWrap:'wrap'}}>
          {ZCC_STEPS.map((s, i) => {
            const done = i < reached, cur = s.id === step;
            const canGo = done && !result;
            return (
              <div key={s.id} onClick={() => canGo && setStep(s.id)}
                style={{padding:'6px 12px', borderRadius:'999px', fontSize:'12px', cursor: canGo ? 'pointer' : 'default',
                  background: cur ? 'var(--accent-blue)' : done ? 'var(--accent-green-dim)' : 'var(--bg-input)',
                  color: cur ? '#fff' : done ? 'var(--accent-green)' : 'var(--text-muted)', border:'1px solid var(--border)'}}>
                {done ? '✓' : `${i + 1}.`} {s.label}
              </div>
            );
          })}
        </div>
      );

      if (!catalog || !enabled || !fwdCatalog || !fwdEnabled) {
        return (<div className="card"><div className="card-header"><h2>➕ Create Zscaler Client Connector App Profile and Forwarding Profile</h2><p>Loading templates...</p></div><div style={{textAlign:'center',padding:'2rem'}}><span className="spinner"></span></div></div>);
      }

      const checksTable = (rows) => (
        <table className="diff-table">
          <tbody>
            {rows.map((c, i) => (
              <tr key={i}><td style={{width:'32px'}}>{statusIcon[c.status]}</td><td style={{fontWeight:600, width:'300px'}}>{c.name}</td><td style={{fontSize:'12px', color:'var(--text-secondary)'}}>{c.detail}</td></tr>
            ))}
          </tbody>
        </table>
      );

      return (
        <div className="card">
          <div className="card-header">
            <h2>➕ Create Zscaler Client Connector App Profile and Forwarding Profile</h2>
            <p>Builds the common Mobile Admin settings for Zscaler Client Connector, following the Zscaler POV best practice guide. Set up the forwarding profile first, then the {plat.label} app profile that uses it. Review exactly what each sets, dry run against your tenant, then create both.</p>
          </div>
          <Stepper />

          {step === 'platform' && (
            <div>
              <div className="explainer"><strong>Why this matters:</strong> App profiles are per platform, so pick the devices this profile is for. Both platforms follow the Zscaler POV best practice guide, and both start with a new forwarding profile by default.</div>
              <div className="tier-grid">
                {ZCC_PLATFORMS.map(p => (
                  <div key={p.id} className={`tier-card ${platform === p.id ? 'selected' : ''}`} onClick={() => pickPlatform(p.id)} data-platform={p.id}>
                    <div className="tier-icon">{p.icon}</div>
                    <div className="tier-name">{p.label}</div>
                    <div className="tier-desc">{p.blurb}</div>
                  </div>
                ))}
              </div>
              <div className="btn-group">
                <button className="btn btn-ghost" onClick={onExit}>← Mobile Admin</button>
                <button className="btn btn-primary" onClick={() => setStep('forwarding')}>Forwarding Profile →</button>
              </div>
            </div>
          )}

          {step === 'forwarding' && (
            <div>
              <div className="explainer"><strong>What a forwarding profile is:</strong> it tells Client Connector how to send traffic on each type of network the device can be on (a trusted network, a VPN, or off-network): whether internet traffic is tunneled to ZIA, whether private-app traffic goes through ZPA, and how. Every app profile points at one, so it comes first. During Apply the forwarding profile is created first and the app profile is linked to it automatically. The Zscaler POV Best Practice template follows the POV best practice guide.</div>
              <div className="tier-grid" style={{marginBottom:'1rem'}}>
                <div className={`tier-card ${isNewFwd ? 'selected' : ''}`} onClick={() => { setFwdMode('new'); setPlan(null); }} data-fwdmode="new">
                  <div className="tier-icon">🆕</div>
                  <div className="tier-name">Create new forwarding profile</div>
                  <div className="tier-desc">Following the Zscaler POV best practice guide, or portal defaults.</div>
                </div>
                <div className={`tier-card ${!isNewFwd ? 'selected' : ''}`} onClick={() => { setFwdMode('existing'); setPlan(null); }} data-fwdmode="existing">
                  <div className="tier-icon">🔗</div>
                  <div className="tier-name">Use existing forwarding profile</div>
                  <div className="tier-desc">Link the app profile to a forwarding profile already in the tenant.</div>
                </div>
              </div>

              {isNewFwd ? (
                <div>
                  <h3 style={{fontSize:'14px', margin:'0 0 0.5rem'}}>Forwarding profile template</h3>
                  <div className="tier-grid">
                    {fwdCatalog.map(t => (
                      <div key={t.id} className={`tier-card ${fwdTemplateId === t.id ? 'selected' : ''}`} onClick={() => pickFwdTemplate(t.id)} data-fwdtemplate={t.id}>
                        <div className="tier-icon">{t.icon}</div>
                        <div className="tier-name">{t.name}</div>
                        <div className="tier-desc">{t.description}</div>
                        <div style={{fontSize:'11px', color:'var(--text-muted)', marginTop:'8px'}}>{t.settings.length} settings · Source: {t.source}</div>
                      </div>
                    ))}
                  </div>
                  <div className="form-group">
                    <label className="form-label">Forwarding Profile Name</label>
                    <input type="text" value={fwdName} maxLength={128} onChange={e => { setPlan(null); setFwdName(e.target.value); }} data-field="fwdName" />
                    {fwdNameTaken && <div className="form-hint" style={{color:'var(--accent-red)'}}>A forwarding profile with this name already exists.</div>}
                  </div>
                  {fwdTemplate.settings.length === 0 ? (
                    <div className="alert alert-info"><span>ℹ Portal Default has no extra settings: Tunnel with Local Proxy for ZIA, ZPA tunnel except on VPN-Trusted networks.</span></div>
                  ) : (
                    <div>
                      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', margin:'0.5rem 0'}}>
                        <h3 style={{fontSize:'14px'}}>Forwarding settings ({fwdChosen.length}/{fwdTemplate.settings.length} selected)</h3>
                        <div style={{display:'flex', gap:'6px'}}>
                          <button className="btn btn-ghost btn-sm" onClick={() => { setPlan(null); setFwdEnabled(new Set(fwdTemplate.settings.map(s => s.key))); }}>Select all</button>
                          <button className="btn btn-ghost btn-sm" onClick={() => { setPlan(null); setFwdEnabled(new Set()); }}>Clear</button>
                        </div>
                      </div>
                      <ZccSettingToggles settings={fwdTemplate.settings} enabled={fwdEnabled} onToggle={toggleFwd} />
                      <div className="form-hint">Network types: On-Trusted, VPN-Trusted, Off-Trusted and Split VPN-Trusted. Settings marked "all networks" apply to each of them.</div>
                    </div>
                  )}
                </div>
              ) : (
                <div className="form-group">
                  <label className="form-label">Forwarding Profile</label>
                  <select value={String(form.forwardingProfileId)} onChange={e => setField('forwardingProfileId', Number(e.target.value))} data-field="fwdExisting">
                    {(forwardingProfiles || []).some(fp => String(fp.id) === '0') ? null : <option value="0">Default</option>}
                    {(forwardingProfiles || []).map(fp => <option key={fp.id} value={String(fp.id)}>{fp.name || '(unnamed)'} (ID {fp.id})</option>)}
                  </select>
                  {template && template.recommendedForwardingProfile && <div className="form-hint">The {template.name} template recommends <strong>{template.recommendedForwardingProfile.name}</strong>.</div>}
                </div>
              )}
              <div className="btn-group">
                <button className="btn btn-ghost" onClick={() => setStep('platform')}>← Back</button>
                <button className="btn btn-primary" onClick={() => setStep('template')} disabled={isNewFwd && (!fwdName.trim() || fwdNameTaken)}>App Profile →</button>
              </div>
            </div>
          )}

          {step === 'template' && (
            <div>
              <div className="explainer"><strong>What an app profile is:</strong> it holds the Client Connector settings for the {plat.label} devices it applies to: certificates and drivers, which apps bypass the tunnel, notifications, troubleshooting options, and who it applies to. The Zscaler POV Best Practice template follows the POV best practice guide; Portal Default is a blank profile. It will use forwarding profile <strong>{fwdLabel}</strong>{isNewFwd ? ' (new)' : ''}.</div>
              <div className="tier-grid">
                {catalog.map(t => (
                  <div key={t.id} className={`tier-card ${templateId === t.id ? 'selected' : ''}`} onClick={() => pickTemplate(t.id)}>
                    <div className="tier-icon">{t.icon}</div>
                    <div className="tier-name">{t.name}</div>
                    <div className="tier-desc">{t.description}</div>
                    <div style={{fontSize:'11px', color:'var(--text-muted)', marginTop:'8px'}}>{t.settings.length} settings · Source: {t.source}</div>
                  </div>
                ))}
              </div>
              {template && template.settings.length > 0 && (
                <div className="card" style={{background:'var(--bg-input)'}}>
                  <h3 style={{fontSize:'14px', marginBottom:'0.5rem'}}>What {template.name} will do</h3>
                  <ul style={{margin:0, paddingLeft:'1.2rem', fontSize:'13px', lineHeight:1.7}}>
                    {template.settings.map(s => <li key={s.key}><strong>{s.label}</strong>: {s.value}{s.manual && <span className="badge badge-risk" style={{marginLeft:'6px'}}>MANUAL</span>}</li>)}
                  </ul>
                  {template.settings.some(s => s.manual) && <div className="form-hint" style={{marginTop:'0.5rem'}}>MANUAL = the public API does not accept this setting. The wizard reminds you to set it in the Mobile Admin portal after the profile is created.</div>}
                </div>
              )}
              <div className="btn-group">
                <button className="btn btn-ghost" onClick={() => setStep('forwarding')}>← Back</button>
                <button className="btn btn-primary" onClick={() => setStep('customize')}>Customize →</button>
              </div>
            </div>
          )}

          {step === 'customize' && (
            <div>
              <div className="form-group">
                <label className="form-label">App Profile Name</label>
                <input type="text" value={form.name} maxLength={128} onChange={e => setField('name', e.target.value)} />
              </div>
              <div className="form-group">
                <label className="form-label">Description</label>
                <input type="text" value={form.description} onChange={e => setField('description', e.target.value)} />
              </div>
              <div className="form-hint" style={{marginBottom:'1rem'}}>Forwarding profile: <strong>{fwdLabel}</strong>{isNewFwd ? ' (created first, then linked)' : ''}. Change it on the Forwarding Profile step.</div>
              <div className="toggle-item" style={{marginBottom:'1rem'}}>
                <div>
                  <label onClick={() => setField('active', !form.active)}>Enable profile after creation</label>
                  <div className="form-hint">Off by default. {enabled.has('allUsers') ? 'This template applies to ALL USERS, so enabling it affects real devices.' : 'With no users/groups assigned it will not match any device.'}</div>
                </div>
                <div className={`toggle-switch ${form.active ? 'active' : ''}`} onClick={() => setField('active', !form.active)}><div className="toggle-knob"></div></div>
              </div>

              {template.settings.length === 0 ? (
                <div className="alert alert-info"><span>ℹ The Portal Default template has no extra settings. The profile is created exactly as the portal would create it.</span></div>
              ) : (
                <div>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', margin:'0.5rem 0'}}>
                    <h3 style={{fontSize:'14px'}}>App profile settings ({chosen.length}/{template.settings.length} selected)</h3>
                    <div style={{display:'flex', gap:'6px'}}>
                      <button className="btn btn-ghost btn-sm" onClick={() => { setPlan(null); setEnabled(new Set(template.settings.map(s => s.key))); }}>Select all</button>
                      <button className="btn btn-ghost btn-sm" onClick={() => { setPlan(null); setEnabled(new Set()); }}>Clear</button>
                    </div>
                  </div>
                  <ZccSettingToggles settings={template.settings} enabled={enabled} onToggle={toggle} />
                </div>
              )}
              <div className="btn-group">
                <button className="btn btn-ghost" onClick={() => setStep('template')}>← Back</button>
                <button className="btn btn-primary" onClick={() => setStep('review')} disabled={!form.name.trim()}>Review →</button>
              </div>
            </div>
          )}

          {step === 'review' && (
            <div>
              <h3 style={{fontSize:'14px', margin:'0 0 0.5rem'}}>1. Forwarding profile {isNewFwd ? <span className="badge badge-create">NEW — CREATED FIRST</span> : <span className="badge badge-category">EXISTING</span>}</h3>
              <table className="diff-table" style={{marginBottom:'0.75rem'}}>
                <tbody>
                  <tr><td style={{width:'200px', color:'var(--text-muted)'}}>Forwarding profile</td><td><strong>{fwdLabel}</strong></td></tr>
                  {isNewFwd && <tr><td style={{color:'var(--text-muted)'}}>Template</td><td>{fwdTemplate.icon} {fwdTemplate.name}</td></tr>}
                </tbody>
              </table>
              {isNewFwd && (fwdChosen.length > 0 ? <ZccSettingsTable settings={fwdChosen} /> :
                <div className="alert alert-info"><span>ℹ No forwarding settings selected. The forwarding profile will match a portal-default profile.</span></div>)}
              {isNewFwd && fwdTemplate.settings.length > fwdChosen.length && (
                <div className="form-hint" style={{marginTop:'0.5rem'}}>Not applied (left at portal default): {fwdTemplate.settings.filter(s => !fwdEnabled.has(s.key)).map(s => s.label).join(', ')}</div>
              )}

              <h3 style={{fontSize:'14px', margin:'1.5rem 0 0.5rem'}}>2. App profile <span className="badge badge-create">NEW</span></h3>
              <table className="diff-table" style={{marginBottom:'1rem'}}>
                <tbody>
                  <tr><td style={{width:'200px', color:'var(--text-muted)'}}>Profile</td><td><strong>{form.name}</strong></td></tr>
                  <tr><td style={{color:'var(--text-muted)'}}>Description</td><td>{form.description || '—'}</td></tr>
                  <tr><td style={{color:'var(--text-muted)'}}>Platform</td><td>{plat.icon} {plat.label}</td></tr>
                  <tr><td style={{color:'var(--text-muted)'}}>Template</td><td>{template.icon} {template.name}</td></tr>
                  <tr><td style={{color:'var(--text-muted)'}}>Forwarding profile</td><td>{fwdLabel}{isNewFwd ? ' (new, from step 1)' : ''}</td></tr>
                  <tr><td style={{color:'var(--text-muted)'}}>State after creation</td><td>{form.active ? <span className="badge badge-risk">ENABLED</span> : <span className="badge badge-create">DISABLED</span>}</td></tr>
                  <tr><td style={{color:'var(--text-muted)'}}>Assigned to</td><td>{enabled.has('allUsers') ? <span className="badge badge-risk">ALL USERS</span> : 'No users or groups'}</td></tr>
                </tbody>
              </table>
              {chosen.length > 0 ? <ZccSettingsTable settings={chosen} /> : (
                <div className="alert alert-info"><span>ℹ No template settings selected. The profile will match a portal-default profile.</span></div>
              )}
              {template.settings.length > chosen.length && (
                <div className="form-hint" style={{marginTop:'0.5rem'}}>Not applied (left at portal default): {template.settings.filter(s => !enabled.has(s.key)).map(s => s.label).join(', ')}</div>
              )}
              <div className="btn-group">
                <button className="btn btn-ghost" onClick={() => setStep('customize')}>← Back</button>
                <button className="btn btn-primary" onClick={runDryRun} disabled={busy}>{busy ? <><span className="spinner"></span> Running...</> : 'Run Dry Run →'}</button>
              </div>
            </div>
          )}

          {step === 'dryrun' && plan && (
            <div>
              <div className={`alert ${plan.ok ? 'alert-success' : 'alert-danger'}`}>
                <span>{plan.ok ? '✓ Dry run passed. Nothing has been changed in your tenant yet.' : '✗ Dry run found problems. Fix them before creating the profiles.'}</span>
              </div>
              {plan.warnings.map((w, i) => <div key={i} className="alert alert-warning"><span>⚠ {w}</span></div>)}
              {plan.forwardingProfile?.isNew && (
                <>
                  <h3 style={{fontSize:'14px', margin:'1rem 0 0.5rem'}}>1. Forwarding profile "{plan.forwardingProfile.name}" (created first)</h3>
                  {checksTable(plan.checks.filter(c => c.group === 'forwarding'))}
                </>
              )}
              <h3 style={{fontSize:'14px', margin:'1rem 0 0.5rem'}}>{plan.forwardingProfile?.isNew ? '2. ' : ''}App profile "{form.name}"</h3>
              {checksTable(plan.checks.filter(c => c.group !== 'forwarding'))}
              <h3 style={{fontSize:'14px', margin:'1.25rem 0 0.5rem'}}>{plat.label} app profile order after create</h3>
              <table className="diff-table">
                <thead><tr><th>Rule</th><th>Profile</th><th>Status</th><th></th></tr></thead>
                <tbody>
                  {plan.placement.map((p, i) => (
                    <tr key={i} style={p.isNew ? {background:'var(--accent-blue-dim)'} : {}}>
                      <td>{p.ruleOrder}</td><td style={{fontWeight: p.isNew ? 700 : 400}}>{p.name}</td>
                      <td>{p.active ? 'Enabled' : 'Disabled'}</td>
                      <td>{p.isNew && <span className="badge badge-create">NEW</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="form-hint" style={{marginTop:'0.75rem'}}>
                {plan.forwardingProfile?.isNew && <>Request 1: POST /zcc/papi/public/v1/webForwardingProfile/edit (id "-1" = create){plan.fwdPayloadPreview ? ` · ${(plan.fwdPayloadPreview.bytes / 1024).toFixed(1)} KB` : ''}<br/></>}
                Request {plan.forwardingProfile?.isNew ? '2' : ''}: PUT /zcc/papi/public/v1/web/policy/edit · {plan.settings.length} template settings · {plan.payloadPreview ? `${plan.payloadPreview.fieldCount} top-level fields, ${(plan.payloadPreview.bytes / 1024).toFixed(1)} KB` : ''}
              </div>
              <div className="btn-group">
                <button className="btn btn-ghost" onClick={() => setStep('review')}>← Back</button>
                <button className="btn btn-ghost" onClick={runDryRun} disabled={busy}>↻ Re-run</button>
                <button className="btn btn-success" onClick={() => { setConfirmed(false); setStep('apply'); }} disabled={!plan.ok}>Proceed to Apply →</button>
              </div>
            </div>
          )}

          {step === 'apply' && (
            <div>
              {!result ? (
                <div>
                  <div className="alert alert-warning">
                    <span>⚠ <strong>Caution:</strong> {isNewFwd ? <>This first creates forwarding profile <strong>{fwdName}</strong>, then </> : 'This '}creates app profile <strong>{form.name}</strong> in your ZCC tenant at rule order {plan?.ruleOrder}, {form.active ? <strong>ENABLED</strong> : 'disabled'}{enabled.has('allUsers') ? ', assigned to all users' : ''}, using forwarding profile {fwdLabel}. If the app profile fails, the new forwarding profile is deleted again. You can delete both afterwards from Mobile Admin.</span>
                  </div>
                  <div className="toggle-item" style={{marginBottom:'1rem'}}>
                    <label onClick={() => setConfirmed(!confirmed)} style={{cursor:'pointer'}}>I understand this will create {isNewFwd ? 'a forwarding profile and ' : ''}an app profile in my ZCC tenant and have reviewed the dry run.</label>
                    <div className={`toggle-switch ${confirmed ? 'active' : ''}`} onClick={() => setConfirmed(!confirmed)}><div className="toggle-knob"></div></div>
                  </div>
                  <div className="btn-group">
                    <button className="btn btn-ghost" onClick={() => setStep('dryrun')} disabled={busy}>← Back</button>
                    <button className="btn btn-success" onClick={runApply} disabled={!confirmed || busy}>{busy ? <><span className="spinner"></span> Creating...</> : (isNewFwd ? '🚀 Create Forwarding + App Profile' : '🚀 Create App Profile')}</button>
                  </div>
                </div>
              ) : (
                <div>
                  {result.forwardingProfile?.created && (
                    <>
                      <div className={`alert ${result.forwardingProfile.verified ? 'alert-success' : 'alert-warning'}`}>
                        <span>{result.forwardingProfile.verified ? '✓' : '⚠'} 1. Created forwarding profile <strong>{result.forwardingProfile.name}</strong> (ID {result.forwardingProfile.id}). {result.forwardingProfile.verified ? 'Every setting was read back from ZCC and matches.' : 'Some settings did not read back as expected.'}</span>
                      </div>
                      <ZccVerifyTable rows={result.forwardingProfile.verification} />
                    </>
                  )}
                  <div className={`alert ${result.verified ? 'alert-success' : 'alert-warning'}`} style={{marginTop: result.forwardingProfile?.created ? '1rem' : 0}}>
                    <span>{result.verified ? '✓' : '⚠'} {result.forwardingProfile?.created ? '2. ' : ''}Created app profile <strong>{result.name}</strong> (ID {result.id}, rule order {result.ruleOrder}, {result.active ? 'enabled' : 'disabled'}), linked to forwarding profile {result.forwardingProfile?.name}. {result.verified ? 'Every setting was read back from ZCC and matches.' : 'Some settings did not read back as expected. See below.'}</span>
                  </div>
                  <ZccVerifyTable rows={result.verification} />
                  {result.manualSteps?.length > 0 && (
                    <div className="alert alert-warning" style={{marginTop:'1rem'}}>
                      <span>✋ <strong>Finish in the Mobile Admin portal:</strong> open App Profiles → {plat.label} → <strong>{result.name}</strong> and set {result.manualSteps.map(m => `${m.label} = ${m.value}`).join('; ')}. The public API does not accept {result.manualSteps.length === 1 ? 'this setting' : 'these settings'}.</span>
                    </div>
                  )}
                  <div className="form-hint" style={{marginTop:'0.75rem'}}>Recorded in the audit log (ZCC_DRY_RUN and ZCC_APPLY entries).</div>
                  <div className="btn-group">
                    <button className="btn btn-ghost" onClick={onExit}>← Mobile Admin</button>
                    <button className="btn btn-primary" onClick={restart}>Create another</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ========================
    // Digital Experience (ZDX) module (v1.8.0)
    // Template -> Applications -> Review -> Dry Run -> Apply, plus a Manage screen
    // ========================
    const ZDX_STEPS = [
      { id: 'template', label: 'Template' },
      { id: 'apps', label: 'Applications & Probes' },
      { id: 'review', label: 'Review' },
      { id: 'dryrun', label: 'Dry Run' },
      { id: 'apply', label: 'Apply' }
    ];
    const zdxMin = (s) => `${Math.round(Number(s) / 60)} min`;
    const ZDX_PROTOCOL_LABEL = { ADAPTIVE: 'Adaptive (recommended)', ICMP: 'ICMP', TCP: 'TCP', UDP: 'UDP' };

    function ZdxStateBadge({ p }) {
      if (!p.configured) return <span className="badge badge-category">NOT SET UP</span>;
      return p.active ? <span className="badge badge-create">ON</span> : <span className="badge badge-risk">OFF</span>;
    }

    function ZdxWizard({ setError, onExit }) {
      const [step, setStep] = useState('template');
      const [catalog, setCatalog] = useState(null);
      const [templateId, setTemplateId] = useState('POV_BEST_PRACTICE');
      const [predef, setPredef] = useState({});   // provider -> { on, prefix, web, cloudpath }
      const [custom, setCustom] = useState([]);   // [{ name, url, cloudpath, frequency, protocol }]
      const [plan, setPlan] = useState(null);
      const [busy, setBusy] = useState(false);
      const [confirmed, setConfirmed] = useState(false);
      const [result, setResult] = useState(null);

      const applyTemplate = (cat, id) => {
        const t = cat.templates.find(x => x.id === id);
        const p = {};
        cat.predefined.forEach(a => { p[a.provider] = { on: false, prefix: a.prefix || '', web: true, cloudpath: true }; });
        t.predefined.forEach(x => { p[x.provider] = { ...(p[x.provider] || {}), on: true, web: x.web !== false, cloudpath: !!x.cloudpath }; });
        setPredef(p);
        setCustom(t.custom.map(c => ({ name: c.name, url: c.url, cloudpath: c.cloudpath !== false, frequency: c.frequency || 300, protocol: c.protocol || 'ADAPTIVE' })));
        setPlan(null);
      };

      useEffect(() => {
        api.call('GET', '/zdx/catalog').then(c => { setCatalog(c); applyTemplate(c, 'POV_BEST_PRACTICE'); })
          .catch(e => setError('Could not load ZDX: ' + e.message));
      }, []);

      const reached = ZDX_STEPS.findIndex(s => s.id === step);
      const chosenPredef = catalog ? catalog.predefined.filter(a => predef[a.provider]?.on) : [];
      const payload = () => ({
        templateId,
        predefined: chosenPredef.map(a => ({ provider: a.provider, prefix: predef[a.provider].prefix, web: predef[a.provider].web, cloudpath: predef[a.provider].cloudpath })),
        custom: custom.map(c => ({ ...c, name: c.name.trim(), url: c.url.trim() }))
      });
      const setP = (prov, patch) => { setPlan(null); setPredef(prev => ({ ...prev, [prov]: { ...prev[prov], ...patch } })); };
      const setC = (i, patch) => { setPlan(null); setCustom(prev => prev.map((c, j) => j === i ? { ...c, ...patch } : c)); };
      const addC = () => { setPlan(null); setCustom(prev => [...prev, { name: '', url: 'https://', cloudpath: true, frequency: 300, protocol: 'ADAPTIVE' }]); };
      const delC = (i) => { setPlan(null); setCustom(prev => prev.filter((_, j) => j !== i)); };

      const runDryRun = async () => {
        setBusy(true); setError(null);
        try { setPlan(await api.call('POST', '/zdx/dryrun', payload())); setStep('dryrun'); }
        catch (e) { setError('Dry run failed: ' + e.message); }
        setBusy(false);
      };
      const runApply = async () => {
        setBusy(true); setError(null);
        try { setResult(await api.call('POST', '/zdx/apply', payload())); }
        catch (e) { setError('Apply failed: ' + e.message); }
        setBusy(false);
      };
      const restart = () => { setStep('template'); setPlan(null); setResult(null); setConfirmed(false); api.call('GET', '/zdx/catalog').then(c => { setCatalog(c); applyTemplate(c, templateId); }).catch(() => {}); };
      const statusIcon = { pass: '✅', warn: '⚠️', fail: '❌' };

      const Stepper = () => (
        <div style={{display:'flex', gap:'6px', marginBottom:'1.25rem', flexWrap:'wrap'}}>
          {ZDX_STEPS.map((s, i) => {
            const done = i < reached, cur = s.id === step, canGo = done && !result;
            return (
              <div key={s.id} onClick={() => canGo && setStep(s.id)}
                style={{padding:'6px 12px', borderRadius:'999px', fontSize:'12px', cursor: canGo ? 'pointer' : 'default',
                  background: cur ? 'var(--accent-blue)' : done ? 'var(--accent-green-dim)' : 'var(--bg-input)',
                  color: cur ? '#fff' : done ? 'var(--accent-green)' : 'var(--text-muted)', border:'1px solid var(--border)'}}>
                {done ? '✓' : `${i + 1}.`} {s.label}
              </div>
            );
          })}
        </div>
      );

      const header = (
        <div className="card-header">
          <h2>📈 Set Up Zscaler Digital Experience Probes</h2>
          <p>Turns on the ZDX probes that show how users experience their key apps, following the Zscaler POV best practice guide. Review exactly what will change, dry run against your tenant, then apply.</p>
        </div>
      );
      if (!catalog) return (<div className="card">{header}<div style={{textAlign:'center',padding:'2rem'}}><span className="spinner"></span></div></div>);

      const probeSummary = (web, path) => [web && 'Web', path && 'CloudPath'].filter(Boolean).join(' + ') || 'No probes';

      return (
        <div className="card">
          {header}
          <Stepper />

          {step === 'template' && (
            <div>
              <div className="explainer"><strong>What ZDX probes are:</strong> Client Connector runs small synthetic tests from each user's device. A <strong>Web probe</strong> loads the app's page and measures availability and page fetch time. A <strong>CloudPath probe</strong> traces the network path hop by hop (device, Wi-Fi, ISP, Zscaler, app) so you can see where slowness comes from. Probes belong to an application: a <strong>predefined app</strong> is one Zscaler maintains probes for (Microsoft 365, Zoom, Okta…); a <strong>custom app</strong> is any URL you add.</div>
              <div className="tier-grid">
                {catalog.templates.map(t => (
                  <div key={t.id} className={`tier-card ${templateId === t.id ? 'selected' : ''}`} data-zdxtemplate={t.id}
                    onClick={() => { setTemplateId(t.id); applyTemplate(catalog, t.id); }}>
                    <div className="tier-icon">{t.icon}</div>
                    <div className="tier-name">{t.name}</div>
                    <div className="tier-desc">{t.description}</div>
                    <div style={{fontSize:'11px', color:'var(--text-muted)', marginTop:'8px'}}>{t.predefined.length + t.custom.length} apps · Source: {t.source}</div>
                  </div>
                ))}
              </div>
              <div className="btn-group">
                <button className="btn btn-ghost" onClick={onExit}>← Digital Experience</button>
                <button className="btn btn-primary" onClick={() => setStep('apps')}>Applications & Probes →</button>
              </div>
            </div>
          )}

          {step === 'apps' && (
            <div>
              <h3 style={{fontSize:'14px', margin:'0 0 0.25rem'}}>Zscaler predefined apps</h3>
              <div className="form-hint" style={{marginBottom:'0.75rem'}}>Zscaler maintains the Web and CloudPath probes for these. Apps marked NOT SET UP are created in the tenant first; some need the customer's tenant prefix (for example <em>contoso</em> for contoso.sharepoint.com).</div>
              <div className="toggle-group">
                {catalog.predefined.map(a => {
                  const st = predef[a.provider] || {};
                  return (
                    <div className="toggle-item" key={a.provider} data-predef={a.provider} style={{alignItems:'flex-start'}}>
                      <div style={{flex:1}}>
                        <label onClick={() => setP(a.provider, { on: !st.on })}>{a.label} <ZdxStateBadge p={a} /></label>
                        <div className="form-hint">{a.description}</div>
                        {st.on && (
                          <div style={{display:'flex', gap:'1rem', alignItems:'center', flexWrap:'wrap', marginTop:'0.5rem'}}>
                            {a.needsPrefix && !a.configured && (
                              <span style={{display:'flex', alignItems:'center', gap:'6px', fontSize:'12px'}}>
                                <input type="text" value={st.prefix || ''} placeholder="prefix" style={{width:'140px'}} data-field="prefix"
                                  onChange={e => setP(a.provider, { prefix: e.target.value.trim() })} />
                                <span style={{color:'var(--text-muted)'}}>{String(a.host).replace('<prefix>', '')}</span>
                              </span>
                            )}
                            {a.configured && a.configuredHost && <span className="form-hint">Probes {a.configuredHost}</span>}
                            <label style={{fontSize:'12px', display:'flex', gap:'4px', alignItems:'center', cursor:'pointer'}}>
                              <input type="checkbox" checked={st.web !== false} onChange={e => setP(a.provider, { web: e.target.checked, cloudpath: e.target.checked ? st.cloudpath : false })} /> Web probe
                            </label>
                            <label style={{fontSize:'12px', display:'flex', gap:'4px', alignItems:'center', cursor: st.web === false ? 'not-allowed' : 'pointer', opacity: st.web === false ? 0.5 : 1}}>
                              <input type="checkbox" checked={!!st.cloudpath} disabled={st.web === false} onChange={e => setP(a.provider, { cloudpath: e.target.checked })} /> CloudPath probe
                            </label>
                          </div>
                        )}
                      </div>
                      <div className={`toggle-switch ${st.on ? 'active' : ''}`} onClick={() => setP(a.provider, { on: !st.on })}><div className="toggle-knob"></div></div>
                    </div>
                  );
                })}
              </div>

              <h3 style={{fontSize:'14px', margin:'1.5rem 0 0.25rem'}}>Custom apps</h3>
              <div className="form-hint" style={{marginBottom:'0.75rem'}}>Any URL users depend on, such as an EHR, PACS viewer or intranet. Each gets a Web probe (ZDX needs one to turn the app on) and, by default, a CloudPath probe to the same host. Probes run for all users.</div>
              {custom.length === 0 && <div className="alert alert-info"><span>ℹ No custom apps. Add one below or continue with predefined apps only.</span></div>}
              {custom.map((c, i) => (
                <div key={i} className="card" style={{background:'var(--bg-input)', padding:'0.9rem', marginBottom:'0.6rem'}} data-custom={i}>
                  <div style={{display:'grid', gridTemplateColumns:'1fr 2fr auto', gap:'0.6rem', alignItems:'end'}}>
                    <div className="form-group" style={{margin:0}}>
                      <label className="form-label">App name</label>
                      <input type="text" value={c.name} maxLength={64} onChange={e => setC(i, { name: e.target.value })} data-field="name" />
                    </div>
                    <div className="form-group" style={{margin:0}}>
                      <label className="form-label">URL to probe</label>
                      <input type="text" value={c.url} onChange={e => setC(i, { url: e.target.value })} data-field="url" />
                    </div>
                    <button className="btn btn-ghost btn-sm" onClick={() => delC(i)}>🗑 Remove</button>
                  </div>
                  <div style={{display:'flex', gap:'1rem', alignItems:'center', flexWrap:'wrap', marginTop:'0.6rem', fontSize:'12px'}}>
                    <span>Every <select value={c.frequency} onChange={e => setC(i, { frequency: Number(e.target.value) })} style={{width:'auto', display:'inline-block', padding:'2px 6px'}}>
                      {catalog.frequencies.map(f => <option key={f} value={f}>{zdxMin(f)}</option>)}
                    </select></span>
                    <label style={{display:'flex', gap:'4px', alignItems:'center', cursor:'pointer'}}>
                      <input type="checkbox" checked={c.cloudpath} onChange={e => setC(i, { cloudpath: e.target.checked })} data-field="cloudpath" /> CloudPath probe
                    </label>
                    {c.cloudpath && (
                      <span>Protocol <select value={c.protocol} onChange={e => setC(i, { protocol: e.target.value })} style={{width:'auto', display:'inline-block', padding:'2px 6px'}}>
                        {catalog.protocols.map(p => <option key={p} value={p}>{ZDX_PROTOCOL_LABEL[p] || p}</option>)}
                      </select></span>
                    )}
                  </div>
                </div>
              ))}
              <button className="btn btn-ghost btn-sm" onClick={addC} style={{marginTop:'0.25rem'}}>➕ Add custom app</button>

              <div className="btn-group">
                <button className="btn btn-ghost" onClick={() => setStep('template')}>← Back</button>
                <button className="btn btn-primary" onClick={() => setStep('review')} disabled={!chosenPredef.length && !custom.length}>Review →</button>
              </div>
            </div>
          )}

          {step === 'review' && (
            <div>
              <table className="diff-table">
                <thead><tr><th>App</th><th>Type</th><th>Target</th><th>Probes</th><th>Tenant today</th></tr></thead>
                <tbody>
                  {chosenPredef.map(a => {
                    const st = predef[a.provider];
                    const host = a.configured ? (a.configuredHost || a.host) : String(a.host).replace('<prefix>', st.prefix || '<prefix>');
                    return (<tr key={a.provider}><td style={{fontWeight:600}}>{a.label}</td><td><span className="badge badge-category">PREDEFINED</span></td><td>{host}</td><td>{probeSummary(st.web !== false, st.cloudpath && st.web !== false)} (Zscaler-managed)</td><td><ZdxStateBadge p={a} /></td></tr>);
                  })}
                  {custom.map((c, i) => (
                    <tr key={'c' + i}><td style={{fontWeight:600}}>{c.name || '(unnamed)'}</td><td><span className="badge badge-create">CUSTOM</span></td><td>{c.url}</td><td>{probeSummary(true, c.cloudpath)} · every {zdxMin(c.frequency)}{c.cloudpath ? ` · ${c.protocol}` : ''}</td><td>New</td></tr>
                  ))}
                </tbody>
              </table>
              <div className="form-hint" style={{marginTop:'0.5rem'}}>All probes run for all users. Web probes accept HTTP 200–299 and 304, follow up to 5 redirects and time out after 60 seconds.</div>
              <div className="btn-group">
                <button className="btn btn-ghost" onClick={() => setStep('apps')}>← Back</button>
                <button className="btn btn-primary" onClick={runDryRun} disabled={busy}>{busy ? <><span className="spinner"></span> Running...</> : 'Run Dry Run →'}</button>
              </div>
            </div>
          )}

          {step === 'dryrun' && plan && (
            <div>
              <div className={`alert ${plan.ok ? 'alert-success' : 'alert-danger'}`}>
                <span>{plan.ok ? `✓ Dry run passed: ${plan.changes} change${plan.changes === 1 ? '' : 's'} planned. Nothing has been changed in your tenant yet.` : '✗ Dry run found problems. Fix them before applying.'}</span>
              </div>
              {plan.warnings.map((w, i) => <div key={i} className="alert alert-warning"><span>⚠ {w}</span></div>)}
              <h3 style={{fontSize:'14px', margin:'1rem 0 0.5rem'}}>Pre-flight checks</h3>
              <table className="diff-table"><tbody>
                {plan.checks.map((c, i) => (<tr key={i}><td style={{width:'32px'}}>{statusIcon[c.status]}</td><td style={{fontWeight:600, width:'280px'}}>{c.name}</td><td style={{fontSize:'12px', color:'var(--text-secondary)'}}>{c.detail}</td></tr>))}
              </tbody></table>
              <h3 style={{fontSize:'14px', margin:'1.25rem 0 0.5rem'}}>What Apply will do, in order</h3>
              {plan.apps.filter(a => a.steps.length).map((a, i) => (
                <div key={i} style={{marginBottom:'0.6rem'}}>
                  <div style={{fontWeight:600, fontSize:'13px'}}>{a.name} <span className="badge badge-category">{a.kind.toUpperCase()}</span></div>
                  <ol style={{margin:'0.25rem 0 0', paddingLeft:'1.4rem', fontSize:'12px', color:'var(--text-secondary)'}}>
                    {a.steps.map((s, j) => <li key={j}>{s.label}{s.detail ? ` — ${s.detail}` : ''}</li>)}
                  </ol>
                </div>
              ))}
              <div className="btn-group">
                <button className="btn btn-ghost" onClick={() => setStep('review')}>← Back</button>
                <button className="btn btn-ghost" onClick={runDryRun} disabled={busy}>↻ Re-run</button>
                <button className="btn btn-success" onClick={() => { setConfirmed(false); setStep('apply'); }} disabled={!plan.ok || !plan.changes}>Proceed to Apply →</button>
              </div>
            </div>
          )}

          {step === 'apply' && (
            <div>
              {!result ? (
                <div>
                  <div className="alert alert-warning"><span>⚠ <strong>Caution:</strong> This makes {plan?.changes} change{plan?.changes === 1 ? '' : 's'} in your ZDX tenant. The probes start running for all users right away. If a custom app fails part way, what was created for it is removed again. You can turn probes off or delete custom apps afterwards from Digital Experience → Manage.</span></div>
                  <div className="toggle-item" style={{marginBottom:'1rem'}}>
                    <label onClick={() => setConfirmed(!confirmed)} style={{cursor:'pointer'}}>I understand this changes my ZDX tenant and have reviewed the dry run.</label>
                    <div className={`toggle-switch ${confirmed ? 'active' : ''}`} onClick={() => setConfirmed(!confirmed)}><div className="toggle-knob"></div></div>
                  </div>
                  <div className="btn-group">
                    <button className="btn btn-ghost" onClick={() => setStep('dryrun')} disabled={busy}>← Back</button>
                    <button className="btn btn-success" onClick={runApply} disabled={!confirmed || busy}>{busy ? <><span className="spinner"></span> Applying...</> : '🚀 Apply ZDX Probes'}</button>
                  </div>
                </div>
              ) : (
                <div>
                  <div className={`alert ${result.verified ? 'alert-success' : 'alert-warning'}`}>
                    <span>{result.verified ? '✓ Done. Every app and probe was read back from ZDX and is on.' : '⚠ Finished with problems. See below.'}</span>
                  </div>
                  {result.results.map((r, i) => (
                    <div key={i} style={{marginBottom:'0.75rem'}}>
                      <div style={{fontWeight:600, fontSize:'13px'}}>{r.ok ? '✅' : '❌'} {r.name} <span className="badge badge-category">{r.kind.toUpperCase()}</span></div>
                      <ul style={{margin:'0.25rem 0 0', paddingLeft:'1.4rem', fontSize:'12px', color:'var(--text-secondary)'}}>
                        {r.steps.map((s, j) => <li key={j}>{s.ok ? (s.skipped ? '–' : '✓') : '✗'} {s.label}{s.error ? `: ${s.error}` : ''}</li>)}
                      </ul>
                      {r.rolledBack && <div className="form-hint" style={{color:'var(--accent-amber)'}}>Rolled back: {r.rolledBack} removed.</div>}
                    </div>
                  ))}
                  {result.verification?.length > 0 && (
                    <table className="diff-table" style={{marginTop:'0.75rem'}}>
                      <thead><tr><th></th><th>App</th><th>Check</th><th>Read back</th></tr></thead>
                      <tbody>{result.verification.map((v, i) => (<tr key={i}><td>{v.ok ? '✅' : '❌'}</td><td>{v.app}</td><td>{v.check}</td><td style={{fontSize:'12px'}}>{v.detail}</td></tr>))}</tbody>
                    </table>
                  )}
                  <div className="form-hint" style={{marginTop:'0.75rem'}}>Probe data appears in the ZDX portal within a few probe intervals. Recorded in the audit log (ZDX_DRY_RUN and ZDX_APPLY entries).</div>
                  <div className="btn-group">
                    <button className="btn btn-ghost" onClick={onExit}>← Digital Experience</button>
                    <button className="btn btn-primary" onClick={restart}>Start again</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function ZdxManage({ setError, onExit }) {
      const [data, setData] = useState(null);
      const [busy, setBusy] = useState(null);
      const [confirm, setConfirm] = useState(null); // { kind:'app'|'probe', key, id, name }
      const load = async () => { setError(null); try { setData(await api.call('GET', '/zdx/overview')); } catch (e) { setError('Could not load ZDX apps: ' + e.message); } };
      useEffect(() => { load(); }, []);
      const act = async (label, fn) => { setBusy(label); setError(null); try { await fn(); setConfirm(null); await load(); } catch (e) { setError(e.message); } setBusy(null); };
      const isCustom = (a) => a.type !== 'PREDEFINED';

      return (
        <div className="card">
          <div className="card-header">
            <h2>🛠️ Manage ZDX Apps & Probes</h2>
            <p>Every app and probe configured in this ZDX tenant. Turn them on or off, or delete custom apps and probes. Zscaler predefined apps and their probes can only be turned off.</p>
          </div>
          {!data ? <div style={{textAlign:'center',padding:'2rem'}}><span className="spinner"></span></div> : (
            <div>
              {data.apps.map(a => (
                <div key={a.id} className="card" style={{background:'var(--bg-input)', padding:'0.9rem', marginBottom:'0.6rem'}} data-zdxapp={a.name}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:'12px'}}>
                    <div>
                      <div style={{fontWeight:600, fontSize:'13px'}}>{a.name} <span className={`badge ${a.type === 'PREDEFINED' ? 'badge-category' : 'badge-create'}`}>{a.type}</span> {a.active ? <span className="badge badge-create">ON</span> : <span className="badge badge-risk">OFF</span>}</div>
                      <div style={{fontSize:'11px', color:'var(--text-muted)'}}>ID {a.id}{a.host ? ` · ${a.host}` : ''} · {a.monitors.length} probe{a.monitors.length === 1 ? '' : 's'}</div>
                    </div>
                    <div style={{display:'flex', gap:'6px', alignItems:'center', flexShrink:0}}>
                      <button className="btn btn-ghost btn-sm" disabled={!!busy} onClick={() => act('app', () => api.call('POST', `/zdx/apps/${encodeURIComponent(a.key)}/${a.active ? 'deactivate' : 'activate'}`))}>{a.active ? 'Turn off' : 'Turn on'}</button>
                      {isCustom(a) && (confirm && confirm.kind === 'app' && confirm.id === a.id ? (
                        <>
                          <span style={{fontSize:'11px', color:'var(--accent-amber)'}}>Delete "{a.name}" and its probes?</span>
                          <button className="btn btn-sm" style={{background:'var(--accent-red)', color:'#fff'}} disabled={!!busy} onClick={() => act('del', () => api.call('DELETE', `/zdx/apps/${a.id}?confirmName=${encodeURIComponent(a.name)}`))}>Yes, delete</button>
                          <button className="btn btn-ghost btn-sm" onClick={() => setConfirm(null)}>Cancel</button>
                        </>
                      ) : <button className="btn btn-ghost btn-sm" disabled={!!busy} onClick={() => setConfirm({ kind: 'app', id: a.id })}>🗑 Delete</button>)}
                    </div>
                  </div>
                  {a.monitors.length > 0 && (
                    <table className="diff-table" style={{marginTop:'0.6rem'}}>
                      <tbody>
                        {a.monitors.map(m => (
                          <tr key={m.id}>
                            <td style={{width:'80px'}}><span className="badge badge-category">{m.type === 'WEB' ? 'WEB' : 'CLOUDPATH'}</span></td>
                            <td style={{fontWeight:500}}>{m.name}</td>
                            <td style={{fontSize:'12px', color:'var(--text-secondary)'}}>{m.target}{m.frequency ? ` · every ${zdxMin(m.frequency)}` : ''}</td>
                            <td style={{width:'60px'}}>{m.active ? <span className="badge badge-create">ON</span> : <span className="badge badge-risk">OFF</span>}</td>
                            <td style={{width:'240px', textAlign:'right'}}>
                              <button className="btn btn-ghost btn-sm" disabled={!!busy} onClick={() => act('probe', () => api.call('POST', `/zdx/apps/${encodeURIComponent(a.key)}/monitors/${m.id}/${m.active ? 'deactivate' : 'activate'}`))}>{m.active ? 'Turn off' : 'Turn on'}</button>
                              {isCustom(a) && (confirm && confirm.kind === 'probe' && confirm.id === m.id ? (
                                <>
                                  <button className="btn btn-sm" style={{background:'var(--accent-red)', color:'#fff', marginLeft:'4px'}} disabled={!!busy} onClick={() => act('delp', () => api.call('DELETE', `/zdx/apps/${a.id}/monitors/${m.id}?confirmName=${encodeURIComponent(m.name)}`))}>Yes, delete</button>
                                  <button className="btn btn-ghost btn-sm" onClick={() => setConfirm(null)}>Cancel</button>
                                </>
                              ) : <button className="btn btn-ghost btn-sm" style={{marginLeft:'4px'}} disabled={!!busy} onClick={() => setConfirm({ kind: 'probe', id: m.id })}>🗑</button>)}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              ))}
              <div className="form-hint">A CloudPath probe follows its app's Web probe: turn off or delete the CloudPath probe before its Web probe.</div>
            </div>
          )}
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={onExit}>← Digital Experience</button>
            <button className="btn btn-ghost" onClick={load} disabled={!!busy}>🔄 Refresh</button>
          </div>
        </div>
      );
    }

    function ZdxStep({ setError }) {
      const [mode, setMode] = useState('home');
      if (mode === 'create') return <ZdxWizard setError={setError} onExit={() => setMode('home')} />;
      if (mode === 'manage') return <ZdxManage setError={setError} onExit={() => setMode('home')} />;
      return (
        <div className="card">
          <div className="card-header">
            <h2>📈 Digital Experience (ZDX)</h2>
            <p>Zscaler Digital Experience probes via OneAPI: see how users experience their key apps, from the device to the app.</p>
          </div>
          <div className="tier-grid">
            <div className="tier-card" onClick={() => setMode('create')} style={{cursor:'pointer'}}>
              <div className="tier-icon">➕</div>
              <div className="tier-name">Set up probes</div>
              <div className="tier-desc">Turn on the probes from the Zscaler POV best practice guide (Microsoft Login and zscaler.com), add predefined SaaS apps or your own URLs: review, dry run, apply.</div>
            </div>
            <div className="tier-card" onClick={() => setMode('manage')} style={{cursor:'pointer'}}>
              <div className="tier-icon">🛠️</div>
              <div className="tier-name">Manage apps & probes</div>
              <div className="tier-desc">See every ZDX app and probe in the tenant; turn them on or off, or delete custom ones.</div>
            </div>
          </div>
        </div>
      );
    }

    function MobileAdminStep({ setError, loading, setLoading, config }) {
      const [mode, setMode] = useState('home'); // home | create | edit
      const [wizStep, setWizStep] = useState('select'); // select, configure, review, apply
      const [profiles, setProfiles] = useState(null);
      const [selectedFwdId, setSelectedFwdId] = useState(null);
      const [selectedAppId, setSelectedAppId] = useState(null);
      const [applyResult, setApplyResult] = useState(null);

      // v1.6.0: delete Windows app profiles
      const [deleteConfirm, setDeleteConfirm] = useState(null); // { id, name, platform }
      const [macProfiles, setMacProfiles] = useState(null); // v1.6.1: macOS app profiles (delete only)
      const [zccBusy, setZccBusy] = useState(false);

      // Best-practice setting toggles
      const [fwdSettings, setFwdSettings] = useState({
        ztunnel2: true,
        transparentRedirect: true,
        dropIpv6: true,
        allTrafficT2: true
      });
      const [appSettings, setAppSettings] = useState({
        // Tunnel bypass lists
        packetTunnelExcludeList: '',
        packetTunnelExcludeListForIPv6: '',
        packetTunnelIncludeList: '',
        packetTunnelIncludeListForIPv6: '',
        // VPN / source port
        vpnGateways: '',
        sourcePortBasedBypasses: '',
        // IPv6 / DNS settings (toggles)
        disableParallelIpv4AndIPv6: true,
        useDefaultAdapterForDNS: false,
        updateDnsSearchOrder: false,
        disableDNSRouteExclusion: false,
        enforceSplitDNS: false,
        bypassDNSTrafficUsingUDPProxy: false,
        truncateLargeUDPDNSResponse: false,
        prioritizeDnsExclusions: false,
        // DNS lists
        packetTunnelDnsExcludeList: '',
        packetTunnelDnsIncludeList: '',
        dnsPriorityOrdering: '',
        dnsPriorityOrderingForTrustedDnsCriteria: '',
        customDNS: '',
        // App/service IDs
        appServiceIds: '',
        bypassAppIds: '',
        bypassCustomAppIds: '',
        // Passwords (leave blank to skip)
        logoutpassword: '',
        uninstallpassword: '',
        disablepassword: '',
        exitPassword: '',
        zdxDisablePassword: '',
        zdDisablePassword: '',
        zpaDisablePassword: '',
        zdpDisablePassword: '',
        zccRevertPassword: '',
        zccFailCloseSettingsExitUninstallPassword: ''
      });

      // Fetch profiles on mount
      const fetchProfiles = async () => {
        setLoading(true); setError(null);
        try {
          const data = await api.call('GET', '/zcc/profiles');
          setProfiles(data);
          api.call('GET', '/zcc/app-profiles/macos').then(setMacProfiles).catch(() => setMacProfiles([]));
          if (data.errors?.length > 0) {
            setError('Some profile fetches failed: ' + data.errors.join('; '));
          }
        } catch (e) { setError(e.message); }
        setLoading(false);
      };

      useEffect(() => { fetchProfiles(); }, []);

      const handleDeleteProfile = async (ap) => {
        setZccBusy(true); setError(null);
        try {
          await api.call('DELETE', `/zcc/app-profiles/${ap.id}?confirmName=${encodeURIComponent(ap.name)}&platform=${ap.platform || 'windows'}`);
          setDeleteConfirm(null);
          if (String(selectedAppId) === String(ap.id)) setSelectedAppId(null);
          await fetchProfiles();
        } catch (e) { setError('Delete failed: ' + e.message); }
        setZccBusy(false);
      };

      // v1.7.0: delete forwarding profiles (server refuses while an app profile uses it)
      const handleDeleteFwd = async (fp) => {
        setZccBusy(true); setError(null);
        try {
          await api.call('DELETE', `/zcc/forwarding-profiles/${fp.id}?confirmName=${encodeURIComponent(fp.name)}`);
          setDeleteConfirm(null);
          if (String(selectedFwdId) === String(fp.id)) setSelectedFwdId(null);
          await fetchProfiles();
        } catch (e) { setError('Delete failed: ' + e.message); }
        setZccBusy(false);
      };

      // Build the PATCH/POST payloads from selected settings
      const buildPayloads = () => {
        const payloads = { forwardingProfileId: selectedFwdId, appProfileId: selectedAppId, settings: {} };

        if (selectedFwdId && profiles) {
          const fwdProfile = profiles.forwardingProfiles.find(p => String(p.id) === String(selectedFwdId));
          // Build forwarding profile actions from best practices
          const fwdActions = {};
          if (fwdSettings.ztunnel2 || fwdSettings.transparentRedirect || fwdSettings.dropIpv6 || fwdSettings.allTrafficT2) {
            fwdActions.forwardingProfileActions = [{
              actionType: '1',
              networkType: '2',
              primaryTransport: fwdSettings.ztunnel2 ? '2' : '1',
              enablePacketTunnel: '1',
              redirectWebTraffic: fwdSettings.transparentRedirect ? '1' : '0',
              useTunnel2ForProxiedWebTraffic: fwdSettings.allTrafficT2 ? '1' : '0',
              allowTLSFallback: '0',
              systemProxy: '0',
              dropIpv6Traffic: fwdSettings.dropIpv6 ? '1' : '0',
              dropIpv6IncludeTrafficInT2: fwdSettings.dropIpv6 ? '1' : '0',
              dropIpv6TrafficInIpv6Network: fwdSettings.dropIpv6 ? '1' : '0',
              blockUnreachableDomainsTraffic: '0',
              pathMtuDiscovery: '0',
              latencyBasedZenEnablement: '0',
              mtuForZadapter: 1500,
              TLSTimeout: 90,
              DTLSTimeout: 90,
              UDPTimeout: 90,
              zenProbeInterval: 600,
              zenProbeSampleSize: 2,
              zenThresholdLimit: 0,
              tunnel2FallbackType: '0'
            }];
            fwdActions.forwardingProfileZpaActions = [{
              actionType: '1',
              networkType: '2',
              primaryTransport: fwdSettings.ztunnel2 ? '2' : '1',
              latencyBasedServerMTEnablement: 0,
              latencyBasedZpaServerEnablement: '0',
              mtuForZadapter: 1500,
              TLSTimeout: 90,
              DTLSTimeout: 90,
              lbsZpaProbeInterval: 600,
              lbsZpaProbeSampleSize: 2,
              lbsZpaThresholdLimit: 0,
              sendTrustedNetworkResultToZpa: '0'
            }];
          }
          payloads.settings.fwd = fwdActions;
        }

        if (selectedAppId) {
          // PATCH payload — only send non-empty/non-default allowlisted fields
          const patch = {};
          // Toggle fields — send if true
          const toggleFields = ['disableParallelIpv4AndIPv6','useDefaultAdapterForDNS','updateDnsSearchOrder',
            'disableDNSRouteExclusion','enforceSplitDNS','bypassDNSTrafficUsingUDPProxy',
            'truncateLargeUDPDNSResponse','prioritizeDnsExclusions'];
          for (const f of toggleFields) {
            if (appSettings[f]) patch[f] = '1';
          }
          // String fields — send if non-empty
          const strFields = ['packetTunnelExcludeList','packetTunnelExcludeListForIPv6',
            'packetTunnelIncludeList','packetTunnelIncludeListForIPv6',
            'vpnGateways','sourcePortBasedBypasses',
            'packetTunnelDnsExcludeList','packetTunnelDnsIncludeList',
            'dnsPriorityOrdering','dnsPriorityOrderingForTrustedDnsCriteria','customDNS',
            'appServiceIds','bypassAppIds','bypassCustomAppIds',
            'logoutpassword','uninstallpassword','disablepassword','exitPassword',
            'zdxDisablePassword','zdDisablePassword','zpaDisablePassword',
            'zdpDisablePassword','zccRevertPassword','zccFailCloseSettingsExitUninstallPassword'];
          for (const f of strFields) {
            if (appSettings[f]) patch[f] = appSettings[f];
          }
          payloads.settings.app = patch;
        }

        return payloads;
      };

      const handleApply = async () => {
        setLoading(true); setError(null);
        try {
          const payloads = buildPayloads();
          const result = await api.call('POST', '/zcc/apply', payloads);
          setApplyResult(result);
          setWizStep('apply');
        } catch (e) { setError(e.message); }
        setLoading(false);
      };

      // === MODE CHOOSER ===
      if (mode === 'home') {
        return (
          <div className="card">
            <div className="card-header">
              <h2>📱 Mobile Admin Portal</h2>
              <p>Zscaler Client Connector app profiles and forwarding profiles via OneAPI.</p>
            </div>
            <div className="tier-grid">
              <div className="tier-card" onClick={() => setMode('create')} style={{cursor:'pointer'}}>
                <div className="tier-icon">➕</div>
                <div className="tier-name">Create from template</div>
                <div className="tier-desc">A forwarding profile and a Windows or macOS app profile following the Zscaler POV best practice guide: customize, review, dry run, apply.</div>
              </div>
              <div className="tier-card" onClick={() => { setMode('edit'); setWizStep('select'); }} style={{cursor:'pointer'}}>
                <div className="tier-icon">🛠️</div>
                <div className="tier-name">Edit existing profiles</div>
                <div className="tier-desc">Apply best-practice settings to existing app and forwarding profiles, or delete profiles.</div>
              </div>
            </div>
          </div>
        );
      }
      if (mode === 'create') {
        return (
          <ZccCreateWizard setError={setError} config={config}
            forwardingProfiles={profiles ? profiles.forwardingProfiles : []}
            onExit={() => { setMode('home'); fetchProfiles(); }}
            onCreated={() => fetchProfiles()} />
        );
      }

      // === SELECT STEP: pick which profiles to edit ===
      if (wizStep === 'select') {
        if (loading || !profiles) {
          return (<div className="card"><div className="card-header"><h2>📱 Mobile Admin Portal</h2><p>Loading profiles from ZCC...</p></div><div style={{textAlign:'center',padding:'2rem'}}><span className="spinner"></span></div></div>);
        }
        return (
          <div>
            <div className="card">
              <div className="card-header">
                <h2>📱 Mobile Admin Portal — Select Profiles</h2>
                <p>Select existing profiles to apply best-practice settings, or delete profiles.</p>
              </div>

              <div className="explainer">
                <strong>How this works:</strong> Pick existing profiles to apply best-practice settings (PATCH for app profiles, POST edit for forwarding profiles), or delete profiles you no longer need. To create a new profile from a template, go back and choose <strong>Create from template</strong>.
              </div>

              <div className="card" style={{background:'var(--bg-input)', marginTop:'1rem'}}>
                <h3 style={{fontSize:'14px', marginBottom:'0.75rem'}}>Forwarding Profiles ({profiles.forwardingProfiles.length})</h3>
                {profiles.forwardingProfiles.length === 0 ? (
                  <div style={{fontSize:'13px', color:'var(--text-muted)'}}>No forwarding profiles found. Create one in ZCC Admin Portal first.</div>
                ) : profiles.forwardingProfiles.map(fp => (
                  <div key={fp.id} className={`tier-card ${String(selectedFwdId) === String(fp.id) ? 'selected' : ''}`}
                    onClick={() => setSelectedFwdId(fp.id)}
                    style={{cursor:'pointer', marginBottom:'0.5rem', padding:'0.75rem', display:'flex', justifyContent:'space-between', alignItems:'center', gap:'12px'}}>
                    <div>
                      <div style={{fontSize:'13px', fontWeight:600}}>{fp.name || '(unnamed)'}</div>
                      <div style={{fontSize:'11px', color:'var(--text-muted)'}}>ID: {fp.id} · Active: {fp.active ? 'Yes' : 'No'} · Actions: {fp.actionCount}</div>
                    </div>
                    {String(fp.id) !== '0' && (
                      <div onClick={e => e.stopPropagation()} style={{display:'flex', gap:'6px', alignItems:'center', flexShrink:0}}>
                        {deleteConfirm && deleteConfirm.kind === 'fwd' && String(deleteConfirm.id) === String(fp.id) ? (
                          <>
                            <span style={{fontSize:'11px', color:'var(--accent-amber)'}}>Delete "{fp.name}"?</span>
                            <button className="btn btn-sm" style={{background:'var(--accent-red)', color:'#fff'}} disabled={zccBusy}
                              onClick={() => handleDeleteFwd(fp)}>Yes, delete</button>
                            <button className="btn btn-ghost btn-sm" onClick={() => setDeleteConfirm(null)}>Cancel</button>
                          </>
                        ) : (
                          <button className="btn btn-ghost btn-sm" disabled={zccBusy}
                            onClick={() => setDeleteConfirm({ kind: 'fwd', id: fp.id, name: fp.name })}>🗑 Delete</button>
                        )}
                      </div>
                    )}
                  </div>
                ))}
              </div>

              <div className="card" style={{background:'var(--bg-input)', marginTop:'1rem'}}>
                <h3 style={{fontSize:'14px', marginBottom:'0.75rem'}}>App Profiles — Windows ({profiles.appProfiles.length})</h3>
                {profiles.appProfiles.length === 0 ? (
                  <div style={{fontSize:'13px', color:'var(--text-muted)'}}>No Windows app profiles found. Create one in ZCC Admin Portal first.</div>
                ) : profiles.appProfiles.map(ap => (
                  <div key={ap.id} className={`tier-card ${String(selectedAppId) === String(ap.id) ? 'selected' : ''}`}
                    onClick={() => setSelectedAppId(ap.id)}
                    style={{cursor:'pointer', marginBottom:'0.5rem', padding:'0.75rem', display:'flex', justifyContent:'space-between', alignItems:'center', gap:'12px'}}>
                    <div>
                      <div style={{fontSize:'13px', fontWeight:600}}>{ap.name || '(unnamed)'}</div>
                      <div style={{fontSize:'11px', color:'var(--text-muted)'}}>ID: {ap.id} · Active: {ap.active ? 'Yes' : 'No'} · FWD Profile: {ap.forwardingProfileName || 'None'}</div>
                    </div>
                    {String(ap.id) !== '0' && (
                      <div onClick={e => e.stopPropagation()} style={{display:'flex', gap:'6px', alignItems:'center', flexShrink:0}}>
                        {deleteConfirm && deleteConfirm.kind !== 'fwd' && String(deleteConfirm.id) === String(ap.id) ? (
                          <>
                            <span style={{fontSize:'11px', color:'var(--accent-amber)'}}>Delete "{ap.name}"?</span>
