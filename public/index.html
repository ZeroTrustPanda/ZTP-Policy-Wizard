      const [certs, reloadCerts] = useSslCertificates(needsCert && auth.connected);
      useEffect(() => {
        // a framework file carries the certificate by name; match it once the tenant's list is in
        if (certs && certs.certificates && config.sslCertificateName && !config.sslCertificate) {
          const c = certs.certificates.find(x => x.name === config.sslCertificateName);
          if (c) setConfig(cfg => ({ ...cfg, sslCertificate: { id: c.id, name: c.name } }));
        }
      }, [certs]);
      const toggles = [
        { key: 'enableUrlFiltering', label: 'URL Filtering', desc: 'Block/allow web categories, create custom URL rules' },
        { key: 'enableFirewall', label: 'Cloud Firewall', desc: 'Network-level firewall filtering rules' },
        { key: 'enableSslInspection', label: 'SSL/TLS Inspection', desc: 'Inspect encrypted traffic for threats' },
        { key: 'enableSandbox', label: 'Cloud Sandbox', desc: 'Quarantine & scan unknown files (Office, PDF, Executables)' },
        { key: 'enableDnsSecurity', label: 'DNS Security', desc: 'Block malicious DNS categories and DNS tunnels' },
        { key: 'enableFileTypeControl', label: 'File Type Control', desc: 'Block risky file types (executables, scripts, archives, databases)' },
        { key: 'enableCloudAppControl', label: 'Cloud App Control', desc: 'Control SaaS apps (DoH, file sharing, webmail, AI/ML, social, IM)' },
        { key: 'enableDlp', label: 'Data Loss Prevention', desc: 'DLP policy rules mapped to compliance engines (HIPAA, PCI, GDPR, etc.). Default Action=Allow with Zscaler Incident Receiver; switch to Block on the next step.' },
        { key: 'enableMalwareProtection', label: 'Malware & Threat Protection', desc: 'Anti-virus, anti-spyware, botnet protection settings' },
        { key: 'enableAdvancedSettings', label: 'Advanced Cloud Settings', desc: 'HTTP tunnel control, domain fronting, authentication settings' }
      ];

      const handleGenerate = async () => {
        setLoading(true); setError(null);
        try {
          const tmpl = await api.call('POST', '/templates/generate', config);
          setTemplate(tmpl);
          onNext();
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Customize Template</h2>
              <p>Fine-tune the naming prefix and which policy areas to include.</p>
            </div>

            {config.baseTemplate && (
              <div className="alert alert-info" style={{display:'block'}} data-frameworkbanner>
                📁 Using the framework <strong>{config.frameworkName || config.baseTemplate.metadata?.name || 'from file'}</strong> — its rules are created with their own names; the tier and compliance steps don't apply.
                <button className="btn btn-ghost btn-sm" style={{marginLeft:'8px'}} onClick={() => setConfig({ ...config, baseTemplate: null, frameworkName: null })}>Use tiers instead</button>
              </div>
            )}
            {config.frameworkName && !config.baseTemplate && (
              <div className="alert alert-info" data-frameworkbanner>📁 Settings loaded from the framework <strong>{config.frameworkName}</strong>.</div>
            )}

            <div className="form-group">
              <label className="form-label">Naming Prefix</label>
              <input type="text" value={config.prefix}
                onChange={e => setConfig({...config, prefix: e.target.value.replace(/[^A-Za-z0-9_-]/g, '')})}
                placeholder="ZTP" />
              <div className="form-hint">
                All created objects will be named with this prefix (e.g., {config.prefix}-Block-Legal-Liability).
                Letters, numbers, hyphens, and underscores only.
              </div>
            </div>

            <IsolationProfilePicker config={config} setConfig={setConfig} auth={auth} />

            {needsCert && (
              <div className="form-group" data-sslcert>
                <label className="form-label">SSL interception certificate (for the Inspect rules this creates)</label>
                {!auth.connected ? <div className="form-hint">Connect to list certificates.</div> : (
                  <CertificatePicker value={config.sslCertificate || null} onChange={(c) => setConfig({ ...config, sslCertificate: c })} certs={certs} reload={reloadCerts} testId="customize" />
                )}
                <div className="form-hint">Leave on "Zscaler default certificate" to keep Zscaler's. To change existing SSL rules in bulk, use ZIA › SSL Certificate Manager.</div>
              </div>
            )}

            <div className="form-group">
              <label className="form-label">Policy Modules</label>
              <div className="toggle-group">
                {toggles.map(t => (
                  <div className="toggle-item" key={t.key}>
                    <div>
                      <label onClick={() => setConfig({...config, [t.key]: !config[t.key]})}>{t.label}</label>
                      <div className="form-hint">{t.desc}</div>
                    </div>
                    <div className={`toggle-switch ${config[t.key] ? 'active' : ''}`}
                      onClick={() => setConfig({...config, [t.key]: !config[t.key]})}>
                      <div className="toggle-knob"></div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="alert alert-info">
              ℹ Template: <strong>{config.baseTemplate ? (config.frameworkName || config.baseTemplate.metadata?.name) : `${config.prefix}-${config.complianceFramework || 'General'}-${config.tier}`}</strong>
            </div>

            <div className="btn-group">
              <button className="btn btn-ghost" onClick={onBack}>← Back</button>
              <button className="btn btn-primary" onClick={onNext}>Next: Rules →</button>
            </div>
          </div>
        </div>
      );
    }

    // ========================
    // v1.9.0: frameworks (save / load / capture), isolation profile + certificate pickers, SSL Certificate Manager
    // ========================
    function downloadJson(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    const safeFileName = (s) => String(s || 'framework').replace(/[^\w.-]+/g, '_');

    // Config keys a framework replaces when it is loaded (everything else keeps its current value)
    const FRAMEWORK_RESET = { actionSettings: { policy: {}, rules: {} }, disabledRules: {}, baseTemplate: null, frameworkName: null,
      cbiProfile: null, cbiProfileName: null, sslCertificate: null, sslCertificateName: null };

    function FrameworkPanel({ setConfig, setError, onLoaded, auth }) {
      const [busy, setBusy] = useState(false);
      const [loaded, setLoaded] = useState(null);
      const [capture, setCapture] = useState(null);
      const fileRef = React.useRef(null);

      const useFramework = (out) => {
        setConfig(c => ({ ...c, ...FRAMEWORK_RESET, ...out.config, frameworkName: out.name || null }));
        onLoaded(!!out.config.baseTemplate);
      };
      const readFile = async (file) => {
        setError(null); setBusy(true);
        try {
          const text = await file.text();
          let json; try { json = JSON.parse(text); } catch (e) { throw new Error('That file is not JSON.'); }
          const out = await api.call('POST', '/frameworks/read', { framework: json });
          setLoaded(out);
        } catch (e) { setError(e.message); }
        setBusy(false);
        if (fileRef.current) fileRef.current.value = '';
      };
      const doCapture = async () => {
        setError(null); setBusy(true);
        try { setCapture(await api.call('POST', '/frameworks/capture', {})); } catch (e) { setError(e.message); }
        setBusy(false);
      };

      return (
        <div className="card" data-frameworkpanel>
          <div className="card-header">
            <h2>📁 Start from a framework (optional)</h2>
            <p>Load a framework file you saved earlier (tier, compliance, rule switches, Allow / Block / Isolate choices, isolation profile and certificate), or capture this tenant's current policies so you can apply them to another tenant.</p>
          </div>
          <div style={{display:'flex', gap:'8px', flexWrap:'wrap'}}>
            <input ref={fileRef} type="file" accept=".json,application/json" style={{display:'none'}} data-frameworkfile
              onChange={e => e.target.files[0] && readFile(e.target.files[0])} />
            <button className="btn btn-ghost" disabled={busy} onClick={() => fileRef.current && fileRef.current.click()}>📂 Load a saved framework…</button>
            <button className="btn btn-ghost" disabled={busy || !auth.connected} onClick={doCapture} data-capture>📸 Capture this tenant's policies</button>
            {busy && <span className="spinner"></span>}
          </div>
          {loaded && (
            <div className="alert alert-info" style={{display:'block', marginTop:'1rem'}} data-loadedframework>
              <strong>{loaded.name}</strong> {loaded.kind === 'captured' ? '(captured policies)' : '(built-in framework settings)'}
              {loaded.savedAt && <> · saved {String(loaded.savedAt).substring(0, 10)}</>}
              {loaded.description && <div style={{fontSize:'12px', marginTop:'4px'}}>{loaded.description}</div>}
              {loaded.counts && <div style={{fontSize:'12px', marginTop:'4px'}}>{Object.entries(loaded.counts).map(([k, v]) => `${k}: ${v}`).join(' · ')}</div>}
              <div style={{marginTop:'8px'}}><button className="btn btn-primary btn-sm" onClick={() => useFramework(loaded)} data-useframework>Use this framework →</button></div>
            </div>
          )}
          {capture && (
            <div className="alert alert-info" style={{display:'block', marginTop:'1rem'}} data-captured>
              <strong>Captured {Object.values(capture.framework.baseTemplate.policies).reduce((n, v) => n + (Array.isArray(v) ? v.length : 1), 0)} rules</strong>
              {' '}({Object.entries(capture.framework.baseTemplate.policies).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.length : 1}`).join(' · ')}
              {capture.framework.baseTemplate.customCategories.length > 0 && <> · custom categories: {capture.framework.baseTemplate.customCategories.length}</>}). Nothing in the tenant was changed.
              {[...capture.notes, ...capture.skipped].slice(0, 8).map((n, i) => <div key={i} style={{fontSize:'12px'}}>• {n}</div>)}
              {capture.notes.length + capture.skipped.length > 8 && <div style={{fontSize:'12px'}}>• … {capture.notes.length + capture.skipped.length - 8} more</div>}
              <div style={{marginTop:'8px', display:'flex', gap:'8px'}}>
                <button className="btn btn-primary btn-sm" onClick={() => downloadJson(`${safeFileName(capture.framework.name)}.ztp-framework.json`, capture.framework)} data-downloadcapture>⬇ Save framework file</button>
                <button className="btn btn-ghost btn-sm" onClick={async () => { try { useFramework(await api.call('POST', '/frameworks/read', { framework: capture.framework })); } catch (e) { setError(e.message); } }}>Use it in this session</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SaveFrameworkButton({ config, setError }) {
      const [name, setName] = useState(config.frameworkName || `${config.prefix || 'ZTP'} ${config.complianceFramework || 'General'} ${config.tier}`);
      const [open, setOpen] = useState(false);
      const save = async () => {
        setError(null);
        try {
          const { module, frameworkName, ...rest } = config;
          const file = await api.call('POST', '/frameworks/build', { name, config: rest });
          downloadJson(`${safeFileName(name)}.ztp-framework.json`, file);
          setOpen(false);
        } catch (e) { setError(e.message); }
      };
      if (!open) return <button className="btn btn-ghost" onClick={() => setOpen(true)} data-saveframework>💾 Save framework…</button>;
      return (
        <span style={{display:'inline-flex', gap:'6px', alignItems:'center'}}>
          <input type="text" value={name} onChange={e => setName(e.target.value)} style={{width:'240px'}} data-frameworkname />
          <button className="btn btn-primary btn-sm" disabled={!name.trim()} onClick={save} data-saveframeworkgo>Download</button>
          <button className="btn btn-ghost btn-sm" onClick={() => setOpen(false)}>Cancel</button>
        </span>
      );
    }

    function IsolationProfilePicker({ config, setConfig, auth }) {
      const [profiles, setProfiles] = useState(null);
      const [tick, setTick] = useState(0);
      useEffect(() => {
        if (!auth.connected) return;
        setProfiles(null);
        api.call('GET', '/isolation-profiles').then(ps => {
          setProfiles(ps);
          const still = config.cbiProfile && ps.find(p => String(p.id) === String(config.cbiProfile.id));
          if (!still && ps.length) {
            // "Default Isolation Profile" is always there; use it unless a framework file named another one
            const byName = config.cbiProfileName && ps.find(p => p.name === config.cbiProfileName);
            const pick = byName || ps.find(p => p.defaultProfile) || ps.find(p => /default isolation profile/i.test(p.name)) || ps[0];
            setConfig(c => ({ ...c, cbiProfile: { id: pick.id, name: pick.name, url: pick.url } }));
          }
        }).catch(e => setProfiles({ error: e.message }));
      }, [auth.connected, tick]);
      return (
        <div className="form-group" data-isolation>
          <label className="form-label">Cloud Browser Isolation profile</label>
          {!auth.connected ? <div className="form-hint">Connect to pick a profile.</div>
           : !profiles ? <div className="form-hint"><span className="spinner"></span> Reading profiles…</div>
           : profiles.error ? <div className="alert alert-warning">Could not read isolation profiles: {profiles.error}</div>
           : profiles.length === 0 ? <div className="alert alert-warning" style={{display:'block'}}>This tenant has no isolation profile yet. Create one in the Isolation admin portal (the ZIA API can only read profiles) and click Refresh. Until then Sandbox "Quarantine & Isolate" falls back to Quarantine and URL rules can't be set to Isolate.
               <div><button className="btn btn-ghost btn-sm" style={{marginTop:'6px'}} onClick={() => setTick(t => t + 1)} data-refreshprofiles>↻ Refresh</button></div></div>
           : (
            <div style={{display:'flex', gap:'8px'}}>
              <select style={{flex:1}} value={config.cbiProfile ? config.cbiProfile.id : ''} onChange={e => { const p = profiles.find(x => String(x.id) === e.target.value); setConfig({ ...config, cbiProfile: p ? { id: p.id, name: p.name, url: p.url } : null }); }}>
                {profiles.map(p => <option key={p.id} value={p.id}>{p.name}{p.defaultProfile ? ' (default)' : ''}</option>)}
              </select>
              <button className="btn btn-ghost btn-sm" onClick={() => setTick(t => t + 1)} title="Fetch the profiles again (picks up ones created in the Isolation portal)" data-refreshprofiles>↻ Refresh</button>
            </div>
          )}
          <div className="form-hint">Used by Sandbox "Quarantine & Isolate" and by any URL rule you set to Isolate on the Rules step. The Default Isolation Profile is used unless you pick another; created a new one in the Isolation portal? Click Refresh.</div>
        </div>
      );
    }

    // ========================
    // SSL interception certificate picker (Customize) + SSL Certificate Manager page (special edition)
    // ========================
    function useSslCertificates(enabled) {
      const [state, setState] = useState(null);
      const load = () => { setState(null); api.call('GET', '/ssl/certificates').then(setState).catch(e => setState({ error: e.message, certificates: [] })); };
      useEffect(() => { if (enabled) load(); }, [enabled]);
      return [state, load];
    }

    function CertificatePicker({ value, onChange, certs, reload, testId }) {
      const [manual, setManual] = useState(false);
      const [mId, setMId] = useState(''); const [mName, setMName] = useState('');
      const list = (certs && certs.certificates) || [];
      return (
        <div data-certpicker={testId || 'cert'}>
          <div style={{display:'flex', gap:'8px', alignItems:'center'}}>
            <select style={{flex:1}} value={value ? String(value.id) : ''} onChange={e => {
              if (e.target.value === '__manual') { setManual(true); return; }
              setManual(false);
              const c = list.find(x => String(x.id) === e.target.value);
              onChange(c ? { id: c.id, name: c.name } : null);
            }}>
              <option value="">Zscaler default certificate</option>
              {list.filter(c => !c.defaultCertificate).map(c => <option key={c.id} value={String(c.id)}>{c.name}{c.type ? ` (${c.type})` : ''}{c.from && c.from !== 'certificate list' ? ` — ${c.from}` : ''}</option>)}
              {value && !list.some(c => String(c.id) === String(value.id)) && <option value={String(value.id)}>{value.name} (entered)</option>}
              <option value="__manual">Enter a certificate ID…</option>
            </select>
            <button className="btn btn-ghost btn-sm" onClick={reload} title="Fetch certificates again (picks up newly imported ones)">↻ Refresh</button>
          </div>
          {!certs ? <div className="form-hint"><span className="spinner"></span> Reading certificates…</div>
            : certs.error ? <div className="form-hint" style={{color:'var(--accent-amber)'}}>Could not read certificates: {certs.error}</div>
            : !certs.source && <div className="form-hint">This tenant's API didn't return a certificate list{list.length ? '; showing certificates already used by SSL rules' : ''}. You can enter the certificate ID and name from Administration › Intermediate Root Certificates.</div>}
          {manual && (
            <div style={{display:'flex', gap:'6px', marginTop:'6px'}}>
              <input type="text" placeholder="Certificate ID" value={mId} onChange={e => setMId(e.target.value.replace(/[^0-9]/g, ''))} style={{width:'140px'}} />
              <input type="text" placeholder="Certificate name (as in the portal)" value={mName} onChange={e => setMName(e.target.value)} style={{flex:1}} />
              <button className="btn btn-ghost btn-sm" disabled={!mId || !mName} onClick={() => { onChange({ id: Number(mId), name: mName.trim() }); setManual(false); }}>Use</button>
            </div>
          )}
        </div>
      );
    }

    function SslCertStep({ setError }) {
      const [rules, setRules] = useState(null);
      const [certs, reloadCerts] = useSslCertificates(true);
      const [selected, setSelected] = useState({});
      const [target, setTarget] = useState(null);
      const [preview, setPreview] = useState(null);
      const [result, setResult] = useState(null);
      const [busy, setBusy] = useState(false);
      const loadRules = () => { setRules(null); api.call('GET', '/ssl/rules').then(setRules).catch(e => setError(e.message)); };
      useEffect(() => { loadRules(); }, []);
      const ids = Object.keys(selected).filter(k => selected[k]);
      const changeable = (rules || []).filter(r => r.changeable);
      const run = async (dryRun) => {
        setBusy(true); setError(null);
        try {
          const r = await api.call('POST', '/ssl/bulk-certificate', { ruleIds: ids, certificate: target, dryRun });
          if (dryRun) setPreview(r); else { setResult(r); setPreview(null); loadRules(); }
        } catch (e) { setError(e.message); }
        setBusy(false);
      };
      return (
        <div className="card">
          <div className="card-header">
            <h2>🔐 SSL Certificate Manager</h2>
            <p>Choose which interception certificate your SSL Inspect rules use — for example, stop using the Zscaler default certificate and sign with your imported intermediate CA. Only Inspect (DECRYPT) rules use a certificate.</p>
          </div>
          <div className="form-group">
            <label className="form-label">Certificate to use</label>
            <CertificatePicker value={target} onChange={(c) => { setTarget(c); setPreview(null); setResult(null); }} certs={certs} reload={reloadCerts} testId="bulk" />
          </div>
          {!rules ? <div style={{textAlign:'center', padding:'1rem'}}><span className="spinner"></span></div> : (
            <>
              <div style={{display:'flex', gap:'8px', marginBottom:'8px'}}>
                <button className="btn btn-ghost btn-sm" onClick={() => setSelected(Object.fromEntries(changeable.map(r => [r.id, true])))}>Select all Inspect rules ({changeable.length})</button>
                <button className="btn btn-ghost btn-sm" onClick={() => setSelected(Object.fromEntries(changeable.filter(r => !r.override).map(r => [r.id, true])))}>Select rules on the default certificate</button>
                <button className="btn btn-ghost btn-sm" onClick={() => setSelected({})}>Clear</button>
                <button className="btn btn-ghost btn-sm" onClick={loadRules}>↻ Reload rules</button>
              </div>
              <table className="diff-table" data-sslrules>
                <thead><tr><th></th><th>Order</th><th>Rule</th><th>Action</th><th>Certificate</th></tr></thead>
                <tbody>
                  {rules.map(r => (
                    <tr key={r.id} style={{opacity: r.changeable ? 1 : 0.5}}>
                      <td><input type="checkbox" disabled={!r.changeable} checked={!!selected[r.id]} onChange={e => { setSelected({ ...selected, [r.id]: e.target.checked }); setPreview(null); }} /></td>
                      <td>{r.order}</td>
                      <td style={{fontFamily:'IBM Plex Mono', fontSize:'12px'}}>{r.name}{r.predefined && <span className="badge badge-category" style={{marginLeft:'6px'}}>PREDEFINED</span>}{r.defaultRule && <span className="badge badge-category" style={{marginLeft:'6px'}}>DEFAULT RULE</span>}</td>
                      <td><span className={`badge ${r.action === 'DECRYPT' ? 'badge-update' : 'badge-category'}`}>{r.action === 'DECRYPT' ? 'INSPECT' : r.action}</span></td>
                      <td style={{fontSize:'12px'}}>{r.changeable ? (r.certificate ? r.certificate.name : <span style={{color:'var(--accent-amber)'}}>Zscaler default</span>) : '—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </>
          )}
          {preview && (
            <div className="alert alert-info" style={{display:'block', marginTop:'1rem'}} data-sslpreview>
              <strong>Preview — nothing changed yet:</strong>
              {preview.results.map((r, i) => <div key={i} style={{fontSize:'12px'}}>{r.ok ? (r.unchanged ? '= ' : '→ ') : '✕ '}{r.name}: {r.unchanged ? `already ${r.after}` : r.ok ? `${r.before} → ${r.after}` : r.error}</div>)}
            </div>
          )}
          {result && (
            <div className={`alert ${result.results.every(r => r.ok) ? 'alert-success' : 'alert-warning'}`} style={{display:'block', marginTop:'1rem'}} data-sslresult>
              <strong>{result.results.filter(r => r.ok && !r.unchanged).length} rule(s) changed{result.activated ? ' and activated' : ''}.</strong>
              {result.results.map((r, i) => <div key={i} style={{fontSize:'12px'}}>{r.ok ? '✓' : '✕'} {r.name}: {r.ok ? `${r.before} → ${r.after}` : r.error}</div>)}
            </div>
          )}
          <div className="btn-group">
            <button className="btn btn-ghost" disabled={!ids.length || busy} onClick={() => run(true)} data-sslpreviewbtn>Preview change ({ids.length})</button>
            <button className="btn btn-success" disabled={!ids.length || busy || !preview} onClick={() => run(false)} data-sslapply>
              {busy ? <><span className="spinner"></span> Working…</> : `Apply to ${ids.length} rule${ids.length === 1 ? '' : 's'} and activate`}
            </button>
          </div>
          <div className="form-hint">To go back, choose "Zscaler default certificate", select the rules and apply. Every change is in the audit log.</div>
        </div>
      );
    }

    // ========================
    // Step: Rules — on/off switch per rule, Allow / Block / Isolate (v1.6.0, v1.9.0)
    // ========================
    const isRestrictiveAction = (a) => /(^|,\s*)(BLOCK|DENY|CAUTION|ISOLATE)/.test(a || '');
    const isBlockAction = (a) => /(^|,\s*)(BLOCK|DENY)/.test(a || '');

    function ActionsStep({ config, setConfig, setTemplate, setError, loading, setLoading, onNext, onBack }) {
      const [catalog, setCatalog] = useState(null);
      const [open, setOpen] = useState({});
      const settings = config.actionSettings || { policy: {}, rules: {} };
      const disabled = config.disabledRules || {};
      const base = config.baseTemplate;
      const defaultLabel = base ? 'Framework default' : 'Tier default';

      // The catalog depends on what is generated, not on the switches / choices made here
      const catalogKey = JSON.stringify([config.tier, config.complianceFramework, config.prefix,
        config.enableUrlFiltering, config.enableFirewall, config.enableSslInspection, config.enableSandbox, config.enableDnsSecurity,
        config.enableFileTypeControl, config.enableCloudAppControl, config.enableDlp, base ? (base.metadata?.capturedAt || base.metadata?.name || 'base') : null]);

      useEffect(() => {
        let cancelled = false;
        setCatalog(null);
        api.call('POST', '/templates/action-catalog', { ...config, actionSettings: null, disabledRules: {} })
          .then(c => { if (!cancelled) setCatalog(c); })
          .catch(e => setError(e.message));
        return () => { cancelled = true; };
      }, [catalogKey]);

      const update = (policy, rules) => setConfig({ ...config, actionSettings: { policy, rules } });
      const setDisabled = (next) => setConfig({ ...config, disabledRules: next });
      const toggleRule = (key) => { const next = { ...disabled }; if (next[key]) delete next[key]; else next[key] = true; setDisabled(next); };
      const setGroupOn = (g, on) => {
        const next = { ...disabled };
        for (const r of g.rules) { if (on) delete next[r.key]; else next[r.key] = true; }
        setDisabled(next);
      };

      // A policy-level choice clears that type's per-rule overrides so the two never disagree
      const setPolicy = (type, value) => {
        const rules = { ...settings.rules };
        Object.keys(rules).forEach(k => { if (k.startsWith(type + ':')) delete rules[k]; });
        update({ ...settings.policy, [type]: value }, rules);
      };

      const baseFor = (r) => r.defaultAction === 'ALLOW' ? 'ALLOW' : isBlockAction(r.defaultAction) ? 'BLOCK' : r.defaultAction === 'ISOLATE' ? 'ISOLATE' : null;

      const setRule = (type, rule, value) => {
        const rules = { ...settings.rules };
        const p = settings.policy[type];
        const inherited = (p === 'ALLOW' || p === 'BLOCK') ? p : baseFor(rule);
        if (value === inherited) delete rules[rule.key]; else rules[rule.key] = value;
        update(settings.policy, rules);
      };

      const effective = (type, r) => {
        if (r.locked) return baseFor(r);
        if (settings.rules[r.key]) return settings.rules[r.key];
        const p = settings.policy[type];
        if (p === 'ALLOW' || p === 'BLOCK') return p;
        return baseFor(r); // null = Caution tier default
      };

      const isWeakened = (type, r) => !r.locked && isRestrictiveAction(r.defaultAction) && effective(type, r) === 'ALLOW';
      const groups = catalog || [];
      const weakenedCount = groups.reduce((n, g) => n + (g.canOverride ? g.rules.filter(r => !disabled[r.key] && isWeakened(g.type, r)).length : 0), 0);
      const offCount = groups.reduce((n, g) => n + g.rules.filter(r => disabled[r.key]).length, 0);
      const totalRules = groups.reduce((n, g) => n + g.rules.length, 0);
      const isolateCount = groups.reduce((n, g) => n + (g.canIsolate ? g.rules.filter(r => !disabled[r.key] && effective(g.type, r) === 'ISOLATE').length : 0), 0);
      const overrideCount = Object.keys(settings.rules).length +
        Object.values(settings.policy).filter(v => v === 'ALLOW' || v === 'BLOCK').length;

      const resetAll = () => setConfig({ ...config, actionSettings: { policy: {}, rules: {} }, disabledRules: {} });

      const handleGenerate = async () => {
        setLoading(true); setError(null);
        try {
          const tmpl = await api.call('POST', '/templates/generate', config);
          setTemplate(tmpl);
          onNext();
        } catch (e) { setError(e.message); }
        setLoading(false);
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Rules</h2>
              <p>Every rule has an on/off switch. Where the policy type supports it, choose Allow or Block per policy type or per rule — URL rules can also be set to Isolate (Cloud Browser Isolation).</p>
            </div>

            <div className="alert alert-info">
              <span>ℹ <strong>{defaultLabel}</strong> keeps exactly what {base ? 'the framework file' : `the ${config.tier} tier`} creates (including Caution pages).
              <strong> Allow all</strong> / <strong>Block all</strong> applies to every rule in that policy type; you can then change single rules.
              Switched-off rules are not created.</span>
            </div>

            {(offCount > 0 || isolateCount > 0) && (
              <div className="alert alert-info" data-rulesummary>
                <span>{totalRules - offCount} of {totalRules} rules on{isolateCount > 0 && <> · {isolateCount} URL rule{isolateCount === 1 ? '' : 's'} set to Isolate (profile: <strong>{config.cbiProfile ? config.cbiProfile.name : 'tenant default'}</strong>)</>}</span>
              </div>
            )}

            {weakenedCount > 0 && (
              <div className="alert alert-warning">
                <span>⚠ {weakenedCount} rule{weakenedCount === 1 ? '' : 's'} that {base ? 'the framework' : `the ${config.tier} tier`} would restrict {weakenedCount === 1 ? 'is' : 'are'} set to Allow.
                This reduces protection; it is flagged in the plan and recorded in the audit log.</span>
              </div>
            )}

            {!catalog ? (
              <div style={{textAlign:'center', padding:'2rem'}}><div className="spinner" style={{margin:'0 auto'}}></div></div>
            ) : catalog.length === 0 ? (
              <div className="alert alert-warning">No rule-based policy types are enabled. Go back to Customize.</div>
            ) : catalog.map(g => {
              const pol = settings.policy[g.type] || 'DEFAULT';
              const overrides = g.rules.filter(r => settings.rules[r.key]).length;
              const on = g.rules.filter(r => !disabled[r.key]).length;
              const blocking = g.canOverride ? g.rules.filter(r => !disabled[r.key] && effective(g.type, r) === 'BLOCK').length : null;
              return (
                <div className="ab-group" key={g.type} data-rulegroup={g.type}>
                  <div className="ab-group-header" onClick={() => setOpen({ ...open, [g.type]: !open[g.type] })}>
                    <div>
                      <div className="ab-group-title">{open[g.type] ? '▾' : '▸'} {g.label}</div>
                      <div className="ab-group-sub">
                        {on} of {g.rules.length} on
                        {blocking !== null && <> · {blocking} blocking</>}
                        {overrides > 0 && <> · {overrides} individually changed</>}
                      </div>
                    </div>
                    <div style={{display:'flex', gap:'8px', alignItems:'center'}} onClick={e => e.stopPropagation()}>
                      <div className="ab-seg">
                        <button className={on === g.rules.length ? 'on-default' : ''} onClick={() => setGroupOn(g, true)} data-allon>All on</button>
                        <button className={on === 0 ? 'on-block' : ''} onClick={() => setGroupOn(g, false)} data-alloff>All off</button>
                      </div>
                      {g.canOverride && (
                        <div className="ab-seg">
                          <button className={pol === 'DEFAULT' ? 'on-default' : ''} onClick={() => setPolicy(g.type, 'DEFAULT')}>{defaultLabel}</button>
                          <button className={pol === 'ALLOW' ? 'on-allow' : ''} onClick={() => setPolicy(g.type, 'ALLOW')}>Allow all</button>
                          <button className={pol === 'BLOCK' ? 'on-block' : ''} onClick={() => setPolicy(g.type, 'BLOCK')}>Block all</button>
                        </div>
                      )}
                    </div>
                  </div>
                  {open[g.type] && (
                    <div className="ab-rows">
                      {g.rules.map(r => {
                        const eff = effective(g.type, r);
                        const isOff = !!disabled[r.key];
                        return (
                          <div className="ab-row" key={r.key} data-rule={r.key} style={{opacity: isOff ? 0.5 : 1}}>
                            <div style={{display:'flex', gap:'12px', alignItems:'flex-start'}}>
                              <div className={`toggle-switch ${isOff ? '' : 'active'}`} style={{flexShrink:0, marginTop:'2px'}} onClick={() => toggleRule(r.key)} title={isOff ? 'Off — this rule will not be created' : 'On'} data-ruletoggle={r.key}>
                                <div className="toggle-knob"></div>
                              </div>
                              <div>
                                <div className="ab-row-name">{r.name}</div>
                                <div className="ab-row-desc">{r.description}</div>
                                <div className="ab-row-desc">
                                  {defaultLabel}: <strong>{r.defaultActions ? r.defaultActions.join(', ') : r.defaultAction}</strong>
                                  {r.categoryCount !== undefined && <> · {r.categoryCount} categor{r.categoryCount === 1 ? 'y' : 'ies'}</>}
                                </div>
                                {!isOff && g.canOverride && isWeakened(g.type, r) && <div className="ab-warn">⚠ Weaker than the default</div>}
                                {!isOff && eff === 'ISOLATE' && <div className="ab-row-desc">🖥 Opens in Cloud Browser Isolation ({config.cbiProfile ? config.cbiProfile.name : 'tenant default profile'})</div>}
                                {r.locked && <div className="ab-row-desc">🔒 Required for baseline internet access; Allow / Block cannot be changed</div>}
                              </div>
                            </div>
                            {g.canOverride && (
                              <div className="ab-seg">
                                <button disabled={r.locked || isOff} className={eff === 'ALLOW' ? 'on-allow' : ''} onClick={() => setRule(g.type, r, 'ALLOW')}>Allow</button>
                                <button disabled={r.locked || isOff} className={eff === 'BLOCK' ? 'on-block' : ''} onClick={() => setRule(g.type, r, 'BLOCK')}>Block</button>
                                {g.canIsolate && <button disabled={r.locked || isOff} className={eff === 'ISOLATE' ? 'on-default' : ''} onClick={() => setRule(g.type, r, 'ISOLATE')} data-isolatebtn>Isolate</button>}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}

            <div className="btn-group">
              <button className="btn btn-ghost" onClick={onBack}>← Back</button>
              {(overrideCount > 0 || offCount > 0) && <button className="btn btn-ghost" onClick={resetAll}>Reset to defaults</button>}
              <SaveFrameworkButton config={config} setError={setError} />
              <button className="btn btn-primary" onClick={handleGenerate} disabled={loading || !catalog}>
                {loading ? <><span className="spinner"></span> Generating...</> : 'Generate Template & Review →'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ========================
    // Step: Review / Plan
    // ========================
    function ReviewStep({ template, plan, setPlan, auth, setError, loading, setLoading, onApply, onBack }) {
      const [tab, setTab] = useState('policies');

      const runDryRun = async () => {
        setLoading(true); setError(null);
        try {
          const result = await api.call('POST', '/plan/dryrun', { template });
          setPlan(result);
          setTab('diff');
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      };

      if (!template) return <div className="alert alert-warning">No template generated. Go back to Customize step.</div>;

      const allPolicies = [
        ...(template.policies.urlFiltering || []).map(r => ({...r, category: 'URL Filtering'})),
        ...(template.policies.firewallFiltering || []).map(r => ({...r, category: 'Firewall'})),
        ...(template.policies.sslInspection || []).map(r => ({...r, category: 'SSL Inspection'})),
        ...(template.policies.sandbox || []).map(r => ({...r, category: 'Sandbox', action: r.baRuleAction})),
        ...(template.policies.dnsSecurity || []).map(r => ({...r, category: 'DNS Security'})),
        ...(template.policies.fileTypeControl || []).map(r => ({...r, category: 'File Type Control', action: r.filteringAction})),
        ...(template.policies.cloudAppControl || []).map(r => ({...r, category: 'Cloud App Control', action: (r.actions||[]).join(', ')})),
        ...(template.policies.dlp || []).map(r => ({...r, category: 'Data Loss Prevention', action: r.action || 'ALLOW'})),
      ];
      const actionChanges = template.actionChanges || [];
      const weakenedChanges = actionChanges.filter(c => c.weakened);

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Review: {template.metadata.name}</h2>
              <p>
                Tier: <strong>{template.metadata.tier}</strong>
                {template.metadata.complianceFramework && <> · Framework: <strong>{template.metadata.complianceFramework.name}</strong></>}
                · Prefix: <strong>{template.metadata.prefix}</strong>
              </p>
            </div>

            {actionChanges.length > 0 && (
              <div className={`alert ${weakenedChanges.length ? 'alert-warning' : 'alert-info'}`}>
                <span>{weakenedChanges.length ? '⚠' : 'ℹ'} {actionChanges.length} rule{actionChanges.length === 1 ? '' : 's'} differ from the {template.metadata.tier} tier default
                {weakenedChanges.length > 0 && <> — {weakenedChanges.length} weaken protection ({weakenedChanges.slice(0, 3).map(c => `${c.name}: ${c.from}→${c.to}`).join(', ')}{weakenedChanges.length > 3 ? ', …' : ''})</>}.</span>
              </div>
            )}
            <div style={{display:'flex', gap:'8px', marginBottom:'1rem'}}>
              <button className={`btn btn-sm ${tab==='policies' ? 'btn-primary' : 'btn-ghost'}`}
                onClick={() => setTab('policies')}>Policy Rules ({allPolicies.length})</button>
              <button className={`btn btn-sm ${tab==='checklist' ? 'btn-primary' : 'btn-ghost'}`}
                onClick={() => setTab('checklist')}>Checklist</button>
              <button className={`btn btn-sm ${tab==='compliance' ? 'btn-primary' : 'btn-ghost'}`}
                onClick={() => setTab('compliance')}>Compliance Evidence</button>
              <button className={`btn btn-sm ${tab==='diff' ? 'btn-primary' : 'btn-ghost'}`}
                onClick={() => { if (!plan) runDryRun(); else setTab('diff'); }}>
                {plan ? 'Diff View' : 'Run Dry Run'}
              </button>
            </div>

            {tab === 'policies' && (
              <div style={{overflowX:'auto'}}>
                <table className="diff-table">
                  <thead>
                    <tr>
                      <th>Order</th>
                      <th>Category</th>
                      <th>Rule Name</th>
                      <th>Action</th>
                      <th>Description</th>
                    </tr>
                  </thead>
                  <tbody>
                    {allPolicies.map((r, i) => (
                      <tr key={i}>
                        <td>{r.order}</td>
                        <td><span className="badge badge-category">{r.category}</span></td>
                        <td style={{fontFamily:'IBM Plex Mono', fontSize:'12px'}}>{r.name}</td>
                        <td>
                          <span className={`badge ${isBlockAction(r.action) ? 'badge-risk' : 'badge-create'}`}>
                            {r.action}
                          </span>
                          {r.actionChanged && (
                            <div style={{fontSize:'11px', marginTop:'4px', color: r.weakened ? 'var(--accent-amber)' : 'var(--text-muted)'}}>
                              {r.weakened ? '⚠ ' : ''}tier default: {r.defaultActions ? r.defaultActions.join(', ') : r.defaultAction}
                            </div>
                          )}
                        </td>
                        <td style={{fontSize:'12px', color:'var(--text-secondary)'}}>{r.description}</td>
                      </tr>
                    ))}
                    {template.policies.malwareProtection && (
                      <tr>
                        <td>—</td>
                        <td><span className="badge badge-category">Malware</span></td>
                        <td style={{fontFamily:'IBM Plex Mono', fontSize:'12px'}}>{template.policies.malwareProtection.name}</td>
                        <td><span className="badge badge-update">CONFIG</span></td>
                        <td style={{fontSize:'12px', color:'var(--text-secondary)'}}>Malware & Advanced Threat Protection settings</td>
                      </tr>
                    )}
                    {template.policies.advancedSettings && (
                      <tr>
                        <td>—</td>
                        <td><span className="badge badge-category">Advanced</span></td>
                        <td style={{fontFamily:'IBM Plex Mono', fontSize:'12px'}}>{template.policies.advancedSettings.name}</td>
                        <td><span className="badge badge-update">CONFIG</span></td>
                        <td style={{fontSize:'12px', color:'var(--text-secondary)'}}>Advanced cloud settings configuration</td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {tab === 'checklist' && (
              <div>
                {template.implementationChecklist.map((item, i) => (
                  <div key={i} style={{
                    display:'flex', alignItems:'center', gap:'10px',
                    padding:'8px 12px', borderBottom:'1px solid var(--border)',
                    fontSize:'13px'
                  }}>
                    <span style={{
                      width:'20px', height:'20px', borderRadius:'4px',
                      border:'1px solid var(--border)', display:'flex',
                      alignItems:'center', justifyContent:'center', fontSize:'10px',
                      flexShrink:0
                    }}>
                      {item.manual ? '✋' : '○'}
                    </span>
                    <span className="badge badge-category" style={{fontSize:'10px', flexShrink:0}}>{item.category}</span>
                    <span>{item.task}</span>
                    {item.manual && <span style={{fontSize:'11px', color:'var(--accent-amber)'}}>MANUAL</span>}
                  </div>
                ))}
              </div>
            )}

            {tab === 'compliance' && (
              <div>
                {!template.metadata.complianceFramework ? (
                  <div className="alert alert-info">No compliance framework selected. Go back to select one for evidence mapping.</div>
                ) : (
                  <div>
                    <h3 style={{fontSize:'14px', marginBottom:'1rem'}}>
                      {template.metadata.complianceFramework.name} Compliance Evidence
                    </h3>
                    {allPolicies.filter(r => r.complianceMapping?.length > 0).map((r, i) => (
                      <div key={i} className="evidence-item">
                        <div style={{fontWeight:600, marginBottom:'4px'}}>{r.name}</div>
                        {r.complianceMapping.map((m, j) => (
                          <div key={j} style={{fontSize:'12px'}}>
                            <span className="fw">{m.framework}</span> →
                            <span className="ctrl"> {m.id}: {m.name}</span>
                            {m.description && <span style={{color:'var(--text-muted)'}}> — {m.description}</span>}
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {tab === 'diff' && (
              <div>
                {loading ? (
                  <div style={{textAlign:'center', padding:'2rem'}}><div className="spinner" style={{margin:'0 auto'}}></div><p style={{marginTop:'8px', color:'var(--text-muted)'}}>Running dry run against your tenant...</p></div>
                ) : plan ? (
                  <div>
                    <div className="alert alert-info">
                      ℹ Plan Summary: <strong>{plan.summary.creates} creates</strong>, <strong>{plan.summary.updates} updates</strong>
                      {plan.summary.actionOverrides > 0 && <>, <strong>{plan.summary.actionOverrides} Allow/Block overrides</strong></>}
                      {plan.summary.riskyActions > 0 && <>, <span style={{color:'var(--accent-red)'}}>{plan.summary.riskyActions} risky actions</span></>}
                    </div>
                    {plan.errors?.length > 0 && plan.errors.map((w,i) => (
                      <div key={'e' + i} className="alert alert-danger">✕ {typeof w === 'string' ? w : (w.error || JSON.stringify(w))}</div>
                    ))}
                    {plan.resolved?.cbi?.name && (
                      <div className="alert alert-info" data-resolvedcbi>🖥 Isolation profile: <strong>{plan.resolved.cbi.name}</strong>{plan.resolved.cbi.defaultProfile ? ' (default)' : ''}</div>
                    )}
                    {plan.warnings?.length > 0 && plan.warnings.map((w,i) => (
                      <div key={i} className="alert alert-warning">⚠ {w}</div>
                    ))}
                    <table className="diff-table">
                      <thead>
                        <tr>
                          <th>Action</th>
                          <th>Category</th>
                          <th>Rule Name</th>
                          <th>Current</th>
                          <th>Proposed</th>
                        </tr>
                      </thead>
                      <tbody>
                        {plan.actions.map((a, i) => (
                          <tr key={i}>
                            <td>
                              <span className={`badge ${a.type==='CREATE' ? 'badge-create' : 'badge-update'}`}>{a.type}</span>
                              {a.isRisky && <span className="badge badge-risk" style={{marginLeft:'4px'}}>RISK</span>}
                              {a.weakened && <span className="badge badge-risk" style={{marginLeft:'4px'}}>WEAKENED</span>}
                              {a.actionChanged && !a.weakened && <span className="badge badge-update" style={{marginLeft:'4px'}}>OVERRIDE</span>}
                            </td>
                            <td><span className="badge badge-category">{a.category}</span></td>
                            <td style={{fontFamily:'IBM Plex Mono', fontSize:'12px'}}>{a.name}</td>
                            <td style={{fontSize:'12px', color:'var(--text-muted)'}}>
                              {a.current ? JSON.stringify(a.current) : '—'}
                            </td>
                            <td style={{fontSize:'12px', color:'var(--accent-green)'}}>
                              {JSON.stringify(a.proposed)}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ) : (
                  <div>
                    <button className="btn btn-primary" onClick={runDryRun} disabled={loading}>
                      Run Dry Run Against Tenant
                    </button>
                    <p className="form-hint" style={{marginTop:'8px'}}>This will read your current configuration and show what would change.</p>
                  </div>
                )}
              </div>
            )}

            <div className="btn-group">
              <button className="btn btn-ghost" onClick={onBack}>← Back</button>
              {!auth.connected ? (
                <div className="alert alert-warning" style={{margin:0}}>Connect to ZIA first to apply changes</div>
              ) : (
                <button className="btn btn-success" onClick={onApply}>
                  Proceed to Apply →
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ========================
    // Step: Apply
    // ========================
    function ApplyStep({ template, plan, applyResult, setApplyResult, setError, loading, setLoading, onNext }) {
      const [confirmed, setConfirmed] = useState(false);

      const handleApply = async () => {
        setLoading(true); setError(null);
        try {
          const result = await api.call('POST', '/apply', {
            template,
            snapshotId: plan?.snapshotId
          });
          setApplyResult(result);
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      };

      const handleRollback = async () => {
        if (!plan?.snapshotId) return;
        setLoading(true);
        try {
          const result = await api.call('POST', '/rollback', { snapshotId: plan.snapshotId });
          alert(result.message);
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Apply Configuration</h2>
              <p>This will create policy rules in your ZIA tenant and activate the changes.</p>
            </div>

            {!applyResult ? (
              <div>
                <div className="alert alert-warning">
                  ⚠ <strong>Caution:</strong> This will make real changes to your ZIA tenant. A snapshot has been
                  taken for best-effort rollback. Created rules will be ordered above any conflicting existing rules.
                </div>

                <div className="toggle-item" style={{marginBottom:'1rem'}}>
                  <label onClick={() => setConfirmed(!confirmed)} style={{cursor:'pointer'}}>
                    I understand this will modify my ZIA tenant configuration and have reviewed the plan.
                  </label>
                  <div className={`toggle-switch ${confirmed ? 'active' : ''}`}
                    onClick={() => setConfirmed(!confirmed)}>
                    <div className="toggle-knob"></div>
                  </div>
                </div>

                <div className="btn-group">
                  <button className="btn btn-success" onClick={handleApply} disabled={!confirmed || loading}>
                    {loading ? <><span className="spinner"></span> Applying...</> : '🚀 Apply Changes'}
                  </button>
                </div>
              </div>
            ) : (
              <div>
                {applyResult.activated ? (
                  <div className="alert alert-success">
                    ✓ Changes applied and activated successfully!
                    Applied {applyResult.summary.applied} rules with {applyResult.summary.errors} errors.
                  </div>
                ) : (
                  <div className="alert alert-danger">
                    Changes were applied but activation may have failed. Check errors below.
                  </div>
                )}

                {applyResult.applied?.length > 0 && (
                  <div style={{marginBottom:'1rem'}}>
                    <h3 style={{fontSize:'14px', marginBottom:'8px', color:'var(--accent-green)'}}>Applied ({applyResult.applied.length})</h3>
                    {applyResult.applied.map((a, i) => (
                      <div key={i} style={{padding:'6px 12px', borderBottom:'1px solid var(--border)', fontSize:'13px'}}>
                        <span className={`badge ${a.type==='CREATE' ? 'badge-create' : 'badge-update'}`}>{a.type}</span>
                        {' '}<span className="badge badge-category">{a.category}</span>
                        {' '}{a.name}
                        {a.id && <span style={{color:'var(--text-muted)', marginLeft:'8px'}}>ID: {a.id}</span>}
                      </div>
                    ))}
                  </div>
                )}

                {applyResult.errors?.length > 0 && (
                  <div style={{marginBottom:'1rem'}}>
                    <h3 style={{fontSize:'14px', marginBottom:'8px', color:'var(--accent-red)'}}>Errors ({applyResult.errors.length})</h3>
                    {applyResult.errors.map((e, i) => (
                      <div key={i} className="alert alert-danger" style={{fontSize:'13px'}}>
                        {e.category} / {e.name}: {e.error}
                      </div>
                    ))}
                  </div>
                )}

                <div className="btn-group">
                  <button className="btn btn-danger" onClick={handleRollback} disabled={loading}>
                    ↩ Attempt Rollback
                  </button>
                  <button className="btn btn-primary" onClick={onNext}>
                    View Audit Log →
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================
    // Step: Audit Log
    // ========================
    function AuditStep({ auditLogs, setAuditLogs, setError }) {
      const [loaded, setLoaded] = useState(false);

      useEffect(() => {
        if (!loaded) {
          api.call('GET', '/audit/logs').then(setAuditLogs).catch(e => setError(e.message));
          setLoaded(true);
        }
      }, [loaded]);

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Audit Log</h2>
              <p>Complete record of all actions taken during this session.</p>
            </div>

            <div className="btn-group" style={{marginTop:0, marginBottom:'1rem'}}>
              <button className="btn btn-ghost btn-sm" onClick={() => {
                window.open('/api/audit/export/csv', '_blank');
              }}>📥 Export CSV</button>
              <button className="btn btn-ghost btn-sm" onClick={() => {
                window.open('/api/audit/export/json', '_blank');
              }}>📥 Export JSON</button>
              <button className="btn btn-ghost btn-sm" onClick={() => {
                api.call('GET', '/audit/logs').then(setAuditLogs).catch(e => setError(e.message));
              }}>🔄 Refresh</button>
            </div>

            <div style={{maxHeight:'500px', overflowY:'auto', border:'1px solid var(--border)', borderRadius:'var(--radius)'}}>
              <div className="log-entry" style={{background:'var(--bg-secondary)', position:'sticky', top:0}}>
                <span style={{fontWeight:600}}>Timestamp</span>
                <span style={{fontWeight:600}}>Action</span>
                <span style={{fontWeight:600}}>Status</span>
                <span style={{fontWeight:600}}>Details</span>
              </div>
              {auditLogs.length === 0 ? (

    // ========================
    // Step: Policy Catalog (no auth required)
    // ========================
    function CatalogStep() {

      function getActionClass(action) {
        if (!action) return '';

      function renderPolicies(policies, tierKey, fwKey) {
        return Object.entries(policies).map(([policyType, rules]) => {

          const isOpen = openPolicies[pKey];

          return (
            <div className="catalog-policy-group" key={policyType}>
              <div className="catalog-policy-header" onClick={() => toggle(openPolicies, setOpenPolicies, pKey)}>

                {label}
                <span className="catalog-count">{count}</span>
              </div>
              {isOpen && Array.isArray(rules) && rules.map((r, i) => renderRule(r, i))}
              {isOpen && !Array.isArray(rules) && rules.settings && (

                  <div className="catalog-rule-name">{rules.name}</div>
                  {rules.description && <div className="catalog-rule-detail">{rules.description}</div>}

      }

      if (loading) return <div className="catalog-loading">Loading policy catalog...</div>;
      if (error) return <div className="alert alert-danger">Failed to load catalog: {error}</div>;
      if (!catalog) return null;

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>📖 Policy Catalog</h2>
              <p>Browse every rule across all security tiers and compliance frameworks. No authentication required. Click a tier to expand, then drill into frameworks and policy types to see individual rules with compliance mappings.</p>
            </div>

            <div className="explainer">
              <strong>How to use:</strong> Expand a security tier below, then pick a compliance framework (or "No Framework" for general-purpose).
              Each policy module shows every rule that would be created, including the action, URL categories, dictionaries, protocols, and
              mapped compliance controls. Use this to decide which tier and framework is right for your organization before connecting to ZIA.
            </div>

            {Object.entries(catalog.tiers).map(([tierKey, fwMap]) => {
              const meta = tierMeta[tierKey] || { icon: '?', label: tierKey, color: 'var(--text-primary)' };
              const isTierOpen = openTiers[tierKey];
              const totalRules = Object.values(fwMap).reduce((sum, fw) =>
                sum + Object.values(fw.ruleCounts || {}).reduce((s, c) => s + c, 0), 0
              );

              return (
                <div className="catalog-tier" key={tierKey}>
                  <div className="catalog-tier-header" onClick={() => toggle(openTiers, setOpenTiers, tierKey)}>
                    <span className="arrow" style={{transform:isTierOpen?'rotate(90deg)':'none'}}>▶</span>
                    <span>{meta.icon}</span>
                    <span style={{color: meta.color}}>{meta.label}</span>
                    <span className="catalog-count">{Object.keys(fwMap).length} framework{Object.keys(fwMap).length !== 1 ? 's' : ''}</span>

                    const fKey = `${tierKey}-${fwKey}`;
                    const isFwOpen = openFws[fKey];
                    const fwLabel = fwKey === 'NONE' ? 'No Framework (General)' :
                      (catalog.frameworks[fwKey] ? `${catalog.frameworks[fwKey].name} — ${catalog.frameworks[fwKey].fullName}` : fwKey);
                    const rc = fwData.ruleCounts || {};
                    const totalFwRules = Object.values(rc).reduce((s, c) => s + c, 0);

                    return (
                      <div className="catalog-fw" key={fwKey}>
                        <div className="catalog-fw-header" onClick={() => toggle(openFws, setOpenFws, fKey)}>
                          <span className="arrow" style={{fontSize:'10px',transition:'transform 0.2s',transform:isFwOpen?'rotate(90deg)':'none'}}>▶</span>
                          <span>{fwKey === 'NONE' ? '🌐' : '📋'}</span>
                          <span>{fwLabel}</span>
                          <span className="catalog-count">{totalFwRules} rules</span>
                        </div>
                        {isFwOpen && (
                          <div>
                            <div className="catalog-summary" style={{margin:'0.5rem 0 0.25rem 1rem'}}>
                              {Object.entries(rc).map(([pt, c]) => (
                                <span key={pt} className="catalog-summary-chip">{policyLabels[pt]?.split(' ').slice(1).join(' ') || pt}: {c}</span>
                              ))}
                            </div>
                            {renderPolicies(fwData.policies, tierKey, fwKey)}

                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ========================
    // Step: Mobile Admin Portal (ZCC)
    // ========================
    // ZCC-08/09: same rules as server/v2/validate.js
    const splitList = (t) => String(t || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean);
    function classifyHostEntry(s) {
      const FQDN = /^(?=.{1,253}$)(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\.(?!-)[A-Za-z0-9-]{1,63}(?<!-))+$/;
      const ip = (x) => { const p = x.split('.'); return p.length === 4 && p.every(o => /^\d{1,3}$/.test(o) && +o <= 255); };
      if (/^\*\./.test(s)) return FQDN.test(s.slice(2)) ? { ok: true, type: 'wildcard' } : { ok: false, why: 'not a valid wildcard domain (use *.example.com)' };
      if (s.includes('*')) return { ok: false, why: 'wildcards are only allowed as a leading *.' };
      if (s.includes('/')) { const [a, m] = s.split('/'); return ip(a) && /^\d{1,2}$/.test(m) && +m <= 32 ? { ok: true, type: 'cidr' } : { ok: false, why: 'not a valid IPv4 CIDR (e.g. 10.0.0.0/24)' }; }
      if (/^[\d.]+$/.test(s)) return ip(s) ? { ok: true, type: 'ip' } : { ok: false, why: 'not a valid IPv4 address' };
      return FQDN.test(s) ? { ok: true, type: 'fqdn' } : { ok: false, why: 'not a valid domain name' };
    }
    function zccListErrors(lists, keys) {
      const out = {};
      for (const k of keys || []) {
        out[k] = [];
        for (const e of splitList(lists[k])) {
          if ((k === 'dnsInclusions' && e === '*') || (k === 'ipInclusions' && e === '0.0.0.0/0')) continue;
          const c = classifyHostEntry(e);
          if (!c.ok) out[k].push(`"${e}": ${c.why}`);
          else if (k === 'vpnGateways' && c.type === 'wildcard') out[k].push(`"${e}": wildcards are not allowed for VPN gateways`);
          else if ((k === 'ipInclusions' || k === 'ipExclusions') && (c.type === 'fqdn' || c.type === 'wildcard')) out[k].push(`"${e}": IP lists take an IP address or CIDR only (put domain names in the DNS lists)`);
        }
      }
      return out;
    }
    const ACTION_LABEL = { CREATE: 'Create', UPDATE: 'Update', NO_CHANGE: 'No change', MANUAL: 'Manual step', FAILED: 'Failed', SKIPPED: 'Skipped', DELETE: 'Delete', DELETED: 'Deleted' };
    const ACTION_CLASS = { CREATE: 'badge-create', UPDATE: 'badge-update', NO_CHANGE: 'badge-category', MANUAL: 'badge-update', FAILED: 'badge-risk', SKIPPED: 'badge-risk', DELETE: 'badge-risk', DELETED: 'badge-create' };
    function ActionBadge({ action }) { return <span className={`badge ${ACTION_CLASS[action] || 'badge-category'}`} data-action={action}>{ACTION_LABEL[action] || action}</span>; }

    const ZCC_STEPS = [
      { id: 'platform', label: 'Platform' },
      { id: 'forwarding', label: 'Forwarding Profile' },
      { id: 'template', label: 'App Profile' },
      { id: 'customize', label: 'Customize' },
      { id: 'review', label: 'Review' },
      { id: 'dryrun', label: 'Dry Run' },
      { id: 'apply', label: 'Apply' }
    ];

    const ZCC_PLATFORMS = [
      { id: 'windows', label: 'Windows', icon: '🪟', nameTag: 'Windows', blurb: 'Client Connector on Windows 10 / 11 devices', fwdDefault: 'new' },
      { id: 'macos', label: 'macOS', icon: '🍎', nameTag: 'macOS', blurb: 'Client Connector on Macs (Apple Silicon and Intel)', fwdDefault: 'new' }
    ];

    // Settings toggles grouped by category (shared by the forwarding and app profile steps)
    // Random tamper-protection password (letters, digits and a few symbols ZCC accepts); generated in the browser
    function genPassword(len = 16) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#%*_+=';
      const a = new Uint32Array(len); (window.crypto || window.msCrypto).getRandomValues(a);
      let pw = Array.from(a, x => chars[x % chars.length]).join('');
      if (!/[0-9]/.test(pw)) pw = pw.slice(0, -1) + '7';
      return pw;
    }
    function ZccSettingToggles({ settings, enabled, onToggle, extras }) {
      const cats = [...new Set(settings.map(s => s.category))];
      return cats.map(cat => (
        <div key={cat} style={{marginBottom:'1rem'}}>
          <h4 style={{fontSize:'13px', color:'var(--accent-blue)', margin:'0.75rem 0 0.5rem'}}>{cat}</h4>
          <div className="toggle-group">
            {settings.filter(s => s.category === cat).map(s => (
              <React.Fragment key={s.key}>
              <div className="toggle-item" data-setting={s.key}>
                <div>
                  <label onClick={() => onToggle(s.key)}>{s.label} {s.impact === 'caution' && <span className="badge badge-risk" style={{marginLeft:'6px'}}>REVIEW</span>}{s.manual && <span className="badge badge-risk" style={{marginLeft:'6px'}}>MANUAL</span>}</label>
                  <div className="form-hint">{s.description}</div>
                  <div className="form-hint">Sets: <strong>{s.value}</strong> · Portal default: {s.portalDefault}</div>
                </div>
                <div className={`toggle-switch ${enabled.has(s.key) ? 'active' : ''}`} onClick={() => onToggle(s.key)}><div className="toggle-knob"></div></div>
              </div>
              {extras && extras[s.key] && enabled.has(s.key) && <div style={{margin:'0 0 0.75rem 1rem'}}>{extras[s.key]}</div>}
              </React.Fragment>
            ))}
          </div>
        </div>
      ));
    }

    function ZccSettingsTable({ settings }) {
      return (
        <div style={{overflowX:'auto'}}>
          <table className="diff-table">
            <thead><tr><th>Category</th><th>Setting</th><th>New value</th><th>Portal default</th><th>What it does</th></tr></thead>
            <tbody>
              {settings.map(s => (
                <tr key={s.key}>
                  <td><span className="badge badge-category">{s.category}</span></td>
                  <td style={{fontWeight:600}}>{s.label}{s.impact === 'caution' && <span className="badge badge-risk" style={{marginLeft:'6px'}}>REVIEW</span>}{s.manual && <span className="badge badge-risk" style={{marginLeft:'6px'}}>MANUAL</span>}</td>
                  <td style={{color:'var(--accent-green)'}}>{s.value}</td>
                  <td style={{color:'var(--text-muted)'}}>{s.portalDefault}</td>
                  <td style={{fontSize:'12px', color:'var(--text-secondary)'}}>{s.description}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function ZccVerifyTable({ rows }) {
      if (!rows || !rows.length) return null;
      return (
        <table className="diff-table">
          <thead><tr><th></th><th>Setting</th><th>Expected</th><th>Read back</th></tr></thead>
          <tbody>
            {rows.map(v => (
              <tr key={v.key}><td>{v.manual ? '✋' : v.ok ? '✅' : '❌'}</td><td>{v.label}</td><td>{v.expected}</td><td>{v.manual ? 'Set in portal' : v.ok ? 'Matches' : (v.error || 'Different')}</td></tr>
            ))}
          </tbody>
        </table>
      );
    }

    // ========================
    // Mobile Admin: Create App Profile wizard
    // Windows v1.6.0, macOS v1.6.1, forwarding profile first v1.7.0
    // Platform -> Forwarding Profile -> App Profile -> Customize -> Review -> Dry Run -> Apply
    // ========================
    function ZccCreateWizard({ setError, config, forwardingProfiles, onExit, onCreated, guided, initialPlatform }) {
      const prefix = (config && (config.globalPrefix || config.prefix)) || 'ZTP';
      const [step, setStep] = useState('platform');
      const [platform, setPlatform] = useState(initialPlatform || 'windows');
      const initTag = initialPlatform === 'macos' ? 'macOS' : 'Windows';
      // v2.4: a saved POV (resume) or a template seeds the first platform's choices; used once, on the first load
      const seedRef = useRef((guided && guided.seed && guided.seed[initialPlatform || 'windows']) || null);
      const seed = seedRef.current;
      const [catalog, setCatalog] = useState(null);
      const [templateId, setTemplateId] = useState((seed && seed.templateId) || 'BEST_PRACTICE');
      const [enabled, setEnabled] = useState(null); // Set of app profile setting keys
      const [form, setForm] = useState({
        name: (seed && seed.name) || `${prefix}-${initTag}-BestPractice`,
        description: (seed && seed.description) || 'Created by ZTP Policy Wizard from the Best Practice template',
        forwardingProfileId: (seed && seed.forwardingProfileId) || 0,
        active: !!(seed && seed.active)
      });
      // Forwarding profile (created first, then linked to the app profile)
      const [fwdCatalog, setFwdCatalog] = useState(null);
      const [fwdMode, setFwdMode] = useState(seed && !seed.newForwardingProfile && seed.forwardingProfileId ? 'existing' : 'new'); // 'new' | 'existing'
      const [fwdTemplateId, setFwdTemplateId] = useState((seed && seed.newForwardingProfile && seed.newForwardingProfile.templateId) || 'BEST_PRACTICE');
      const [fwdEnabled, setFwdEnabled] = useState(null);
      const [fwdName, setFwdName] = useState((seed && seed.newForwardingProfile && seed.newForwardingProfile.name) || `${prefix}-FWD-${initTag}-BestPractice`);
      const [plan, setPlan] = useState(null);
      const [busy, setBusy] = useState(false);
      const [confirmed, setConfirmed] = useState(false);
      const [result, setResult] = useState(null);
      // v2.0: predefined IP-based bypass apps from the tenant (ZCC-03) and the five lists (ZCC-06..09)
      const [bypassApps, setBypassApps] = useState(null);
      const [bypassChecked, setBypassChecked] = useState(null);
      const [tamperPassword, setTamperPassword] = useState(() => (seed && seed.tamperPassword) || genPassword());
      const [showPw, setShowPw] = useState(false);
      const [listDefaults, setListDefaults] = useState(null);
      const [lists, setLists] = useState(null);      // { key: text } per list; null = defaults not loaded yet
      const [v2meta, setV2meta] = useState(null);

      const plat = ZCC_PLATFORMS.find(p => p.id === platform);
      useEffect(() => {
        api.call('GET', '/v2/meta').then(setV2meta).catch(() => {});
        api.call('GET', '/v2/zcc/bypass-apps').then(apps => { setBypassChecked(new Set(seed && Array.isArray(seed.bypassAppIds) ? seed.bypassAppIds : apps.map(a => a.id))); setBypassApps(apps); })
          .catch(e => setBypassApps({ error: e.message }));
      }, []);
      // Defaults shown for each list = what the chosen template produces (ZCC-07); reloaded when the template changes
      useEffect(() => {
        if (!templateId || !enabled) return;
        api.call('POST', `/v2/zcc/list-defaults/${platform}`, { templateId, enabledSettings: [...enabled] }).then(d => {
          setListDefaults(d);
          setLists(prev => {
            if (prev && prev.__platform === platform && prev.__template === templateId) return prev;
            const fromSeed = !prev && seed && seed.lists && platform === (initialPlatform || 'windows');
            return { __platform: platform, __template: templateId, ...Object.fromEntries(Object.entries(d).map(([k, v]) => [k, (fromSeed && Array.isArray(seed.lists[k]) ? seed.lists[k] : v).join(', ')])) };
          });
        }).catch(() => {});
      }, [platform, templateId, enabled && [...enabled].sort().join(',')]);
      const listErrors = lists && v2meta ? zccListErrors(lists, v2meta.zccListKeys) : {};
      const listsInvalid = Object.values(listErrors).some(e => e.length);

      // Forwarding profile an app template recommends (none of the POV templates do), else Default
      const recommendedFwdId = (t) => {
        const rec = t && t.recommendedForwardingProfile;
        if (!rec) return 0;
        const list = forwardingProfiles || [];
        const hit = list.find(f => String(f.id) === String(rec.id)) || list.find(f => (f.name || '').toLowerCase() === String(rec.name).toLowerCase());
        return hit ? Number(hit.id) : 0;
      };

      useEffect(() => {
        api.call('GET', '/zcc/fwd-templates').then(c => {
          setFwdCatalog(c);
          const t = c.find(x => x.id === fwdTemplateId) || c.find(x => x.id === 'BEST_PRACTICE') || c[0];
          const sf = seed && seed.newForwardingProfile && Array.isArray(seed.newForwardingProfile.enabledSettings) ? seed.newForwardingProfile.enabledSettings : null;
          setFwdEnabled(new Set(sf || t.settings.map(s => s.key)));
        }).catch(e => setError(e.message));
      }, []);

      useEffect(() => {
        let cancelled = false;
        setCatalog(null); setEnabled(null); setPlan(null);
        api.call('GET', `/zcc/templates/${platform}`).then(c => {
          if (cancelled) return;
          setCatalog(c);
          const t = c.find(x => x.id === templateId) || c.find(x => x.id === 'BEST_PRACTICE') || c[0];
          setTemplateId(t.id);
          const se = seedRef.current && platform === (initialPlatform || 'windows') && Array.isArray(seedRef.current.enabledSettings) ? seedRef.current.enabledSettings : null;
          setEnabled(new Set(se || t.settings.map(s => s.key)));
          if (!(seedRef.current && seedRef.current.forwardingProfileId)) setForm(f => ({ ...f, forwardingProfileId: recommendedFwdId(t) }));
        }).catch(e => setError(e.message));
        return () => { cancelled = true; };
      }, [platform]);

      // Forwarding profiles may arrive after the catalog: apply the recommendation once they do
      useEffect(() => {
        if (!catalog) return;
        const t = catalog.find(x => x.id === templateId);
        const rec = recommendedFwdId(t);
        if (rec && !Number(form.forwardingProfileId)) setForm(f => ({ ...f, forwardingProfileId: rec }));
      }, [forwardingProfiles, catalog]);

      const pickPlatform = (id) => {
        if (id === platform) return;
        const from = ZCC_PLATFORMS.find(p => p.id === platform), to = ZCC_PLATFORMS.find(p => p.id === id);
        setForm(f => ({ ...f, name: f.name.replace(`-${from.nameTag}-`, `-${to.nameTag}-`) }));
        setFwdName(n => n.replace(`-${from.nameTag}-`, `-${to.nameTag}-`));
        setFwdMode(to.fwdDefault);
        setPlatform(id);
      };

      const template = catalog ? catalog.find(t => t.id === templateId) : null;
      const chosen = template ? template.settings.filter(s => enabled && enabled.has(s.key)) : [];
      const fwdTemplate = fwdCatalog ? fwdCatalog.find(t => t.id === fwdTemplateId) : null;
      const fwdChosen = fwdTemplate ? fwdTemplate.settings.filter(s => fwdEnabled && fwdEnabled.has(s.key)) : [];
      const reached = ZCC_STEPS.findIndex(s => s.id === step);
      const isNewFwd = fwdMode === 'new';
      const existingFwdName = (forwardingProfiles || []).find(f => String(f.id) === String(form.forwardingProfileId))?.name || 'Default';
      const fwdLabel = isNewFwd ? fwdName : existingFwdName;
      const fwdNameTaken = isNewFwd && (forwardingProfiles || []).some(f => String(f.name || '').toLowerCase() === fwdName.trim().toLowerCase());

      const payload = () => ({
        ...form, templateId, enabledSettings: [...(enabled || [])],
        tamperPassword: enabled && enabled.has('tamperPasswords') ? tamperPassword : '',
        bypassAppIds: bypassChecked ? [...bypassChecked] : null,
        lists: lists ? Object.fromEntries(((v2meta && v2meta.zccListKeys) || []).map(k => [k, splitList(lists[k])])) : null,
        forwardingProfileId: isNewFwd ? 0 : form.forwardingProfileId,
        newForwardingProfile: isNewFwd ? { name: fwdName.trim(), templateId: fwdTemplateId, enabledSettings: [...(fwdEnabled || [])] } : null
      });

      const tamperPanel = (
        <div data-tamperpanel>
          <div className="form-hint" style={{marginBottom:'4px'}}>Password for this profile (shown in the summary report, which is then marked as containing secrets):</div>
          <div style={{display:'flex', gap:'6px', alignItems:'center', flexWrap:'wrap'}}>
            <input type={showPw ? 'text' : 'password'} value={tamperPassword} maxLength={64} autoComplete="new-password" style={{maxWidth:'260px', fontFamily:'IBM Plex Mono, monospace'}}
              onChange={e => { setPlan(null); setTamperPassword(e.target.value); }} data-tamperpw />
            <button className="btn btn-ghost btn-sm" onClick={() => setShowPw(!showPw)}>{showPw ? 'Hide' : 'Show'}</button>
            <button className="btn btn-ghost btn-sm" onClick={() => { setPlan(null); setTamperPassword(genPassword()); }} data-tampergen>Generate new</button>
            <button className="btn btn-ghost btn-sm" onClick={() => { try { navigator.clipboard.writeText(tamperPassword); } catch (e) {} }}>Copy</button>
          </div>
        </div>
      );
      const pickTemplate = (id) => {
        setTemplateId(id); setPlan(null);
        const t = catalog.find(x => x.id === id);
        setEnabled(new Set(t.settings.map(s => s.key)));
        setForm(f => ({ ...f, forwardingProfileId: recommendedFwdId(t) || f.forwardingProfileId }));
        if (id === 'PORTAL_DEFAULT') setForm(f => ({ ...f, name: f.name.replace(/BestPractice$/, 'Blank'), description: 'Created by ZTP Policy Wizard (portal defaults)' }));
        else setForm(f => ({ ...f, name: f.name.replace(/Blank$/, 'BestPractice'), description: 'Created by ZTP Policy Wizard from the Best Practice template' }));
      };
      const pickFwdTemplate = (id) => {
        setFwdTemplateId(id); setPlan(null);
        const t = fwdCatalog.find(x => x.id === id);
        setFwdEnabled(new Set(t.settings.map(s => s.key)));
        setFwdName(n => id === 'PORTAL_DEFAULT' ? n.replace(/BestPractice$/, 'Blank') : n.replace(/Blank$/, 'BestPractice'));
      };
      const toggle = (key) => { setPlan(null); setEnabled(prev => { const n = new Set(prev); n.has(key) ? n.delete(key) : n.add(key); return n; }); };
      const toggleFwd = (key) => { setPlan(null); setFwdEnabled(prev => { const n = new Set(prev); n.has(key) ? n.delete(key) : n.add(key); return n; }); };
