    // ========================
    // Policy Wizard 2.0 — global prefix, ZIA POV flow (scope → baseline → rules → dry run → apply), ZPA, bulk managers, report
    // ========================
    const POV_STEPS = [
      { id: 'scope', label: 'Scope' },
      { id: 'baseline', label: 'Baseline Framework' },
      { id: 'rules', label: 'Rules' },
      { id: 'review', label: 'Dry Run' },
      { id: 'done', label: 'Apply & Results' }
    ];
    const POV_DEFAULT = { scope: null, baseline: null, disabledRules: {}, actionSettings: { policy: {}, rules: {} }, settingOverrides: {}, cbiProfile: null, sslCertificate: null };
    const SCOPE_TO_TYPES = {
      urlFiltering: ['urlFiltering'], cloudAppControl: ['cloudAppControl'], fileTypeControl: ['fileTypeControl'], advancedThreatProtection: ['advancedThreatProtection'],
      firewallFiltering: ['firewallFiltering'], dnsSecurity: ['dnsSecurity'], sslInspection: ['sslInspection'], dlpMonitor: ['dlp'], dlpBlock: ['dlp'],
      endpointDlp: ['endpointDlp'], sandboxStandard: ['sandbox'], sandboxAdvanced: ['sandbox'], aiPromptCapture: ['aiPromptCapture']
    };
    const typesInScope = (scope) => new Set(Object.entries(scope || {}).filter(([, v]) => v).flatMap(([k]) => SCOPE_TO_TYPES[k] || []));
    /** SCP-03: keep choices whose policy type is still in scope; drop the rest. */
    function pruneToScope(pov, scope) {
      const t = typesInScope(scope);
      const keep = (key) => t.has(String(key).split(':')[0]);
      const f = (o) => Object.fromEntries(Object.entries(o || {}).filter(([k]) => keep(k)));
      const pol = Object.fromEntries(Object.entries(pov.actionSettings.policy || {}).filter(([k]) => t.has(k)));
      // DLP Monitor and Block generate different rules: switching between them drops the old DLP choices
      const dlpSwitched = pov.scope && ((!!pov.scope.dlpMonitor) !== (!!scope.dlpMonitor));
      const drop = (o) => dlpSwitched ? Object.fromEntries(Object.entries(o).filter(([k]) => !k.startsWith('dlp:'))) : o;
      return { ...pov, scope, disabledRules: drop(f(pov.disabledRules)), actionSettings: { policy: pol, rules: drop(f(pov.actionSettings.rules)) }, settingOverrides: f(pov.settingOverrides) };
    }
    const safeStore = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* not available */ } } };

    function useV2Meta() {
      const [meta, setMeta] = useState(null);
      useEffect(() => { api.call('GET', '/v2/meta').then(setMeta).catch(() => {}); }, []);
      return meta;
    }

    // ---------- §1 Scope ----------
    function ScopeStep({ meta, pov, setPov, licensing, onNext, onBack, nextLabel }) {
      const scope = pov.scope || Object.fromEntries(meta.scopeItems.map(i => [i.key, i.default]));
      const groupOf = (key) => Object.entries(meta.exclusiveGroups).find(([, keys]) => keys.includes(key));
      const lic = (key) => (licensing && licensing.items && licensing.items[key]) || null;
      const set = (key, on) => {
        const next = { ...scope, [key]: on };
        const g = groupOf(key);
        if (on && g) for (const other of g[1]) if (other !== key) next[other] = false;   // SCP-30/31
        setPov(prev => pruneToScope(prev, next));
      };
      useEffect(() => { if (!pov.scope) setPov(prev => ({ ...prev, scope })); }, []);
      // GLB-08 + SCP-04: an item the tenant is not licensed for is switched off, not just hidden
      useEffect(() => {
        if (!licensing || !licensing.items) return;
        const blocked = Object.entries(licensing.items).filter(([, v]) => v.licensed === false).map(([k]) => k);
        if (blocked.some(k => scope[k])) setPov(prev => pruneToScope(prev, { ...(prev.scope || scope), ...Object.fromEntries(blocked.map(k => [k, false])) }));
        // v2.6: a hidden standard edition (the advanced one is licensed) moves its choice to the advanced edition
        const UPGRADE = { sandboxStandard: 'sandboxAdvanced' };
        const hid = Object.entries(licensing.items).filter(([k, v]) => v.hidden && scope[k] && UPGRADE[k]).map(([k]) => k);
        if (hid.length) setPov(prev => pruneToScope(prev, { ...(prev.scope || scope), ...Object.fromEntries(hid.flatMap(k => [[k, false], [UPGRADE[k], true]])) }));
      }, [licensing, pov.scope]);
      const rows = (keys) => keys.map(key => {
        const item = meta.scopeItems.find(i => i.key === key);
        const l = lic(key);
        if (l && l.hidden) return null;   // v2.6: the advanced edition is licensed, so the standard one is not offered
        const blocked = l && l.licensed === false;
        const on = !!scope[key] && !blocked;
        return (
          <div key={key} className="toggle-item" style={{opacity: blocked ? 0.55 : 1}} title={blocked ? meta.copy.scope.notLicensed : ''} data-scope={key}>
            <div style={{flex:1}}>
              <label style={{cursor: blocked ? 'not-allowed' : 'pointer'}} onClick={() => !blocked && set(key, !scope[key])}>{item.label}
                {blocked && <span className="badge badge-risk" style={{marginLeft:'8px'}}>{meta.copy.scope.notLicensed}</span>}
                {l && l.licensed === null && <span className="badge badge-category" style={{marginLeft:'8px'}} title={l.reason}>Licence not confirmed</span>}
              </label>
              <div className="form-hint">{item.desc}</div>
              {licensing && licensing.notes && licensing.notes[key] && !(blocked && key === 'sandboxAdvanced') && (
                <div className="form-hint" data-editionnote={key} style={{color: licensing.notes[key].status === 'warn' ? 'var(--accent-amber)' : licensing.notes[key].status === 'pass' ? 'var(--accent-green)' : 'var(--text-muted)'}}>
                  {licensing.notes[key].status === 'warn' ? '⚠ ' : licensing.notes[key].status === 'pass' ? '✓ ' : 'ℹ '}{licensing.notes[key].text}</div>
              )}
              {key === 'endpointDlp' && on && licensing && licensing.endpointDlpEnabledInZcc !== true && (
                <div className="alert alert-warning" style={{marginTop:'6px'}}><span>⚠ {licensing.endpointDlpEnabledInZcc === false ? meta.copy.scope.endpointPrereqDisabled : meta.copy.scope.endpointPrereq}</span></div>
              )}
              {key === 'aiPromptCapture' && on && <div className="form-hint" style={{color:'var(--accent-amber)'}}>⚠ {meta.copy.aiPrompt.note}</div>}
              {l && l.licensed === null && on && <div className="form-hint" style={{color:'var(--accent-amber)'}}>{meta.copy.scope.licenceUnknown}</div>}
            </div>
            <div className={`toggle-switch ${on ? 'active' : ''}`} onClick={() => !blocked && set(key, !scope[key])} style={{cursor: blocked ? 'not-allowed' : 'pointer'}}><div className="toggle-knob"></div></div>
          </div>
        );
      });
      return (
        <div className="card" data-step="scope">
          <div className="card-header"><h2>{meta.copy.scope.title}</h2><p>{meta.copy.scope.intro}</p></div>
          {!licensing && <div className="form-hint" style={{marginBottom:'0.75rem'}}><span className="spinner"></span> Checking what this tenant is licensed for…</div>}
          <h3 style={{fontSize:'13px', margin:'0.5rem 0'}}>Data protection and sandbox</h3>
          <div className="form-hint" style={{marginBottom:'6px'}}>{meta.copy.scope.exclusiveNote}</div>
          {rows(['dlpMonitor', 'dlpBlock'])}
          {rows(['endpointDlp'])}
          {rows(['saasDlp', 'emailDlp'])}
          {rows(['sandboxStandard', 'sandboxAdvanced'])}
          {rows(['aiPromptCapture'])}
          <h3 style={{fontSize:'13px', margin:'1rem 0 0.5rem'}}>Core internet security</h3>
          {rows(['urlFiltering', 'cloudAppControl', 'fileTypeControl', 'advancedThreatProtection', 'firewallFiltering', 'dnsSecurity', 'sslInspection'])}
          <div className="btn-group">
            {onBack && <button className="btn btn-ghost" onClick={onBack}>← Back</button>}
            <button className="btn btn-primary" onClick={onNext} disabled={!Object.values(scope).some(Boolean)} data-next>{nextLabel || 'Next: Baseline Framework →'}</button>
          </div>
        </div>
      );
    }

    // ---------- §2 Baseline Framework ----------
    function BaselineStep({ meta, pov, setPov, setError, onNext, onBack }) {
      const fileRef = useRef(null);
      const pick = (id) => setPov(prev => (prev.baseline === id ? prev : { ...prev, baseline: id, disabledRules: {}, actionSettings: { policy: {}, rules: {} }, settingOverrides: {} }));
      const card = (b) => (
        <label key={b.id} className={`tier-card ${pov.baseline === b.id ? 'selected' : ''}`} style={{cursor:'pointer', display:'block', textAlign:'left'}} data-baseline={b.id}>
          <div style={{display:'flex', gap:'8px', alignItems:'center'}}>
            <input type="radio" name="baseline" checked={pov.baseline === b.id} onChange={() => pick(b.id)} />
            <div className="tier-name" style={{margin:0}}>{b.name}</div>
          </div>
          <div className="tier-desc" style={{marginTop:'4px'}}>{b.fullName !== b.name ? <><strong>{b.fullName}.</strong> </> : ''}{b.description}</div>
          <div className="form-hint" style={{marginTop:'4px'}}>Definition {b.version} · researched {b.researchedAt} · {b.sources.length} sources</div>
        </label>
      );
      const save = () => {
        const data = { format: 'zpw-pov-selections', version: 2, savedAt: new Date().toISOString(), pov };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pov-selections-${pov.baseline || 'draft'}.json`; a.click();
      };
      const load = async (file) => {
        try {
          const j = JSON.parse(await file.text());
          if (j.format !== 'zpw-pov-selections' || !j.pov) throw new Error('This is not a saved POV selections file.');
          setPov({ ...POV_DEFAULT, ...j.pov, cbiProfile: null, sslCertificate: null });
        } catch (e) { setError(e.message); }
        if (fileRef.current) fileRef.current.value = '';
      };
      const selected = [...meta.baselines.compliance, ...meta.baselines.nonMapped].find(b => b.id === pov.baseline);
      return (
        <div className="card" data-step="baseline">
          <div className="card-header"><h2>{meta.copy.baseline.title}</h2><p>{meta.copy.baseline.intro}</p></div>
          <h3 style={{fontSize:'13px', margin:'0.5rem 0'}}>Compliance frameworks</h3>
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(260px, 1fr))', gap:'10px'}}>{meta.baselines.compliance.map(card)}</div>
          <h3 style={{fontSize:'13px', margin:'1.25rem 0 0.5rem'}}>{meta.copy.baseline.nonMappedTitle}</h3>
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(260px, 1fr))', gap:'10px'}}>{meta.baselines.nonMapped.map(card)}</div>
          {selected && (
            <details style={{marginTop:'1rem'}}>
              <summary style={{cursor:'pointer', fontSize:'13px'}}>Sources for {selected.name} ({selected.sources.length})</summary>
              <ul style={{fontSize:'12px', marginTop:'6px'}}>{selected.sources.map(s => <li key={s.id}><a href={s.url} target="_blank" rel="noreferrer">{s.title}</a></li>)}</ul>
            </details>
          )}
          <div style={{display:'flex', gap:'8px', marginTop:'1rem', flexWrap:'wrap'}}>
            <input ref={fileRef} type="file" accept=".json,application/json" style={{display:'none'}} onChange={e => e.target.files[0] && load(e.target.files[0])} data-loadselections />
            <button className="btn btn-ghost btn-sm" onClick={() => fileRef.current && fileRef.current.click()}>📂 Load saved selections…</button>
            <button className="btn btn-ghost btn-sm" onClick={save} disabled={!pov.baseline}>💾 Save selections…</button>
            <span className="form-hint" style={{margin:0}}>Saves scope, baseline, rule switches and Allow / Block choices to reuse with another customer.</span>
          </div>
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={onBack}>← Scope</button>
            <button className="btn btn-primary" onClick={onNext} disabled={!pov.baseline} data-next>Next: Rules →</button>
          </div>
        </div>
      );
    }

    // ---------- §2.1 Rule review ----------
    // v2.4: switching POVs can briefly render the rules step with a reset (scope-less) selection; show nothing until it has one
    function PovRulesStep(props) { return props.pov && props.pov.scope ? <PovRulesStepInner {...props} /> : null; }
    function PovRulesStepInner({ meta, pov, setPov, prefix, auth, setError, onNext, onBack, nextLabel, backLabel }) {
      const [tpl, setTpl] = useState(null);
      const [open, setOpen] = useState({});
      const [q, setQ] = useState('');
      const [changedOnly, setChangedOnly] = useState(false);
      const searchRef = useRef(null);
      const [certs, reloadCerts] = useSslCertificates(!!(pov.scope && pov.scope.sslInspection) && auth.connected);
      const key = JSON.stringify([pov.baseline, pov.scope, prefix]);
      useEffect(() => {
        let gone = false;
        setTpl(null);
        api.call('POST', '/v2/zia/generate', { baseline: pov.baseline, scope: pov.scope, prefix }).then(t => { if (!gone) setTpl(t); }).catch(e => setError(e.message));
        return () => { gone = true; };
      }, [key]);
      const disabled = pov.disabledRules || {};
      const choices = pov.actionSettings || { policy: {}, rules: {} };
      const setRuleOn = (k, on) => setPov(p => { const d = { ...p.disabledRules }; if (on) delete d[k]; else d[k] = true; return { ...p, disabledRules: d }; });
      const setGroupOn = (g, on) => setPov(p => { const d = { ...p.disabledRules }; for (const r of (g.rules || g.settings)) { if (on) delete d[r.key]; else d[r.key] = true; } return { ...p, disabledRules: d }; });
      const setAll = (on) => setPov(p => { const d = { ...p.disabledRules }; for (const g of tpl.catalog) for (const r of (g.rules || g.settings)) { if (on) delete d[r.key]; else d[r.key] = true; } return { ...p, disabledRules: d }; });
      // FWK-11/12, OQ-9: the bulk control rewrites every rule in the category; a rule choice after that wins until the bulk control is used again
      const bulk = (type, v) => setPov(p => {
        const rules = Object.fromEntries(Object.entries(p.actionSettings.rules).filter(([k]) => !k.startsWith(type + ':')));
        const policy = { ...p.actionSettings.policy }; if (v === 'DEFAULT') delete policy[type]; else policy[type] = v;
        return { ...p, actionSettings: { policy, rules } };
      });
      const setRuleAction = (r, v) => setPov(p => ({ ...p, actionSettings: { ...p.actionSettings, rules: { ...p.actionSettings.rules, [r.key]: v } } }));
      const effective = (g, r) => {
        const rc = choices.rules[r.key]; if (rc) return rc;
        const pc = choices.policy[g.type]; if (pc === 'ALLOW' || pc === 'BLOCK') return pc;
        const d = String(r.defaultAction || '');
        return /^(ALLOW)/.test(d) ? 'ALLOW' : /^(BLOCK|DENY)/.test(d) ? 'BLOCK' : d === 'ISOLATE' ? 'ISOLATE' : null;
      };
      const settingValue = (s) => pov.settingOverrides[s.key] !== undefined ? pov.settingOverrides[s.key] : s.defaultValue;
      // 19: search, changed-from-default filter, expand / collapse, keyboard shortcuts
      const isChanged = (g, r) => !!disabled[r.key] || !!choices.rules[r.key] || !!choices.policy[g.type] || pov.settingOverrides[r.key] !== undefined;
      const visible = (g, r) => (!q || `${r.name || r.label} ${r.description || ''}`.toLowerCase().includes(q.toLowerCase())) && (!changedOnly || isChanged(g, r));
      const setAllOpen = (v) => tpl && setOpen(Object.fromEntries(tpl.catalog.map(g => [g.type, v])));
      useEffect(() => {
        const onKey = (e) => {
          const typing = /INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '');
          if (e.key === '/' && !typing) { e.preventDefault(); searchRef.current && searchRef.current.focus(); }
          else if (e.key === 'Escape' && typing && e.target === searchRef.current) { setQ(''); e.target.blur(); }
          else if (!typing && (e.key === 'e' || e.key === 'E')) setAllOpen(true);
          else if (!typing && (e.key === 'c' || e.key === 'C')) setAllOpen(false);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [tpl]);
      if (!tpl) return <div className="card"><div style={{textAlign:'center', padding:'2rem'}}><div className="spinner" style={{margin:'0 auto'}}></div><div className="form-hint">Building the rule set for {pov.baseline}…</div></div></div>;
      const total = tpl.catalog.reduce((n, g) => n + (g.rules || g.settings).length, 0);
      const off = tpl.catalog.reduce((n, g) => n + (g.rules || g.settings).filter(r => disabled[r.key]).length, 0);
      const anyIsolate = Object.values(choices.rules).includes('ISOLATE');
      return (
        <div className="card" data-step="rules">
          <div className="card-header"><h2>Rules — {tpl.metadata.baseline.name}</h2>
            <p>Every rule the baseline creates for the features in scope, grouped by category. Switch rules on or off, and choose Allow or Block per category or per rule. A rule you change after using the category control keeps your choice until you use the category control again.</p></div>
          <div className="alert alert-info"><span>{total - off} of {total} rules and settings on · names start with <code>{prefix}-</code></span></div>
          {(() => { const items = tpl.catalog.flatMap(g => g.rules || g.settings); const mapped = items.filter(r => r.compliance && r.compliance.controls.length).length;
            return <div className="form-hint" style={{marginTop:'-0.25rem', marginBottom:'0.75rem'}} data-compliancesummary>Compliance profile <strong>{tpl.metadata.baseline.name}</strong>{pov.fromIntake ? ' (chosen on Customer intake)' : ''}: {mapped} of {items.length} map to its controls; the rest show why (best practice, differentiating use case, operational, privacy). </div>; })()}
          <div style={{display:'flex', gap:'6px', flexWrap:'wrap', marginBottom:'0.75rem'}} data-rulespack>
            {[['mapping-html', '⬇ Control mapping report'], ['mapping-csv', 'CSV'], ['policy-json', '⬇ Policy export (JSON)'], ['policy-csv', 'CSV'], ['testplan-html', '⬇ Test plan by control'], ['testplan-csv', 'CSV']].map(([id, l]) =>
              <button key={id} className="btn btn-ghost btn-sm" data-rulespackfile={id} onClick={() => downloadPack(id, { baseline: pov.baseline, scope: pov.scope, prefix, disabledRules: pov.disabledRules, actionSettings: pov.actionSettings, settingOverrides: pov.settingOverrides }).catch(e => setError(e.message))}>{l}</button>)}
          </div>
          {(tpl.generationNotes || []).length > 0 && <div className="alert alert-warning" style={{display:'block'}}>{tpl.generationNotes.map((n, i) => <div key={i}>⚠ {n}</div>)}</div>}
          {(tpl.licenceSkipped || []).length > 0 && (
            <details style={{margin:'0 0 0.75rem'}} data-licenceskipped>
              <summary style={{cursor:'pointer', fontSize:'13px'}}>Not licensed on this tenant: {tpl.licenceSkipped.length} rule(s) left out</summary>
              <ul style={{fontSize:'12px', margin:'6px 0 0 18px'}}>{tpl.licenceSkipped.map((r, i) => <li key={i}>{r.name}: <span className="badge badge-risk">Not licensed</span> {r.reason}</li>)}</ul>
            </details>
          )}
          <div style={{display:'flex', gap:'6px', marginBottom:'0.75rem', flexWrap:'wrap', alignItems:'center'}}>
            <button className="btn btn-ghost btn-sm" onClick={() => setAll(true)} data-globalselect>Select all</button>
            <button className="btn btn-ghost btn-sm" onClick={() => setAll(false)} data-globaldeselect>Deselect all</button>
            <span style={{width:'12px'}}></span>
            <input ref={searchRef} type="search" value={q} placeholder="Search rules  ( / )" onChange={e => setQ(e.target.value)} style={{width:'220px'}} data-rulesearch />
            <label style={{fontSize:'12px', display:'flex', gap:'4px', alignItems:'center', cursor:'pointer'}}><input type="checkbox" checked={changedOnly} onChange={e => setChangedOnly(e.target.checked)} data-changedonly /> Changed from default</label>
            <button className="btn btn-ghost btn-sm" onClick={() => setAllOpen(true)} title="E" data-expandall>Expand all</button>
            <button className="btn btn-ghost btn-sm" onClick={() => setAllOpen(false)} title="C" data-collapseall>Collapse all</button>
            <span className="form-hint" style={{margin:0}}>Keys: / search · E expand · C collapse · Esc clear</span>
          </div>
          {(anyIsolate || (pov.scope.sandboxAdvanced)) && <IsolationProfilePicker config={pov} setConfig={(c) => setPov(typeof c === 'function' ? c : () => c)} auth={auth} />}
          {pov.scope.sslInspection && (
            <div className="form-group">
              <label className="form-label">SSL interception certificate (for the Inspect rules this creates)</label>
              <CertificatePicker value={pov.sslCertificate || null} onChange={(c) => setPov(p => ({ ...p, sslCertificate: c }))} certs={certs} reload={reloadCerts} testId="pov" />
            </div>
          )}
          {tpl.catalog.map(g => {
            const all = g.rules || g.settings;
            const items = all.filter(r => visible(g, r));
            if ((q || changedOnly) && !items.length) return null;
            const isOpen = open[g.type] || ((q || changedOnly) && items.length > 0);
            const onCount = all.filter(r => !disabled[r.key]).length;
            const pol = choices.policy[g.type] || 'DEFAULT';
            return (
              <div className="ab-group" key={g.type} data-rulegroup={g.type}>
                <div className="ab-group-header" onClick={() => setOpen({ ...open, [g.type]: !open[g.type] })}>
                  <div><div className="ab-group-title">{isOpen ? '▾' : '▸'} {g.label}</div><div className="ab-group-sub">{onCount} of {all.length} on · {all.filter(r => r.compliance && r.compliance.controls.length).length} mapped to {tpl.metadata.baseline.name}{(q || changedOnly) ? ` · ${items.length} shown` : ''}</div></div>
                  <div style={{display:'flex', gap:'8px'}} onClick={e => e.stopPropagation()}>
                    <div className="ab-seg">
                      <button className={onCount === all.length ? 'on-default' : ''} onClick={() => setGroupOn(g, true)} data-allon>Select all</button>
                      <button className={onCount === 0 ? 'on-block' : ''} onClick={() => setGroupOn(g, false)} data-alloff>Deselect all</button>
                    </div>
                    {g.canOverride && (
                      <div className="ab-seg">
                        <button className={pol === 'DEFAULT' ? 'on-default' : ''} onClick={() => bulk(g.type, 'DEFAULT')}>Default</button>
                        <button className={pol === 'ALLOW' ? 'on-allow' : ''} onClick={() => bulk(g.type, 'ALLOW')} data-bulkallow>Allow all</button>
                        <button className={pol === 'BLOCK' ? 'on-block' : ''} onClick={() => bulk(g.type, 'BLOCK')} data-bulkblock>Block all</button>
                      </div>
                    )}
                  </div>
                </div>
                {isOpen && (
                  <div className="ab-rows">
                    {g.type === 'aiPromptCapture' && <div className="alert alert-warning" style={{margin:'0.5rem'}}><span>⚠ {meta.copy.aiPrompt.note}</span></div>}
                    {g.type === 'ucaas' && <div className="form-hint" style={{margin:'0.5rem'}}>Advanced Settings → Unified communications as a service (UCaaS). Enabled for every Zscaler Internet Access run so these apps are recognised and handled correctly.</div>}
                    {items.map(r => {
                      const isOff = !!disabled[r.key];
                      const eff = g.rules ? effective(g, r) : null;
                      return (
                        <div className="ab-row" key={r.key} data-rule={r.key} style={{opacity: isOff ? 0.5 : 1}}>
                          <div style={{display:'flex', gap:'12px', alignItems:'flex-start'}}>
                            <div className={`toggle-switch ${isOff ? '' : 'active'}`} style={{flexShrink:0}} onClick={() => setRuleOn(r.key, isOff)} data-ruletoggle={r.key}><div className="toggle-knob"></div></div>
                            <div>
                              <div className="ab-row-name">{r.name || r.label}</div>
                              {r.description && <div className="ab-row-desc">{r.description}</div>}
                              {g.rules && <div className="ab-row-desc">Default: <strong>{r.defaultAction}</strong>{r.categoryCount !== undefined && <> · {r.categoryCount} categories</>}{r.allowOnly && ' · Allow only (monitor)'}</div>}
                              {g.settings && <div className="ab-row-desc">{g.type === 'aiPromptCapture' ? (isOff ? 'Capture off' : 'Capture on') : g.type === 'ucaas' ? (isOff ? 'Off' : 'Enabled') : isOff ? 'Left as the tenant has it' : `Set to ${settingValue(r) ? 'Block' : 'Allow'}`}</div>}
                              {r.locked && <div className="ab-row-desc">🔒 Required for baseline internet access</div>}
                              {r.compliance && <div className="ab-row-desc" data-rulecompliance={r.key}>{r.compliance.controls.length
                                ? <>Maps to {r.compliance.controls.map(c => <span key={c.id} className="badge badge-category" style={{marginRight:'4px'}} title={c.name} data-control={c.id}>{c.id}</span>)}</>
                                : <><span className="badge badge-risk" style={{marginRight:'6px'}} data-reason={r.compliance.reason.code}>{r.compliance.reason.label}</span>{r.compliance.reason.text}</>}</div>}
                            </div>
                          </div>
                          {g.rules && r.canOverride && !r.locked && (
                            <div className="ab-seg">
                              <button disabled={isOff} className={eff === 'ALLOW' ? 'on-allow' : ''} onClick={() => setRuleAction(r, 'ALLOW')}>Allow</button>
                              <button disabled={isOff} className={eff === 'BLOCK' ? 'on-block' : ''} onClick={() => setRuleAction(r, 'BLOCK')}>Block</button>
                              {g.canIsolate && <button disabled={isOff} className={eff === 'ISOLATE' ? 'on-default' : ''} onClick={() => setRuleAction(r, 'ISOLATE')}>Isolate</button>}
                            </div>
                          )}
                          {g.type === 'advancedThreatProtection' && !isOff && (
                            <div className="ab-seg">
                              <button className={!settingValue(r) ? 'on-allow' : ''} onClick={() => setPov(p => ({ ...p, settingOverrides: { ...p.settingOverrides, [r.key]: false } }))}>Allow</button>
                              <button className={settingValue(r) ? 'on-block' : ''} onClick={() => setPov(p => ({ ...p, settingOverrides: { ...p.settingOverrides, [r.key]: true } }))}>Block</button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={onBack}>{backLabel || '← Baseline'}</button>
            <button className="btn btn-primary" onClick={onNext} data-next>{nextLabel || 'Run Dry Run →'}</button>
          </div>
        </div>
      );
    }

    function LedgerTable({ ledger, filterProduct }) {
      const [show, setShow] = useState('changes');
      const rows = (ledger || []).filter(e => show === 'all' || e.action !== 'NO_CHANGE');
      return (
        <div>
          <div style={{display:'flex', gap:'6px', margin:'0.5rem 0'}}>
            <button className={`btn btn-sm ${show === 'changes' ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setShow('changes')}>Changes only</button>
            <button className={`btn btn-sm ${show === 'all' ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setShow('all')} data-showall>Everything ({(ledger || []).length})</button>
          </div>
          <table className="diff-table" data-ledger>
            <thead><tr>{!filterProduct && <th>Product</th>}<th>Type</th><th>Name</th><th>Planned action</th><th>Detail</th></tr></thead>
            <tbody>
              {rows.map((e, i) => (
                <tr key={i}>
                  {!filterProduct && <td>{e.product}</td>}
                  <td>{e.category}</td><td style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'12px'}}>{e.name}</td>
                  <td><ActionBadge action={e.action} /></td>
                  <td style={{fontSize:'12px'}}>
                    {e.error || (!e.details && e.changes ? 'Changes: ' + e.changes.join(', ') : '') || e.note || e.why || ''}
                    {e.details && e.details.length > 0 && (
                      <div data-fielddiff>{e.why && <div>{e.why}</div>}{e.details.map((d, j) => (
                        <div key={j} style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'11px', margin:'2px 0'}}>
                          <strong>{d.field}</strong>: <span style={{color:'var(--accent-red)', textDecoration:'line-through'}}>{d.from}</span> → <span style={{color:'var(--accent-green)'}}>{d.to}</span>
                        </div>))}
                        {(e.changes || []).filter(c => /^order /.test(c)).map((c, j) => <div key={'o' + j} style={{fontSize:'11px'}}>{c}</div>)}
                      </div>
                    )}
                  </td>
                </tr>
              ))}
              {!rows.length && <tr><td colSpan={5} style={{color:'var(--text-muted)'}}>Nothing to change.</td></tr>}
            </tbody>
          </table>
        </div>
      );
    }
    const countLine = (c) => Object.entries(c || {}).map(([k, v]) => `${ACTION_LABEL[k] || k} ${v}`).join(' · ') || 'nothing';

    // ---------- Dry run + apply (GLB-03/04) ----------
    // v2.8: what the dry run found about the customer's own rules, the API budget, and steps the API cannot do
    function ShadowPanel({ shadow }) {
      if (!shadow) return null;
      const f = shadow.findings || [];
      const icon = (x) => x.severity === 'high' ? '✕' : x.severity === 'medium' ? '⚠' : 'ℹ';
      return (
        <div className={`alert ${f.some(x => x.severity === 'high') ? 'alert-danger' : f.length ? 'alert-warning' : 'alert-info'}`} style={{display:'block'}} data-shadow={f.length}>
          <div><strong>Customer rules above the POV rules:</strong> {shadow.summary}</div>
          {f.slice(0, 12).map((x, i) => <div key={i} style={{marginTop:'4px', fontSize:'13px'}} data-shadowfinding={x.kind}>{icon(x)} <strong>{x.rule}</strong> <span className="form-hint" style={{display:'inline'}}>({x.policy})</span>: {x.reason} <em>{x.fix}</em></div>)}
          {f.length > 12 && <div className="form-hint">…and {f.length - 12} more; all of them are in the summary report.</div>}
          {shadow.note && <div className="form-hint">{shadow.note}</div>}
        </div>
      );
    }
    function PlanExtras({ plan }) {
      if (!plan) return null;
      return (<>
        <ShadowPanel shadow={plan.shadow} />
        {plan.forecast && <div className="form-hint" data-forecast>⏱ {plan.forecast.text}{plan.forecast.fits === false ? ' That is more than this API client has left this hour: the run stops when the budget runs out, and running it again later carries on.' : ''}</div>}
        {(plan.manualSteps || []).length > 0 && <details className="form-hint" data-manualsteps><summary style={{cursor:'pointer'}}>{plan.manualSteps.length} step{plan.manualSteps.length === 1 ? '' : 's'} to finish in the portal (the API cannot do these)</summary><ul style={{margin:'4px 0 0'}}>{plan.manualSteps.map((m, i) => <li key={i}><strong>{m.area}:</strong> {m.step}</li>)}</ul></details>}
      </>);
    }
    const applyError = (e) => e.data && Array.isArray(e.data.changed) && e.data.changed.length ? `${e.message} Changed: ${e.data.changed.join('; ')}.` : e.message;

    function PovReviewStep({ pov, prefix, setError, result, setResult, onBack, onDone }) {
      const [plan, setPlan] = useState(null);
      const [busy, setBusy] = useState(false);
      const [confirmed, setConfirmed] = useState(false);
      const body = () => ({ baseline: pov.baseline, scope: pov.scope, prefix, disabledRules: pov.disabledRules, actionSettings: pov.actionSettings,
        settingOverrides: pov.settingOverrides, cbiProfile: pov.cbiProfile, sslCertificate: pov.sslCertificate });
      const run = async () => { setBusy(true); setError(null); setPlan(null); try { setPlan(await api.call('POST', '/v2/zia/plan', body())); } catch (e) { setError('Dry run failed: ' + e.message); } setBusy(false); };
      useEffect(() => { run(); }, []);
      const apply = async () => {
        setBusy(true); setError(null);
        try { const r = await api.call('POST', '/v2/zia/apply', { ...body(), planId: plan.planId }); setResult(r); onDone(); }
        catch (e) { setError('Apply failed: ' + applyError(e)); }
        setBusy(false);
      };
      return (
        <div className="card" data-step="review">
          <div className="card-header"><h2>Dry run</h2><p>Nothing has been changed yet. This is exactly what Apply will do: each object is matched by name in your tenant.</p></div>
          {busy && !plan && <div style={{textAlign:'center', padding:'2rem'}}><div className="spinner" style={{margin:'0 auto'}}></div><div className="form-hint">Reading your tenant and comparing…</div></div>}
          {plan && (<>
            <div className="alert alert-info" data-plancounts><span><strong>Planned:</strong> {countLine(plan.counts)}</span></div>
            {plan.errors.map((e, i) => <div key={i} className="alert alert-danger"><span>✕ {e}</span></div>)}
            {plan.warnings.length > 0 && (
              <div className="alert alert-warning" style={{display:'block'}} data-planwarnings>{plan.warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}</div>
            )}
            {plan.resolved && plan.resolved.cbi && plan.resolved.cbi.name && <div className="form-hint">Isolation profile: {plan.resolved.cbi.name}</div>}
            <PlanExtras plan={plan} />
            <LedgerTable ledger={plan.ledger} filterProduct />
            <div className="toggle-item" style={{marginTop:'1rem'}}>
              <label onClick={() => setConfirmed(!confirmed)} style={{cursor:'pointer'}}>I have reviewed this dry run. Apply these changes to ZIA and activate them.</label>
              <div className={`toggle-switch ${confirmed ? 'active' : ''}`} onClick={() => setConfirmed(!confirmed)} data-confirm><div className="toggle-knob"></div></div>
            </div>
          </>)}
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={onBack} disabled={busy}>← Rules</button>
            <button className="btn btn-ghost" onClick={run} disabled={busy}>↻ Re-run dry run</button>
            <button className="btn btn-success" onClick={apply} disabled={!plan || !confirmed || busy} data-apply>{busy && plan ? <><span className="spinner"></span> Applying…</> : '🚀 Apply and activate'}</button>
          </div>
        </div>
      );
    }

    function PovDoneStep({ result, onReport, onRestart }) {
      if (!result) return null;
      const failed = result.ledger.filter(e => e.action === 'FAILED' || e.action === 'SKIPPED');
      return (
        <div className="card" data-step="done">
          <div className="card-header"><h2>Applied</h2><p>{countLine(result.counts)}. {result.activated === true ? 'Changes were activated.' : result.activated === false ? 'Activation failed — activate in the ZIA portal.' : 'Nothing needed activating.'}</p></div>
          {failed.length > 0 && <div className="alert alert-warning"><span>⚠ {failed.length} object(s) did not apply. Each one is listed below with the reason; everything else was applied.</span></div>}
          {result.warnings.length > 0 && <div className="alert alert-warning" style={{display:'block'}}>{result.warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}</div>}
          {result.verify && <div className={`alert ${result.verify.differ.length ? 'alert-warning' : 'alert-success'}`} style={{display:'block'}} data-verify={result.verify.differ.length}>{result.verify.text}{result.verify.differ.map((d, i) => <div key={i} className="form-hint" style={{margin:0}}>{d.category}: {d.name} — {d.why}</div>)}</div>}
          <LedgerTable ledger={result.ledger} filterProduct />
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={onRestart}>Start another run</button>
            <button className="btn btn-primary" onClick={onReport} data-gotoreport>Summary report →</button>
          </div>
        </div>
      );
    }

    // ---------- §5 ZPA wizard ----------
    // Application segment settings, used for the shared defaults and for per-application overrides in a bulk upload
    function ZpaSegmentSettings({ value, onChange, compact }) {
      const set = (k, v) => onChange({ ...value, [k]: v });
      const tog = (k, label, hint) => (
        <div className="toggle-item" key={k} style={compact ? {padding:'6px 10px'} : undefined}>
          <div><label onClick={() => set(k, !value[k])} style={{cursor:'pointer'}}>{label}</label>{hint && !compact && <div className="form-hint">{hint}</div>}</div>
          <div className={`toggle-switch ${value[k] ? 'active' : ''}`} onClick={() => set(k, !value[k])} data-zpaset={k}><div className="toggle-knob"></div></div>
        </div>
      );
      return (<>
        <div style={compact ? {display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:'8px'} : undefined}>
          <div className="form-group">
            <label className="form-label">Bypass / Client Steering</label>
            <select value={value.bypassType} onChange={e => set('bypassType', e.target.value)}>
              <option value="NEVER">Use Client Forwarding Policy</option><option value="ALWAYS">Always bypass</option><option value="ON_NET">Bypass on corporate network</option>
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Health check</label>
            <select value={value.healthReporting} onChange={e => set('healthReporting', e.target.value)}>
              <option value="ON_ACCESS">On Access</option><option value="CONTINUOUS">Continuous</option><option value="NONE">None</option>
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">App Connector selection</label>
            <select value={value.selectConnectorCloseToApp ? 'APP' : 'USER'} onChange={e => set('selectConnectorCloseToApp', e.target.value === 'APP')}>
              <option value="USER">Closer to User</option><option value="APP">Closer to Application (no UDP)</option>
            </select>
          </div>
        </div>
        <div style={compact ? {display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:'6px'} : undefined}>
          {tog('icmpAccessType', 'Pingable')}
          {tog('isCnameEnabled', 'Client Connector can receive CNAME')}
          {tog('clientlessAccess', 'Clientless Access: Enabled', 'Needs a web server certificate; set up in the ZPA portal.')}
          {tog('adpEnabled', 'Active Directory Inspection')}
          {tog('autoAppProtectEnabled', 'Auto App Protection')}
          {tog('useInDrMode', 'Disaster Recovery')}
          {tog('ipAnchored', 'Source IP Anchor')}
          {tog('tcpKeepAlive', 'TCP Keepalive')}
          {tog('doubleEncrypt', 'Double Encryption')}
          {tog('bypassOnReauth', 'Bypass during Reauthentication')}
        </div>
      </>);
    }

    function ZpaWizard({ meta, prefix, setError, onReport, guided }) {
      const [ctx, setCtx] = useState(null);
      // v2.4: init = { domains } or { apps } from the preset, or the saved choices of a POV being resumed ({ saved: body }); seed = template choices
      const init0 = (guided && guided.initial) || {};
      const saved = init0.saved || null;
      const seedZ = (guided && guided.seed) || {};
      const init = saved ? { domains: saved.domains, apps: saved.apps } : init0;
      const [form, setForm] = useState({ domains: init.domains || '', tcpPorts: (saved && saved.tcpPorts) || '1-52, 54-65535', udpPorts: (saved && saved.udpPorts !== undefined ? saved.udpPorts : '1-52, 54-65535'), connectorGroupId: (saved && saved.connectorGroupId) || '',
        descriptions: { connectorGroup: meta.copy.zpa.connectorGroupDescription, appSegment: meta.copy.zpa.appSegmentDescription, ...((saved || seedZ).descriptions || {}) } });
      const [settings, setSettings] = useState({ ...meta.zpaDefaults, ...((saved || seedZ).settings || {}) });
      const [policies, setPolicies] = useState({ access: true, timeout: true, inspection: true, isolation: true, ...((saved || seedZ).policies || {}) });
      const [pra, setPra] = useState({ rdpHost: '', sshHost: '', ...((saved && saved.pra) || {}) });
      const [iso, setIso] = useState({ enabled: true, copyPaste: 'none', uploadDownload: 'none', allowPrinting: false, watermark: true, watermarkMessage: 'Zscaler POV', ...((saved || seedZ).isolationProfile || {}) });
      const [ba, setBa] = useState({ domain: '', port: '443', certificateId: '', ...((saved && saved.browserAccess) || {}) });
      const [bulk, setBulk] = useState(!!(init.apps && init.apps.length));
      const [apps, setApps] = useState(() => (init.apps || []).map(a => ({ ...a, settings: a.settings || {} })));            // [{ name, destinations[], tcpPorts, udpPorts, row, settings }]
      const [csvErrors, setCsvErrors] = useState([]);
      const [csvName, setCsvName] = useState('');
      const [openApp, setOpenApp] = useState(null);
      const [errors, setErrors] = useState([]);
      const [plan, setPlan] = useState(null);
      const [result, setResult] = useState(null);
      const [busy, setBusy] = useState(false);
      const [reveal, setReveal] = useState(false);
      const [confirmed, setConfirmed] = useState(false);
      useEffect(() => { api.call('GET', '/v2/zpa/context').then(setCtx).catch(e => setCtx({ error: e.message })); }, []);
      useEffect(() => { setPlan(null); setConfirmed(false); }, [JSON.stringify([form, settings, bulk, apps, policies, pra, iso, ba])]);
      useEffect(() => {
        if (bulk && !apps.length) { setErrors([]); return; }
        const t = setTimeout(() => api.call('POST', '/v2/zpa/validate', bulk ? { apps: apps.map(a => ({ ...a, destinations: destList(a.destinations) })), settings, pra, browserAccess: ba } : { domains: form.domains, tcpPorts: form.tcpPorts, udpPorts: form.udpPorts, settings, pra, browserAccess: ba }).then(r => setErrors(r.errors)).catch(() => {}), 250);
        return () => clearTimeout(t);
      }, [form.domains, form.tcpPorts, form.udpPorts, settings.healthReporting, bulk, JSON.stringify(apps), pra.rdpHost, pra.sshHost, ba.domain, ba.port]);
      const body = () => ({ prefix, ...(bulk ? { apps: apps.map(a => ({ ...a, destinations: destList(a.destinations) })) } : { domains: form.domains, tcpPorts: form.tcpPorts, udpPorts: form.udpPorts }), settings, connectorGroupId: form.connectorGroupId || null, descriptions: form.descriptions, policies, pra,
        isolationProfile: policies.isolation ? iso : { ...iso, enabled: false }, browserAccess: ba.domain.trim() ? ba : {} });
      const downloadTemplate = () => {
        const blob = new Blob([meta.copy.zpa.bulkTemplate], { type: 'text/csv' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'zpa-app-segments-template.csv'; document.body.appendChild(a); a.click(); a.remove();
      };
      const loadCsv = async (file) => {
        if (!file) return;
        setCsvName(file.name);
        try {
          const text = await file.text();
          const r = await api.call('POST', '/v2/zpa/parse-csv', { text });
          setApps(r.apps.map(a => ({ ...a, settings: {} }))); setCsvErrors(r.errors);
        } catch (e) { setCsvErrors([e.message]); setApps([]); }
      };
      const segName = (name) => `${prefix}-${String(name).trim().replace(/\s+/g, '-')}`;
      const appSettings = (a) => ({ ...settings, ...(a.settings || {}) });
      // v2.3.1: name, destinations and ports are editable in the table (destinations kept as typed, split when sent)
      const destText = (d) => Array.isArray(d) ? d.join(', ') : String(d || '');
      const destList = (d) => Array.isArray(d) ? d : String(d || '').split(/[,;\s]+/).map(x => x.trim()).filter(Boolean);
      const setApp = (i, patch) => setApps(apps.map((a, j) => j === i ? { ...a, ...patch } : a));
      const addApp = () => { setApps([...apps, { name: '', destinations: '', tcpPorts: '443', udpPorts: '', settings: {} }]); };
      const setAppSettings = (i, v) => setApps(apps.map((a, j) => j === i ? { ...a, settings: Object.fromEntries(Object.entries(v).filter(([k, val]) => settings[k] !== val)) } : a));
      const dry = async () => { setBusy(true); setError(null); try { setPlan(await api.call('POST', '/v2/zpa/plan', body())); setConfirmed(false); } catch (e) { setError(e.message); } setBusy(false); };
      const apply = async () => { setBusy(true); setError(null); try { setResult(await api.call('POST', '/v2/zpa/apply', { ...body(), planId: plan.planId })); } catch (e) { setError(e.message); } setBusy(false); };
      const n = (s) => `${prefix}-${s}`;
      const masked = (k) => k.length > 12 ? k.slice(0, 6) + '•'.repeat(18) + k.slice(-4) : '•'.repeat(k.length);
      return (
        <div className="card" data-step="zpa">

          <div className="alert alert-warning" data-zpalocation><span>📍 {meta.copy.zpa.locationBanner}</span></div>
          {ctx && ctx.error && <div className="alert alert-danger"><span>Could not reach ZPA: {ctx.error}</span></div>}
          <table className="diff-table" style={{marginBottom:'1rem'}}><tbody>
            <tr><td style={{width:'200px'}}>App Connector Group</td><td><code>{n('appconnector-group')}</code> · Connector certificate · San Jose, CA · default upgrade schedule and version</td></tr>
            <tr><td>Provisioning Key</td><td><code>{n('provisioning-key')}</code> · App Connector · max usage 5</td></tr>
            <tr><td>Segment Group</td><td><code>{n('segment-group')}</code></td></tr>
            <tr><td>Server Group</td><td><code>{n('server-group')}</code> · Dynamic Server Discovery on</td></tr>
            <tr><td>Application Segment{bulk ? 's' : ''}</td><td>{bulk ? (apps.length ? apps.map(a => <code key={a.name} style={{marginRight:'6px'}}>{segName(a.name)}</code>) : 'One per application in the uploaded CSV') : <code>{n('app-segment')}</code>}</td></tr>
            {policies.access && <tr><td>Access policy</td><td><code>{n('access-policy')}</code> · anyone signed in to ZPA can reach these applications</td></tr>}
            {ba.domain.trim() && <tr><td>Browser Access</td><td><code>{n('browser-access')}</code> · https://{ba.domain.trim()} with no client</td></tr>}
            {policies.timeout && <tr><td>Timeout policy</td><td><code>{n('timeout-policy')}</code> · re-authenticate every 8 hours, or after 1 hour idle</td></tr>}
            {policies.inspection && <tr><td>Inspection</td><td><code>{n('inspection-profile')}</code> (OWASP, all predefined controls) · <code>{n('inspection-policy')}</code></td></tr>}
            {policies.isolation && <tr><td>Isolation policy</td><td><code>{n('isolation-policy')}</code> · Browser Access users get an isolated session{iso.enabled ? <> in <code>{n('isolation-profile')}</code></> : ''}</td></tr>}
            {(pra.rdpHost || pra.sshHost) && <tr><td>Privileged Remote Access</td><td>{pra.rdpHost && <><code>{n('pra-rdp')}</code> + <code>{n('pra-rdp-console')}</code> </>}{pra.sshHost && <><code>{n('pra-ssh')}</code> + <code>{n('pra-ssh-console')}</code></>}</td></tr>}
          </tbody></table>
          <div className="form-group">
            <label className="form-label">App Connector Group description</label>
            <input type="text" value={form.descriptions.connectorGroup} onChange={e => setForm({ ...form, descriptions: { ...form.descriptions, connectorGroup: e.target.value } })} />
          </div>
          <div className="form-group">
            <label className="form-label">Provisioning key: App Connector Group</label>
            <select value={form.connectorGroupId} onChange={e => setForm({ ...form, connectorGroupId: e.target.value })} data-zpacg>
              <option value="">{n('appconnector-group')} (created by this wizard)</option>
              {ctx && ctx.connectorGroups && ctx.connectorGroups.filter(g => g.name !== n('appconnector-group')).map(g => <option key={g.id} value={g.id}>{g.name}{g.location ? ` — ${g.location}` : ''}</option>)}
            </select>
          </div>
          <div className="toggle-item" style={{marginBottom:'1rem'}} data-zpabulktoggle>
            <div><label onClick={() => setBulk(!bulk)} style={{cursor:'pointer'}}>{meta.copy.zpa.bulkLabel}</label><div className="form-hint">{meta.copy.zpa.bulkHelp}</div></div>
            <div className={`toggle-switch ${bulk ? 'active' : ''}`} onClick={() => setBulk(!bulk)}><div className="toggle-knob"></div></div>
          </div>
          {bulk ? (
            <div className="card" style={{background:'var(--bg-input)'}} data-zpabulk>
              <div style={{display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap', marginBottom:'0.75rem'}}>
                <button className="btn btn-ghost btn-sm" onClick={downloadTemplate} data-zpatemplate>⬇ Download CSV template</button>
                <label className="btn btn-primary btn-sm" style={{cursor:'pointer', margin:0}}>⬆ Upload CSV<input type="file" accept=".csv,text/csv" style={{display:'none'}} onChange={e => { loadCsv(e.target.files[0]); e.target.value = ''; }} data-zpacsv /></label>
                {csvName && <span className="form-hint">{csvName}: {apps.length} application{apps.length === 1 ? '' : 's'}</span>}
              </div>
              {csvErrors.length > 0 && <div className="alert alert-danger" style={{display:'block'}} data-zpacsverrors>{csvErrors.map((e, i) => <div key={i}>✕ {e}</div>)}</div>}

                          <td><input type="text" value={destText(a.destinations)} onChange={e => setApp(i, { destinations: e.target.value })} data-zpaedit="destinations" placeholder="app.domain.com, 10.0.0.0/24" style={{width:'100%', fontSize:'12px'}} /></td>

                          <td><input type="text" value={a.udpPorts || ''} onChange={e => setApp(i, { udpPorts: e.target.value })} data-zpaedit="udp" placeholder="—" style={{width:'100%', fontSize:'12px'}} /></td>
                          <td style={{fontSize:'12px'}}>{Object.keys(a.settings || {}).length ? <span className="badge badge-update">{Object.keys(a.settings).length} custom</span> : 'Shared defaults'}</td>
                          <td style={{whiteSpace:'nowrap'}}>
                            <button className="btn btn-ghost btn-sm" onClick={() => setOpenApp(openApp === i ? null : i)} data-zpaappsettings={a.name}>{openApp === i ? 'Close' : 'Settings'}</button>
                            <button className="btn btn-ghost btn-sm" onClick={() => { setApps(apps.filter((_, j) => j !== i)); setCsvErrors(csvErrors.filter(e => !e.startsWith(`Row ${a.row} `))); setOpenApp(null); }} title="Remove from this upload">✕</button>
                          </td>

                        {openApp === i && (
                          <tr><td colSpan={6} style={{background:'var(--bg-card)'}}>
                            <div className="form-hint" style={{marginBottom:'6px'}}>Settings for <strong>{a.name}</strong>. Anything you change here overrides the shared defaults below for this application only.</div>
                            <ZpaSegmentSettings value={appSettings(a)} onChange={v => setAppSettings(i, v)} compact />
                            {Object.keys(a.settings || {}).length > 0 && <button className="btn btn-ghost btn-sm" onClick={() => setAppSettings(i, settings)}>Reset to shared defaults</button>}
                          </td></tr>
                        )}
                      </React.Fragment>
                    ))}
                  </tbody>
                </table>
              )}
              <button className="btn btn-ghost btn-sm" style={{marginTop:'6px'}} onClick={addApp} data-zpaaddapp>+ Add application</button>
            </div>
          ) : (<>
          <div className="form-group">
            <label className="form-label">Application segment: domains and IPs</label>
            <input type="text" value={form.domains} placeholder={meta.copy.zpa.fqdnHelp} onChange={e => setForm({ ...form, domains: e.target.value })} data-zpadomains />
            <div className="form-hint">Comma-separated. Wildcard domain (*.example.com), domain, IPv4 address or IPv4 CIDR.</div>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px'}}>
            <div className="form-group"><label className="form-label">TCP port ranges</label><input type="text" value={form.tcpPorts} onChange={e => setForm({ ...form, tcpPorts: e.target.value })} /></div>
            <div className="form-group"><label className="form-label">UDP port ranges</label><input type="text" value={form.udpPorts} onChange={e => setForm({ ...form, udpPorts: e.target.value })} /></div>
          </div>
          <div className="form-hint" style={{marginBottom:'0.5rem'}}>Port 53 is left out on purpose (DNS stays with Client Connector).</div>
          <div className="form-group">
            <label className="form-label">Application segment description</label>
            <input type="text" value={form.descriptions.appSegment} onChange={e => setForm({ ...form, descriptions: { ...form.descriptions, appSegment: e.target.value } })} />
          </div>
          </>)}
          <details style={{margin:'0.5rem 0 1rem'}} open>
            <summary style={{cursor:'pointer', fontSize:'13px'}}>{bulk ? 'Shared application segment settings (every uploaded application starts with these)' : 'Application segment settings (defaults from the POV guide)'}</summary>
            <div className="form-hint" style={{margin:'6px 0'}}>{meta.copy.zpa.defaultsNote}</div>
            <ZpaSegmentSettings value={settings} onChange={setSettings} />
          </details>
          <details style={{margin:'0.5rem 0 1rem'}} open data-zpapolicies>
            <summary style={{cursor:'pointer', fontSize:'13px'}}>Policies for the application segment{bulk ? 's' : ''}</summary>
            {[['access', 'Access policy (everyone)', 'Anyone signed in to ZPA can reach these applications. Narrow it to groups later in the ZPA portal.'],
              ['timeout', 'Timeout policy', 'Users re-authenticate every 8 hours, or after 1 hour idle.'],
              ['inspection', 'AppProtection inspection', 'Inspect traffic with an OWASP Core Rule Set profile (needs AppProtection on the tenant).'],
              ['isolation', 'Browser isolation', 'Users who reach these applications through Browser Access get an isolated browser session.']].map(([k, label, hint]) => (
              <div className="toggle-item" key={k} data-zpapolicy={k}>
                <div><label onClick={() => setPolicies({ ...policies, [k]: !policies[k] })} style={{cursor:'pointer'}}>{label}</label><div className="form-hint">{hint}</div></div>
                <div className={`toggle-switch ${policies[k] ? 'active' : ''}`} onClick={() => setPolicies({ ...policies, [k]: !policies[k] })}><div className="toggle-knob"></div></div>
              </div>))}
          </details>
          {policies.isolation && (

                <div className="toggle-item"><div><label onClick={() => setIso({ ...iso, allowPrinting: !iso.allowPrinting })} style={{cursor:'pointer'}}>Allow printing</label></div>
                  <div className={`toggle-switch ${iso.allowPrinting ? 'active' : ''}`} onClick={() => setIso({ ...iso, allowPrinting: !iso.allowPrinting })}><div className="toggle-knob"></div></div></div>
                <div className="toggle-item"><div><label onClick={() => setIso({ ...iso, watermark: !iso.watermark })} style={{cursor:'pointer'}}>Watermark (user, time and a message)</label></div>
                  <div className={`toggle-switch ${iso.watermark ? 'active' : ''}`} onClick={() => setIso({ ...iso, watermark: !iso.watermark })} data-isowatermark><div className="toggle-knob"></div></div></div>
                {iso.watermark && <div className="form-group"><label className="form-label">Watermark message</label><input type="text" maxLength={64} value={iso.watermarkMessage} onChange={e => setIso({ ...iso, watermarkMessage: e.target.value })} /></div>}
                <div className="form-hint">ZIA Isolate rules keep the ZIA isolation profile; set its controls in ZIA › Cloud Browser Isolation (listed in the report's follow-ups).</div>
              </>)}
            </details>
          )}
          <details style={{margin:'0.5rem 0 1rem'}} data-zpaba>
            <summary style={{cursor:'pointer', fontSize:'13px'}}>Browser Access (optional, no client)</summary>
            <div className="form-hint" style={{margin:'6px 0'}}>Publish one internal web app so users can open it in a browser without Client Connector. Pick a web server certificate that covers the domain (upload it in the ZPA portal first if none is listed). Leave the domain blank to skip.</div>
            <div style={{display:'grid', gridTemplateColumns:'2fr 1fr', gap:'12px'}}>
              <div className="form-group"><label className="form-label">Web app domain</label><input type="text" value={ba.domain} placeholder="ehr.hospital.org" onChange={e => setBa({ ...ba, domain: e.target.value })} data-badomain /></div>
              <div className="form-group"><label className="form-label">Port</label><input type="text" value={ba.port} onChange={e => setBa({ ...ba, port: e.target.value })} /></div>
            </div>
            <div className="form-group"><label className="form-label">Web server certificate</label>
              <select value={ba.certificateId} onChange={e => setBa({ ...ba, certificateId: e.target.value })} data-bacert>
                <option value="">Pick a certificate…</option>
                {ctx && (ctx.certificates || []).map(c => <option key={c.id} value={c.id}>{c.name}{c.cn ? ` (${c.cn})` : ''}{c.validTo && c.validTo * 1000 < Date.now() ? ' — expired' : ''}</option>)}
              </select>
              {ba.domain.trim() && ba.certificateId && ctx && (() => { const c = (ctx.certificates || []).find(x => x.id === ba.certificateId); const d = ba.domain.trim().toLowerCase();
                const fits = c && [c.cn, ...(c.san || [])].some(n => n && (n.toLowerCase() === d || (n.startsWith('*.') && d.endsWith(n.slice(1).toLowerCase()) && d.split('.').length === n.split('.').length)));
                return fits ? null : <div className="form-hint" style={{color:'var(--accent-amber)'}}>⚠ This certificate does not cover {d}; browsers will warn.</div>; })()}
            </div>
          </details>
          <details style={{margin:'0.5rem 0 1rem'}} data-zpapra>
            <summary style={{cursor:'pointer', fontSize:'13px'}}>Privileged Remote Access (optional)</summary>
            <div className="form-hint" style={{margin:'6px 0'}}>Enter a server to reach over RDP and/or SSH from the PRA portal (no client needed). The wizard creates the PRA application and a console in your existing PRA portal; when the tenant has no portal yet, create one (domain and certificate) in the ZPA portal and run again. Leave blank to skip.</div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px'}}>
              <div className="form-group"><label className="form-label">RDP server (port 3389)</label><input type="text" value={pra.rdpHost} placeholder="jumpbox.hospital.local" onChange={e => setPra({ ...pra, rdpHost: e.target.value })} data-zprardp /></div>
              <div className="form-group"><label className="form-label">SSH server (port 22)</label><input type="text" value={pra.sshHost} placeholder="10.0.0.22" onChange={e => setPra({ ...pra, sshHost: e.target.value })} data-zprassh /></div>
            </div>
          </details>
          {errors.length > 0 && <div className="alert alert-danger" style={{display:'block'}} data-zpaerrors>{errors.map((e, i) => <div key={i}>✕ {e}</div>)}</div>}
          {plan && !result && (<>
            <div className="alert alert-info"><span><strong>Dry run:</strong> {countLine(plan.counts)}. Nothing changed yet.</span></div>
            {plan.warnings.map((w, i) => <div key={i} className="alert alert-warning"><span>⚠ {w}</span></div>)}
            <LedgerTable ledger={plan.ledger} filterProduct />
            <div className="toggle-item" style={{marginTop:'1rem'}}>
              <label onClick={() => setConfirmed(!confirmed)} style={{cursor:'pointer'}}>I have reviewed this dry run. Create / update these ZPA objects.</label>
              <div className={`toggle-switch ${confirmed ? 'active' : ''}`} onClick={() => setConfirmed(!confirmed)} data-zpaconfirm><div className="toggle-knob"></div></div>
            </div>
          </>)}
          {result && (<>
            <div className="alert alert-success"><span>✓ {countLine(result.counts)}</span></div>
            {result.warnings.map((w, i) => <div key={i} className="alert alert-warning"><span>⚠ {w}</span></div>)}
            <LedgerTable ledger={result.ledger} filterProduct />
            {result.provisioningKey && (
              <div className="card" style={{marginTop:'1rem', borderColor:'var(--accent-red)'}} data-zpakey>
                <strong>Provisioning key</strong> <span className="badge badge-risk">SECRET</span>
                <div style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'12px', wordBreak:'break-all', margin:'8px 0'}}>{reveal ? result.provisioningKey : masked(result.provisioningKey)}</div>
                <div style={{display:'flex', gap:'6px'}}>
                  <button className="btn btn-ghost btn-sm" onClick={() => setReveal(!reveal)} data-reveal>{reveal ? 'Hide' : 'Reveal'}</button>
                  <button className="btn btn-ghost btn-sm" onClick={() => { try { navigator.clipboard.writeText(result.provisioningKey); } catch (e) {} }}>Copy</button>
                </div>
                <div className="form-hint">{meta.copy.zpa.keyNote} It is also included in the summary report, which is marked as containing a secret.</div>
              </div>
            )}
            <div className="alert alert-warning" style={{marginTop:'1rem'}}><span>📍 Follow-ups: {result.followUps.join(' ')}</span></div>
          </>)}
          {guided ? (
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={guided.onBack}>← Back</button>
            <button className="btn btn-primary" onClick={() => guided.onNext(body())} disabled={errors.length > 0 || (bulk ? (!apps.length || csvErrors.length > 0) : !form.domains.trim())} data-zpanext>{guided.nextLabel || 'Next →'}</button>
          </div>
          ) : (
          <div className="btn-group">
            {!result && <button className="btn btn-primary" onClick={dry} disabled={busy || errors.length > 0 || (bulk ? (!apps.length || csvErrors.length > 0) : !form.domains.trim())} data-zpadry>{busy && !plan ? <><span className="spinner"></span> Checking…</> : 'Run Dry Run'}</button>}
            {plan && !result && <button className="btn btn-success" onClick={apply} disabled={busy || !confirmed} data-zpaapply>{busy ? <><span className="spinner"></span> Applying…</> : '🚀 Apply'}</button>}
            {result && <button className="btn btn-primary" onClick={onReport}>Summary report →</button>}
          </div>
          )}
        </div>
      );
    }

    // ========================
    // v2.2 — POV Start (readiness, intake, combined run), live progress, rate limits, POV tests, Client Connector devices & install,
    //        snapshots / restore / drift, update check
    // ========================
    const STATUS_ICON = { pass: '✅', warn: '⚠️', fail: '❌', info: 'ℹ️' };
    const fmtLeft = (iso) => { const s = Math.max(0, Math.round((new Date(iso).getTime() - Date.now()) / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
    const download = (name, content, type = 'text/plain') => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); };

    // 17: live progress feed (objects appear as they are created / updated)
    function LiveProgress({ active, title }) {
      const [events, setEvents] = useState([]);
      useEffect(() => {
        if (!active) return;
        setEvents([]);
        const stop = api.events(ev => { if (ev.name || ev.message) setEvents(prev => [...prev.slice(-299), ev]); });
        return stop;
      }, [active]);
      if (!active && !events.length) return null;
      const label = (e) => e.result || e.action;
      return (
        <div className="card" style={{background:'var(--bg-input)', maxHeight:'280px', overflowY:'auto', padding:'0.75rem'}} data-liveprogress>
          <div style={{fontSize:'12px', fontWeight:600, marginBottom:'6px'}}>{active && <span className="spinner" style={{width:'10px', height:'10px', marginRight:'6px'}}></span>}{title || 'Live progress'} · {events.length} event{events.length === 1 ? '' : 's'}</div>
          {events.slice().reverse().map((e, i) => (
            <div key={i} style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'11px', padding:'1px 0', color: e.status === 'error' || e.error ? 'var(--accent-red)' : undefined}}>
              {new Date(e.at).toLocaleTimeString()} · {e.category || e.product || e.action} {e.name ? `· ${e.name}` : ''} {label(e) ? `· ${label(e)}` : ''}{e.message ? ` · ${e.message}` : ''}{e.error ? ` — ${e.error}` : ''}
            </div>
          ))}
        </div>
      );
    }

    // 16: Client Connector / ZDX call budget, with a countdown when Zscaler asks the wizard to wait
    function RateLimitBar() {
      const [rl, setRl] = useState(null);
      const [, tick] = useState(0);
      useEffect(() => {
        let gone = false;
        const load = () => api.call('GET', '/v2/ratelimits').then(r => { if (!gone) setRl(r); }).catch(() => {});
        load(); const t = setInterval(load, 20000); const t2 = setInterval(() => tick(x => x + 1), 1000);
        return () => { gone = true; clearInterval(t); clearInterval(t2); };
      }, []);
      if (!rl) return null;
      const items = [['Client Connector', rl.zcc], ['ZDX', rl.zdx]].filter(([, v]) => v && (v.usedLastHour > 0 || v.blockedUntil));
      if (!items.length) return null;
      return (
        <div style={{display:'flex', gap:'10px', flexWrap:'wrap', marginBottom:'0.75rem'}} data-ratelimits>
          {items.map(([name, v]) => {
            const blocked = v.blockedUntil && new Date(v.blockedUntil).getTime() > Date.now();
            return (
              <span key={name} className={`badge ${blocked ? 'badge-risk' : v.remaining < 20 ? 'badge-update' : 'badge-category'}`} style={{fontSize:'11px'}}>
                {name} API: {blocked ? `paused by Zscaler, resumes in ${fmtLeft(v.blockedUntil)}` : `${v.remaining} of ${v.budget} calls left this hour`}
              </span>
            );
          })}
        </div>
      );
    }

    // 20: update check (standalone builds and the server version)
    function UpdateBadge() {
      const [u, setU] = useState(null);
      useEffect(() => { api.call('GET', '/v2/update-check').then(setU).catch(() => {}); }, []);
      if (!u || !u.newer) return null;
      return <a className="tag" href={u.downloads} target="_blank" rel="noreferrer" style={{background:'var(--accent-amber)', color:'#111', textDecoration:'none'}} data-update>Update available: v{u.latest}</a>;
    }

    // ---------- POV Start ----------
    function ReadinessPanel({ setError }) {
      const [r, setR] = useState(null);
      const [busy, setBusy] = useState(false);
      const run = async () => { setBusy(true); try { setR(await api.call('GET', '/v2/readiness')); } catch (e) { setError('Readiness check failed: ' + e.message); } setBusy(false); };
      useEffect(() => { run(); }, []);
      const areas = r ? [...new Set(r.checks.map(c => c.area))] : [];
      return (
        <div className="card" data-readiness>
          <div className="card-header" style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
            <div><h2>Tenant readiness</h2><p>Read-only checks of what the POV needs, including every licence a standard POV uses, so blockers show up before the customer sees them.</p></div>
            <button className="btn btn-ghost btn-sm" onClick={run} disabled={busy}>{busy ? <span className="spinner"></span> : '↻ Check again'}</button>
          </div>
          {busy && !r && <div className="form-hint"><span className="spinner"></span> Checking ZIA, ZPA, Client Connector and ZDX…</div>}
          {r && (<>
            <div className="alert alert-info"><span>{Object.entries(r.counts).map(([k, v]) => `${STATUS_ICON[k]} ${v}`).join('   ')}</span></div>
            <table className="diff-table"><tbody>
              {areas.map(a => r.checks.filter(c => c.area === a).map((c, i) => (
                <tr key={a + i} data-check={c.name}>
                  <td style={{width:'60px'}}>{i === 0 ? <strong>{a}</strong> : ''}</td>
                  <td style={{width:'24px'}}>{STATUS_ICON[c.status]}</td>
                  <td style={{width:'230px'}}>{c.name}</td>
                  <td style={{fontSize:'12px'}}>{c.detail}{c.fix && <div className="form-hint" style={{margin:0}}>→ {c.fix}</div>}</td>
                </tr>
              )))}
            </tbody></table>
            {r.permissions && <details className="card" style={{marginTop:'1rem', padding:'0.75rem 1rem'}} open={r.permissions.some(x => x.status === 'fail' || x.status === 'warn')} data-permissions>
              <summary style={{cursor:'pointer', fontWeight:600}}>API permissions by product ({r.permissions.filter(x => x.access).length} of {r.permissions.length} products reachable)</summary>
              <table className="diff-table" style={{marginTop:'0.5rem'}}>
                <thead><tr><th>Product</th><th>API access</th><th>Role</th><th>Missing or read-only</th></tr></thead>
                <tbody>{r.permissions.map(x => (
                  <tr key={x.product} data-perm={x.product}>
                    <td>{STATUS_ICON[x.status]} {x.label}{x.needed ? '' : <span className="form-hint" style={{marginLeft:'4px'}}>(not in this POV)</span>}</td>
                    <td>{x.access ? 'Yes' : <strong style={{color: x.needed ? 'var(--accent-red)' : undefined}}>No</strong>}</td>
                    <td>{x.role || '—'}</td>
                    <td style={{fontSize:'12px'}}>{[...x.missing, ...x.readOnly].length ? <>
                      {x.missing.map(m => <div key={m.perm}>✕ <code>{m.perm}</code> — {m.for}{m.optional ? ' (optional)' : ''}</div>)}
                      {x.readOnly.map(m => <div key={m.perm}>◐ <code>{m.perm}</code> read-only — {m.for}{m.optional ? ' (optional)' : ''}</div>)}
                    </> : x.access ? 'None' : '—'}{x.fix && <div className="form-hint" style={{margin:'2px 0 0'}}>→ {x.fix}</div>}</td>
                  </tr>))}</tbody>
              </table>
            </details>}
            {r.skus && <details className="card" style={{marginTop:'0.75rem', padding:'0.75rem 1rem'}} data-skus>
              <summary style={{cursor:'pointer', fontWeight:600}}>Licences on this tenant ({r.skus.active} active SKUs){r.skus.editions && r.skus.editions.sandbox ? ` · Sandbox ${r.skus.editions.sandbox}` : ''}{r.skus.editions && r.skus.editions.dlp ? ` · DLP ${r.skus.editions.dlp}` : ''}</summary>
              <div style={{display:'flex', gap:'6px', margin:'0.5rem 0'}}>
                <button className="btn btn-ghost btn-sm" onClick={() => download('tenant-licences.csv', ['Area,SKU,Name,Status,Ends,What it is,Unlocks in the wizard', ...r.skus.rows.map(x => [x.area, x.id, x.name, x.status, x.endsOn || '', x.what, x.unlocks].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))].join('\r\n') + '\r\n', 'text/csv')} data-skucsv>⬇ CSV</button>
                <button className="btn btn-ghost btn-sm" onClick={() => { const w = window.open('', '_blank'); if (!w) return; w.document.write(`<html><head><title>Tenant licences</title><style>body{font:13px system-ui;margin:24px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:4px 6px;text-align:left}</style></head><body><h2>Tenant licences</h2><table><tr><th>Area</th><th>SKU</th><th>Name</th><th>Status</th><th>Ends</th><th>What it is</th><th>Unlocks</th></tr>${r.skus.rows.map(x => `<tr><td>${x.area}</td><td>${x.id}</td><td>${x.name}</td><td>${x.status}</td><td>${x.endsOn || ''}</td><td>${x.what}</td><td>${x.unlocks}</td></tr>`).join('')}</table></body></html>`); w.document.close(); w.print(); }} data-skuprint>🖨 Print</button>
              </div>
              <table className="diff-table">
                <thead><tr><th>Area</th><th>SKU</th><th>Status</th><th>What it is</th><th>Unlocks in the wizard</th></tr></thead>
                <tbody>{r.skus.rows.map(x => (
                  <tr key={x.id} data-sku={x.id} style={{opacity: x.active ? 1 : 0.55}}>
                    <td>{x.area}</td><td><code>{x.id}</code>{x.name && x.name !== x.id && <div className="form-hint" style={{margin:0}}>{x.name}</div>}</td>
                    <td style={{fontSize:'12px'}}>{x.status}{x.endsOn ? ` · ends ${x.endsOn}` : ''}{x.endingSoon ? ' ⚠' : ''}</td>
                    <td style={{fontSize:'12px'}}>{x.what}{!x.confirmed && <span className="form-hint" style={{marginLeft:'4px'}}>(to confirm)</span>}</td>
                    <td style={{fontSize:'12px'}}>{x.unlocks}</td>
                  </tr>))}
                  {(r.skus.viaToken || []).map(x => <tr key={x.product}><td>{x.label}</td><td colSpan={4} style={{fontSize:'12px'}}>Not in the ZIA subscription list; {x.access ? `the API client can use it (role "${x.role}").` : 'the API client has no access to it.'}</td></tr>)}
                </tbody>
              </table>
            </details>}
          </>)}
        </div>
      );
    }

    const splitItems = (v) => String(v || '').split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);
    const DOMAIN_OK = (d) => /^(?=.{1,253}$)(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\.(?!-)[A-Za-z0-9-]{1,63}(?<!-))+$/.test(String(d || '').trim());
    const PREFIX_OK = (p) => /^[A-Za-z0-9_-]{1,20}$/.test(String(p || ''));
    const suggestPrefix = (name) => {
      const s = String(name || '').replace(/[^A-Za-z0-9 ]/g, ' ').trim();
      if (!s) return '';
      const words = s.split(/\s+/);
      const initials = words.length > 1 ? words.map(w => w[0]).join('') : words[0];
      return (initials.length >= 3 ? initials : words.join('')).toUpperCase().slice(0, 12);
    };

    // v2.3 guided POV: Readiness → Build the POV (scope) → Customer intake → Client Connector → Internet Access → Private Access → Digital Experience → Dry run & apply
    const GUIDE_DEFAULT = { customerName: '', prefix: '', prefixEdited: false, domain: '', presetId: 'HEALTHCARE', baseline: 'HIPAA', scope: { zia: true, zpa: true, zdx: true, aiguard: false } };
    const GUIDE_PRODUCTS = [
      { id: 'zia', icon: '🌐', name: 'Zscaler Internet Access', desc: 'URL filtering, cloud app control, SSL inspection, threat protection, DLP, firewall and DNS policies from a baseline framework.' },
      { id: 'zpa', icon: '🔒', name: 'Zscaler Private Access', desc: 'App Connector group and provisioning key, application segments for the internal domain and common apps, access / timeout / inspection / isolation policies.' },
      { id: 'zdx', icon: '📈', name: 'Zscaler Digital Experience', desc: 'Web and CloudPath probes for Microsoft 365, UCaaS and the SaaS apps common to the customer\'s market.' },
      { id: 'aiguard', icon: '🛡️', name: 'AI Guard', desc: 'Runtime protection for AI apps (ChatGPT, Microsoft 365 Copilot, Claude, Gemini and more): ZIA inspects their traffic and chains it to AI Guard for prompt and response detection. Needs Internet Access.', needs: 'zia' }
    ];

    function GuideStepper({ stages, stage, visited, go }) {
      return (
        <div className="guide-stepper" data-guidestepper>
          {stages.map((s, i) => {
            const cur = s.id === stage, seen = visited.has(s.id) && !cur;
            return (
              <div key={s.id} onClick={() => visited.has(s.id) && go(s.id)} data-guidestage={s.id}
                className={`guide-pill ${cur ? 'cur' : seen ? 'seen' : ''}`} style={{cursor: visited.has(s.id) ? 'pointer' : 'default'}}>
                <span className="guide-num">{seen ? '✓' : i + 1}</span>{s.label}
              </div>
            );
          })}
        </div>
      );
    }

    function ScopePanel({ g, setG, onNext, onBack }) {
      // AI Guard rides on ZIA: turning it on turns ZIA on; turning ZIA off turns AI Guard off
      const toggle = (id) => setG(prev => {
        const on = !prev.scope[id];
        const scope = { ...prev.scope, [id]: on };
        if (id === 'aiguard' && on) scope.zia = true;
        if (id === 'zia' && !on) scope.aiguard = false;
        return { ...prev, scope };
      });
      const any = Object.values(g.scope).some(Boolean);
      return (
        <div className="card" data-guide="scope">
          <div className="card-header"><h2>Build the POV</h2><p>What is in scope for this POV? The wizard walks you through each product you turn on, then runs one dry run and one apply for all of them.</p></div>
          <div className="tier-grid" style={{gridTemplateColumns:'repeat(auto-fill, minmax(230px, 1fr))'}}>
            {GUIDE_PRODUCTS.map(p => (
              <div key={p.id} className={`tier-card ${g.scope[p.id] ? 'selected' : ''}`} onClick={() => toggle(p.id)} data-scopeproduct={p.id} style={{textAlign:'left', position:'relative'}}>
                <div style={{position:'absolute', top:'12px', right:'12px'}}><div className={`toggle-switch ${g.scope[p.id] ? 'active' : ''}`}><div className="toggle-knob"></div></div></div>
                <div className="product-icon"><Icon name={p.id} size={22} /></div>
                <div className="tier-name">{p.name}</div>
                <div className="tier-desc">{p.desc}</div>
                {p.needs && g.scope[p.id] && <div className="form-hint" style={{marginTop:'6px'}} data-needszia>Internet Access was turned on with it.</div>}
              </div>
            ))}
          </div>
          <div className="form-hint" style={{marginTop:'0.75rem'}}>📱 {g.scope.zia || g.scope.zpa ? 'Zscaler Client Connector is set up first, because Internet Access and Private Access traffic reaches Zscaler through it.' : 'Client Connector is skipped: neither Internet Access nor Private Access is in scope.'}</div>
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={onBack}>← Back</button>
            <button className="btn btn-primary" onClick={onNext} disabled={!any} data-next>Next: Customer intake →</button>
          </div>
        </div>
      );
    }

    function IntakePanel({ meta, g, setG, presets, onNext, onBack, busy }) {
